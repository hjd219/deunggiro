<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>법인 임원 임기 자동계산 | 등기로</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:#102b3a;background:#fff}header{height:72px;display:flex;align-items:center;padding:0 5vw;border-bottom:1px solid #e3edf1}header b{font-size:22px;color:#169bd5}header span{margin-left:18px;font-size:13px;color:#71858f}main{max-width:1160px;margin:auto;padding:64px 28px 90px}.intro h1{margin:0 0 12px;font-size:38px;letter-spacing:-1.5px}.intro h1 em{font-style:normal;color:#169bd5}.intro p{margin:0;color:#71858f;font-size:14px}.steps{display:flex;margin:42px 0 36px;border-bottom:1px solid #dce6ea}.step{flex:1;padding-bottom:16px;color:#7a8d96;font-size:12px;font-weight:800}.step b{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:8px;border:1px solid #cbd9df;border-radius:50%}.step.active{color:#168fc2;border-bottom:2px solid #37aee4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:68px}h2{margin:0 0 8px;font-size:21px}.desc{margin-bottom:20px;color:#71858f;font-size:13px}.upload{display:flex;min-height:238px;flex-direction:column;align-items:center;justify-content:center;border:1.5px dashed #9fcddd;background:#f7fcfe;text-align:center;cursor:pointer}.upload:hover{background:#f1faff}.upload-icon{display:grid;place-items:center;width:48px;height:58px;margin-bottom:14px;border:2px solid #37aee4;border-radius:5px;background:#fff;color:#168fc2;font-size:11px;font-weight:900}.upload strong{font-size:16px}.upload small{margin-top:7px;color:#758b95}.filename{min-height:18px;margin-top:12px;color:#168fc2;font-size:12px;font-weight:800}.privacy{margin:12px 0 28px;color:#71858f;font-size:11px}.rules{padding-top:24px;border-top:1px solid #e0e9ed}.rulecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rule{padding:17px;background:#f5fafc}.rule small{display:block;margin-bottom:5px;color:#71858f}.rule strong{font-size:13px}.analyze{width:100%;height:52px;margin-top:22px;border:0;background:#169bd5;color:#fff;font-weight:900;cursor:pointer}.analyze:disabled{opacity:.45}.result{border-top:2px solid #37aee4}.status{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #dce6ea;color:#71858f;font-size:12px}.status strong{color:#169bd5;font-size:24px}.box{padding:24px 0;border-bottom:1px solid #dce6ea}.box small{display:block;margin-bottom:6px;color:#71858f;font-size:11px}.box>strong{display:block;font-size:16px}.head{display:flex;justify-content:space-between;gap:15px}.badge{padding:6px 8px;background:#edf8fc;color:#168fc2;font-size:10px;font-weight:800}.rows{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.row{color:#71858f;font-size:11px}.row strong{display:block;margin-top:5px;color:#173647;font-size:13px}.notice{padding:22px 0;color:#71858f;font-size:12px;line-height:1.7}@media(max-width:800px){main{padding:38px 18px 70px}.intro h1{font-size:29px}.grid{grid-template-columns:1fr;gap:45px}.step{min-width:120px}.steps{overflow:auto}.rows{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>등기로</b><span>법인 임원 임기 자동계산</span></header>
<main>
<section class="intro"><h1>법인 임원 임기 <em>자동계산</em></h1><p>등기사항증명서 PDF를 선택하고 임원 임기만료 예상일을 확인합니다.</p></section>
<div class="steps"><div class="step active"><b>1</b>PDF 업로드</div><div class="step"><b>2</b>임원 자동인식</div><div class="step"><b>3</b>임기 확인</div></div>
<div class="grid">
<section>
<h2>등기사항증명서 올리기</h2><div class="desc">인터넷등기소에서 발급한 PDF 또는 스캔 PDF를 선택하세요.</div>
<input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
<div id="uploadBox" class="upload" role="button" tabindex="0"><span class="upload-icon">PDF</span><strong>PDF 파일을 선택하세요</strong><small>클릭하여 파일을 선택하세요</small><span id="fileName" class="filename"></span></div>
<div class="privacy">파일은 임원정보 인식을 위해 OCR 서버로 전송되며 분석 후 결과만 표시합니다.</div>
<div class="rules"><h2>임기 계산 기준</h2><div class="rulecards"><div class="rule"><small>이사</small><strong>취임·중임일 + 3년</strong></div><div class="rule"><small>감사</small><strong>최종 결산기 정기주주총회 기준</strong></div></div></div>
<button id="analyze" class="analyze" type="button" disabled>PDF 분석</button>
</section>
<aside class="result"><div class="status"><span id="status">PDF를 선택해 주세요</span><strong id="count">-</strong></div><div id="result"><div class="notice">분석 결과가 여기에 표시됩니다.</div></div></aside>
</div>
</main>
<script>
(function(){
'use strict';
var OCR_ENDPOINT='https://deunggiro-ocr.hapuha21.workers.dev/';
var input=document.getElementById('pdfFile'),box=document.getElementById('uploadBox'),nameEl=document.getElementById('fileName'),analyze=document.getElementById('analyze'),statusEl=document.getElementById('status'),countEl=document.getElementById('count'),resultEl=document.getElementById('result'),selected=null;
function openPicker(){input.click()}
box.addEventListener('click',openPicker);
box.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openPicker()}});
input.addEventListener('change',function(){selected=input.files&&input.files.length?input.files[0]:null;if(!selected){nameEl.textContent='';analyze.disabled=true;statusEl.textContent='PDF를 선택해 주세요';return}if(selected.type&&selected.type!=='application/pdf'&&!/\.pdf$/i.test(selected.name)){selected=null;input.value='';nameEl.textContent='PDF 파일만 선택할 수 있습니다.';analyze.disabled=true;return}nameEl.textContent='선택됨 · '+selected.name;statusEl.textContent='분석 준비 완료';countEl.textContent='-';analyze.disabled=false});
function dateOf(s){var m=String(s||'').replace(/[Oo]/g,'0').replace(/[Il]/g,'1').match(/((?:19|20)\d{2})\D{0,3}(\d{1,2})\D{0,3}(\d{1,2})/);if(!m)return'';var mo=+m[2],d=+m[3];return mo>0&&mo<13&&d>0&&d<32?m[1]+'.'+String(mo).padStart(2,'0')+'.'+String(d).padStart(2,'0'):''}
function directorEnd(d){return d?String(+d.slice(0,4)+3)+d.slice(4):'확인 필요'}
function auditorEnd(d){if(!d)return'확인 필요';var y=+d.slice(0,4),m=+d.slice(5,7),day=+d.slice(8,10),limit=new Date(y+3,m-1,day),fy=new Date(limit.getFullYear(),11,31)<=limit?limit.getFullYear():limit.getFullYear()-1;return String(fy+1)+'.03.31'}
function roleOf(s){var x=String(s||'').replace(/\s/g,''),roles=['대표이사','사내이사','기타비상무이사','사외이사','감사'];for(var i=0;i<roles.length;i++)if(x.indexOf(roles[i])>=0)return roles[i];return''}
function cleanName(s,role){s=String(s||'').replace(role,' ').replace(/\d{6}\s*[-–]?\s*[\d*]{1,7}.*$/,' ').replace(/^(성명|성명:|성명：)/,'').trim();var nat=s.match(/((?:미합중국|미국|일본|중국|캐나다|호주|영국|프랑스|독일)(?:인)?\s*[가-힣]{2,4})/);if(nat)return nat[1].replace(/\s+/g,' ');var id=s.match(/([가-힣]{2,4})\s*(?=\d{6}\s*[-–]?)/);if(id)return id[1];var a=s.match(/[가-힣]{2,4}/g)||[],stop=/^(이사|감사|대표이사|사내이사|사외이사|취임|중임|퇴임|사임|해임|변경|등기|연월일|미합중국|광역시|특별시|남동구|연수구|미추홀구|부평구|계양구|강화군|옹진군)$/;for(var i=0;i<a.length;i++)if(!stop.test(a[i]))return a[i];return'성명 확인 필요'}
function parse(text){
 var lines=String(text||'').split(/\n+/).map(function(x){return x.replace(/\s+/g,' ').trim()}).filter(Boolean),founded='',corp='법인명 인식 필요',officers=[];
 for(var i=0;i<lines.length;i++){if(corp==='법인명 인식 필요'&&/주식회사/.test(lines[i]))corp=lines[i].replace(/^상\s*호\s*/,'').slice(0,120);if(/회사성립|성립연월일/.test(lines[i]))for(var q=i;q<Math.min(i+5,lines.length);q++){var fd=dateOf(lines[q]);if(fd){founded=fd;break}}}
 for(var n=0;n<lines.length;n++){var role=roleOf(lines[n]);if(!role)continue;var end=Math.min(n+12,lines.length);for(var z=n+1;z<end;z++)if(roleOf(lines[z])){end=z;break}var block=lines.slice(n,end),explicit='',kind='',name='성명 확인 필요';
  for(var b=0;b<block.length;b++){var cn=cleanName(block[b],role);if(cn!=='성명 확인 필요'){name=cn;break}}
  for(var k=0;k<block.length;k++){if(/취임|중임/.test(block[k])){var same=dateOf(block[k]);var next='';if(!same&&k+1<block.length&&/^(?:19|20)\d{2}/.test(block[k+1]))next=dateOf(block[k+1]);explicit=same||next;if(explicit){kind=/중임/.test(block[k])?'중임':'취임';break}}}
  officers.push({role:role,name:name,date:explicit||founded,fallback:!explicit,kind:kind});
 }
 return{corp:corp,founded:founded,officers:officers.filter(function(o,i,a){return a.findIndex(function(x){return x.role===o.role&&x.name===o.name&&x.date===o.date})===i}).slice(0,12)}
}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]})}
function render(r){countEl.textContent=r.officers.length+'명';statusEl.textContent='OCR 분석 완료';var h='<div class="box"><small>법인명</small><strong>'+esc(r.corp)+'</strong><small style="margin-top:12px">회사성립연월일</small><strong>'+esc(r.founded||'인식 필요')+'</strong></div>';r.officers.forEach(function(o){var end=o.role==='감사'?auditorEnd(o.date):directorEnd(o.date);h+='<div class="box"><div class="head"><strong>'+esc(o.role)+' · '+esc(o.name)+'</strong><span class="badge">'+(o.fallback?'설립일 적용':esc(o.kind))+'</span></div><div class="rows"><div class="row">임기 기준일<strong>'+esc(o.date||'확인 필요')+'</strong></div><div class="row">기준<strong>'+(o.fallback?'취임·중임 없음 → 회사성립연월일':esc(o.kind)+'일')+'</strong></div><div class="row">임기만료<strong>'+esc(end)+'</strong></div></div></div>'});resultEl.innerHTML=h}
function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error('PDF 변환 모듈을 불러오지 못했습니다.'))};document.head.appendChild(s)})}
async function ensurePdf(){if(!window.pdfjsLib)await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'}
function ocrText(data){if(!data||!Array.isArray(data.ParsedResults))return'';return data.ParsedResults.map(function(p){return p&&p.ParsedText?p.ParsedText:''}).join('\n')}
async function sendImage(blob,name){
 var fd=new FormData();fd.append('file',blob,name);
 var res=await fetch(OCR_ENDPOINT,{method:'POST',body:fd});
 var data=await res.json().catch(function(){return{}});
 if(!res.ok)throw new Error(data.detail||data.error||('OCR 서버 오류 ('+res.status+')'));
 var text=ocrText(data);if(!text.trim())throw new Error('OCR 결과에서 문자를 찾지 못했습니다.');return text;
}
async function pageBlob(page){
 var base=page.getViewport({scale:2.2}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});
 canvas.width=Math.ceil(base.width);canvas.height=Math.ceil(base.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
 await page.render({canvasContext:ctx,viewport:base}).promise;
 var quality=.88,blob=await new Promise(function(ok){canvas.toBlob(ok,'image/jpeg',quality)});
 while(blob&&blob.size>900000&&quality>.45){quality-=.08;blob=await new Promise(function(ok){canvas.toBlob(ok,'image/jpeg',quality)})}
 if(blob&&blob.size>900000){var ratio=Math.sqrt(850000/blob.size),w=Math.max(900,Math.floor(canvas.width*ratio)),h=Math.floor(canvas.height*ratio),small=document.createElement('canvas');small.width=w;small.height=h;var sc=small.getContext('2d',{alpha:false});sc.fillStyle='#fff';sc.fillRect(0,0,w,h);sc.drawImage(canvas,0,0,w,h);blob=await new Promise(function(ok){small.toBlob(ok,'image/jpeg',.72)})}
 if(!blob)throw new Error('PDF 페이지 이미지 변환에 실패했습니다.');return blob;
}
analyze.addEventListener('click',async function(){
 if(!selected)return;analyze.disabled=true;statusEl.textContent='PDF 변환 준비 중';countEl.textContent='…';
 try{
  await ensurePdf();
  var pdf=await pdfjsLib.getDocument({data:new Uint8Array(await selected.arrayBuffer())}).promise,text='';
  for(var p=1;p<=pdf.numPages;p++){
   statusEl.textContent='페이지 '+p+'/'+pdf.numPages+' 이미지 변환 중';
   var page=await pdf.getPage(p),blob=await pageBlob(page);
   statusEl.textContent='페이지 '+p+'/'+pdf.numPages+' OCR.space 분석 중';
   text+='\n'+await sendImage(blob,'page-'+p+'.jpg');
  }
  render(parse(text));document.querySelectorAll('.step').forEach(function(x){x.classList.add('active')});
 }catch(e){console.error(e);statusEl.textContent='분석 실패';countEl.textContent='!';resultEl.innerHTML='<div class="notice">'+esc(e.message||e)+'</div>'}
 finally{analyze.disabled=!selected}
});
})();
</script>
</body>
</html>
