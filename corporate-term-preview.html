<title>법인 임원 임기 자동계산 | 등기로</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;color:#102b3a;background:#fff}header{height:72px;display:flex;align-items:center;padding:0 5vw;border-bottom:1px solid #e3edf1}header b{font-size:22px;color:#169bd5}header span{margin-left:18px;font-size:13px;color:#71858f}main{max-width:1160px;margin:auto;padding:64px 28px 90px}.intro h1{margin:0 0 12px;font-size:38px;letter-spacing:-1.5px}.intro h1 em{font-style:normal;color:#169bd5}.intro p{margin:0;color:#71858f;font-size:14px}.steps{display:flex;margin:42px 0 36px;border-bottom:1px solid #dce6ea}.step{flex:1;padding-bottom:16px;color:#7a8d96;font-size:12px;font-weight:800}.step b{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:8px;border:1px solid #cbd9df;border-radius:50%}.step.active{color:#168fc2;border-bottom:2px solid #37aee4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:68px}h2{margin:0 0 8px;font-size:21px}.desc{margin-bottom:20px;color:#71858f;font-size:13px}.upload{display:flex;min-height:238px;flex-direction:column;align-items:center;justify-content:center;border:1.5px dashed #9fcddd;background:#f7fcfe;text-align:center;cursor:pointer}.upload:hover{background:#f1faff}.upload-icon{display:grid;place-items:center;width:48px;height:58px;margin-bottom:14px;border:2px solid #37aee4;border-radius:5px;background:#fff;color:#168fc2;font-size:11px;font-weight:900}.upload strong{font-size:16px}.upload small{margin-top:7px;color:#758b95}.filename{min-height:18px;margin-top:12px;color:#168fc2;font-size:12px;font-weight:800}.privacy{margin:12px 0 28px;color:#71858f;font-size:11px}.rules{padding-top:24px;border-top:1px solid #e0e9ed}.rulecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rule{padding:17px;background:#f5fafc}.rule small{display:block;margin-bottom:5px;color:#71858f}.rule strong{font-size:13px}.analyze{width:100%;height:52px;margin-top:22px;border:0;background:#169bd5;color:#fff;font-weight:900;cursor:pointer}.analyze:disabled{opacity:.45}.result{border-top:2px solid #37aee4}.status{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid #dce6ea;color:#71858f;font-size:12px}.status strong{color:#169bd5;font-size:24px}.box{padding:24px 0;border-bottom:1px solid #dce6ea}.box small{display:block;margin-bottom:6px;color:#71858f;font-size:11px}.box>strong{display:block;font-size:16px}.head{display:flex;justify-content:space-between;gap:15px}.badge{padding:6px 8px;background:#edf8fc;color:#168fc2;font-size:10px;font-weight:800}.rows{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}.row{color:#71858f;font-size:11px}.row strong{display:block;margin-top:5px;color:#173647;font-size:13px}.notice{padding:22px 0;color:#71858f;font-size:12px;line-height:1.7}@media(max-width:800px){main{padding:38px 18px 70px}.intro h1{font-size:29px}.grid{grid-template-columns:1fr;gap:45px}.step{min-width:120px}.steps{overflow:auto}.rows{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>등기로</b><span>법인 임원 임기 자동계산</span></header>
<main>
<section class="intro"><h1>법인 임원 임기 <em>자동계산</em></h1><p>등기사항증명서 PDF를 선택하고 임원 임기만료 예상일을 확인합니다.</p></section>
<div class="steps"><div class="step active"><b>1</b>PDF 업로드</div><div class="step"><b>2</b>임원 자동인식</div><div class="step"><b>3</b>임기 확인</div></div>
<div class="grid">
<section>
<h2>등기사항증명서 올리기</h2><div class="desc">인터넷등기소에서 발급한 PDF 또는 스캔 PDF를 선택하세요.</div>
<input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
<div id="uploadBox" class="upload" role="button" tabindex="0"><span class="upload-icon">PDF</span><strong>PDF 파일을 선택하세요</strong><small>클릭하여 파일을 선택하세요</small><span id="fileName" class="filename"></span></div>
<div class="privacy">파일은 임원정보 인식을 위해 OCR 서버로 전송되며 분석 후 결과만 표시합니다.</div>
<div class="rules"><h2>임기 계산 기준</h2><div class="rulecards"><div class="rule"><small>이사</small><strong>취임·중임일 + 3년</strong></div><div class="rule"><small>감사</small><strong>취임·중임일 + 3년</strong></div></div></div>
<button id="analyze" class="analyze" type="button" disabled>PDF 분석</button>
</section>
<aside class="result"><div class="status"><span id="status">PDF를 선택해 주세요</span><strong id="count">-</strong></div><div id="result"><div class="notice">분석 결과가 여기에 표시됩니다.</div></div></aside>
</div>
</main>
<script>
(function(){
'use strict';
const OCR_ENDPOINT='https://deunggiro-ocr.hapuha21.workers.dev/';
const $=id=>document.getElementById(id);
const input=$('pdfFile'),box=$('uploadBox'),nameEl=$('fileName'),analyze=$('analyze'),statusEl=$('status'),countEl=$('count'),resultEl=$('result');
let selected=null;

box.onclick=()=>input.click();
box.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};
input.onchange=()=>{
 selected=input.files&&input.files[0]||null;
 if(!selected){nameEl.textContent='';analyze.disabled=true;return}
 if(!/\.pdf$/i.test(selected.name)){selected=null;input.value='';nameEl.textContent='PDF 파일만 선택할 수 있습니다.';analyze.disabled=true;return}
 nameEl.textContent='선택됨 · '+selected.name;statusEl.textContent='분석 준비 완료';countEl.textContent='-';analyze.disabled=false;
};

const esc=s=>String(s||'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
function dateOf(s){const m=String(s||'').replace(/[Oo]/g,'0').replace(/[Il]/g,'1').match(/((?:19|20)\d{2})\D{0,3}(\d{1,2})\D{0,3}(\d{1,2})/);if(!m)return'';const mo=+m[2],d=+m[3];return mo>0&&mo<13&&d>0&&d<32?m[1]+'.'+String(mo).padStart(2,'0')+'.'+String(d).padStart(2,'0'):''}
const directorEnd=d=>d?String(+d.slice(0,4)+3)+d.slice(4):'확인 필요';
function auditorEnd(d){return directorEnd(d)}
function roleOf(s){const x=String(s||'').replace(/\s/g,'');return ['대표이사','사내이사','기타비상무이사','사외이사','감사'].find(r=>x.includes(r))||''}
function personName(s,role){
 s=String(s||'').replace(role,' ').replace(/^(성명|성명:|성명：)/,' ').trim();
 const beforeId=s.match(/((?:(?:미합중국|미국|일본|중국|캐나다|호주|영국|프랑스|독일)(?:인)?\s*)?[가-힣]{2,4})\s*(?=\d{6}\s*[-–]?)/);
 if(beforeId)return beforeId[1].trim();
 const nat=s.match(/((?:미합중국|미국|일본|중국|캐나다|호주|영국|프랑스|독일)(?:인)?\s*[가-힣]{2,4})/);if(nat)return nat[1].trim();
 const a=s.match(/[가-힣]{2,4}/g)||[],stop=/^(이사|감사|대표이사|사내이사|사외이사|취임|중임|퇴임|사임|해임|변경|등기|연월일|회사성립|주식회사|광역시|특별시|남동구|연수구|미추홀구|부평구|계양구|강화군|옹진군)$/;
 return a.find(x=>!stop.test(x))||'성명 확인 필요';
}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('PDF 변환 모듈을 불러오지 못했습니다.'));document.head.appendChild(s)})}
async function ensurePdf(){if(!window.pdfjsLib)await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'}
async function pageBlob(page){
 let scale=1.8,quality=.78;
 for(let i=0;i<10;i++){
  const vp=page.getViewport({scale}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport:vp}).promise;
  const blob=await new Promise(ok=>canvas.toBlob(ok,'image/jpeg',quality));if(!blob)throw new Error('PDF 페이지 이미지 변환에 실패했습니다.');if(blob.size<=420000)return blob;
  scale=Math.max(.75,scale*Math.min(.88,Math.sqrt(420000/blob.size)*.92));quality=Math.max(.38,quality-.07);
 }
 throw new Error('페이지 압축에 실패했습니다.');
}
async function ocr(blob,pageNo){
 const fd=new FormData();fd.append('file',blob,'page-'+pageNo+'.jpg');
 const res=await fetch(OCR_ENDPOINT,{method:'POST',body:fd}),data=await res.json().catch(()=>({}));
 if(!res.ok){let d=data.detail||data.error||('OCR 서버 오류 ('+res.status+')');if(typeof d==='object')d=JSON.stringify(d);throw new Error(String(d))}
 return data;
}

function textFromOCR(data){
 const pageText=Array.isArray(data&&data.pages)?data.pages.map(p=>String(p&&p.text||'')).filter(Boolean).join('\n'):'';
 if(pageText)return pageText;
 if(data&&typeof data.text==='string'&&data.text.trim())return data.text;
 return (data&&data.ParsedResults||[]).map(x=>String(x&&x.ParsedText||'')).filter(Boolean).join('\n');
}
function normalizeText(s){
 let t=String(s||'').replace(/\r/g,'\n').replace(/[ \t\f\v]+/g,' ').replace(/\n{2,}/g,'\n').trim();
 const tokens=['임원에관한사항','회사성립연월일','대표이사','사내이사','사외이사','기타비상무이사','감사위원','감사','이사','취임','중임','사임','퇴임','해임','주소변경'];
 for(const token of tokens){
  const re=new RegExp(token.split('').join('\\\\s*'),'g');
  t=t.replace(re,token);
 }
 return t;
}
function parseTextDocument(text){
 const src=normalizeText(text), lines=src.split('\n').map(x=>x.trim()).filter(Boolean);
 let corp='법인명 인식 필요',founded='';
 for(let i=0;i<lines.length;i++){
  const t=lines[i];
  if(corp==='법인명 인식 필요'){
   const m=t.match(/(?:^|\s)상호\s+(.+)/);
   if(m)corp=m[1].trim().slice(0,120);
  }
  if(/회사\s*성립\s*연월일|회사성립연월일/.test(t)){
   const near=[t,lines[i+1]||'',lines[i+2]||''].join(' ');
   founded=dateOf(near)||founded;
  }
 }
 // 법인명 보조 인식
 if(corp==='법인명 인식 필요'){
  const m=src.match(/상호\s+([^\n]+)/);
  if(m)corp=m[1].trim().slice(0,120);
 }
 // 성립일 보조 인식
 if(!founded){
  const m=src.match(/회사\s*성립\s*연월일[\s\S]{0,80}/);
  if(m)founded=dateOf(m[0])||'';
 }

 let section=src;
 const sm=src.search(/임원에\s*관한\s*사항/);
 if(sm>=0)section=src.slice(sm).replace(/^.*?임원에\s*관한\s*사항/,'');
 const stop=section.search(/\n\s*(?:지점에\s*관한\s*사항|기타사항|등기기록의\s*개설)/);
 if(stop>=0)section=section.slice(0,stop);
 const ls=section.split('\n').map(x=>x.trim()).filter(Boolean);

 const roleRe=/(대표이사|사내이사|사외이사|기타비상무이사|감사위원|감사|이사)(?:\\s+(.+))?/;
 const eventRe=/(중임|취임|사임|퇴임|해임)/g;
 const groups=[];
 let cur=null;

 function usableName(tail,role){
  let s=String(tail||'').replace(role||'',' ').trim();
  // 주민번호/생년월일 앞의 성명을 최우선으로 잡는다.
  let m=s.match(/((?:(?:미합중국|미국|일본|중국|캐나다|호주|영국|프랑스|독일)(?:인)?\s*)?[가-힣]{2,5})\s*(?=\d{6}\s*[-–]?)/);
  if(m)return m[1].trim();
  // 날짜·주소·사건 문구를 제거한 뒤 첫 성명 후보.
  s=s.replace(/\d{4}\s*년[\s\S]*$/,' ').replace(/\d{6}\s*[-–]?[\d*●•Xx-]*/g,' ');
  const a=s.match(/[가-힣]{2,5}/g)||[];
  const stopName=/^(주소|변경|등기|취임|중임|사임|퇴임|해임|말소|회복|대표이사|사내이사|사외이사|기타비상무이사|감사위원|감사|이사)$/;
  return a.find(x=>!stopName.test(x))||'';
 }

 for(let i=0;i<ls.length;i++){
  const line=ls[i], rm=line.match(roleRe);
  if(rm){
   const role=rm[1];
   // 직위와 성명이 줄바꿈된 OCR도 처리하되, 다음 직위까지 넘어가지는 않는다.
   const tail=[rm[2]||'',ls[i+1]||'',ls[i+2]||''].join(' ').trim();
   const n=usableName(tail,role);
   // 주소변경 행은 새 임원이 아니다. 성명이 확인된 실제 직위행만 새 블록으로 연다.
   if(n && !(/^|\\s)주소변경/.test(String(rm[2]||''))){
    cur={role,name:n,events:[],order:groups.length};
    groups.push(cur);
   }
  }
  if(!cur)continue;
  // 사건일이 다음 줄에 분리되는 Document AI 결과까지 최대 2줄 범위에서 결합한다.
  const window=[line,ls[i+1]||'',ls[i+2]||''].join(' ');
  const kinds=[...window.matchAll(eventRe)].map(m=>m[1]);
  for(const kind of kinds){
   const d=dateOf(window);
   if(d && !cur.events.some(e=>e.kind===kind&&e.date===d))cur.events.push({kind,date:d,order:i});
  }
 }

 // 1차에서 임원을 하나도 못 잡은 경우: Document AI가 표를 한 줄로 합친 형태를 직접 스캔한다.
 if(!groups.length){
  const flat=section.replace(/\n/g,' ');
  const rr=/(대표이사|사내이사|사외이사|기타비상무이사|감사위원|감사|이사)\s+((?:(?:미합중국|미국|일본|중국|캐나다|호주|영국|프랑스|독일)(?:인)?\s*)?[가-힣]{2,5})([\s\S]*?)(?=(?:대표이사|사내이사|사외이사|기타비상무이사|감사위원|감사|이사)\s+|$)/g;
  let m;
  while((m=rr.exec(flat))){
   const g={role:m[1],name:m[2].trim(),events:[],order:groups.length};
   const body=m[3]||'';
   const er=/((?:19|20)\d{2}\D{0,3}\d{1,2}\D{0,3}\d{1,2})[\s\S]{0,28}?(중임|취임|사임|퇴임|해임)|(중임|취임|사임|퇴임|해임)[\s\S]{0,28}?((?:19|20)\d{2}\D{0,3}\d{1,2}\D{0,3}\d{1,2})/g;
   let e;
   while((e=er.exec(body))){
    const kind=e[2]||e[3],date=dateOf(e[1]||e[4]);
    if(kind&&date&&!g.events.some(x=>x.kind===kind&&x.date===date))g.events.push({kind,date,order:e.index});
   }
   groups.push(g);
  }
 }

 // 같은 직위+성명 OCR 중복을 하나로 합친다.
 const merged=new Map();
 for(const g of groups){
  const key=g.role+'|'+g.name;
  if(!merged.has(key))merged.set(key,{role:g.role,name:g.name,events:[],order:g.order});
  const z=merged.get(key);
  for(const e of g.events)if(!z.events.some(x=>x.kind===e.kind&&x.date===e.date))z.events.push(e);
 }
 const officers=[];
 for(const g of merged.values()){
  g.events.sort((a,b)=>a.date.localeCompare(b.date)||a.order-b.order);
  const stateEvents=g.events.filter(e=>['취임','중임','사임','퇴임','해임'].includes(e.kind));
  const last=stateEvents.length?stateEvents[stateEvents.length-1]:null;
  if(last&&['사임','퇴임','해임'].includes(last.kind))continue;
  const entries=stateEvents.filter(e=>e.kind==='취임'||e.kind==='중임');
  const lastEntry=entries.length?entries[entries.length-1]:null;

  // 취임/중임 기록이 없으면 설립 당시 등재 임원으로 보아 회사성립일을 최초 취임일로 사용.
  // 단, 퇴임계열 사건이 존재한 기록에는 설립일 fallback을 절대 적용하지 않는다.
  let date='',kind='',fallback=false;
  if(lastEntry){date=lastEntry.date;kind=lastEntry.kind}
  else if(!stateEvents.length&&founded){date=founded;kind='설립';fallback=true}
  else {date='';kind='';fallback=false}

  officers.push({role:g.role,name:g.name,date,kind,fallback});
 }
 const out=officers.slice(0,12);
 if(!out.length&&/(대표이사|사내이사|사외이사|기타비상무이사|감사위원|감사|이사)/.test(section)){
  console.warn('[임원파서] 직위 문구는 있으나 현재 임원 0명', {founded,section});
 }
 return {corp,founded,officers:out};
}
function rowsFromOCR(data,pageNo){
 const rows=[];
 (data.ParsedResults||[]).forEach(pr=>{
  const lines=pr&&pr.TextOverlay&&pr.TextOverlay.Lines||[];
  lines.forEach(line=>{
   const words=(line.Words||[]).map(w=>({text:String(w.WordText||'').trim(),left:+w.Left||0,top:+w.Top||0,width:+w.Width||0,height:+w.Height||0})).filter(w=>w.text);
   if(!words.length)return;
   words.sort((a,b)=>a.left-b.left);
   rows.push({page:pageNo,top:Math.min(...words.map(w=>w.top)),bottom:Math.max(...words.map(w=>w.top+w.height)),words,text:words.map(w=>w.text).join(' ')});
  });
 });
 return rows;
}
function normalizedRows(rows){
 rows.sort((a,b)=>a.page-b.page||a.top-b.top);
 return rows.map((r,index)=>({...r,index,words:r.words.slice().sort((a,b)=>a.left-b.left),compact:String(r.text||'').replace(/\s+/g,'').replace(/[·ㆍ]/g,'')}));
}
function compact(s){return String(s||'').replace(/\s+/g,'').replace(/[·ㆍ]/g,'')}
function eventKind(s){
 const x=compact(s);
 if(x.includes('중임'))return'중임';
 if(x.includes('취임'))return'취임';
 if(x.includes('사임'))return'사임';
 if(x.includes('퇴임'))return'퇴임';
 if(x.includes('해임'))return'해임';
 return'';
}
function idName(text,role){
 const t=String(text||'').replace(role||'',' ');
 const m=t.match(/((?:(?:미합중국|미국|일본|중국|캐나다|호주|영국|프랑스|독일)(?:인)?\s*)?[가-힣]{2,4})\s*(?=\d{6}\s*[-–]?\s*[\d*●•Xx]{1,7})/);
 return m?m[1].trim():'';
}
function lineEvent(row){
 const joined=compact(row.text),kind=eventKind(joined),date=dateOf(joined);
 return kind&&date?{kind,date,row:row.index}:null;
}
function mergeNearbyEvent(rows,idx,from,to){
 const base=rows[idx];
 const candidates=[];
 for(let j=Math.max(from,idx-1);j<=Math.min(to-1,idx+1);j++){
  if(rows[j].page!==base.page)continue;
  const dy=Math.abs(((rows[j].top+rows[j].bottom)/2)-((base.top+base.bottom)/2));
  if(j===idx||dy<=Math.max(16,(base.bottom-base.top)*1.15)){
   candidates.push(...rows[j].words);
  }
 }
 candidates.sort((a,b)=>a.top-b.top||a.left-b.left);
 const text=compact(candidates.map(w=>w.text).join(' ')),kind=eventKind(text),date=dateOf(text);
 return kind&&date?{kind,date,row:idx}:null;
}
function parse(rows){
 rows=normalizedRows(rows);
 let corp='법인명 인식 필요',founded='';
 for(let i=0;i<rows.length;i++){
  const t=rows[i].text;
  if(corp==='법인명 인식 필요'&&/주식회사/.test(t))corp=t.replace(/^상\s*호\s*/,'').slice(0,120);
  if(/회사\s*성립|성립\s*연월일/.test(t)){
   let near=t;
   for(let j=i+1;j<Math.min(rows.length,i+4)&&rows[j].page===rows[i].page;j++)near+=' '+rows[j].text;
   founded=dateOf(near)||founded;
  }
 }

 const records=[];
 for(let i=0;i<rows.length;i++){
  const role=roleOf(rows[i].text);
  if(!role)continue;

  // 한 임원 기록은 현재 직책행부터 다음 직책행 직전까지만 사용한다.
  // 단, 페이지를 넘기지 않는다.
  let end=i+1;
  while(end<rows.length&&rows[end].page===rows[i].page&&!roleOf(rows[end].text)&&end-i<18)end++;
  const block=rows.slice(i,end);

  // 주민번호/식별번호 바로 앞 성명을 최우선으로 사용한다.
  let name='';
  for(const row of block){name=idName(row.text,role);if(name)break}
  if(!name){
   for(const row of block){const n=personName(row.text,role);if(n!=='성명 확인 필요'){name=n;break}}
  }
  if(!name)name='성명 확인 필요';

  // 취임·중임·사임·퇴임·해임만 사건으로 인정한다.
  // 주소변경·등기일 등 다른 날짜는 여기 들어오지 않는다.
  const events=[];
  for(let j=i;j<end;j++){
   const row=rows[j];
   if(!eventKind(row.text))continue;
   let ev=lineEvent(row);
   if(!ev)ev=mergeNearbyEvent(rows,j,i,end);
   if(ev&&!events.some(x=>x.kind===ev.kind&&x.date===ev.date))events.push(ev);
  }
  events.sort((a,b)=>a.date.localeCompare(b.date)||a.row-b.row);

  const entries=events.filter(e=>e.kind==='취임'||e.kind==='중임');
  const exits=events.filter(e=>e.kind==='사임'||e.kind==='퇴임'||e.kind==='해임');
  const lastEntry=entries.length?entries[entries.length-1]:null;
  const lastExit=exits.length?exits[exits.length-1]:null;

  // 마지막 상태가 사임·퇴임·해임이면 현재 임원에서 제외한다.
  if(lastExit&&(!lastEntry||lastExit.date>lastEntry.date||(lastExit.date===lastEntry.date&&lastExit.row>=lastEntry.row)))continue;

  records.push({
   role,name,
   date:lastEntry?lastEntry.date:founded,
   fallback:!lastEntry,
   kind:lastEntry?lastEntry.kind:'',
   sourceRow:i
  });
 }

 // OCR 중복만 제거한다. 서로 다른 직책은 임의로 합치지 않는다.
 const officers=[];
 for(const o of records){
  const same=officers.find(x=>x.role===o.role&&x.name===o.name);
  if(!same){officers.push(o);continue}
  if((o.date||'')>(same.date||''))Object.assign(same,o);
 }
 return {corp,founded,officers:officers.map(({sourceRow,...o})=>o).slice(0,12)};
}
function render(r){
 countEl.textContent=r.officers.length+'명';statusEl.textContent='OCR 분석 완료';
 let h='<div class="box"><small>법인명</small><strong>'+esc(r.corp)+'</strong><small style="margin-top:12px">회사성립연월일</small><strong>'+esc(r.founded||'인식 필요')+'</strong></div>';
 r.officers.forEach(o=>{const end=o.role==='감사'?auditorEnd(o.date):directorEnd(o.date);h+='<div class="box"><div class="head"><strong>'+esc(o.role)+' · '+esc(o.name)+'</strong><span class="badge">'+(o.fallback?'설립 당시 취임':esc(o.kind))+'</span></div><div class="rows"><div class="row">임기 기준일<strong>'+esc(o.date||'확인 필요')+'</strong></div><div class="row">기준<strong>'+(o.fallback?'설립 당시 임원 → 회사성립연월일':esc(o.kind)+'일')+'</strong></div><div class="row">임기만료<strong>'+esc(end)+'</strong></div></div></div>'});
 resultEl.innerHTML=h;
}
analyze.onclick=async()=>{
 if(!selected)return;analyze.disabled=true;statusEl.textContent='PDF 변환 준비 중';countEl.textContent='…';
 try{
  await ensurePdf();const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await selected.arrayBuffer())}).promise;let rows=[],texts=[];
  for(let p=1;p<=pdf.numPages;p++){
   statusEl.textContent='페이지 '+p+'/'+pdf.numPages+' 이미지 변환 중';
   const page=await pdf.getPage(p),blob=await pageBlob(page);
   statusEl.textContent='페이지 '+p+'/'+pdf.numPages+' OCR 분석 중 ('+Math.ceil(blob.size/1024)+'KB)';
   const data=await ocr(blob,p),raw=textFromOCR(data);
   if(raw)texts.push(raw);
   rows=rows.concat(rowsFromOCR(data,p));
  }
  let parsed;
  if(texts.join('\n').trim())parsed=parseTextDocument(texts.join('\n'));
  else if(rows.length)parsed=parse(rows);
  else throw new Error('OCR 텍스트를 찾지 못했습니다.');
  render(parsed);document.querySelectorAll('.step').forEach(x=>x.classList.add('active'));
 }catch(e){console.error(e);statusEl.textContent='분석 실패';countEl.textContent='!';resultEl.innerHTML='<div class="notice">'+esc(e.message||e)+'</div>'}
 finally{analyze.disabled=!selected}
};
})();
</script>
