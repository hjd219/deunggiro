<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>도장 파일 점검</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#eef6fb;margin:0;padding:24px;color:#172840}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:18px;padding:24px;box-shadow:0 16px 40px rgba(15,31,50,.15)}
.box{height:220px;border:2px dashed #36a9e1;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff}
img{width:150px;height:150px;object-fit:contain;background:#fff}
#status{margin-top:16px;font-weight:800;font-size:14px;line-height:1.6}
.small{font-size:12px;color:#667384;margin-top:8px;word-break:break-all}
</style></head><body><div class="card"><h2>도장 원본 파일 점검</h2><div class="box"><img id="stamp" src="/assets/deunggiro-stamp-clean.png?v=stamp-test-1" alt="도장"></div><div id="status">불러오는 중…</div><div class="small">/assets/deunggiro-stamp-clean.png</div></div>
<script>
const i=document.getElementById('stamp'),s=document.getElementById('status');
i.addEventListener('load',()=>{s.textContent='이미지 로드 성공 · 원본 '+i.naturalWidth+' × '+i.naturalHeight+' px';});
i.addEventListener('error',()=>{s.textContent='이미지 로드 실패 · 파일 경로/배포 문제';});
</script></body></html>
