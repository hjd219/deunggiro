10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #d8e5e9;display:flex;gap:8px}.bottom a{flex:1;height:50px;border-radius:11px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;font-weight:900}</style></head><body><main class="phone"><header class="head"><div class="logo">스마트 등기로</div></header><div class="screen"><section class="card"><div id="quiz"><div class="progress" id="pg"></div><h1 class="q" id="q"></h1><div id="options"></div><button class="back" id="back" onclick="prev()">← 이전 질문</button></div><div class="result" id="result"><div class="progress">진단 결과</div><h2 id="rh"></h2><p id="rp"></p><div class="row"><b>선택한 상황</b><span id="chosen"></span></div><div class="row"><b>다음 단계</b><span>필요서류와 관련 처리사례를 확인하고 예상비용을 계산할 수 있습니다.</span></div><div class="actions"><a class="calc" href="/acquisition-calculator.html">비용 계산</a><a class="call" href="tel:0324251500">전화 상담</a></div><button class="reset" onclick="resetAll()">다시 진단하기</button></div></section></div></main><nav class="bottom"><a class="calc" href="/acquisition-calculator.html">비용 계산</a><a class="call" href="tel:0324251500">전화 상담</a></nav><script>let step=0,a=[];const flows={"상속등기":[["현재 가장 가까운 상황은 무엇입니까?",["일반 상속등기","연락두절 상속인","미성년자 상속인","외국인·해외거주 상속인"]],["상속인 간 재산분할 협의가 되었습니까?",["협의 완료","아직 협의 전","협의가 어려움"]]],"상속포기 · 한정승인":[["사망 사실을 안 지 얼마나 되었습니까?",["3개월 이내","3개월이 지남"]],["현재 가장 가까운 상황은 무엇입니까?",["상속포기 희망","채무가 많아 한정승인 검토","선순위 상속인이 포기함","채권자 소송·독촉을 받음"]]],"법인등기":[["어떤 등기가 필요합니까?",["법인설립","대표·임원변경","본점이전","상호·목적변경","증자"]],["추가로 해당되는 사항이 있습니까?",["특별한 사항 없음","과밀·비과밀 지역 이동","임원 연락두절"]]]};function data(){if(step===0)return["어떤 업무를 확인하시겠습니까?",["상속등기","상속포기 · 한정승인","법인등기"]];return flows[a[0]][step-1]}function draw(){const d=data();pg.textContent=(step+1)+" / 3";q.textContent=d[0];options.innerHTML="";d[1].forEach(v=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<span>"+v+"</span><span class='arrow'>›</span>";b.onclick=()=>choose(v);options.appendChild(b)});back.style.visibility=step?"visible":"hidden"}function choose(v){a[step]=v;if(step<2){step++;draw()}else finish()}function prev(){if(step>0){a.pop();step--;draw()}}function finish(){quiz.style.display="none";result.style.display="block";rh.textContent=a[0]+" 진단이 완료되었습니다.";rp.textContent="선택한 내용에 맞춰 우선 확인할 절차를 안내할 수 있습니다.";chosen.textContent=a.join(" → ")}function resetAll(){step=0;a=[];result.style.display="none";quiz.style.display="block";draw()}draw();</script></body></html>
