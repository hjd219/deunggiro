<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI 등기로 전송 아이콘 8종</title><style>*{box-sizing:border-box}body{margin:0;background:#f7fbfd;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#263b43}.wrap{max-width:620px;margin:0 auto;padding:34px 18px}.head{text-align:center;margin-bottom:28px}.head b{color:#299bc7;font-size:22px}.head p{font-size:13px;color:#657b83;margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #d8e9ef;border-radius:18px;padding:20px 12px;text-align:center;box-shadow:0 5px 16px rgba(31,101,128,.06)}.card h3{font-size:14px;margin:13px 0 3px}.card p{font-size:11px;color:#71858c;margin:0}.send{width:52px;height:52px;border:0;border-radius:15px;background:#299bc7;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0}.send svg{width:25px;height:25px;display:block}.stroke{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.txt{font-size:28px;font-weight:800;line-height:1}.recommended{border:2px solid #299bc7;position:relative}.recommended:before{content:'추천';position:absolute;right:10px;top:9px;background:#e6f6fb;color:#299bc7;font-size:10px;font-weight:800;padding:3px 7px;border-radius:10px}@media(max-width:380px){.wrap{padding:26px 12px}.grid{gap:10px}.card{padding:18px 8px}}</style></head><body><main class="wrap"><div class="head"><b>AI 등기로 전송 아이콘 8종</b><p>실제 전송 버튼 크기와 등기로 색상으로 비교</p></div><div class="grid">
