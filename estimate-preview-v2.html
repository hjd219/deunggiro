<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>등기로 새 견적서 미리보기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eef4f7;color:#173342;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;padding:12px;background:#fff;border-bottom:1px solid #dce7eb}.bar button{flex:1;min-height:48px;border:0;border-radius:12px;font-size:15px;font-weight:850}.back{background:#e9f0f4;color:#173342}.save{background:#35a9e1;color:#fff}.stage{padding:18px 10px 36px}.paper{width:min(794px,100%);min-height:1123px;margin:auto;background:#fff;padding:48px;box-shadow:0 10px 30px rgba(30,64,82,.08)}.estimate-head{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:16px;border-bottom:2px solid #35a9e1}.estimate-head>div{display:flex;align-items:baseline;gap:14px}.estimate-head b{font-size:27px;color:#35a9e1}.estimate-head span{font-size:17px;font-weight:900}.estimate-head small{font-size:11px;color:#71858f}.estimate-hero{padding:28px 0 25px;border-bottom:1px solid #dce7eb}.estimate-hero>span{display:block;font-size:12px;font-weight:800;color:#71858f}.estimate-hero strong{display:block;margin:4px 0;font-size:38px;letter-spacing:-1.5px;color:#168fc5}.estimate-hero small{font-size:11px;color:#8798a0}.estimate-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:25px 0;border-bottom:1px solid #dce7eb}.estimate-col+.estimate-col{border-left:1px solid #e0e9ed;padding-left:28px}.estimate-col h3,.estimate-docs h3{margin:0 0 14px;font-size:16px}.estimate-rate{display:flex;gap:7px;align-items:baseline;min-height:30px;font-size:10px;color:#6c818c}.estimate-rate small{margin-left:auto}.row,.subtotal{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:33px;padding:6px 0;border-bottom:1px solid #e5ecef;font-size:11px}.row span{color:#617782}.row b{white-space:nowrap}.subtotal{margin-top:6px;border-top:1px solid #bfcfd6;border-bottom:0;font-size:12px;font-weight:900}.subtotal strong{color:#168fc5}.estimate-docs{padding:21px 0;border-bottom:1px solid #dce7eb}.doc-line{margin:6px 0;font-size:11px;line-height:1.65;color:#526b77}.estimate-office{display:grid;gap:4px;padding-top:18px;font-size:10px;line-height:1.5;color:#71858f}.estimate-office b{font-size:12px;color:#173342}@media(max-width:700px){.stage{overflow:hidden;padding:10px 0 24px}.paper{width:794px;min-width:794px;padding:48px;transform-origin:top center;box-shadow:none}}@media print{@page{size:A4;margin:8mm}body{background:#fff}.bar{display:none}.stage{padding:0}.paper{width:194mm;min-height:0;margin:0;padding:5mm;box-shadow:none;transform:none!important}}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script></head>
<body><div class="bar"><button class="back" id="back">← 계산기로 돌아가기</button><button class="save" id="save">PDF 저장</button></div><div class="stage" id="stage"><main class="paper" id="paper"></main></div>
<script>
const paper=document.getElementById('paper'),stage=document.getElementById('stage'),raw=sessionStorage.getItem('deunggiroEstimatePreview');
if(raw){try{const d=JSON.parse(raw);document.title=d.title||document.title;paper.innerHTML=d.html||''}catch(e){paper.textContent='견적서를 표시하지 못했습니다.'}}else paper.innerHTML='<p style="text-align:center;padding:80px 0">견적 정보가 없습니다.</p>';
function fit(){if(innerWidth>700){paper.style.transform='';stage.style.height='';return}const z=Math.min(1,Math.max(300,innerWidth)/794);paper.style.transform='scale('+z+')';stage.style.height=(paper.scrollHeight*z+12)+'px'}requestAnimationFrame(()=>requestAnimationFrame(fit));addEventListener('resize',fit);
document.getElementById('back').onclick=()=>{const from=sessionStorage.getItem('deunggiroEstimateSource');if(from)location.href=from;else history.back()};
document.getElementById('save').onclick=async()=>{const btn=document.getElementById('save'),old=btn.textContent;try{btn.disabled=true;btn.textContent='PDF 만드는 중...';if(!window.html2canvas||!window.jspdf){window.print();return}const c=await html2canvas(paper,{scale:2,useCORS:true,backgroundColor:'#fff'}),{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'}),w=210,h=c.height*w/c.width,img=c.toDataURL('image/jpeg',.96);let y=0,left=h;pdf.addImage(img,'JPEG',0,y,w,h,'FAST');left-=297;while(left>0){y=left-h;pdf.addPage();pdf.addImage(img,'JPEG',0,y,w,h,'FAST');left-=297}const blob=pdf.output('blob'),url=URL.createObjectURL(blob),ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(ios){const win=window.open(url,'_blank');if(!win)location.href=url;setTimeout(()=>URL.revokeObjectURL(url),120000)}else{const a=document.createElement('a');a.href=url;a.download='등기로-예상견적서.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}}catch(e){window.print()}finally{btn.disabled=false;btn.textContent=old}};
</script></body></html>
