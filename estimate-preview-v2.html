<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>등기로 새 견적서 미리보기</title>
<style>
:root{--accent:#35a9e1;--ink:#173342;--muted:#4f6672;--line:#d8e4e9;--soft:#f4f9fb}*{box-sizing:border-box}html,body{margin:0;background:#eef3f6;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;padding:12px max(12px,env(safe-area-inset-right)) 12px max(12px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--line)}.bar button{flex:1;min-height:50px;border:0;border-radius:13px;font-size:16px;font-weight:850;cursor:pointer}.back{background:#e9f0f4;color:var(--ink)}.save{background:var(--accent);color:#fff}.stage{padding:20px 12px 40px}.paper{width:min(794px,100%);min-height:1123px;margin:auto;background:#fff;padding:46px 50px;box-shadow:0 10px 30px rgba(30,64,82,.08)}.quote-head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:end;padding-bottom:15px;border-bottom:2px solid var(--accent)}.brand{font-size:27px;font-weight:950;color:var(--accent);letter-spacing:-1px}.quote-title{display:grid;gap:2px}.quote-title b{font-size:17px}.quote-title span,.quote-date{font-size:10px;color:var(--muted)}.grand{padding:25px 0 22px;border-bottom:1px solid var(--line)}.grand>span{display:block;font-size:11px;font-weight:850;color:var(--muted)}.grand strong{display:block;margin:3px 0;font-size:35px;letter-spacing:-1.5px;color:#168fc5}.grand small{font-size:10px;color:#607782}.block{padding:19px 0}.block h2{margin:0 0 11px;font-size:15px}.property-table{width:100%;border-collapse:collapse;font-size:9.5px}.property-table th{padding:7px 6px;text-align:left;background:var(--soft);color:var(--muted);font-weight:850;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.property-table td{padding:8px 6px;border-bottom:0}.property-table th:nth-child(n+3),.property-table td:nth-child(n+3){text-align:right}.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.cost-grid>.block+ .block{border-left:1px solid var(--line);padding-left:28px}.rate-note{display:flex;align-items:center;gap:6px;min-height:25px;font-size:9px;color:var(--muted)}.rate-note span{margin-left:auto;font-size:8.5px}.cost-row,.sum-row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:30px;padding:5px 0;border-bottom:0!important;font-size:10px}.cost-row span{color:#425d6a}.cost-row b{white-space:nowrap}.sum-row{margin-top:5px;border-top:1px solid #bdced5;border-bottom:0;font-size:11px;font-weight:900}.sum-row strong{color:#168fc5}.docs{border-bottom:0}.doc-item{margin:3px 0;font-size:9.2px;line-height:1.42;color:#405b68}.doc-item b{color:var(--ink)}.docs-split{display:grid;grid-template-columns:minmax(0,1fr) 182px;gap:44px;align-items:start}.docs-account,.docs-list{position:relative;display:grid;align-content:start;gap:8px;padding:0 0 0 13px}.docs-account:before,.docs-list:before{content:"";position:absolute;left:0;top:0;width:2px;height:18px;background:var(--accent);border-radius:2px}.docs-account{font-size:9.5px;line-height:1.45}.docs-account h2,.docs-list h2{margin:0 0 8px;font-size:15px;line-height:1.2;color:var(--ink)}.docs-account span{display:block;color:#526b77}.docs-account strong{display:block;margin-top:2px;font-size:12px;letter-spacing:.1px;color:var(--ink)}.docs-account small{display:block;margin-top:2px;font-size:8.5px;color:var(--muted)}.notice{display:grid;grid-template-columns:45px 1fr;gap:10px;margin-top:16px;padding:10px 12px;background:var(--soft);border-left:3px solid #9ed6ee;font-size:9px;line-height:1.5;color:#607985}.notice b{color:var(--ink)}.quote-footer{display:flex;justify-content:space-between;gap:20px;padding-top:17px;font-size:9px;line-height:1.55;color:#506975}.quote-footer>div{display:grid;gap:2px}.quote-footer>div:last-child{text-align:right}.quote-footer b{font-size:10.5px;color:var(--ink)}.empty{text-align:center;padding:80px 0}
@media(max-width:700px){.stage{padding:10px 8px 28px}.paper{width:100%;min-height:0;padding:25px 20px;box-shadow:none}.quote-head{grid-template-columns:1fr auto;gap:8px}.brand{font-size:25px}.quote-title{grid-column:1/2}.quote-title b{font-size:15px}.quote-date{grid-column:2;grid-row:1/3;align-self:end}.grand{padding:22px 0 19px}.grand strong{font-size:31px}.property-table{font-size:9px}.property-table th,.property-table td{padding:7px 4px}.cost-grid{grid-template-columns:1fr;gap:0}.cost-grid>.block+ .block{border-left:0;border-top:1px solid var(--line);padding-left:0}.block{padding:17px 0}.block h2{font-size:16px}.cost-row,.sum-row{font-size:11px}.doc-item{font-size:9.8px;line-height:1.45}.docs-split{grid-template-columns:minmax(0,1fr) 40%;gap:22px}.docs-account,.docs-list{padding-left:12px}.docs-account{gap:9px}.docs-account strong{font-size:11.5px}.docs-account h2,.docs-list h2{margin-bottom:7px}.quote-footer{display:grid}.quote-footer>div:last-child{text-align:left}}
@media print{@page{size:A4;margin:8mm}html,body{background:#fff}.bar{display:none}.stage{padding:0}.paper{width:194mm;min-height:0;margin:0;padding:5mm;box-shadow:none}.quote-head{break-inside:avoid}.cost-grid,.docs,.notice,.quote-footer{break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script></head>
<body><div class="bar"><button class="back" id="back">← 계산기로 돌아가기</button><button class="save" id="save">PDF 저장</button></div><div class="stage" id="stage"><main class="paper" id="paper"></main></div>
<script>
const paper=document.getElementById('paper'),stage=document.getElementById('stage'),raw=sessionStorage.getItem('deunggiroEstimatePreview');
if(raw){try{const d=JSON.parse(raw);document.title=d.title||document.title;paper.innerHTML=d.html||''}catch(e){paper.textContent='견적서를 표시하지 못했습니다.'}}else paper.innerHTML='<p class="empty">견적 정보가 없습니다.</p>';

document.getElementById('back').onclick=()=>{const from=sessionStorage.getItem('deunggiroEstimateSource');if(from)location.href=from;else history.back()};
document.getElementById('save').onclick=async()=>{const btn=document.getElementById('save'),old=btn.textContent;try{btn.disabled=true;btn.textContent='PDF 만드는 중...';if(!window.html2canvas||!window.jspdf){window.print();return}const prev=paper.getAttribute('style')||'';paper.style.width='794px';paper.style.minHeight='0';paper.style.padding='20px';paper.style.boxShadow='none';await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const c=await html2canvas(paper,{scale:3,useCORS:true,backgroundColor:'#fff',width:794,windowWidth:1200,onclone:doc=>{const cp=doc.getElementById('paper');cp.style.position='static';cp.style.left='auto';cp.style.top='auto';cp.style.transform='none';cp.style.width='794px';cp.style.minHeight='0';cp.style.padding='20px';cp.style.boxShadow='none'}});paper.setAttribute('style',prev);const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'}),img=c.toDataURL('image/png'),pageW=184,pageH=277,ratio=Math.min(pageW/c.width,pageH/c.height),w=c.width*ratio,h=c.height*ratio,x=(210-w)/2,y=(297-h)/2;pdf.addImage(img,'PNG',x,y,w,h);const blob=pdf.output('blob'),url=URL.createObjectURL(blob),ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(ios){const win=window.open(url,'_blank');if(!win)location.href=url;setTimeout(()=>URL.revokeObjectURL(url),120000)}else{const a=document.createElement('a');a.href=url;a.download='등기로-예상견적서.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}}catch(e){window.print()}finally{btn.disabled=false;btn.textContent=old}};
</script></body></html>
