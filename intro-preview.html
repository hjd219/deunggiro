*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#eef6fb;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:#20242b}

<section class="modal"><button class="close">×</button><div class="kicker">등기로 소개</div>
<h2>상황이 다르면, 해결방법도 달라집니다.</h2>
<div class="copy"><p>같은 이름의 사건이라도 사람마다 상황은 다릅니다.</p><p>무엇을 먼저 확인하고, 어떤 절차로 진행해야 하는지 쉽게 설명드립니다.</p><p>필요한 절차와 비용, 주의할 점까지 실제 사건을 기준으로 살펴드립니다.</p></div>
