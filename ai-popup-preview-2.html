<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>AI 등기로 플로팅 미리보기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}body{overflow:hidden;background:#fff}.site{position:fixed;inset:0;width:100%;height:100%;border:0}.ai-float{position:fixed;right:18px;bottom:28px;z-index:99998;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;gap:9px;filter:drop-shadow(0 7px 16px rgba(30,111,143,.16));animation:floatIn .55s ease-out}.ai-orb{order:2;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#dff5fc,#fff);border:1.5px solid #82c8df;box-shadow:0 7px 22px rgba(27,116,151,.24);color:#299bc7;font-weight:900;font-size:17px;position:relative}.ai-orb:before{content:'✦';position:absolute;top:7px;right:9px;font-size:14px;color:#299bc7}.ai-call{order:1;position:relative;background:#fff;border:1px solid #bcdde9;border-radius:18px;padding:10px 13px;color:#299bc7;font-size:13px;font-weight:850;white-space:nowrap;box-shadow:0 5px 18px rgba(31,101,128,.12)}.ai-call:after{content:'';position:absolute;right:-6px;top:50%;width:10px;height:10px;background:#fff;border-top:1px solid #bcdde9;border-right:1px solid #bcdde9;transform:translateY(-50%) rotate(45deg)}.ai-call small{display:block;font-size:10px;font-weight:700;color:rgba(41,155,199,.72);margin-top:2px}.ai-float.nudge .ai-orb{animation:nudge 1.8s ease-in-out 2}.ai-panel{display:none;position:fixed;z-index:99999;background:#f7fbfd;border:1px solid #cfe1e8;overflow:hidden;box-shadow:0 18px 55px rgba(25,76,95,.24)}.ai-panel.on{display:block;animation:pop .18s ease-out}.top{height:58px;background:#fff;border-bottom:1px solid #d9e8ed;display:flex;align-items:center;padding:0 14px}.logo{font-size:17px;font-weight:900;color:#299bc7;flex:1}.logo b{display:inline-block;margin-right:7px;padding:3px 7px;border-radius:7px;background:#e5f6fb;color:#299bc7;font-size:12px}.close{border:0;background:none;font-size:25px;line-height:1;color:#61777f;padding:8px;cursor:pointer}.body{height:calc(100% - 58px);overflow:auto;padding:24px 18px 92px}.bubble{max-width:90%;padding:14px 15px;border-radius:5px 17px 17px 17px;background:#eaf7fb;border:1px solid #bcdde9;color:#293b42;font-size:14px;line-height:1.7;box-shadow:0 3px 10px rgba(31,91,112,.05)}.bubble strong{display:block;color:#299bc7;font-size:14px;margin-bottom:5px}.note{margin-top:15px;color:#299bc7;font-size:12px;font-weight:750;line-height:1.6;letter-spacing:-.15px;white-space:nowrap}.compose{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d9e8ed;padding:10px 11px max(10px,env(safe-area-inset-bottom))}.composein{display:flex;gap:8px;width:100%;min-width:0}.input{flex:1 1 0;min-width:0;width:0;height:46px;border:1px solid #cddfe6;border-radius:14px;padding:0 13px;font-size:14px;outline:none}.input:focus{border-color:#5cb4d2}.send{flex:0 0 46px;width:46px;height:46px;border:0;border-radius:13px;background:#299bc7;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.send svg{width:23px;height:23px;display:block;overflow:visible}.send path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@keyframes floatIn{from{opacity:0;transform:translateX(25px)}to{opacity:1;transform:none}}@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(min-width:769px){.ai-panel{right:22px;bottom:112px;width:400px;height:min(620px,calc(100vh - 145px));border-radius:20px}.ai-float.hidden{display:none}.note{font-size:12px!important;color:#299bc7!important;font-weight:750!important}}
@media(max-width:768px){.ai-float{right:14px;bottom:86px;gap:0;animation:mobileFloat 5s ease-in-out infinite}.ai-orb{width:59px;height:59px;font-size:16px}.ai-call{display:none}.ai-panel{left:3.5vw;right:auto;bottom:82px;width:93vw;max-width:93vw;height:min(72dvh,590px);border-radius:20px}.body{padding:20px 15px 88px}.top{height:55px}.note{font-size:11px;letter-spacing:-.35px}.compose{left:0;right:0;width:100%;padding:10px 10px max(10px,env(safe-area-inset-bottom));overflow:hidden}.composein{width:100%;max-width:100%;min-width:0}.input{font-size:16px;max-width:100%}.send{flex-basis:46px}.ai-float.hidden-mobile{display:none}}@keyframes mobileFloat{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-7px)}90%{transform:translateY(0)}}
@media(max-width:390px){.ai-panel{left:3vw;right:auto;width:94vw;max-width:94vw;height:70dvh;bottom:78px}.note{font-size:10.5px;letter-spacing:-.55px}}
</style></head><body>
<iframe class="site" src="/" title="등기로 홈페이지"></iframe>
<button class="ai-float nudge" id="openAI" aria-label="AI 등기로 열기"><span class="ai-orb">AI</span><span class="ai-call">AI에게 물어보기<small>궁금한 점을 편하게 물어보세요</small></span></button>
<section class="ai-panel" id="aiPanel"><header class="top"><div class="logo"><b>AI</b>등기로</div><button class="close" id="closeAI" aria-label="닫기">×</button></header><main class="body"><div class="bubble"><strong>안녕하세요. AI 등기로입니다. 😊</strong>무엇이 궁금하신가요?</div><div class="note">※ 주민등록번호·상세주소·계좌번호 등 민감한 개인정보는 입력하지 마세요.</div></main><div class="compose"><div class="composein"><input class="input" id="aiInput" placeholder="궁금한 상황을 입력해 주세요"><button class="send" aria-label="보내기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5V7.2M7.5 11.2 12 6.7l4.5 4.5"/></svg></button></div></div></section>
<script>const p=document.getElementById('aiPanel'),b=document.getElementById('openAI');b.onclick=()=>{p.classList.add('on');if(innerWidth>768)b.classList.add('hidden');else b.classList.add('hidden-mobile')};document.getElementById('closeAI').onclick=()=>{p.classList.remove('on');b.classList.remove('hidden');b.classList.remove('hidden-mobile')};setTimeout(()=>b.classList.remove('nudge'),4000);if(window.visualViewport){visualViewport.addEventListener('resize',()=>{if(innerWidth<=768&&p.classList.contains('on')){const h=visualViewport.height;p.style.height=Math.max(300,Math.min(h*.72,590))+'px';p.style.bottom=Math.max(10,innerHeight-visualViewport.height+18)+'px'}})}</script>
</body></html>
