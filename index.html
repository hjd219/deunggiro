<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현재두 법무사 사무소 | 인천 상속등기·상속포기·한정승인·법인등기</title>

<meta name="description" content="인천 현재두 법무사 사무소. 상속등기, 상속포기, 한정승인, 법인등기, 부동산등기, 증여등기 등 다양한 등기 업무를 상담합니다.">

<style>
/* =========================
   VARIABLES & RESET
========================= */
:root {
    --bg-color: #1a1a1a; /* 전체 배경 (다크) */
    --section-bg-color: #222222; /* 섹션 배경 (약간 밝은 다크) */
    --text-main: #e0e0e0; /* 주요 텍스트 */
    --text-sub: #a0a0a0; /* 보조 텍스트 */
    --point-color: #4a90e2; /* 포인트 컬러 (신뢰의 블루) */
    --border-color: #333333; /* 테두리 */
    
    /* 폰트 설정 */
    --font-main: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Pretendard", "Segoe UI", sans-serif;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: var(--font-main);
    color: var(--text-main);
    background: var(--bg-color);
    line-height: 1.8; /* 가독성을 위해 행간 조정 */
}

a {
    text-decoration: none;
    color: inherit;
}

ul, ol {
    margin: 0;
    padding: 0;
    list-style: none;
}

/* =========================
   COMMON ELEMENTS
========================= */

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
}

.section {
    padding: 120px 0;
}

.btn {
    display: inline-block;
    padding: 16px 32px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    transition: 0.3s ease;
    cursor: pointer;
}

.btn-dark {
    background: var(--point-color);
    color: #fff;
    border: none;
}

.btn-dark:hover {
    background: #357abd;
}

/* =========================
   HEADER
========================= */

.header {
    border-bottom: 1px solid var(--border-color);
    background: rgba(26, 26, 26, 0.98); /* 배경색과 맞춘 헤더 */
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(5px); /* 배경 흐림 효과 */
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
}

.logo {
    font-size: 22px;
    font-weight: 900; /* 더 굵게 */
    letter-spacing: -0.5px;
}

.logo span {
    display: block;
    font-size: 14px;
    color: var(--text-sub);
    font-weight: 500;
    margin-top: 0px;
}

.nav {
    display: flex;
    gap: 32px;
    font-size: 15px;
    color: var(--text-main);
}

.nav a {
    position: relative;
    padding-bottom: 4px;
}

.nav a::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: 0;
    left: 0;
    background-color: var(--point-color);
    transition: width 0.3s;
}

.nav a:hover::after {
    width: 100%;
}

/* =========================
   HERO
========================= */

.hero {
    background: var(--section-bg-color);
    padding: 160px 0 140px;
}

.hero-label {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--point-color);
    margin-bottom: 24px;
    text-transform: uppercase;
}

.hero h1 {
    font-size: clamp(40px, 6vw, 68px); /* 더 크게 */
    line-height: 1.2;
    letter-spacing: -4px;
    margin: 0 0 30px;
    font-weight: 900;
}

.hero h1 strong {
    font-weight: 900;
    color: var(--point-color);
}

.hero-text {
    font-size: 20px;
    color: var(--text-sub);
    max-width: 720px;
    margin-bottom: 48px;
}

.hero-phone {
    margin-top: 40px;
    font-size: 20px;
    font-weight: 800;
}

.hero-phone a {
    color: var(--point-color);
    text-decoration: underline;
    text-underline-offset: 6px;
}

.hero-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}

/* =========================
   SECTION TITLE
========================= */

.section-title {
    margin-bottom: 60px;
    text-align: center;
}

.section-title small {
    display: block;
    font-size: 14px;
    color: var(--point-color);
    font-weight: 800;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    text-transform: uppercase;
}

.section-title h2 {
    font-size: 42px;
    letter-spacing: -2px;
    margin: 0;
    font-weight: 900;
}

.section-title p {
    color: var(--text-sub);
    margin-top: 16px;
    font-size: 18px;
}

/* =========================
   SERVICES
========================= */

.services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
}

.service-card {
    background: var(--section-bg-color);
    padding: 40px;
    border-radius: 8px;
    transition: 0.3s ease;
    border: 1px solid var(--border-color);
    /* 미묘한 그림자 추가 */
    box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
}

.service-card:hover {
    transform: translateY(-5px);
    border-color: var(--point-color); /* 호버시 테두리 컬러 변경 */
}

.service-number {
    font-size: 15px;
    color: var(--point-color);
    font-weight: 800;
}

.service-card h3 {
    font-size: 24px;
    margin: 20px 0 12px;
    font-weight: 800;
}

.service-card p {
    color: var(--text-sub);
    font-size: 15px;
    margin: 0;
}

/* =========================
   INHERITANCE
========================= */

.inheritance {
    background: var(--section-bg-color);
    padding-bottom: 0px; /* 하단 패딩 제거로 자연스런 연결 */
}

.inheritance-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
}

.inheritance h2 {
    font-size: 40px;
    line-height: 1.4;
    letter-spacing: -2.5px;
    margin: 0 0 24px;
    font-weight: 900;
}

.inheritance p {
    color: var(--text-sub);
    font-size: 18px;
}

.issue-list {
    background: var(--bg-color);
    border-radius: 8px;
    overflow: hidden; /* 둥근 모서리 적용 */
    border: 1px solid var(--border-color);
}

.issue-list div {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border-color);
    font-size: 16px;
    color: var(--text-main);
}

.issue-list div:last-child {
    border-bottom: 0;
}

/* =========================
   CORPORATE
========================= */

.corporate-section {
    padding-top: 160px;
}

.corporate-box {
    border-top: 2px solid var(--point-color);
    border-bottom: 1px solid var(--border-color);
}

.corporate-item {
    display: flex;
    justify-content: space-between;
    padding: 28px 16px;
    border-bottom: 1px solid var(--border-color);
    transition: 0.2s;
}

.corporate-item:hover {
    background-color: rgba(255,255,255,0.03);
}

.corporate-item:last-child {
    border-bottom: 0;
}

.corporate-item span:first-child {
    font-weight: 800;
    color: var(--text-main);
}

.corporate-item span:last-child {
    color: var(--text-sub);
}

/* =========================
   CONTACT INFO
========================= */

.info-section {
    background: var(--point-color); /* 배경을 포인트 컬러로 */
    color: #fff;
}

.info-inner {
    text-align: center;
}

.info-section h2 {
    font-size: 42px;
    margin: 0 0 16px;
    letter-spacing: -1.5px;
    font-weight: 900;
}

.info-section .info-description {
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 32px;
    font-size: 18px;
}

.contact-phone {
    font-size: 36px;
    font-weight: 900;
    margin: 24px 0;
}

.contact-phone a {
    color: #fff;
}

.contact-address {
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 36px;
    line-height: 1.8;
}

.info-section .btn {
    background: #fff;
    color: var(--point-color);
}
.info-section .btn:hover {
    background: #f0f0f0;
}


/* =========================
   FOOTER
========================= */

footer {
    background: #121212;
    color: var(--text-sub);
    padding: 48px 24px;
    font-size: 14px;
}

.footer-inner {
    max-width: 1100px;
    margin: 0 auto;
}

.footer-title {
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 16px;
}

.footer-line {
    margin-bottom: 6px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .container {
        padding: 0 20px;
    }

    .section {
        padding: 80px 0;
    }

    .header-inner {
        padding: 15px 0;
    }

    .nav {
        display: none; /* 모바일 메뉴 구현 필요시 변경 */
    }

    .logo {
        font-size: 20px;
    }

    .hero {
        padding: 120px 0 100px;
    }

    .hero h1 {
        font-size: 44px;
        letter-spacing: -2.5px;
    }

    .hero-text {
        font-size: 18px;
        margin-bottom: 36px;
    }

    .hero-phone {
        font-size: 18px;
    }

    .section-title {
        margin-bottom: 40px;
    }

    .section-title h2 {
        font-size: 32px;
    }

    .services-grid {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .service-card {
        padding: 30px;
    }

    .inheritance-grid {
        grid-template-columns: 1fr;
        gap: 40px;
    }

    .inheritance h2 {
        font-size: 34px;
    }
    
    .inheritance-inner {
         padding: 90px 24px; /* 모바일에서 inheritance 패딩 복구 */
    }

    .corporate-section {
        padding-top: 80px;
    }

    .corporate-item {
        display: block;
        padding: 20px 5px;
    }

    .corporate-item span:last-child {
        display: block;
        margin-top: 8px;
        font-size: 15px;
    }

    .info-section h2 {
        font-size: 34px;
    }

    .contact-phone {
        font-size: 30px;
    }
}
</style>
</head>
