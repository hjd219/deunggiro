<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI 등기로 플로팅 아이콘 미리보기</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}body{overflow:hidden;background:#fff}.site{position:fixed;inset:0;width:100%;height:100%;border:0}.ai-float{position:fixed;right:18px;bottom:26px;z-index:99998;border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}.ai-orb{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#e9f8fd,#fff);border:1px solid #b9deeb;box-shadow:0 7px 22px rgba(27,116,151,.22);color:#1686ad;font-weight:900;font-size:17px;position:relative}.ai-orb:before{content:'✦';position:absolute;top:8px;right:10px;font-size:13px;color:#50afd0}.ai-float span:last-child{background:rgba(255,255,255,.96);border:1px solid #d5e7ed;border-radius:12px;padding:4px 8px;color:#2b697f;font-size:11px;font-weight:800;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.ai-panel{display:none;position:fixed;inset:0;z-index:99999;background:#f7fbfd}.ai-panel.on{display:block}.top{height:62px;background:#fff;border-bottom:1px solid #d9e8ed;display:flex;align-items:center;padding:0 16px}.close{border:0;background:none;font-size:28px;color:#31464e;padding:5px 14px 5px 0;cursor:pointer}.logo{font-size:18px;font-weight:900;color:#1985ad}.logo b{display:inline-block;margin-right:7px;padding:3px 7px;border-radius:7px;background:#e5f6fb;color:#1686ad;font-size:12px}.body{max-width:560px;margin:auto;padding:32px 18px 105px}.body h1{font-size:25px;line-height:1.4;margin:0 0 9px;color:#17272d}.body>p{margin:0 0 24px;color:#6c8088;font-size:14px;line-height:1.6}.bubble{max-width:88%;padding:13px 15px;border-radius:16px;background:#fff;border:1px solid #d5e6ec;color:#293b42;font-size:14px;line-height:1.65}.note{margin-top:17px;color:#87979d;font-size:11px;line-height:1.55}.compose{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d9e8ed;padding:10px 12px max(10px,env(safe-area-inset-bottom))}.composein{max-width:560px;margin:auto;display:flex;gap:8px}.input{flex:1;height:48px;border:1px solid #cddfe6;border-radius:15px;padding:0 14px;font-size:15px}.send{width:48px;border:0;border-radius:14px;background:#299bc7;color:#fff;font-size:20px;font-weight:900}
@media(max-width:768px){.ai-float{right:15px;bottom:86px}.ai-orb{width:58px;height:58px}.ai-float span:last-child{font-size:10px}}
</style></head><body>
<iframe class="site" src="/" title="등기로 홈페이지"></iframe>
<button class="ai-float" id="openAI" aria-label="AI 등기로 열기"><span class="ai-orb">AI</span><span>AI 등기로</span></button>
<section class="ai-panel" id="aiPanel"><header class="top"><button class="close" id="closeAI">‹</button><div class="logo"><b>AI</b>등기로</div></header><main class="body"><h1>어떤 상황인지<br>편하게 말씀해 주세요.</h1><p>궁금한 내용을 문장으로 입력하면 AI 등기로가 안내합니다.</p><div class="bubble">안녕하세요. 상황을 편하게 입력해 주세요.<br>예) 아버지가 돌아가셨는데 미국에 사는 형제가 있어요.</div><div class="note">주민등록번호·상세주소·계좌번호 등 민감한 개인정보는 입력하지 마세요.</div></main><div class="compose"><div class="composein"><input class="input" placeholder="상황을 입력해 주세요"><button class="send">↑</button></div></div></section>
<script>const p=document.getElementById('aiPanel');document.getElementById('openAI').onclick=()=>p.classList.add('on');document.getElementById('closeAI').onclick=()=>p.classList.remove('on');</script>
</body></html>
