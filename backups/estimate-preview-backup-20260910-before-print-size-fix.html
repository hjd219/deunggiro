<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no,date=no">
<title>등기로 예상 견적서</title>
<style>
:root{--sky:#35a9e1;--sky-deep:#1898d8;--ink:#10263d;--muted:#486176;--line:#90abbb;--bg:#eef4f8;--row-h:42px;--pre-h:52px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:#172840}
a[x-apple-data-detectors],a[href^="tel:"],a[href^="mailto:"]{color:inherit!important;text-decoration:none!important;border:0!important}
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;padding:10px;background:rgba(255,255,255,.96);border-bottom:1px solid #d6e2ea}
.toolbar button{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer}
.back{background:#eaf1f5;color:#263e53}.print{background:var(--sky);color:#fff}
.guide{text-align:center;padding:8px 14px 0;color:#5d7080;font-size:12px}
#stage{width:100%;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.paper{width:min(210mm,calc(100% - 20px));min-height:297mm;margin:12px auto 28px;background:#fff;padding:12mm;box-shadow:0 8px 28px rgba(24,55,77,.12)}
.paper .pdf-download,.paper .consult,.paper .step,.paper .floating-actions,.paper .mobile-nav{display:none!important}
.paper .result{display:block!important;position:static!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;transform:none!important;zoom:1!important;background:#fff!important}
.paper .print-title{display:flex!important;align-items:end!important;justify-content:space-between!important;padding-bottom:12px!important;margin-bottom:14px!important;border-bottom:3px solid var(--sky-deep)!important}
.paper .print-title b{font-size:25px!important;color:var(--sky)!important;font-weight:900!important}
.paper .print-title span{font-size:18px!important;font-weight:900!important;color:#11283f!important}
.paper .print-title small{font-size:9.6px!important;color:#5a7185!important;font-weight:800!important}
.paper .print-columns{display:grid!important;grid-template-columns:1fr 1fr!important;gap:14px!important;align-items:start!important}
.paper .print-col{min-width:0!important;width:100%!important}
.paper .print-col h3,.paper .result h3{font-size:16px!important;line-height:1.25!important;margin:2px 0 8px!important;color:#10263d!important;font-weight:900!important}
.paper .print-col .row{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;gap:10px!important;height:var(--row-h)!important;min-height:var(--row-h)!important;padding:0!important;border-bottom:1.1px solid var(--line)!important}
.paper .print-col .row span{font-size:11.8px!important;line-height:1.25!important;color:#132c44!important;font-weight:800!important;max-width:none!important;text-align:left!important}
.paper .print-col .row b{font-size:11.9px!important;color:#081d31!important;font-weight:900!important;text-align:right!important;white-space:nowrap!important}
.paper .total{min-height:50px!important;padding:11px 13px!important;border:1.2px solid #b7dcec!important;border-radius:9px!important;background:#eaf6fc!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:14px!important;margin-top:10px!important;break-inside:avoid!important}
.paper .total span{font-size:11.8px!important;line-height:1!important;color:#17324a!important;font-weight:900!important;white-space:nowrap!important}
.paper .total strong{font-size:17px!important;line-height:1!important;color:var(--sky-deep)!important;font-weight:900!important;white-space:nowrap!important}
.paper .grand{background:#e7f7fe!important;border-color:#9bd5ef!important}
.paper .documents{display:block!important;margin-top:12px!important;padding:12px 14px!important;border:1.25px solid #88aabd!important;background:#edf8fd!important;border-radius:10px!important}
.paper .documents h3{font-size:12px!important;line-height:1.25!important;margin:0 0 7px!important;color:#10263d!important;font-weight:900!important}
.paper .doc-line,.paper .doc-line b{font-size:11.8px!important;line-height:1.25!important;color:#17324a!important;font-weight:800!important}
.paper .doc-line{margin:4px 0!important}.paper .doc-line b{font-weight:900!important}
.paper .account-box,.paper .bank-account,.paper .account-info,.paper .deposit-account{display:none!important}
.paper .dg-estimate-account{display:block!important;margin-top:12px!important;padding:10px 12px 11px!important;border:1.25px solid #88aabd!important;border-radius:10px!important;background:#f3fbff!important;break-inside:avoid!important}
.paper .dg-estimate-account-title{display:flex!important;align-items:center!important;gap:8px!important;margin-bottom:9px!important}
.paper .dg-estimate-account-title strong{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:24px!important;padding:0 10px!important;border:1px solid #c0e0ee!important;border-radius:8px!important;background:#ecf8fd!important;color:var(--sky-deep)!important;font-size:10.5px!important;font-weight:900!important}
.paper .dg-estimate-account-title span{font-size:10.8px!important;color:#466075!important;font-weight:800!important}
.paper .dg-estimate-account-list{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important}
.paper .dg-estimate-account-row{padding:9px 10px 8px!important;border:1px solid #d0e5ef!important;border-radius:8px!important;background:#fff!important}
.paper .dg-estimate-account-bank{display:block!important;margin-bottom:2px!important;color:var(--sky-deep)!important;font-size:10.5px!important;font-weight:900!important}
.paper .dg-estimate-account-number{display:block!important;color:#0a2035!important;font-size:11.9px!important;font-weight:900!important;text-decoration:none!important}
.paper .dg-estimate-account-holder{display:block!important;margin-top:2px!important;color:#50697e!important;font-size:10.4px!important;font-weight:800!important}
.paper .print-footer{display:block!important}
.paper .office-footer{display:block!important;margin-top:10px!important;padding:10px 12px!important;border:1.25px solid #88aabd!important;border-radius:8px!important;background:#f3fbff!important;color:#17324a!important;font-size:11.4px!important;line-height:1.55!important;font-weight:800!important;text-decoration:none!important}
.paper .office-footer *{text-decoration:none!important}
.paper .office-footer b{display:block!important;margin:0 0 4px!important;color:var(--sky-deep)!important;font-size:11.8px!important;font-weight:900!important}
.paper.acquisition-preview .public-col .result-head{display:block!important;height:84px!important;min-height:84px!important;max-height:84px!important;margin:0!important;overflow:visible!important}
.paper.acquisition-preview .public-col .result-head h3{margin:2px 0 8px!important}
.paper.acquisition-preview .public-col .rate-inline{display:flex!important;align-items:baseline!important;gap:7px!important;flex-wrap:wrap!important;height:52px!important;min-height:52px!important;max-height:52px!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:#163149!important;white-space:normal!important}
.paper.acquisition-preview .public-col .rate-inline span{display:inline!important;font-size:12px!important;font-weight:900!important;color:#163149!important}
.paper.acquisition-preview .public-col .rate-inline strong{font-size:13px!important;font-weight:900!important;color:#0f2338!important}
.paper.acquisition-preview .public-col .rate-inline small{font-size:10px!important;font-weight:800!important;color:#486176!important}
.paper.acquisition-preview .legal-col .section{display:block!important;height:84px!important;min-height:84px!important;max-height:84px!important;margin:0!important;padding:0!important;border:0!important;overflow:hidden!important}
.paper.acquisition-preview .legal-col .section h3{margin:2px 0 8px!important}
.paper.acquisition-preview .legal-col>.total:not(.grand){margin-top:10px!important}
.paper .dg-summary-sync{display:grid!important;grid-template-columns:1fr 1fr!important;gap:14px!important;align-items:stretch!important;margin-top:10px!important}
.paper .dg-summary-sync .total{height:50px!important;margin-top:0!important}
@media(max-width:700px){.toolbar{padding:8px}.toolbar button{flex:1;max-width:180px}.guide{font-size:12px}.paper{flex:0 0 794px!important;width:794px!important;min-height:1123px!important;margin:8px 0 20px!important;padding:45px!important;transform-origin:top center!important}}
@media print{
 @page{size:A4;margin:8mm}
 html,body{background:#fff!important}
 .toolbar,.guide{display:none!important}
 #stage{display:block!important;width:194mm!important;height:auto!important;overflow:visible!important}
 .paper{width:210mm!important;min-height:297mm!important;margin:0!important;padding:12mm!important;box-shadow:none!important;transform:none!important;transform-origin:top left!important;flex:none!important;zoom:.9238!important}
 .paper .office-footer,.paper .office-footer *,.paper .office-footer a,.paper a[x-apple-data-detectors]{text-decoration:none!important;border-bottom:0!important}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>
</head>
<body>
<div class="toolbar"><button class="back" type="button" onclick="history.back()">계산기로 돌아가기</button><button class="print" type="button" onclick="window.print()">PDF 저장 / 인쇄</button></div>
<div class="guide">견적서 화면입니다. 인쇄창이 열리지 않는 앱에서는 브라우저 메뉴의 공유·인쇄 기능을 이용할 수 있습니다.</div>
<div id="stage"><main class="paper" id="paper"></main></div>
<script>
(function(){
 const raw=sessionStorage.getItem('deunggiroEstimatePreview');
 if(!raw){document.getElementById('paper').innerHTML='<p style="text-align:center;padding:60px 0">견적 정보가 없습니다.<br><button onclick="history.back()">돌아가기</button></p>';return}
 try{
  const data=JSON.parse(raw),paper=document.getElementById('paper'),stage=document.getElementById('stage');
  document.title=data.title||'등기로 예상 견적서';
  paper.innerHTML=data.html||'';
  const result=paper.querySelector('.result')||paper;
  result.querySelectorAll('.account-box,.bank-account,.account-info,.deposit-account,.dg-estimate-account').forEach(e=>e.remove());
  const nums=['110-482-692656','3333-07-6560416'];
  [...result.children].forEach(el=>{if(el.classList.contains('office-footer')||el.classList.contains('documents'))return;const t=(el.textContent||'').replace(/\s/g,'');if(nums.some(n=>t.includes(n)))el.remove()});
  const titleText=(result.querySelector('.print-title span')?.textContent||'').trim();
  if(titleText.includes('부동산등기')){
   paper.classList.add('acquisition-preview');
   const columns=result.querySelector('.print-columns');
   const publicTotal=result.querySelector('.public-col > .total');
   const grand=result.querySelector('.legal-col > .grand');
   if(columns&&publicTotal&&grand){
    const summary=document.createElement('div');
    summary.className='dg-summary-sync';
    const grandLabel=grand.querySelector('span');
    if(grandLabel)grandLabel.textContent='예상 합계 금액';
    summary.appendChild(publicTotal);
    summary.appendChild(grand);
    columns.insertAdjacentElement('afterend',summary);
   }
  }
  const account=document.createElement('section');
  account.className='dg-estimate-account';
  account.innerHTML='<div class="dg-estimate-account-title"><strong>입금계좌</strong><span>현재두 법무사 사무소</span></div><div class="dg-estimate-account-list"><div class="dg-estimate-account-row"><span class="dg-estimate-account-bank">신한은행</span><span class="dg-estimate-account-number">110-482-\u2060692656</span><span class="dg-estimate-account-holder">현재두법무사사무소</span></div><div class="dg-estimate-account-row"><span class="dg-estimate-account-bank">카카오뱅크</span><span class="dg-estimate-account-number">3333-07-\u20606560416</span><span class="dg-estimate-account-holder">현재두법무사사무소</span></div></div>';
  const docs=result.querySelector('.documents');
  if(docs)docs.insertAdjacentElement('afterend',account);else result.appendChild(account);
  const footer=result.querySelector('.office-footer');
  if(footer){
   footer.innerHTML=footer.innerHTML
    .replace(/032-425-1500/g,'032-425-\u20601500')
    .replace(/hjd21@naver\.com/g,'hjd21\u2060@naver.com')
    .replace(/www\.deunggiro\.kr/g,'www.\u2060deunggiro.kr');
  }
  function fit(){if(innerWidth>700){paper.style.transform='';stage.style.height='';return}const s=Math.min(1,Math.max(280,innerWidth-12)/794);paper.style.transform='scale('+s+')';stage.style.height=(paper.scrollHeight*s+16)+'px'}
  requestAnimationFrame(()=>requestAnimationFrame(fit));
  addEventListener('resize',fit);
  addEventListener('afterprint',fit);
 }catch(e){document.getElementById('paper').textContent='견적서를 표시하지 못했습니다.'}
})();
</script>
</body>
</html>
