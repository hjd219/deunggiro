.post-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.search-wrap{display:flex;gap:8px;flex:1;min-width:260px}.search-wrap input{flex:1}.category-tabs{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #d6dbe3;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.footer{background:#171717;color:#999;padding:38px 0;font-size:13px}.footer strong{color:#fff}

.notice{background:#fff9e9;border:1px solid #f0dfaa;border-radius:8px;padding:14px;color:#6e5b20;font-size:13px}

 .nav{display:none}.mobile-only{display:inline-flex}.hero{padding:70px 0 66px}.hero h1{letter-spacing:-2.5px}
 .quick-grid,.cards,.post-grid,.form-grid,.admin-grid{grid-template-columns:1fr}.quick-item{border-right:0;border-bottom:1px solid #eee}.quick-item:last-child{border-bottom:0}
 .section{padding:58px 0}.title{font-size:30px}.article{border-left:0;border-right:0;border-radius:0}.container{padding:0 16px}
 .post-card{grid-template-columns:105px minmax(0,1fr);gap:12px;padding:12px}.post-thumb{width:105px;height:105px}.post-card h3{font-size:16px;margin:5px 0}.post-card p{font-size:12px}.post-meta{font-size:11px}.post-card.no-thumb{padding:20px}

<section class="section"><div class="container"><div class="label">LEGAL INFORMATION</div><h1 class="title">법률정보</h1><p class="desc">상속·법인·부동산등기 관련 실무 정보를 정리합니다.</p>
<div class="post-toolbar"><div class="search-wrap"><input id="q" placeholder="제목·내용 검색"><button class="btn btn-primary" onclick="render()">검색</button></div><div id="cats" class="category-tabs"></div></div>
<div id="posts" class="post-grid"><div class="empty">게시글을 불러오는 중입니다.</div></div>
</div></section>
<section class="cta"><div class="container"><h2>상담문의</h2><div class="phone">032-425-1500</div></div></section>
<footer class="footer">
  <div class="container">
    <strong>현재두 법무사 사무소</strong><br>
    인천 · 상속등기 · 상속포기 · 한정승인 · 법인등기 · 부동산등기<br>
    상담전화 032-425-1500
  </div>
</footer>

<script>
let all=[], active='전체';
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function init(){try{const r=await fetch('/data/posts.json?'+Date.now());all=await r.json();const cs=['전체',...new Set(all.map(x=>x.category))];document.getElementById('cats').innerHTML=cs.map(c=>`<button class="chip ${c==='전체'?'active':''}" onclick="setCat('${esc(c)}',this)">${esc(c)}</button>`).join('');render()}catch(e){document.getElementById('posts').innerHTML='<div class="empty">게시글을 불러오지 못했습니다.</div>'}}
function setCat(c,btn){active=c;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}
function render(){const q=document.getElementById('q').value.trim().toLowerCase();const list=all.filter(p=>(active==='전체'||p.category===active)&&(!q||(p.title+' '+(p.summary||'')+' '+(p.keywords||'')).toLowerCase().includes(q)));document.getElementById('posts').innerHTML=list.length?list.map(p=>`<a class="post-card ${p.thumbnail?'':'no-thumb'}" href="/posts/${p.slug}.html">${p.thumbnail?`<img class="post-thumb" src="${esc(p.thumbnail)}" alt="${esc(p.title)}" loading="lazy">`:''}<div class="post-content"><div class="post-meta"><span class="badge">${esc(p.category)}</span>${esc(p.date)}</div><h3>${esc(p.title)}</h3><p>${esc(p.summary||'')}</p></div></a>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});init()
</script></body></html>
