<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI 등기로 전송버튼 스타일 8종</title><style>*{box-sizing:border-box}body{margin:0;background:#f6fafc;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#263b43}.wrap{max-width:680px;margin:auto;padding:30px 16px 45px}.head{text-align:center;margin-bottom:24px}.head h1{font-size:21px;color:#299bc7;margin:0}.head p{font-size:12px;color:#71858c;margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:#fff;border:1px solid #d7e8ee;border-radius:18px;padding:20px 10px 16px;text-align:center}.card h3{font-size:13px;margin:12px 0 2px}.card p{font-size:10px;color:#7a8c92;margin:0}.b{height:48px;border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.b svg{width:23px;height:23px}.line{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.sq{width:48px;border-radius:14px;background:#299bc7;color:#fff}.circle{width:48px;border-radius:50%;background:#299bc7;color:#fff}.soft{width:48px;border-radius:14px;background:#e4f5fa;color:#299bc7;border:1px solid #a9d8e7}.outline{width:48px;border-radius:14px;background:#fff;color:#299bc7;border:2px solid #299bc7}.dark{width:48px;border-radius:14px;background:#237fa3;color:#fff;box-shadow:0 5px 13px rgba(35,127,163,.22)}.pill{width:76px;border-radius:24px;background:#299bc7;color:#fff;gap:5px;font-size:12px;font-weight:800}.pill svg{width:19px;height:19px}.glass{width:48px;border-radius:16px;background:linear-gradient(145deg,#42afd4,#2497c2);color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.35),0 5px 15px rgba(41,155,199,.25)}.minimal{width:48px;border-radius:13px;background:transparent;color:#299bc7;border:0}.recommended{border:2px solid #299bc7;position:relative}.recommended:after{content:'추천';position:absolute;top:8px;right:9px;background:
