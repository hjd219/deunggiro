name: Extract inheritance core CSS once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-inheritance-core-css-once.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract inheritance core CSS without visual changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('inheritance.html')
          s = p.read_text(encoding='utf-8')
          title = '<title>상속등기는 등기로 | 인천 단독상속·공동상속·유증</title>'
          if title not in s:
              raise SystemExit('SEO title guard failed')

          markers = [
              'INHERITANCE_INFOGRAPHIC_V1',
              'INHERITANCE_ICON_BOX_V6',
              'INHERITANCE_PC_LAYOUT_V10',
              'INHERITANCE_SEAMLESS_BG_V2',
          ]
          blocks = []
          starts = []
          ends = []
          for marker in markers:
              pat = re.compile(r'<style>\s*/\* '+re.escape(marker)+r' \*/.*?</style>\s*', re.S)
              m = pat.search(s)
              if not m:
                  raise SystemExit(f'{marker} block not found')
              blocks.append(re.sub(r'^<style>\s*|\s*</style>\s*$', '', m.group(0), flags=re.S).strip())
              starts.append(m.start())
              ends.append(m.end())

          # The four target blocks are sequential in source; replace exact span with one stylesheet link.
          if not (starts == sorted(starts)):
              raise SystemExit('unexpected block order')
          between = s[starts[0]:ends[-1]]
          for marker in markers:
              if between.count(marker) != 1:
                  raise SystemExit('target span integrity failed')

          asset = Path('assets/inheritance-core.css')
          if asset.exists():
              raise SystemExit('assets/inheritance-core.css already exists')
          asset.write_text('\n\n'.join(blocks) + '\n', encoding='utf-8')

          link = '<link rel="stylesheet" href="/assets/inheritance-core.css?v=20260913">\n\n'
          s2 = s[:starts[0]] + link + s[ends[-1]:]

          guards = [
              title,
              '<link rel="stylesheet" href="/assets/detail-pages.css?v=20260913">',
              'INHERITANCE_PROCESS_TOP_GAP_V2',
              'INHERITANCE_FINDER_INLINE_STATIC_V1',
              '<link rel="stylesheet" href="/assets/inheritance-page.css?v=20260913">',
              '<script src="/assets/inheritance-search.js?v=20260913" defer></script>',
              '<script src="/assets/inheritance-pc-layout.js?v=20260913" defer></script>',
          ]
          for g in guards:
              if g not in s2:
                  raise SystemExit('guard missing: '+g)
          for marker in markers:
              if marker in s2:
                  raise SystemExit('inline marker residue: '+marker)
              if marker not in asset.read_text(encoding='utf-8'):
                  raise SystemExit('asset marker missing: '+marker)

          p.write_text(s2, encoding='utf-8')
          PY
          git diff --check
          git diff -- inheritance.html assets/inheritance-core.css
          rm .github/workflows/extract-inheritance-core-css-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html assets/inheritance-core.css .github/workflows/extract-inheritance-core-css-once.yml
          git commit -m '구조정리: 상속등기 핵심 CSS 외부화'
          git push origin main