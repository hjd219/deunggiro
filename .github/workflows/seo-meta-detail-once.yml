name: SEO detail meta once

on:
  push:
    paths:
      - '.github/workflows/seo-meta-detail-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update meta descriptions
        shell: python
        run: |
          from pathlib import Path
          replacements = {
            'inheritance.html': (
              '인천 상속등기·상속재산분할의 절차·비용·필요서류를 확인하세요. 협의분할, 상속취득세와 실제 처리사례도 안내합니다.',
              '인천 상속등기의 절차·비용·필요서류를 확인하세요. 협의분할, 상속취득세와 실제 처리사례도 안내합니다.'
            ),
            'renunciation.html': (
              '인천 상속포기·한정승인·특별한정승인의 절차·비용·필요서류를 확인하세요. 신청기한과 실제 처리사례도 안내합니다.',
              '인천 상속포기·한정승인의 절차·비용·필요서류를 확인하세요. 신청기한과 실제 처리사례도 안내합니다.'
            ),
            'family.html': (
              '인천 협의이혼, 재산분할, 개명, 성년후견·한정후견 등 주요 가사절차와 필요서류를 안내합니다.',
              '인천 가사업무의 절차·비용·필요서류를 확인하세요. 협의이혼, 개명, 성년후견·미성년후견 등 주요 가사절차를 안내합니다.'
            ),
          }
          for file, (old, new) in replacements.items():
            p = Path(file)
            s = p.read_text(encoding='utf-8')
            if old not in s:
              raise SystemExit(f'Expected text not found in {file}')
            p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html renunciation.html family.html
          git diff --cached --check
          git commit -m "Refine inheritance and family SEO descriptions"
          git push origin main
