# Repository-wide validation for the current published site
name: Full repository audit

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**/*.js'
      - 'assets/**/*.css'
      - 'scripts/**'
      - 'tools/**'
      - 'data/**'
      - 'sitemap.xml'
      - 'rss.xml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON XML Python JavaScript YAML and site references
        shell: bash
        run: |
          set -uo pipefail
          ERR=0

          echo '=== JSON ==='
          while IFS= read -r -d '' f; do
            python -m json.tool "$f" >/dev/null || ERR=1
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

          echo '=== XML ==='
          python - <<'PY' || ERR=1
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').rglob('*.xml'):
              if '.git' in p.parts: continue
              try:
                  ET.parse(p)
                  print('OK', p)
              except Exception as e:
                  print('ERROR', p, e)
                  raise
          PY

          echo '=== Python syntax ==='
          python - <<'PY' || ERR=1
          from pathlib import Path
          import py_compile
          bad=[]
          for p in Path('.').rglob('*.py'):
              if '.git' in p.parts: continue
              try:
                  py_compile.compile(str(p), doraise=True)
                  print('OK', p)
              except Exception as e:
                  bad.append((p,e)); print('ERROR', p, e)
          if bad: raise SystemExit(1)
          PY

          echo '=== JavaScript syntax ==='
          while IFS= read -r -d '' f; do
            node --check "$f" >/dev/null || ERR=1
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path './.git/*' -print0)

          echo '=== YAML syntax ==='
          ruby -e 'require "yaml"; Dir.glob("**/*.{yml,yaml}").each{|f| begin; YAML.load_file(f); puts "OK #{f}"; rescue => e; warn "ERROR #{f}: #{e}"; exit 1; end }' || ERR=1

          echo '=== HTML IDs, local links, posts and thumbnails ==='
          python - <<'PY' || ERR=1
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import json, re

          errors=[]
          skip_prefixes=('mailto:','tel:','javascript:','data:','#')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  for key in ('href','src'):
                      v=a.get(key)
                      if v: self.refs.append((tag,key,v))

          htmls=list(Path('.').rglob('*.html'))
          for p in htmls:
              if '.git' in p.parts: continue
              text=p.read_text(encoding='utf-8',errors='replace')
              parser=P()
              try: parser.feed(text)
              except Exception as e: errors.append(f'HTML parse {p}: {e}'); continue
              dup=sorted({x for x in parser.ids if parser.ids.count(x)>1})
              if dup: errors.append(f'Duplicate id {p}: {dup[:10]}')
              for tag,key,ref in parser.refs:
                  ref=ref.strip()
                  if not ref or ref.startswith(skip_prefixes) or ref.startswith('//') or re.match(r'^https?://',ref,re.I): continue
                  url_path=urlsplit(ref).path
                  if not url_path: continue
                  if url_path.startswith('/'):
                      target=Path('.') / unquote(url_path.lstrip('/'))
                  else:
                      target=p.parent / unquote(url_path)
                  if url_path.endswith('/'):
                      target=target/'index.html'
                  if not target.exists():
                      errors.append(f'Missing local ref {p}: {ref} -> {target}')

          pj=Path('data/posts.json')
          if pj.exists():
              posts=json.loads(pj.read_text(encoding='utf-8'))
              slugs=[]
              for i,post in enumerate(posts):
                  slug=str(post.get('slug','')).strip().replace('.html','')
                  if not slug:
                      errors.append(f'posts.json item {i}: empty slug'); continue
                  slugs.append(slug)
                  hp=Path('posts')/f'{slug}.html'
                  if not hp.exists(): errors.append(f'posts.json missing html: {hp}')
                  thumb=str(post.get('thumbnail','')).strip()
                  if not thumb:
                      errors.append(f'posts.json empty thumbnail: {slug}')
                  else:
                      tp=Path(thumb.lstrip('/'))
                      if not tp.exists(): errors.append(f'posts.json missing thumbnail: {slug} -> {tp}')
              dups=sorted({s for s in slugs if slugs.count(s)>1})
              if dups: errors.append(f'Duplicate slugs: {dups}')

          print('HTML files:',len(htmls))
          print('ERRORS:',len(errors))
          for x in errors: print('ERROR:',x)
          if errors: raise SystemExit(1)
          PY

          echo '=== Git diff whitespace check ==='
          git diff --check || ERR=1

          if [ "$ERR" -ne 0 ]; then
            echo 'AUDIT_RESULT=FAIL'
            exit 1
          fi
          echo 'AUDIT_RESULT=PASS'
