name: Full repository audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repo-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, sys, subprocess, tempfile
          import xml.etree.ElementTree as ET
          from urllib.parse import urlsplit, unquote
          from html.parser import HTMLParser

          root=Path('.')
          errors=[]; warnings=[]; info=[]
          def err(x): errors.append(x)
          def warn(x): warnings.append(x)
          def inf(x): info.append(x)

          # Core data parsing
          try:
              posts=json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
              if not isinstance(posts,list): raise ValueError('root is not array')
          except Exception as e:
              err(f'data/posts.json invalid: {e}'); posts=[]
          try:
              tree=ET.parse('sitemap.xml'); smroot=tree.getroot()
              ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
              sitemap_locs=[(x.find('s:loc',ns).text or '').strip() for x in smroot.findall('s:url',ns)]
          except Exception as e:
              err(f'sitemap.xml invalid: {e}'); sitemap_locs=[]

          post_files=sorted(Path('posts').glob('*.html'))
          post_slugs=[p.stem for p in post_files]
          data_slugs=[str(p.get('slug','')).removesuffix('.html').strip() for p in posts]
          if len(data_slugs)!=len(set(data_slugs)): err('duplicate slug in data/posts.json')
          if len(post_slugs)!=len(set(post_slugs)): err('duplicate post filename')
          missing_files=sorted(set(data_slugs)-set(post_slugs))
          orphan_files=sorted(set(post_slugs)-set(data_slugs))
          if missing_files: err('posts.json entries missing HTML: '+', '.join(missing_files))
          if orphan_files: warn('post HTML not present in posts.json: '+', '.join(orphan_files))

          # Sitemap consistency
          sitemap_post_slugs=[]
          for u in sitemap_locs:
              m=re.search(r'/posts/([^/?#]+)\.html$',u)
              if m: sitemap_post_slugs.append(unquote(m.group(1)))
          missing_sitemap=sorted(set(data_slugs)-set(sitemap_post_slugs))
          extra_sitemap=sorted(set(sitemap_post_slugs)-set(data_slugs))
          if missing_sitemap: err('posts.json entries missing sitemap URL: '+', '.join(missing_sitemap))
          if extra_sitemap: warn('sitemap post URLs absent from posts.json: '+', '.join(extra_sitemap))
          if len(sitemap_locs)!=len(set(sitemap_locs)): err('duplicate URLs in sitemap.xml')

          # thumbnails
          for p in posts:
              thumb=str(p.get('thumbnail','')).strip()
              if thumb and thumb.startswith('/'):
                  fp=Path(thumb.lstrip('/').split('?',1)[0])
                  if not fp.exists(): err(f"missing thumbnail for {p.get('slug')}: {thumb}")

          # robots/CNAME
          if Path('robots.txt').exists():
              rt=Path('robots.txt').read_text(encoding='utf-8',errors='replace')
              if 'Sitemap:' not in rt: warn('robots.txt has no Sitemap directive')
          else: err('robots.txt missing')
          if not Path('CNAME').exists(): err('CNAME missing')
          elif Path('CNAME').read_text().strip()!='www.deunggiro.kr': warn('CNAME is not www.deunggiro.kr')

          # HTML parser + local link existence
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.refs=[]; self.ids=[]; self.canonical=[]; self.meta={}; self.scripts=[]; self._in_script=False; self._script=''
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.append(d['id'])
                  if tag in ('a','link') and d.get('href'): self.refs.append(('href',d['href']))
                  if tag in ('img','script','iframe','source','video') and d.get('src'): self.refs.append(('src',d['src']))
                  if tag=='link' and d.get('rel')=='canonical' and d.get('href'): self.canonical.append(d['href'])
                  if tag=='meta' and d.get('name'): self.meta[d['name']]=d.get('content','')
                  if tag=='script' and not d.get('src'): self._in_script=True; self._script=''
              def handle_endtag(self,tag):
                  if tag=='script' and self._in_script: self.scripts.append(self._script); self._in_script=False
              def handle_data(self,data):
                  if self._in_script: self._script += data

          html_files=sorted(root.rglob('*.html'))
          public_root={'index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html','posts.html','acquisition-calculator.html','corporate-calculator.html','divorce-calculator.html'}
          for f in html_files:
              text=f.read_text(encoding='utf-8',errors='replace')
              parser=P()
              try: parser.feed(text); parser.close()
              except Exception as e: err(f'{f}: HTML parser exception: {e}')
              dup_ids=sorted({x for x in parser.ids if parser.ids.count(x)>1})
              if dup_ids: warn(f'{f}: duplicate ids: '+', '.join(dup_ids[:8]))
              # local refs
              for kind,ref in parser.refs:
                  if not ref or ref.startswith(('#','tel:','mailto:','javascript:','data:','blob:','http://','https://','//')): continue
                  clean=urlsplit(ref).path
                  if not clean: continue
                  target=(root / clean.lstrip('/')) if clean.startswith('/') else (f.parent / clean)
                  try: target=target.resolve()
                  except Exception: continue
                  if not target.exists(): warn(f'{f}: broken local {kind} -> {ref}')
              # public root shell includes
              if f.parent==root and f.name in public_root:
                  if '/assets/site-shell.css' not in text: err(f'{f}: missing site-shell.css')
                  if '/assets/site-shell.js' not in text: err(f'{f}: missing site-shell.js')
              # post invariants
              if f.parent.name=='posts':
                  slug=f.stem
                  expected=f'https://www.deunggiro.kr/posts/{slug}.html'
                  if not parser.canonical: err(f'{f}: missing canonical')
                  elif expected not in parser.canonical: err(f'{f}: canonical mismatch {parser.canonical}')
                  for key in ('dg-title','dg-category','dg-date'):
                      if not parser.meta.get(key): err(f'{f}: missing meta {key}')
                  for needed in ('/assets/article-v2.css','/assets/article-v2.js','/assets/site-shell.css','/assets/site-shell.js'):
                      if needed not in text: err(f'{f}: missing {needed}')
                  # old pasted layout residues likely to break rendering
                  bodypos=text.find('class="article-body"')
                  bodytxt=text[bodypos:] if bodypos>=0 else text
                  if re.search(r'width\s*:\s*(?:9\d\d|[1-9]\d{3,})px',bodytxt,re.I): warn(f'{f}: large fixed width remains inside article body')
                  if re.search(r'<img[^>]+margin\s*:\s*[^;\"]*auto',bodytxt,re.I): warn(f'{f}: inline auto-margin image remains in article body')
                  if len(text)>500_000: warn(f'{f}: HTML size {len(text)//1024} KB (very large)')
              # inline JS syntax
              for i,js in enumerate(parser.scripts,1):
                  if not js.strip(): continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as tf:
                      tf.write(js); temp=tf.name
                  cp=subprocess.run(['node','--check',temp],capture_output=True,text=True)
                  Path(temp).unlink(missing_ok=True)
                  if cp.returncode!=0: err(f'{f}: inline script #{i} syntax error: '+cp.stderr.strip().splitlines()[-1])

          # standalone JS syntax
          for jsf in sorted(root.rglob('*.js')):
              cp=subprocess.run(['node','--check',str(jsf)],capture_output=True,text=True)
              if cp.returncode!=0: err(f'{jsf}: JS syntax error: '+cp.stderr.strip().splitlines()[-1])

          # posts.html static SEO list should cover all posts
          ph=Path('posts.html').read_text(encoding='utf-8',errors='replace') if Path('posts.html').exists() else ''
          static=set(re.findall(r'href="/posts/([^"/?#]+)\.html"',ph))
          missing_static=sorted(set(data_slugs)-static)
          extra_static=sorted(static-set(data_slugs))
          if missing_static: warn('posts.html static SEO list missing: '+', '.join(missing_static))
          if extra_static: warn('posts.html static SEO list has stale entries: '+', '.join(extra_static))

          # admin expected publishing hooks
          if Path('admin.html').exists():
              ad=Path('admin.html').read_text(encoding='utf-8',errors='replace')
              for needle,label in [('data/posts.json','posts.json update'),('sitemap.xml','sitemap update'),('/posts/','individual post path'),('<\\/script>','escaped closing script in template')]:
                  if needle not in ad: err(f'admin.html missing publishing hook: {label}')

          print('=== FULL REPOSITORY AUDIT ===')
          print(f'HTML files: {len(html_files)} | post HTML: {len(post_files)} | posts.json: {len(posts)} | sitemap URLs: {len(sitemap_locs)}')
          print(f'ERRORS: {len(errors)}')
          for x in errors: print('ERROR | '+x)
          print(f'WARNINGS: {len(warnings)}')
          for x in warnings: print('WARN | '+x)
          print(f'INFO: {len(info)}')
          for x in info: print('INFO | '+x)
          if errors: sys.exit(1)
          PY
