name: Strengthen inheritance internal links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'STRENGTHEN_INHERITANCE_INTERNAL_LINKS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Add compact inheritance hub links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('inheritance.html')
          s=p.read_text(encoding='utf-8')
          marker='INHERITANCE_INTERNAL_LINK_HUB_V1'
          if marker in s:
              print('internal link hub already present')
          else:
              block='''\n<!-- INHERITANCE_INTERNAL_LINK_HUB_V1 -->\n<section class="section white dg-inheritance-linkhub" aria-labelledby="inheritance-linkhub-title">\n  <div class="container">\n    <div class="label">상속등기 세부안내</div>\n    <h2 class="title" id="inheritance-linkhub-title">특수한 상속 상황도 확인하세요</h2>\n    <p class="desc">상속인 상황에 맞는 세부 안내를 바로 확인할 수 있습니다.</p>\n    <nav class="dg-inheritance-linkhub-grid" aria-label="상속등기 세부안내 바로가기">\n      <a href="/inheritance-missing-heir.html"><strong>연락두절·행방불명 상속인</strong><span>연락이 되지 않는 상속인이 있는 경우</span></a>\n      <a href="/inheritance-minor-heir.html"><strong>미성년자 상속인</strong><span>특별대리인 선임이 필요한 경우</span></a>\n      <a href="/inheritance-overseas-heir.html"><strong>해외거주·외국국적 상속인</strong><span>미국 등 해외 상속인의 서류 준비</span></a>\n      <a href="/inheritance-substitute-succession.html"><strong>대습상속</strong><span>상속인이 먼저 사망한 경우</span></a>\n      <a href="/inheritance-division.html"><strong>상속재산분할</strong><span>협의가 되지 않거나 분할이 필요한 경우</span></a>\n    </nav>\n  </div>\n</section>\n<style>\n.dg-inheritance-linkhub{padding-top:48px!important;padding-bottom:48px!important}\n.dg-inheritance-linkhub .desc{margin-bottom:18px!important}\n.dg-inheritance-linkhub-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}\n.dg-inheritance-linkhub-grid a{display:flex;min-height:92px;flex-direction:column;justify-content:center;padding:15px 14px;border:1px solid #dbe5ef;border-radius:10px;background:#fff;transition:.18s}\n.dg-inheritance-linkhub-grid a:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 22px rgba(25,41,68,.06)}\n.dg-inheritance-linkhub-grid strong{display:block;color:#24384f;font-size:14px;line-height:1.4;letter-spacing:-.3px}\n.dg-inheritance-linkhub-grid span{display:block;margin-top:5px;color:#7a8491;font-size:11px;line-height:1.45}\n@media(max-width:1000px){.dg-inheritance-linkhub-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}\n@media(max-width:700px){.dg-inheritance-linkhub{padding-top:36px!important;padding-bottom:36px!important}.dg-inheritance-linkhub-grid{grid-template-columns:1fr 1fr;gap:8px}.dg-inheritance-linkhub-grid a{min-height:82px;padding:12px}.dg-inheritance-linkhub-grid strong{font-size:13px}.dg-inheritance-linkhub-grid span{font-size:10.5px}}\n</style>\n'''
              anchors=[
                  '<section class="contact"',
                  '<footer',
                  '</body>'
              ]
              pos=None
              for a in anchors:
                  i=s.find(a)
                  if i!=-1:
                      pos=i
                      break
              if pos is None:
                  raise SystemExit('safe insertion anchor not found')
              s=s[:pos]+block+s[pos:]
              p.write_text(s,encoding='utf-8')

          # Give the five detail pages a clear contextual path back to the hub if one is not already present.
          detail_pages=[
              'inheritance-missing-heir.html',
              'inheritance-minor-heir.html',
              'inheritance-overseas-heir.html',
              'inheritance-substitute-succession.html',
              'inheritance-division.html'
          ]
          for name in detail_pages:
              q=Path(name)
              if not q.exists():
                  print('missing detail page:',name)
                  continue
              t=q.read_text(encoding='utf-8')
              back_marker='INHERITANCE_HUB_BACKLINK_V1'
              if back_marker in t:
                  continue
              back='''\n<!-- INHERITANCE_HUB_BACKLINK_V1 -->\n<p class="dg-inheritance-hub-backlink"><a href="/inheritance.html">← 상속등기 전체 안내로 돌아가기</a></p>\n<style>.dg-inheritance-hub-backlink{max-width:1180px;margin:18px auto 8px;padding:0 22px}.dg-inheritance-hub-backlink a{color:#247ea9;font-size:13px;font-weight:800;text-decoration:none}@media(max-width:800px){.dg-inheritance-hub-backlink{padding:0 16px}}</style>\n'''
              anchor='</body>'
              i=t.rfind(anchor)
              if i==-1:
                  raise SystemExit(f'body end not found: {name}')
              t=t[:i]+back+t[i:]
              q.write_text(t,encoding='utf-8')
          PY
          rm .github/workflows/strengthen-inheritance-internal-links.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html inheritance-missing-heir.html inheritance-minor-heir.html inheritance-overseas-heir.html inheritance-substitute-succession.html inheritance-division.html .github/workflows/strengthen-inheritance-internal-links.yml
          git commit -m "상속등기 허브와 세부페이지 내부링크 보강 [skip ci]"
          git push origin HEAD:main
