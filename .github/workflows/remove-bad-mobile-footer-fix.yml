name: Remove bad mobile footer fix
on:
  push:
    paths:
      - '.github/workflows/remove-bad-mobile-footer-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove bad footer override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','posts.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          pattern=re.compile(r'\s*<style>\s*/\* MOBILE_FOOTER_END_V1 \*/.*?</style>\s*', re.S)
          for f in pages:
              p=Path(f)
              t=p.read_text(encoding='utf-8')
              t2=pattern.sub('\n',t)
              if t2!=t:
                  p.write_text(t2,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.html inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff --cached --quiet || git commit -m "Remove bad mobile footer override"
          git push
