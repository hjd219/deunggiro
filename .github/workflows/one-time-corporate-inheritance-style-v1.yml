name: One-time corporate inheritance style v1
on:
  push:
    paths:
      - '.github/workflows/one-time-corporate-inheritance-style-v1.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch corporate detail page
        run: python .github/scripts/patch_corporate_inheritance_style.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corporate.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Redesign corporate detail page in inheritance style'
          git push
