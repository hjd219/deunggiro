name: Cleanup inheritance legacy CSS once
on:
  push:
    paths:
      - '.github/workflows/cleanup-inheritance-legacy-css-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove superseded inheritance CSS blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('inheritance.html')
          s=p.read_text()
          original=s
          # These mobile flow revisions are fully superseded by the later V11 block.
          for marker in ['INHERITANCE_MOBILE_FLOW_FIX_V2','INHERITANCE_MOBILE_FLOW_FIX_V3','INHERITANCE_MOBILE_FLOW_FIX_V4']:
              pat=rf'<style>\s*/\* {marker} \*/.*?</style>\s*'
              s,n=re.subn(pat,'',s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'Expected exactly one {marker}, found {n}')
          # The old generic sky-background block is superseded by the inheritance-specific seamless background + shared detail-pages CSS.
          pat=r'<style>\s*/\* DETAIL_HOME_SKY_BG_V1 \*/.*?</style>\s*'
          s,n=re.subn(pat,'',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected exactly one DETAIL_HOME_SKY_BG_V1, found {n}')
          required=['INHERITANCE_MOBILE_REFERENCE_V11','INHERITANCE_PC_LAYOUT_V10','INHERITANCE_SEAMLESS_BG_V2','INHERITANCE_ICON_BOX_V6','INHERITANCE_INFOGRAPHIC_V1','/assets/detail-pages.css','상속등기는 등기로 | 인천 단독상속·공동상속·유증']
          for x in required:
              if x not in s:
                  raise SystemExit(f'Required content missing: {x}')
          if s==original:
              raise SystemExit('No change')
          p.write_text(s)
          PY
          git diff --check
          git diff -- inheritance.html
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/cleanup-inheritance-legacy-css-once.yml
          git add inheritance.html
          git commit -m '구조정리: 상속등기 구버전 CSS 제거'
          git push origin main