name: Restore inheritance case cards only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-inheritance-case-cards.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore only case cards and remove duplicate guide
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('inheritance.html')
          s=p.read_text(encoding='utf-8')
          # 구 하단 중복 세부안내가 남아 있으면 제거
          s=re.sub(r'\s*<!-- INHERITANCE_INTERNAL_LINK_HUB_V1 -->\s*<section class="section white dg-inheritance-linkhub"[\s\S]*?</section>\s*<style>[\s\S]*?\.dg-inheritance-linkhub[\s\S]*?</style>\s*','\n',s,count=1)
          # 이번 복구 블록이 이미 있으면 중복 생성 금지
          if 'INHERITANCE_CASE_CARDS_RESTORED_V1' not in s:
            block='''\n<!-- INHERITANCE_CASE_CARDS_RESTORED_V1 -->
<section class="section white dg-inheritance-casecards" aria-labelledby="inheritance-casecards-title">
  <div class="container">
    <div class="label">실제 처리사례</div>
    <h2 class="title" id="inheritance-casecards-title">상속등기 이런 경우도 처리합니다</h2>
    <p class="desc">상속인 상황에 따라 달라지는 실제 처리 유형을 확인하세요.</p>
    <nav class="dg-inheritance-casecards-grid" aria-label="상속등기 처리사례 바로가기">
      <a href="/inheritance-missing-heir.html"><div class="dg-case-head"><span class="dg-case-badge">사례</span><strong>연락두절</strong></div><span>연락이 되지 않는 상속인이 있는 경우</span></a>
      <a href="/inheritance-overseas-heir.html"><div class="dg-case-head"><span class="dg-case-badge">사례</span><strong>해외·외국국적</strong></div><span>해외거주·외국인 상속인이 있는 경우</span></a>
      <a href="/inheritance-minor-heir.html"><div class="dg-case-head"><span class="dg-case-badge">사례</span><strong>미성년자</strong></div><span>미성년 상속인이 있는 경우</span></a>
      <a href="/inheritance-substitute-succession.html"><div class="dg-case-head"><span class="dg-case-badge">사례</span><strong>대습상속</strong></div><span>대습상속이 문제되는 경우</span></a>
      <a href="/inheritance-division.html"><div class="dg-case-head"><span class="dg-case-badge">사례</span><strong>상속재산분할</strong></div><span>협의가 되지 않거나 분할이 필요한 경우</span></a>
    </nav>
  </div>
</section>
<style>
.dg-inheritance-casecards{padding-top:48px!important;padding-bottom:48px!important;background:#eef6fb!important}
.dg-inheritance-casecards .desc{margin-bottom:18px!important}
.dg-inheritance-casecards-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:stretch}
.dg-inheritance-casecards-grid a{box-sizing:border-box;min-width:0;min-height:118px;padding:18px 16px 16px;display:flex;flex-direction:column;justify-content:flex-start;background:#fff;border:1.5px solid #69b8ee;border-radius:14px;transition:.18s}
.dg-inheritance-casecards-grid a:hover{border-color:#36a9e1;transform:translateY(-2px);box-shadow:0 8px 22px rgba(25,41,68,.08)}
.dg-inheritance-casecards .dg-case-head{display:flex;align-items:center;gap:7px;white-space:nowrap}
.dg-inheritance-casecards .dg-case-badge{display:inline-flex;align-items:center;justify-content:center;height:21px;padding:0 8px;border-radius:999px;background:#2fa6ef;color:#fff;font-size:11px;font-weight:800;line-height:21px}
.dg-inheritance-casecards-grid strong{color:#24384f;font-size:15px;font-weight:800;line-height:1.35}
.dg-inheritance-casecards-grid a>span{display:block;margin-top:12px;color:#3f4f63;font-size:12px;font-weight:700;line-height:1.45}
@media(max-width:1000px){.dg-inheritance-casecards-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.dg-inheritance-casecards{padding-top:36px!important;padding-bottom:36px!important}.dg-inheritance-casecards-grid{grid-template-columns:1fr 1fr;gap:8px}.dg-inheritance-casecards-grid a{min-height:108px;padding:14px 12px}.dg-inheritance-casecards-grid strong{font-size:13px}.dg-inheritance-casecards .dg-case-badge{height:19px;padding:0 7px;font-size:10px;line-height:19px}.dg-inheritance-casecards-grid a>span{margin-top:9px;font-size:10.5px}}
</style>
'''
            marker='<section class="contact" id="contact">'
            if marker not in s: raise SystemExit('contact marker not found')
            s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/restore-inheritance-case-cards.yml
          # 검증: 구 중복 허브는 없어야 하고 복구 카드는 정확히 1개여야 함
          ! grep -q 'INHERITANCE_INTERNAL_LINK_HUB_V1' inheritance.html
          test "$(grep -c 'INHERITANCE_CASE_CARDS_RESTORED_V1' inheritance.html)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '상속등기 하단 중복안내 제거 및 처리사례 카드 복구 [skip ci]'
          git push origin HEAD:main
