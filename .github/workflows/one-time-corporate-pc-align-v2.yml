name: One-time corporate PC align v2
on:
  push:
    paths:
      - '.github/workflows/one-time-corporate-pc-align-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch corporate page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('corporate.html')
          s=p.read_text(encoding='utf-8')
          marker='CORPORATE_PC_ALIGN_V2'
          css='''<style>
/* CORPORATE_PC_ALIGN_V2 */
.corp-card{display:flex!important;flex-direction:column!important}
.corp-card .corp-cost{margin-top:auto!important}
.corp-card-top{background:#eef6fb!important;border-radius:14px!important;padding:12px!important;margin:-4px -4px 15px!important}
@media(min-width:901px){
 .corp-guide .corp-head{text-align:left!important}
 .corp-guide .corp-head h2,.corp-guide .corp-head p,.corp-guide .corp-kicker{text-align:left!important}
}
</style>'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>',1)
          s=s.replace('상호 · 목적 · 자본금 · 1주의 금액','상호 · 본점주소 · 목적 · 자본금 · 1주의 금액')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corporate.html
          git diff --cached --quiet && exit 0
          git commit -m 'Align corporate PC title and card actions'
          git push
