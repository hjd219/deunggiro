name: Calculator preview once
on:
  push:
    paths:
      - 'maintenance/run-calculator-preview.flag'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply exact calculator preview
        run: node scripts/apply-calculator-preview-once.mjs
      - name: Verify scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'assets/home.css\nindex.html'
          git diff -- index.html | grep -q 'calculator-preview-final'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home.css index.html
          git commit -m "홈 계산기를 확정 미리보기와 일치"
          git pull --rebase origin main
          git push origin HEAD:main
