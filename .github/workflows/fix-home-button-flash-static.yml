name: Fix home button flash static
on:
  push:
    branches: [main]
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'HOME_BUTTON_STATIC_FINAL')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make home hero button styles final from first paint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<style id="dg-home-flash-guard">\nbody.home .hero .buttons{visibility:hidden!important}\nbody.home.dg-home-ready .hero .buttons{visibility:visible!important}\n</style>\n</head>\n<body class="home">\n<script id="dg-home-ready-script">\n(function(){\n  const show=()=>document.body.classList.add('dg-home-ready');\n  if(document.readyState==='complete') show();\n  else window.addEventListener('load',show,{once:true});\n})();\n</script>'''
          new='''<style id="dg-home-buttons-static-final">\nbody.home .hero .buttons{visibility:visible!important}\nbody.home .hero .buttons .dg-intro-open,\nbody.home .hero .buttons a[href="#calculator"]{\n  display:inline-flex!important;align-items:center!important;justify-content:center!important;\n  min-height:48px!important;padding:0 21px!important;border-radius:7px!important;\n  background:#fff!important;color:#20242b!important;border:1px solid #36a9e1!important;\n  box-shadow:none!important;font-size:16px!important;font-weight:900!important;line-height:1!important;\n}\nbody.home .hero .buttons a.dg-phone-cta{\n  display:inline-flex!important;align-items:center!important;justify-content:center!important;\n  min-height:48px!important;padding:0 22px!important;border-radius:8px!important;\n  background:#36a9e1!important;color:#fff!important;border:1px solid #36a9e1!important;\n  box-shadow:none!important;font-size:16px!important;font-weight:900!important;line-height:1!important;\n}\n@media(max-width:800px){\n  body.home .hero .buttons .dg-intro-open,body.home .hero .buttons a[href="#calculator"],body.home .hero .buttons a.dg-phone-cta{min-height:44px!important;padding:0 16px!important;border-radius:8px!important;font-size:16px!important}\n}\n</style>\n</head>\n<body class="home">'''
          if old not in s:
              raise SystemExit('index.html: old flash guard/script block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final static button styles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "메인 상단 3개 버튼 초기 스타일 정적화"
          git pull --rebase origin main
          git push origin main
