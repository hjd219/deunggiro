name: Remove imported Naver footer media

on:
  push:
    paths:
      - 'scripts/strip_naver_trailing_media.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Sync branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
      - name: Remove only postscript Naver-imported images
        run: |
          python -u scripts/strip_naver_trailing_media.py
          git diff --check
          git diff --name-only | grep -v '^posts/' && exit 1 || true
      - name: Commit cleaned articles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- posts/; then
            echo "No trailing media found"
            exit 0
          fi
          git add -- posts/
          git commit -m "Remove trailing Naver map and thumbnail media from imported posts"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Cleaned posts published"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to publish cleaned articles"
          exit 1
