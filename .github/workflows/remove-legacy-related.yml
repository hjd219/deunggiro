name: Remove legacy related menu
on:
  push:
    paths:
      - '.github/workflows/remove-legacy-related.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy related-menu sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = ['inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          pat = re.compile(r'<section class="section"><div class="container"><div class="label">RELATED</div><h2 class="title">관련 메뉴</h2>.*?</section>', re.S)
          for name in files:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              ns, n = pat.subn('', s)
              p.write_text(ns, encoding='utf-8')
              print(name, 'removed', n)
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html renunciation.html corporate.html realestate.html family.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Remove legacy related menu from detail pages"
            git push
          fi
