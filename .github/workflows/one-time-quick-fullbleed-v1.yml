name: One-time quick fullbleed v1
on:
  push:
    paths:
      - '.github/workflows/one-time-quick-fullbleed-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove side white gaps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* QUICK_SIDE_BG_FIX_V1 */'
          if marker not in s:
            css='''\n<style>\n/* QUICK_SIDE_BG_FIX_V1 */\n/* 업무카드 좌우 바깥까지 동일한 하늘색 배경으로 채움 */\n.quick{position:relative!important;background:#eef6fb!important}\n.quick::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:#eef6fb!important}\n.quick>.container{background:transparent!important}\n@media(min-width:1001px){.quick{overflow:visible!important}}\n</style>\n'''
            s=s.replace('</head>',css+'\n</head>',1); p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Extend sky background across service card sides'
          git push origin main