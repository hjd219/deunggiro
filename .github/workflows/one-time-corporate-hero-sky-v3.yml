name: One-time corporate hero sky v3
on:
  push:
    paths:
      - '.github/workflows/one-time-corporate-hero-sky-v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch corporate page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('corporate.html')
          s=p.read_text(encoding='utf-8')
          marker='CORPORATE_HERO_SKY_V3'
          css='''<style>
/* CORPORATE_HERO_SKY_V3 */
.subhero{background:#eef6fb!important}
.subhero::before,.subhero::after{background:transparent!important}
.corp-card-top{background:transparent!important;padding:0!important;margin:0 0 15px!important;border-radius:0!important}
.corp-card{display:flex!important;flex-direction:column!important}
.corp-card .corp-cost{margin-top:auto!important}
@media(min-width:901px){
 .corp-guide .corp-head,.corp-guide .corp-kicker,.corp-guide .corp-head h2,.corp-guide .corp-head p{text-align:left!important}
}
</style>'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>',1)
          s=s.replace('상호 · 목적 · 자본금 · 1주의 금액','상호 · 본점주소 · 목적 · 자본금 · 1주의 금액')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add corporate.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Match corporate hero background to inheritance page'
          git push
