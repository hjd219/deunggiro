name: Complete site integrity audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-integrity-audit.yml'
      - 'scripts/audit_site_integrity.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all HTML files, references, sitemap and SEO directives
        run: python3 scripts/audit_site_integrity.py
      - name: Preserve full JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-integrity-report
          path: site-integrity-report.json
          if-no-files-found: warn
