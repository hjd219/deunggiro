name: One-time latest posts source cleanup
on:
  push:
    branches: [tmp-latest-posts-cleanup-run-20260917]
    paths: ['.github/workflows/tmp-latest-posts-source-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-latest-posts-cleanup-run-20260917
      - name: Remove obsolete latest-post source and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.html'):
              if p.name == 'index.html': continue
              s=p.read_text(encoding='utf-8'); old=s
              s=s.replace('<link rel="stylesheet" href="/assets/latest-posts.css">\n','').replace('<link rel="stylesheet" href="/assets/latest-posts.css">','')
              s=re.sub(r'<aside class="related-posts-panel">.*?</aside>', '', s, flags=re.S)
              if s != old: p.write_text(s,encoding='utf-8')
          p=Path('assets/site-shell.js'); s=p.read_text(encoding='utf-8'); s=s.replace("    document.querySelectorAll('.related-posts-panel').forEach(el=>el.remove());\n",''); p.write_text(s,encoding='utf-8')
          p=Path('assets/site-shell.css'); s=p.read_text(encoding='utf-8').replace('.related-posts-panel,',''); p.write_text(s,encoding='utf-8')
          p=Path('assets/latest-posts.css'); p.unlink(missing_ok=True)
          Path('.github/workflows/tmp-latest-posts-source-cleanup.yml').unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove obsolete latest-post sections from subpages'
          git push origin HEAD:tmp-latest-posts-cleanup-run-20260917
