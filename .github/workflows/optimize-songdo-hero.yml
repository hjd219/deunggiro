name: Optimize hero images
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/optimize-songdo-hero.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - name: Create web hero image
        run: |
          python - <<'PY'
          from PIL import Image
          src='images/(260623)송도국제도시(02).jpg'
          dst='images/songdo-hero.webp'
          im=Image.open(src)
          im.thumbnail((2560,2560), Image.Resampling.LANCZOS)
          im.save(dst,'WEBP',quality=88,method=6)
          print(im.size)
          src2='images/(230727)청라국제도시(0370)-원본.jpg'
          dst2='images/cheongna-realestate-hero.webp'
          im2=Image.open(src2)
          im2.thumbnail((2560,2560), Image.Resampling.LANCZOS)
          im2.save(dst2,'WEBP',quality=86,method=6)
          print(im2.size)
          PY
      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p=Path('realestate.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/images/(230727)청라국제도시(0370)-원본.jpg','/images/cheongna-realestate-hero.webp')
          p.write_text(s,encoding='utf-8')
          PY
          git add images/songdo-hero.webp images/cheongna-realestate-hero.webp realestate.html
          git diff --cached --quiet || (git commit -m "Add optimized Songdo hero image" && git push)
