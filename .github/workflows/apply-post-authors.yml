name: Apply Legal Article Authors

on:
  push:
    paths:
      - '.github/workflows/apply-post-authors.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply stable bylines to all existing articles
        run: python -u scripts/ensure_article_author.py
      - name: Add appropriate calculator links to cost passages
        run: python -u scripts/ensure_cost_calculator_links.py
      - name: Verify every indexed article has visible and structured author
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root=Path('.')
          posts=json.loads((root/'data/posts.json').read_text(encoding='utf-8'))
          bad=[]
          checked=0
          for post in posts:
              slug=str(post.get('slug','')).removesuffix('.html')
              file=root/'posts'/f'{slug}.html'
              if not file.exists():
                  bad.append(slug+':missing')
                  continue
              source=file.read_text(encoding='utf-8')
              bylines=source.count('class="dg-author-byline"')
              meta_start=source.find('<div class="post-meta">')
              meta_end=source.find('</div>',meta_start) if meta_start>=0 else -1
              author_on_date_row=meta_start>=0 and meta_end>meta_start and 'class="dg-author-byline"' in source[meta_start:meta_end]
              authors=[]
              for raw in re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>([\s\S]*?)</script>',source,re.I):
                  try: node=json.loads(raw)
                  except json.JSONDecodeError: continue
                  if isinstance(node,dict) and node.get('@type')=='Article':
                      authors.append(node.get('author'))
              expected={'@type':'Person','name':'현재두','jobTitle':'법무사'}
              if bylines!=1 or not author_on_date_row or not authors or any(a!=expected for a in authors):
                  bad.append(f'{slug}:byline={bylines}:article_schemas={len(authors)}')
              checked+=1
          print('AUTHOR_VALIDATION',checked,'BAD',len(bad))
          if bad:
              print('AUTHOR_VALIDATION_FAILURES',bad[:30])
              raise SystemExit(1)
          PY
      - name: Commit author placement and contextual calculator links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posts
          if git diff --cached --quiet; then
            echo "All author bylines are already present"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Align authors with dates and connect cost passages to calculators"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "AUTHOR_COST_LINKS_PUBLISHED"
                exit 0
              fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 5))
          done
          exit 1
