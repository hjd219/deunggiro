name: Patch calculator page account UI

on:
  push:
    paths:
      - '.github/workflows/patch-calculator-page-account.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator pages
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('acquisition-calculator.html'), Path('corporate-calculator.html')]
          marker = 'CALCULATOR_PAGE_ACCOUNT_SINGLE_V1'
          patch = r'''
<script>
/* CALCULATOR_PAGE_ACCOUNT_SINGLE_V1
   계산기 화면: 고객 준비서류는 숨기고, 입금계좌는 PDF 버튼 위에 1개만 표시 */
(function(){
  const PATHS=['/acquisition-calculator.html','/corporate-calculator.html'];
  if(!PATHS.includes(location.pathname)) return;

  const style=document.createElement('style');
  style.id='dg-calculator-account-single-v1';
  style.textContent=`
    @media screen{
      .result .documents{display:none!important}
      .result .dg-calc-account-single{display:block!important;margin-top:14px!important;padding:15px 16px!important;border:1px solid #91adbf!important;border-radius:12px!important;background:#f2faff!important}
      .result .dg-calc-account-head{display:flex!important;align-items:center!important;gap:8px!important;margin-bottom:10px!important}
      .result .dg-calc-account-head strong{padding:4px 9px!important;border:1px solid #b9e0f2!important;border-radius:8px!important;background:#eaf7fd!important;color:#168dca!important;font-size:12px!important;font-weight:900!important}
      .result .dg-calc-account-head span{color:#607286!important;font-size:11px!important;font-weight:750!important}
      .result .dg-calc-account-list{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important}
      .result .dg-calc-account-row{padding:10px 12px!important;border:1px solid #cfe4ef!important;border-radius:9px!important;background:#fff!important;min-width:0!important}
      .result .dg-calc-account-bank{display:block!important;margin-bottom:3px!important;color:#168dca!important;font-size:11px!important;font-weight:900!important}
      .result .dg-calc-account-number{display:block!important;color:#0b2137!important;font-size:14px!important;font-weight:900!important;white-space:nowrap!important}
      .result .dg-calc-account-holder{display:block!important;margin-top:2px!important;color:#607286!important;font-size:10.5px!important;font-weight:750!important}
      @media(max-width:520px){.result .dg-calc-account-list{grid-template-columns:1fr!important}}
    }
    @media print{.result .dg-calc-account-single{display:none!important}}
  `;
  document.head.appendChild(style);

  const nums=['110-482-692656','3333-07-6560416'];
  const accountHtml=`<div class="dg-calc-account-single"><div class="dg-calc-account-head"><strong>입금계좌</strong><span>현재두 법무사 사무소</span></div><div class="dg-calc-account-list"><div class="dg-calc-account-row"><span class="dg-calc-account-bank">신한은행</span><span class="dg-calc-account-number">110-482-692656</span><span class="dg-calc-account-holder">현재두법무사사무소</span></div><div class="dg-calc-account-row"><span class="dg-calc-account-bank">카카오뱅크</span><span class="dg-calc-account-number">3333-07-6560416</span><span class="dg-calc-account-holder">현재두법무사사무소</span></div></div></div>`;

  function clean(){
    const result=document.querySelector('.result');
    if(!result) return;
    const pdf=result.querySelector('.pdf-download');
    if(!pdf) return;
    const candidates=new Set();
    result.querySelectorAll('.account-box,.bank-account,.account-info,.deposit-account,.dg-estimate-account').forEach(el=>candidates.add(el));
    result.querySelectorAll('*').forEach(el=>{
      if(el.closest('.dg-calc-account-single')) return;
      const t=(el.textContent||'').replace(/\s/g,'');
      if(nums.every(n=>t.includes(n))){
        let node=el;
        while(node.parentElement && node.parentElement!==result && node.parentElement.textContent && nums.every(n=>(node.parentElement.textContent||'').replace(/\s/g,'').includes(n))){
          if(node.parentElement.querySelector('.pdf-download')) break;
          node=node.parentElement;
        }
        if(node!==result && !node.querySelector('.pdf-download')) candidates.add(node);
      }
    });
    candidates.forEach(el=>{if(el.isConnected) el.remove()});
    let single=result.querySelector('.dg-calc-account-single');
    if(!single){pdf.insertAdjacentHTML('beforebegin',accountHtml);single=result.querySelector('.dg-calc-account-single')}
    else if(single.nextElementSibling!==pdf){pdf.insertAdjacentElement('beforebegin',single)}
  }
  let busy=false;
  const schedule=()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{busy=false;clean()})};
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',schedule,{once:true}); else schedule();
  const obs=new MutationObserver(schedule);
  obs.observe(document.documentElement,{subtree:true,childList:true});
})();
</script>
'''

          for path in files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</body>' not in text:
                  raise SystemExit(f'{path}: </body> not found')
              path.write_text(text.replace('</body>', patch + '\n</body>', 1), encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acquisition-calculator.html corporate-calculator.html
          git commit -m "계산기 계좌 중복 제거 및 준비서류 화면 숨김"
          git push
