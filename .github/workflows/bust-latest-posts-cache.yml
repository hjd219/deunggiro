name: Bust latest posts cache
on:
  push:
    branches: [main]
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'BUST_LATEST_POSTS_CACHE')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update latest-posts cache version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['inheritance.html','renunciation.html','corporate.html','realestate.html','family.html','index.html']
          for f in files:
              p=Path(f)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if '/assets/latest-posts.js?v=' in s:
                  import re
                  s=re.sub(r'/assets/latest-posts\.js\?v=[^"\']+', '/assets/latest-posts.js?v=13', s)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/bust-latest-posts-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html renunciation.html corporate.html realestate.html family.html index.html .github/workflows/bust-latest-posts-cache.yml
          git commit -m "처리사례 배지 최신글 스크립트 캐시 갱신 [skip ci]"
          git pull --rebase origin main
          git push origin main
