name: One-time family inheritance layout v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-family-inheritance-layout-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch family detail
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('family.html')
          s=p.read_text(encoding='utf-8')
          if 'FAMILY_INHERITANCE_LAYOUT_V1' in s:
              raise SystemExit(0)
          old='''<section class="section white"><div class="container"><div class="label">MAIN SERVICES</div><h2 class="title">주요 업무</h2><div class="info-grid"><a class="info-card" href="#service-1"><div class="label">01</div><h3>이혼·재산분할</h3><p>협의이혼 · 재산분할 합의 · 관련 등기</p></a><a class="info-card" href="#service-2"><div class="label">02</div><h3>개명</h3><p>개명허가 신청 · 필요서류 · 허가 후 절차</p></a><a class="info-card" href="#service-3"><div class="label">03</div><h3>후견</h3><p>성년후견 · 한정후견 · 가족관계 관련 절차</p></a></div></div></section>'''
          new='''<section class="section family-services"><div class="container"><div class="label">MAIN SERVICES</div><h2 class="title">가사 주요 업무</h2><div class="family-service-grid">
          <article class="family-service-card"><div class="family-card-head"><div class="family-icon"><svg viewBox="0 0 64 64"><circle cx="22" cy="21" r="8" fill="#e8f3ff" stroke="#397bd8" stroke-width="3"/><circle cx="43" cy="21" r="8" fill="#ffecef" stroke="#e35d6a" stroke-width="3"/><path d="M8 51c1-12 7-18 14-18s13 6 14 18M29 51c1-12 7-18 14-18s13 6 14 18" fill="none" stroke="#7758c7" stroke-width="3"/></svg></div><h3>이혼 · 재산분할</h3></div><span class="family-tag">혼인관계 정리</span><p>협의이혼·재판상 이혼과 재산분할에 필요한 절차를 확인합니다.</p><div class="family-items">협의이혼 · 재판상 이혼 · 재산분할 · 위자료</div></article>
          <article class="family-service-card"><div class="family-card-head"><div class="family-icon"><svg viewBox="0 0 64 64"><circle cx="32" cy="19" r="8" fill="#fff4df" stroke="#e59a28" stroke-width="3"/><path d="M17 51c1-13 7-20 15-20s14 7 15 20" fill="#fff9ec" stroke="#e59a28" stroke-width="3"/><path d="M13 31c-5 3-7 8-7 14M51 31c5 3 7 8 7 14" stroke="#28a98b" stroke-width="3"/></svg></div><h3>친권 · 양육권</h3></div><span class="family-tag">미성년 자녀</span><p>이혼 시 친권자·양육자 지정과 양육비 관련 절차를 확인합니다.</p><div class="family-items">친권자 지정 · 양육자 지정 · 양육비 · 면접교섭</div></article>
          <article class="family-service-card"><div class="family-card-head"><div class="family-icon"><svg viewBox="0 0 64 64"><path d="M32 8 50 15v15c0 12-7 21-18 27C21 51 14 42 14 30V15z" fill="#eaf8f4" stroke="#28a98b" stroke-width="3"/><circle cx="32" cy="25" r="6" fill="#fff" stroke="#397bd8" stroke-width="3"/><path d="M23 43c1-8 4-12 9-12s8 4 9 12" fill="none" stroke="#397bd8" stroke-width="3"/></svg></div><h3>성년후견 · 한정후견</h3></div><span class="family-tag">후견제도</span><p>의사결정이나 재산관리에 도움이 필요한 경우 후견개시 절차를 진행합니다.</p><div class="family-items">성년후견 · 한정후견 · 특정후견 · 후견인 변경</div></article>
          <article class="family-service-card"><div class="family-card-head"><div class="family-icon"><svg viewBox="0 0 64 64"><rect x="12" y="9" width="40" height="46" rx="5" fill="#f0ebff" stroke="#7758c7" stroke-width="3"/><path d="M21 21h22M21 30h16M21 39h20" stroke="#7758c7" stroke-width="3"/><circle cx="47" cy="46" r="9" fill="#e8f6fd" stroke="#168dca" stroke-width="3"/><path d="m43 46 3 3 5-7" fill="none" stroke="#168dca" stroke-width="3"/></svg></div><h3>개명 · 가족관계등록</h3></div><span class="family-tag">가족관계 정정</span><p>개명허가와 가족관계등록부의 오류·누락 등을 법원 절차를 통해 정리합니다.</p><div class="family-items">개명허가 · 가족관계등록부 정정 · 등록부 창설</div></article>
          </div></div></section>'''
          if old not in s: raise SystemExit('main services block not found')
          s=s.replace(old,new,1)
          # Remove old process/FAQ section; new FAQ is injected beside documents.
          a=s.find('<section class="section soft"><div class="container feature-grid">')
          b=s.find('<section class="section docs-section"',a)
          if a<0 or b<0: raise SystemExit('process block not found')
          s=s[:a]+s[b:]
          # Convert docs section to two-column documents + FAQ.
          s=s.replace('<section class="section docs-section" id="documents"><div class="container"><div class="label">DOCUMENTS</div>', '<section class="section docs-section" id="documents"><div class="container family-bottom-grid"><div class="family-doc-panel"><div class="label">DOCUMENTS</div>',1)
          needle='<p class="docs-note">※ 실제 제출서류는 사건 내용과 관할기관의 보정 요구 등에 따라 달라질 수 있습니다.</p></div></section>'
          repl='''<p class="docs-note">※ 실제 제출서류는 사건 내용과 관할기관의 보정 요구 등에 따라 달라질 수 있습니다.</p></div><div class="family-faq-panel"><div class="label">FAQ</div><h2 class="title">자주 묻는 질문</h2><div class="family-faq">
          <details><summary><i>Q</i><b>협의이혼을 하면 재산분할도 자동으로 끝나나요?</b><span>＋</span></summary><p>아닙니다. 이혼과 재산분할은 별개이며 <strong>재산분할에 관한 합의</strong>가 필요합니다.</p></details>
          <details><summary><i>Q</i><b>이혼 후에도 재산분할을 청구할 수 있나요?</b><span>＋</span></summary><p>가능합니다. 다만 재산분할청구권은 <strong>이혼한 날부터 2년</strong>이 지나면 소멸하므로 기간을 확인해야 합니다.</p></details>
          <details><summary><i>Q</i><b>친권자와 양육자는 반드시 같은 사람이어야 하나요?</b><span>＋</span></summary><p>반드시 같아야 하는 것은 아닙니다. <strong>자녀의 복리</strong>를 기준으로 친권자와 양육자를 달리 정할 수도 있습니다.</p></details>
          <details><summary><i>Q</i><b>성년후견과 한정후견은 어떤 차이가 있나요?</b><span>＋</span></summary><p>본인의 판단능력 정도에 따라 <strong>성년후견 또는 한정후견</strong>을 검토하며 법원이 구체적인 사정을 심리합니다.</p></details>
          </div></div></div></section>'''
          if needle not in s: raise SystemExit('docs closing block not found')
          s=s.replace(needle,repl,1)
          css='''<style>/* FAMILY_INHERITANCE_LAYOUT_V1 */
          .family-service-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.family-service-card{background:#fff;border:1px solid #dfe7ee;border-radius:20px;padding:20px;min-width:0}.family-card-head{display:flex;align-items:center;gap:11px;margin-bottom:13px}.family-icon{width:54px;height:54px;flex:0 0 54px;background:#fff;border:1px solid #dfe7ee;border-radius:16px;box-shadow:0 5px 14px rgba(31,41,55,.055);padding:9px}.family-icon svg{width:100%;height:100%;display:block}.family-card-head h3{margin:0;color:#263442!important;font-size:18px;line-height:1.35;letter-spacing:-.6px}.family-tag{display:inline-block;background:#eaf7fd;color:#36a9e1;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900}.family-service-card p{font-size:13px;color:#687681;line-height:1.65;margin:11px 0}.family-items{border-top:1px solid #edf1f4;padding-top:10px;color:#53616d!important;font-size:12px;line-height:1.7}.family-bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.family-doc-panel,.family-faq-panel{background:#fff;border:1px solid #dfe7ee;border-radius:22px;padding:26px}.family-doc-panel .docs-grid{grid-template-columns:1fr 1fr!important}.family-faq details{background:#fff;border:1px solid #dce8ef;border-radius:15px;margin:9px 0;overflow:hidden}.family-faq summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:34px 1fr 24px;gap:9px;align-items:center;padding:15px}.family-faq summary::-webkit-details-marker{display:none}.family-faq summary i{font-style:normal;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eaf7fd;color:#36a9e1;font-weight:900}.family-faq summary b{font-size:13px;color:#263442}.family-faq summary span{font-size:20px;color:#8b98a2}.family-faq details p{margin:0;padding:0 52px 16px;color:#667580;font-size:13px;line-height:1.7}.family-faq details p strong{color:#36a9e1}.family-faq details[open] summary span{transform:rotate(45deg)}
          @media(max-width:900px){.family-service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.family-bottom-grid{grid-template-columns:1fr}.family-doc-panel .docs-grid{grid-template-columns:1fr 1fr!important}}@media(max-width:600px){.family-service-grid,.family-doc-panel .docs-grid{grid-template-columns:1fr!important}.family-doc-panel,.family-faq-panel{padding:18px}.family-faq details p{padding:0 48px 15px}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add family.html
          git diff --cached --quiet || git commit -m 'Update family detail layout'
          git push
