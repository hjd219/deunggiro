name: Auto related posts
on:
  push:
    paths:
      - '.github/workflows/auto-related-posts.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply automatic related posts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = {
              'inheritance.html': ('상속등기', '상속'),
              'renunciation.html': ('상속포기·한정승인', '상속포기'),
              'corporate.html': ('법인등기', '법인'),
              'realestate.html': ('부동산등기', '부동산'),
              'family.html': ('가사', '가사'),
          }

          script_template = r'''
<script>
(function(){
  const box=document.getElementById('auto-related-posts');
  if(!box) return;
  const category=box.dataset.category;
  const badge=box.dataset.badge || category;
  const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  fetch('/data/posts.json?v='+Date.now(),{cache:'no-store'})
    .then(r=>{if(!r.ok) throw new Error('posts'); return r.json()})
    .then(posts=>{
      const list=posts
        .filter(p=>p.category===category)
        .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))
        .slice(0,4);
      if(!list.length){
        box.innerHTML='<a href="/posts.html"><span class="related-badge">'+esc(badge)+'</span><span class="related-title">관련 법률정보 전체보기</span><span class="related-arrow">→</span></a>';
        return;
      }
      box.innerHTML=list.map(p=>'<a href="/posts/'+encodeURIComponent(p.slug)+'.html"><span class="related-badge">'+esc(badge)+'</span><span class="related-title">'+esc(p.title)+'</span><span class="related-arrow">→</span></a>').join('');
    })
    .catch(()=>{
      box.innerHTML='<a href="/posts.html"><span class="related-badge">'+esc(badge)+'</span><span class="related-title">관련 법률정보 전체보기</span><span class="related-arrow">→</span></a>';
    });
})();
</script>
'''

          for filename,(category,badge) in pages.items():
              p=Path(filename)
              t=p.read_text(encoding='utf-8')

              # Replace the current static related-post list with a dynamic container.
              pattern=r'<div class="related-posts-list">.*?</div><div class="related-posts-actions">'
              repl=(f'<div class="related-posts-list" id="auto-related-posts" '
                    f'data-category="{category}" data-badge="{badge}">'
                    f'<a href="/posts.html"><span class="related-badge">{badge}</span>'
                    f'<span class="related-title">최신 관련 법률정보를 불러오는 중입니다.</span>'
                    f'<span class="related-arrow">→</span></a></div>'
                    f'<div class="related-posts-actions">')
              t2,n=re.subn(pattern,repl,t,count=1,flags=re.S)
              if n==0:
                  raise RuntimeError(f'{filename}: related-posts-list not found')
              t=t2

              # Remove an older copy if this workflow is ever retried.
              t=re.sub(r'\n?<script>\n\(function\(\)\{\n  const box=document\.getElementById\(\'auto-related-posts\'\);.*?</script>\n?', '\n', t, flags=re.S)
              t=t.replace('</body>', script_template+'\n</body>',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff --cached --quiet || git commit -m "Make related legal information update automatically"
          git push
