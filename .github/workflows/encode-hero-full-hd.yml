name: Encode original homepage video to Full HD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encode-hero-full-hd.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check original resolution and encode
        shell: bash
        run: |
          set -euo pipefail
          INPUT="assets/deunggiro-hero-video.mp4.mp4"
          OUTPUT="assets/deunggiro-hero-video-hd.mp4"
          test -s "$INPUT"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size,bit_rate -of json "$INPUT"
          ffmpeg -hide_banner -loglevel error -y -i "$INPUT" \
            -map 0:v:0 -an \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black,unsharp=5:5:0.4:3:3:0.0" \
            -c:v libx264 -preset slow -crf 19 -pix_fmt yuv420p \
            -movflags +faststart "$OUTPUT"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size,bit_rate -of json "$OUTPUT"
      - name: Publish separate HD asset (do not change homepage HTML)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/deunggiro-hero-video-hd.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add higher quality 1080p homepage video from stored original"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
