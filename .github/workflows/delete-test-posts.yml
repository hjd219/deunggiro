name: Delete Test Posts

on:
  push:
    paths:
      - '.github/workflows/delete-test-posts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete test posts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          slugs={'naver-224370995171','naver-224230217554','naver-224235350490'}
          p=Path('data/posts.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data=[x for x in data if str(x.get('slug','')).replace('.html','') not in slugs]
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          for slug in slugs:
              Path('posts',slug+'.html').unlink(missing_ok=True)
              Path('assets/posts',slug+'-thumbnail.png').unlink(missing_ok=True)
              shutil.rmtree(Path('assets/naver-images',slug),ignore_errors=True)
          print('deleted',sorted(slugs))
          PY
          python scripts/site_maintenance.py
          python scripts/apply_latest_cards.py
          python scripts/generate_sitemap.py
          node scripts/seo-auto.mjs
          node scripts/seo-canonical-fix.mjs
          node scripts/rss-auto.mjs
          git add -A
          git commit -m "테스트 글 3개 삭제 및 목록 정리"
          git push origin HEAD:main
