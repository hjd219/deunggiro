name: Remove consultation label
on:
  push:
    paths:
      - '.github/workflows/remove-consultation-label.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only CONSULTATION label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/site-shell.js')
          s=p.read_text(encoding='utf-8')
          old='<div class="dg-shell-label">CONSULTATION</div>'
          if old not in s:
              raise SystemExit('CONSULTATION label not found; no changes made')
          p.write_text(s.replace(old,'',1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-shell.js
          git commit -m "Remove remaining CONSULTATION label"
          git push
