name: Static service leads
on:
  push:
    branches: [main]
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'STATIC_SERVICE_LEADS')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write service lead copy into HTML and remove runtime swap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          copies={
            'inheritance.html':'상속등기 절차 · 비용 · 필요서류부터 협의분할, 연락두절 · 해외거주 · 미성년자 등 복잡한 상속까지 실제 처리사례를 바탕으로 안내합니다.',
            'renunciation.html':'상속포기 · 한정승인 절차 · 비용 · 필요서류부터 특별한정승인, 후순위 상속인, 미성년자, 상속재산파산까지 실제 처리사례를 바탕으로 안내합니다.',
            'corporate.html':'법인등기 절차 · 비용 · 필요서류부터 법인설립, 임원변경, 본점이전, 상호 · 목적변경, 자본금증자, 해산 · 청산까지 안내합니다.',
            'realestate.html':'부동산등기 절차 · 비용 · 필요서류부터 매매, 증여, 상속, 재산분할, 근저당 설정 · 말소, 신탁등기까지 안내합니다.',
            'family.html':'가사사건 절차 · 비용 · 필요서류부터 협의이혼, 재산분할, 미성년자 특별대리인, 성년후견, 개명 · 가족관계등록까지 안내합니다.'
          }

          for name,copy in copies.items():
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              pattern=r'(<div class="subhero-copy">.*?</h1><p>)(.*?)(</p>)'
              s2,n=re.subn(pattern,lambda m:m.group(1)+copy+m.group(3),s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'{name}: lead paragraph replacement count={n}')
              if copy not in s2:
                  raise SystemExit(f'{name}: new copy missing after replacement')
              p.write_text(s2,encoding='utf-8')

          shell=Path('assets/site-shell.js')
          s=shell.read_text(encoding='utf-8')
          old="""  const servicePages=new Set([\n    '/inheritance.html',\n    '/renunciation.html',\n    '/corporate.html',\n    '/realestate.html',\n    '/family.html'\n  ]);\n  if(servicePages.has(current)){\n    loadScript('/assets/service-lead.js?v=20260911-1').catch(()=>{});\n  }\n\n"""
          if old not in s:
              raise SystemExit('assets/site-shell.js: service-lead loader block not found')
          shell.write_text(s.replace(old,'',1),encoding='utf-8')

          lead=Path('assets/service-lead.js')
          if lead.exists():
              lead.unlink()
          PY
      - name: Commit static service lead conversion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inheritance.html renunciation.html corporate.html realestate.html family.html assets/site-shell.js assets/service-lead.js
          git diff --cached --quiet && exit 0
          git commit -m "5개 업무페이지 설명문 정적화"
          git pull --rebase origin main
          git push origin main
