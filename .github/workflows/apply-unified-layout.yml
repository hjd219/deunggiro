          def build_hero(c):
              links=''.join(f'<a href="{u}"><span class="related-badge">{html.escape(c["badge"])}</span><span class="related-title">{html.escape(t)}</span><span class="related-arrow">→</span></a>' for u,t in c['links'])
              return f'''<section class="subhero"><div class="container subhero-related-grid"><div class="subhero-copy"><div class="breadcrumb"><a href="/">홈</a> / 업무안내 / {html.escape(c['title'])}</div><div class="label">{c['label']}</div><h1>{html.escape(c['title'])}</h1><p>{html.escape(c['desc'])}</p><div class="buttons"><a class="btn btn-primary" href="tel:0324251500">032-425-1500 상담</a><a class="btn btn-border" href="/posts.html">관련 법률정보</a></div></div><aside class="related-posts-panel"><div class="related-posts-head"><div class="label">RELATED LEGAL INFORMATION</div><h2>{html.escape(c['panel'])}</h2><p>{html.escape(c['panel_desc'])}</p></div><div class="related-posts-list">{links}</div><div class="related-posts-actions"><a href="/posts.html">관련 법률정보 전체보기 →</a><a href="{c['action'][0]}">{html.escape(c['action'][1])}</a></div></aside></div></section>'''

          def build_docs(c):
              cards=''.join('<div class="docs-card"><h3>'+html.escape(title)+'</h3><ul>'+''.join('<li>'+html.escape(x)+'</li>' for x in items)+'</ul></div>' for title,items in c['docs'])
              return f'''<section class="section docs-section" id="documents"><div class="container"><div class="label">DOCUMENTS</div><h2 class="title">필요서류</h2><p class="desc">업무 유형별 기본 필요서류입니다. 사건 내용과 당사자 구성에 따라 추가서류가 필요할 수 있습니다.</p><div class="docs-grid">{cards}</div><p class="docs-note">※ 실제 제출서류는 사건 내용과 관할기관의 보정 요구 등에 따라 달라질 수 있습니다.</p></div></section>'''

          def replace_bottom(s):
              starts=[x for x in (s.find('<section class="page-cta'),s.find('<section class="cta'),s.find('<section class="contact')) if x>=0]
              if not starts: return s
              st=min(starts); en=s.find('</footer>',st)
              if en<0: return s
              return s[:st]+FOOTER+s[en+len('</footer>'):]

          for fn,c in PAGES.items():
              p=Path(fn); s=p.read_text(encoding='utf-8')
              s=add_css(s)
              s=re.sub(r'<section class="subhero">.*?</section>',build_hero(c),s,count=1,flags=re.S)
              s=re.sub(r'\s*<section class="section soft anchor-target" id="related-articles">.*?</section>\s*','\n',s,count=1,flags=re.S)
              s=re.sub(r'\s*<section[^>]*id="documents"[^>]*>.*?</section>\s*','\n',s,count=1,flags=re.S)
              s=replace_bottom(s)
              pos=s.find('<section class="contact"')
              if pos>=0: s=s[:pos]+build_docs(c)+'\n'+s[pos:]
              p.write_text(s,encoding='utf-8')

          p=Path('posts.html'); s=p.read_text(encoding='utf-8')
          s=add_css(s)
          s=re.sub(r'\s*<section class="section white seo-links-section".*?</section>\s*','\n',s,count=1,flags=re.S)
          s=replace_bottom(s)
          p.write_text(s,encoding='utf-8')
          PY
