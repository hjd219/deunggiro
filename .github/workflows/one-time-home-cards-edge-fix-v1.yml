name: One-time home cards edge fix v1
on:
  push:
    paths:
      - '.github/workflows/one-time-home-cards-edge-fix-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix card edge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* HOME_SERVICE_CARD_EDGE_FIX_V1 */'
          if marker not in s:
            css='''\n<style>\n/* HOME_SERVICE_CARD_EDGE_FIX_V1 */\n@media(min-width:1001px){\n .quick{width:100%!important;max-width:1180px!important;overflow:visible!important}\n .quick-grid{width:100%!important;max-width:100%!important;min-width:0!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;box-sizing:border-box!important}\n .quick-item.quick-rich{min-width:0!important;max-width:100%!important;width:auto!important;box-sizing:border-box!important;overflow:hidden!important}\n .quick-item.quick-rich:last-child{margin-right:0!important}\n}\n</style>\n'''
            s=s.replace('</head>',css+'\n</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep PC service cards inside container edge'
          git push origin main