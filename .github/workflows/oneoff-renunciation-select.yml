name: oneoff-renunciation-select
on:
  push:
    paths:
      - '.github/workflows/oneoff-renunciation-select.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace legacy popover with direct native select
        shell: python
        run: |
          from pathlib import Path
          p=Path('renunciation.html')
          s=p.read_text(encoding='utf-8')
          old_style='''<style id="dg-renunciation-hero-style">.dg-hero-home{width:48px!important;padding:0!important;background:#fff!important;color:#1599d7!important;border:1px solid #84c9ed!important}.dg-hero-home svg{width:20px;height:20px;display:block}.dg-hero-home:hover,.dg-hero-home:focus-visible{background:#f5fbfe!important;color:#168dca!important}@media(max-width:700px){#dg-renunciation-popover-trigger{font-size:14px!important;padding:0 14px!important}.dg-hero-home{width:48px!important}}</style><link rel="stylesheet" href="/assets/detail-popover.css?v=20260913">'''
          new_style='''<style id="dg-renunciation-hero-style">.dg-hero-home{width:48px!important;padding:0!important;background:#fff!important;color:#1599d7!important;border:1px solid #84c9ed!important}.dg-hero-home svg{width:20px;height:20px;display:block}.dg-hero-home:hover,.dg-hero-home:focus-visible{background:#f5fbfe!important;color:#168dca!important}.dg-renunciation-detail-select-wrap{position:relative;display:inline-flex;min-width:250px;min-height:48px}.dg-renunciation-detail-select{width:100%;min-height:48px;padding:0 38px 0 16px;border:1px solid #84c9ed;border-radius:8px;background:#fff;color:#20242b;font:inherit;font-size:15px;font-weight:900;box-shadow:0 8px 18px rgba(54,169,225,.20);appearance:auto;-webkit-appearance:menulist;cursor:pointer}@media(max-width:700px){.dg-hero-home{width:48px!important}.dg-renunciation-detail-select-wrap{flex:1 1 250px;min-width:0}.dg-renunciation-detail-select{font-size:14px}}</style>'''
          old_button='''<a class="btn btn-border" href="/posts.html">관련 법률정보</a>'''
          new_button='''<label class="dg-renunciation-detail-select-wrap"><select class="dg-renunciation-detail-select" aria-label="상속포기·한정승인 세부안내" onchange="if(this.value) location.href=this.value"><option value="" selected>상속포기·한정승인 세부안내</option><option value="" disabled>상속포기 후 절차</option><option value="" disabled>한정승인 후 청산절차</option></select></label>'''
          old_script='''<script src="/assets/detail-popover.js?v=20260913" defer></script>\n'''
          assert s.count(old_style)==1, f'legacy style count={s.count(old_style)}'
          assert s.count(old_button)==1, f'button count={s.count(old_button)}'
          assert s.count(old_script)==1, f'popover script count={s.count(old_script)}'
          s=s.replace(old_style,new_style,1).replace(old_button,new_button,1).replace(old_script,'',1)
          assert '관련 법률정보</a></div><div class="dg-section-finder"' not in s
          assert 'detail-popover.js' not in s
          assert 'detail-popover.css' not in s
          assert s.count('dg-renunciation-detail-select')>=2
          p.write_text(s,encoding='utf-8')
      - name: Commit only renunciation.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(git status --porcelain | wc -l)" -eq 1
          git add renunciation.html
          git diff --cached --exit-code -- .github/workflows/oneoff-renunciation-select.yml || true
          git commit -m "fix: use direct renunciation detail select"
          git push origin HEAD:main
