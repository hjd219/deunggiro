name: Fix sequential related rolling
on:
  push:
    paths:
      - '.github/workflows/fix-sequential-related.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run fixer
        run: python3 tools/fix_seq_related.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff --cached --quiet || git commit -m "Make related legal info roll one row at a time"
          git push
