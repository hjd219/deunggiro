name: Home desktop CSS ownership move once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-desktop-css-move-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move exact home desktop rules
        run: |
          python - <<'PY'
          from pathlib import Path
          core = Path('assets/site-shell-core.css')
          home = Path('assets/home.css')
          c = core.read_text(encoding='utf-8')
          h = home.read_text(encoding='utf-8')
          old = '@media(min-width:1001px){body.home .hero .hero-written-phrase{font-size:50px!important;letter-spacing:.005em!important;min-height:1.62em!important;margin-top:.12em!important;transform:scaleX(1.14)!important;transform-origin:left center!important}body.home .hero .hero-written-brand{font-size:1.46em!important;letter-spacing:-.035em!important}body.home .hero .hero-written-message{letter-spacing:.005em!important}body.home .hero .hero-written-line{width:99%!important}body.home .hero .hero-written-line.second{width:84%!important}body:not(.home):not(.article-v2) .subhero{padding-bottom:30px!important}body:not(.home):not(.article-v2) .subhero + .section{padding-top:36px!important}.subhero-related-grid .related-posts-head{padding:14px 18px 10px!important}.subhero-related-grid .related-posts-head h2{font-size:18px!important;margin:3px 0 2px!important}.subhero-related-grid .related-posts-head p{font-size:11px!important;line-height:1.5!important}.subhero-related-grid .related-posts-list a{padding:8px 14px!important}.subhero-related-grid .related-posts-actions{padding:9px!important;gap:7px!important}.subhero-related-grid .related-posts-actions a{min-height:32px!important}}'
          keep = '@media(min-width:1001px){body:not(.home):not(.article-v2) .subhero{padding-bottom:30px!important}body:not(.home):not(.article-v2) .subhero + .section{padding-top:36px!important}.subhero-related-grid .related-posts-head{padding:14px 18px 10px!important}.subhero-related-grid .related-posts-head h2{font-size:18px!important;margin:3px 0 2px!important}.subhero-related-grid .related-posts-head p{font-size:11px!important;line-height:1.5!important}.subhero-related-grid .related-posts-list a{padding:8px 14px!important}.subhero-related-grid .related-posts-actions{padding:9px!important;gap:7px!important}.subhero-related-grid .related-posts-actions a{min-height:32px!important}}'
          moved = '@media(min-width:1001px){body.home .hero .hero-written-phrase{font-size:50px!important;letter-spacing:.005em!important;min-height:1.62em!important;margin-top:.12em!important;transform:scaleX(1.14)!important;transform-origin:left center!important}body.home .hero .hero-written-brand{font-size:1.46em!important;letter-spacing:-.035em!important}body.home .hero .hero-written-message{letter-spacing:.005em!important}body.home .hero .hero-written-line{width:99%!important}body.home .hero .hero-written-line.second{width:84%!important}}'
          if c.count(old) != 1:
              raise SystemExit(f'core target count={c.count(old)}')
          if moved in h:
              raise SystemExit('home target already present')
          c = c.replace(old, keep, 1)
          h = h.rstrip() + '\n\n/* HOME_DESKTOP_HERO_OWNERSHIP_V1 - 메인 PC 전용 */\n' + moved + '\n'
          core.write_text(c, encoding='utf-8')
          home.write_text(h, encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'assets/home.css\nassets/site-shell-core.css' || { echo "$changed"; exit 1; }
      - name: Commit move and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/home-desktop-css-move-once.yml
          git add assets/home.css assets/site-shell-core.css
          git commit -m 'CSS 역할 정리: 메인 PC 전용 규칙 home.css로 이전'
          git pull --rebase origin main
          git push origin HEAD:main
