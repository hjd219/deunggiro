name: Structure cleanup phase3 once
on:
  push:
    branches: [main]
    paths:
      - 'maintenance/run-structure-cleanup-phase3.flag'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/structure-cleanup-phase3-once.mjs
      - name: Verify scope
        run: |
          test "$(git diff --name-only)" = 'assets/site-shell-core.css'
          git diff --check
          ! grep -q 'padding-left:14px;padding-right:14px' assets/site-shell-core.css
          grep -q 'padding-left:16px!important;padding-right:16px!important' assets/site-shell-core.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-shell-core.css
          git commit -m '3차 CSS 구조개선: 중복 모바일 여백 제거'
          git pull --rebase origin main
          git push origin HEAD:main