name: Staticize service page enhancements once
on:
  push:
    paths:
      - '.github/workflows/staticize-service-enhancements-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  staticize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Staticize runtime enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          pages=['inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          calc={
            'inheritance.html':('상속비용 계산기 →','/acquisition-calculator.html?type=inheritance'),
            'corporate.html':('법인비용 계산기 →','/corporate-calculator.html'),
            'realestate.html':('취득세 계산기 →','/acquisition-calculator.html'),
            'family.html':('재산분할 계산기 →','/divorce-calculator.html'),
          }

          def add_desc(html, section_class, text):
              if text in html: return html
              m=re.search(r'<section\b[^>]*class=["\'][^"\']*\b'+re.escape(section_class)+r'\b[^"\']*["\'][^>]*>',html,re.I)
              if not m: raise SystemExit(f'section not found: {section_class}')
              h=re.search(r'<h2\b[^>]*class=["\'][^"\']*\btitle\b[^"\']*["\'][^>]*>[\s\S]*?</h2>',html[m.end():],re.I)
              if not h: raise SystemExit(f'title not found in {section_class}')
              pos=m.end()+h.end()
              return html[:pos]+f'<p class="desc dg-section-desc">{text}</p>'+html[pos:]

          def actions_span(html):
              m=re.search(r'<div\b[^>]*class=["\'][^"\']*\brelated-posts-actions\b[^"\']*["\'][^>]*>',html,re.I)
              if not m: raise SystemExit('related-posts-actions not found')
              end=html.find('</div>',m.end())
              if end<0: raise SystemExit('related-posts-actions closing div not found')
              return m.end(),end

          def ensure_calc(html,text,href):
              a,b=actions_span(html); inner=html[a:b]
              anchors=list(re.finditer(r'<a\b[^>]*>[\s\S]*?</a>',inner,re.I))
              target=None
              for x in anchors:
                  tag=x.group(0)
                  if '계산기' in re.sub(r'<[^>]+>','',tag) or f'href="{href}"' in tag or f"href='{href}'" in tag:
                      target=x; break
              new=f'<a class="dg-related-calc" href="{href}">{text}</a>'
              if target:
                  inner=inner[:target.start()]+new+inner[target.end():]
              else:
                  inner=inner+new
              return html[:a]+inner+html[b:]

          def remove_ren_dup(html):
              a,b=actions_span(html); inner=html[a:b]
              anchors=list(re.finditer(r'<a\b[^>]*>[\s\S]*?</a>',inner,re.I))
              if len(anchors)>1:
                  x=anchors[-1]
                  inner=inner[:x.start()]+inner[x.end():]
              return html[:a]+inner+html[b:]

          for name in pages:
              p=root/name; html=p.read_text(encoding='utf-8')
              html=re.sub(r'\s*<script\s+src=["\']/assets/service-page-enhancements\.js(?:\?[^"\']*)?["\']\s+defer></script>','',html,flags=re.I)
              if name=='renunciation.html':
                  html=add_desc(html,'ren-process-section','상속포기·한정승인의 절차와 3개월 신청기한을 확인하세요.')
                  html=remove_ren_dup(html)
              if name=='family.html':
                  html=add_desc(html,'family-services','이혼·재산분할·친권·양육권 등 주요 가사사건의 절차를 확인하세요.')
              if name in calc:
                  html=ensure_calc(html,*calc[name])
              p.write_text(html,encoding='utf-8')

          ap=root/'scripts/apply_latest_cards.py'
          s=ap.read_text(encoding='utf-8')
          s=s.replace("SERVICE_PAGES={'inheritance.html','renunciation.html','corporate.html','realestate.html','family.html'}\n",'')
          s=s.replace("SERVICE_ENHANCEMENTS_JS='<script src=\"/assets/service-page-enhancements.js\" defer></script>'\n",'')
          s=re.sub(r"\n    if path\.name in SERVICE_PAGES and '/assets/service-page-enhancements\.js' not in s:\n        pos=s\.lower\(\)\.rfind\('</body>'\)\n        if pos!=-1: s=s\[:pos\]\+SERVICE_ENHANCEMENTS_JS\+'\\n'\+s\[pos:\]\n        else: s\+=SERVICE_ENHANCEMENTS_JS\+'\\n'",'',s)
          s=s.replace("print('latest-card / service-enhancements / article-cta patched',len(changed),'files')","print('latest-card / article-cta patched',len(changed),'files')")
          ap.write_text(s,encoding='utf-8')

          js=root/'assets/service-page-enhancements.js'
          if js.exists(): js.unlink()

          # verification
          for name in pages:
              h=(root/name).read_text(encoding='utf-8')
              assert 'service-page-enhancements.js' not in h, name
          assert '상속포기·한정승인의 절차와 3개월 신청기한을 확인하세요.' in (root/'renunciation.html').read_text(encoding='utf-8')
          assert '이혼·재산분할·친권·양육권 등 주요 가사사건의 절차를 확인하세요.' in (root/'family.html').read_text(encoding='utf-8')
          for name,(text,href) in calc.items():
              h=(root/name).read_text(encoding='utf-8')
              assert href in h and text in h, name
          assert 'service-page-enhancements' not in ap.read_text(encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/staticize-service-enhancements-once.yml
          git add inheritance.html renunciation.html corporate.html realestate.html family.html scripts/apply_latest_cards.py
          git add -u assets/service-page-enhancements.js
          git diff --cached --check
          git commit -m '구조정리: 서비스페이지 런타임 보정 정적 HTML 반영'
          git push
