name: Fix latest case badge size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'FIX_LATEST_CASE_BADGE_SIZE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch badge style and cache refs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js=Path('assets/latest-posts.js')
          s=js.read_text(encoding='utf-8')
          old=".dg-latest-thumb{position:relative}.dg-case-overlay-badge{position:absolute;top:10px;right:10px;z-index:3;display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:4px 10px;border-radius:999px;background:#35a9e1;color:#fff;font-size:12px;font-weight:900;line-height:1;box-shadow:0 4px 12px rgba(18,132,186,.22)}@media(max-width:700px){.dg-case-overlay-badge{top:9px;right:9px;min-height:26px;padding:4px 9px;font-size:11.5px}}"
          new=".dg-latest-thumb{position:relative}.dg-case-overlay-badge{position:absolute;top:9px;right:9px;z-index:3;display:inline-flex;align-items:center;justify-content:center;min-height:24px;padding:3px 8px;border-radius:999px;background:#35a9e1;color:#fff;font-size:10px;font-weight:900;line-height:1;box-shadow:0 3px 9px rgba(18,132,186,.18);pointer-events:none}@media(max-width:700px){.dg-case-overlay-badge{top:7px;right:7px;min-height:22px;padding:3px 7px;font-size:9px}}"
          if old not in s:
              raise SystemExit('target style not found')
          js.write_text(s.replace(old,new,1),encoding='utf-8')

          pages=['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          for name in pages:
              p=Path(name)
              if not p.exists():
                  continue
              t=p.read_text(encoding='utf-8')
              t,n=re.subn(r'/assets/latest-posts\.js\?v=[^"\']+', '/assets/latest-posts.js?v=20260911-0016', t, count=1)
              if n:
                  p.write_text(t,encoding='utf-8')

          Path('.github/workflows/fix-latest-case-badge-size.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-posts.js index.html inheritance.html renunciation.html corporate.html realestate.html family.html .github/workflows/fix-latest-case-badge-size.yml
          git commit -m "최신글 처리사례 배지 크기와 위치 통일 [skip ci]"
          git push
