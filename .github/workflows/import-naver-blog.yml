name: Import Naver Blog Posts

on:
  push:
    paths:
      - 'scripts/import_naver_blog_clean.py'
      - '.github/workflows/import-naver-blog.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-naver-blog-main
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow
      - name: Sync main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
      - name: Import and repair
        run: timeout 300s python -u scripts/import_naver_blog_clean.py
      - name: Validate repaired and imported bodies
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from bs4 import BeautifulSoup
          posts=json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
          checked=0
          bad=[]
          for p in posts:
              if p.get('source')!='naver-blog':
                  continue
              slug=(p.get('slug') or '').replace('.html','')
              f=Path('posts')/(slug+'.html')
              if not f.exists():
                  bad.append(slug+':missing')
                  continue
              soup=BeautifulSoup(f.read_text(encoding='utf-8',errors='ignore'),'html.parser')
              body=soup.select_one('.article-body')
              if body is None:
                  bad.append(slug+':no-body')
                  continue
              text=re.sub(r'\s+','',' '.join(body.stripped_strings))
              if len(text)<500:
                  bad.append(f'{slug}:short-{len(text)}')
                  continue
              checked+=1
          print('BODY_VALIDATED',checked,'BAD',len(bad))
          if bad:
              print('BODY_BAD_LIST',','.join(bad))
              raise SystemExit(1)
          PY
      - name: Postprocess
        run: |
          timeout 90s python -u scripts/strip_naver_emojis.py
          timeout 90s python -u scripts/patch_naver_import_dates.py
          timeout 90s python -u scripts/site_maintenance.py
          timeout 90s python -u scripts/inject_internal_links.py
          timeout 90s python -u scripts/cleanup_naver_rendering.py
          timeout 90s python -u scripts/optimize_naver_keywords.py
          timeout 150s python -u scripts/generate_thumbnails.py
          timeout 90s python -u scripts/fix_thumbnail_logo.py
          timeout 90s python -u scripts/apply_latest_cards.py
          timeout 90s python -u scripts/generate_sitemap.py
          timeout 120s node scripts/seo-auto.mjs
          timeout 60s node scripts/seo-canonical-fix.mjs
          timeout 60s node scripts/rss-auto.mjs
      - name: Validate site
        run: |
          python -m py_compile scripts/import_naver_blog_clean.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then echo "No changes"; exit 0; fi
          git add data/posts.json data/seo-report.json posts posts.html assets/posts assets/naver-images index.html inheritance.html renunciation.html corporate.html realestate.html family.html sitemap.xml rss.xml admin.html
          git commit -m "네이버 자동수집 본문복구 및 SEO 자동반영"
          git push origin HEAD:main
