name: Import Naver Blog Posts

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-naver-blog-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install importer and thumbnail dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow

      - name: Import Naver posts, repair body and publish
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

          python scripts/import_naver_blog.py
          # SmartEditor 실제 본문 구조를 다시 읽어 본문 누락과 잘못된 카테고리를 교정
          python scripts/repair_naver_posts.py
          # 네이버 원문 게시일이 아니라 등기로 홈페이지에 실제 수집·작성된 날짜를 최초 1회 고정
          python scripts/patch_naver_import_dates.py

          python scripts/patch_admin_seo.py
          python scripts/patch_admin_category.py
          python scripts/site_maintenance.py
          python scripts/generate_thumbnails.py
          python scripts/fix_thumbnail_logo.py
          # 내부 대표 썸네일은 개별글 제목 아래에 유지
          python scripts/site_maintenance.py
          python scripts/apply_latest_cards.py

          python -m py_compile \
            scripts/import_naver_blog.py \
            scripts/repair_naver_posts.py \
            scripts/patch_naver_import_dates.py \
            scripts/patch_admin_seo.py \
            scripts/patch_admin_category.py \
            scripts/site_maintenance.py \
            scripts/generate_thumbnails.py \
            scripts/fix_thumbnail_logo.py \
            scripts/apply_latest_cards.py

          python - <<'PY'
          import json
          from pathlib import Path
          posts=json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
          missing=[]
          for p in posts:
              slug=(p.get('slug') or '').replace('.html','')
              thumb=(p.get('thumbnail') or '').strip()
              if not thumb:
                  missing.append(slug+': empty thumbnail')
              elif not Path(thumb.lstrip('/')).exists():
                  missing.append(thumb)
          if missing:
              raise SystemExit('Missing thumbnails: '+', '.join(missing[:20]))
          print('validated',len(posts),'posts with thumbnails')
          PY

          git diff --check
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "No Naver or generated changes"
            exit 0
          fi

          git add admin.html data/posts.json posts posts.html assets/posts assets/naver-images index.html inheritance.html renunciation.html corporate.html realestate.html family.html
          git commit -m "네이버 본문·분류·작성일·썸네일 자동반영"
          git push origin HEAD:main
