name: Import Naver Blog Posts

on:
  push:
    paths:
      - 'scripts/import_naver_blog.py'
      - 'scripts/refresh_naver_format.py'
      - '.github/workflows/import-naver-blog.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-naver-blog-main
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml pillow
      - name: Sync main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
      - name: Import posts missing from website
        run: timeout 420s python -u scripts/import_naver_blog.py
      - name: Preserve Naver body formatting
        run: timeout 420s python -u scripts/refresh_naver_format.py
      - name: Safe postprocess
        run: |
          timeout 90s python -u scripts/patch_naver_import_dates.py
          timeout 90s python -u scripts/site_maintenance.py
          timeout 90s python -u scripts/inject_internal_links.py
          timeout 150s python -u scripts/generate_thumbnails.py
          timeout 90s python -u scripts/fix_thumbnail_logo.py
          timeout 90s python -u scripts/apply_latest_cards.py
          timeout 90s python -u scripts/generate_sitemap.py
          timeout 120s node scripts/seo-auto.mjs
          timeout 60s node scripts/seo-canonical-fix.mjs
          timeout 60s node scripts/rss-auto.mjs
      - name: Final body quality gate
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path('.')
          posts=json.loads((root/'data/posts.json').read_text(encoding='utf-8'))
          marks=('êµ','ë“','ë¡','ì§','ì—','ì›','ë¹','ê³','ë°','ì„','ìƒ','ìž','í•','ì‹','ìš','ìœ','ì•','ë¶','ì¶','ì ','ì²')
          bad=[]; checked=0
          for p in posts:
              if p.get('source')!='naver-blog': continue
              checked+=1; slug=str(p.get('slug','')).replace('.html',''); path=root/'posts'/f'{slug}.html'
              if not path.exists(): bad.append(f'{slug}:missing'); continue
              soup=BeautifulSoup(path.read_text(encoding='utf-8',errors='replace'),'html.parser'); body=soup.select_one('.article-body')
              text=' '.join(body.stripped_strings) if body else ''; chars=len(re.sub(r'\s+','',text)); moji=sum(text.count(x) for x in marks)
              if chars<500 or moji: bad.append(f'{slug}:chars={chars}:mojibake={moji}')
          print('POSTPROCESS_QUALITY',checked,'BAD',len(bad))
          if bad:
              print('POSTPROCESS_BAD_LIST',','.join(bad)); raise SystemExit(1)
          PY
          python -m py_compile scripts/import_naver_blog.py scripts/refresh_naver_format.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then echo "No changes"; exit 0; fi
          git add data/posts.json data/seo-report.json posts posts.html assets/posts assets/naver-images index.html inheritance.html renunciation.html corporate.html realestate.html family.html sitemap.xml rss.xml admin.html
          git commit -m "네이버 블로그 미수집 글 자동 반영"
          git push origin HEAD:main
