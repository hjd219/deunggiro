name: Full static audit once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-static-audit-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install validators
        run: python3 -m pip install --quiet beautifulsoup4 tinycss2 pyyaml
      - name: Validate repository files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import json, py_compile, sys
          import yaml
          import tinycss2
          from bs4 import BeautifulSoup

          root = Path('.').resolve()
          errors = []
          counts = {'html':0,'css':0,'js':0,'json':0,'yaml':0,'py':0}

          def rel(p):
              return str(p.resolve().relative_to(root)).replace('\\','/')

          files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]

          for p in files:
              ext = p.suffix.lower()
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              if ext == '.json':
                  counts['json'] += 1
                  try: json.loads(text)
                  except Exception as e: errors.append(f'JSON {rel(p)}: {e}')

              elif ext in ('.yml','.yaml'):
                  counts['yaml'] += 1
                  try: yaml.safe_load(text)
                  except Exception as e: errors.append(f'YAML {rel(p)}: {e}')

              elif ext == '.py':
                  counts['py'] += 1
                  try: py_compile.compile(str(p), doraise=True)
                  except Exception as e: errors.append(f'PY {rel(p)}: {e}')

              elif ext == '.css':
                  counts['css'] += 1
                  try:
                      rules = tinycss2.parse_stylesheet(text, skip_comments=False, skip_whitespace=False)
                      for token in rules:
                          if getattr(token, 'type', None) == 'error':
                              errors.append(f'CSS {rel(p)} line {getattr(token,"source_line","?")}: {token.message}')
                  except Exception as e: errors.append(f'CSS {rel(p)}: {e}')

              elif ext == '.html':
                  counts['html'] += 1
                  try:
                      soup = BeautifulSoup(text, 'html.parser')
                  except Exception as e:
                      errors.append(f'HTML {rel(p)} parse: {e}')
                      continue

                  seen = set()
                  for tag in soup.find_all(attrs={'id': True}):
                      ident = tag.get('id')
                      if ident in seen:
                          errors.append(f'HTML {rel(p)} duplicate id: {ident}')
                      seen.add(ident)

                  for tag, attr in [('a','href'),('link','href'),('script','src'),('img','src'),('source','src')]:
                      for node in soup.find_all(tag):
                          v = node.get(attr)
                          if not v or v.startswith(('#','http://','https://','//','mailto:','tel:','javascript:','data:')):
                              continue
                          path = unquote(urlsplit(v).path)
                          if not path:
                              continue
                          target = (root / path.lstrip('/')) if path.startswith('/') else (p.parent / path)
                          if path.endswith('/'):
                              target = target / 'index.html'
                          if not target.exists():
                              errors.append(f'LINK {rel(p)} -> {v} (missing {rel(target) if target.is_absolute() and str(target).startswith(str(root)) else target})')

          print('COUNTS', counts)
          if errors:
              print(f'ERROR_COUNT {len(errors)}')
              for e in errors:
                  print(e)
              sys.exit(1)
          print('STATIC_AUDIT_OK')
          PY

          while IFS= read -r -d '' f; do
            node --check "$f" >/dev/null
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0)

          echo 'NODE_CHECK_OK'
          git status --short
