name: Update posts intro
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'UPDATE_POSTS_INTRO')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Update intro text
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('posts.html')
          s=p.read_text(encoding='utf-8')
          old='<p class="desc">상속·법인·부동산등기 관련 실무 정보를 정리합니다.</p>'
          new='<p class="desc">인천 상속등기·상속포기·한정승인·법인등기·부동산등기의 실제 처리사례와 실무정보를 안내합니다.</p>'
          if old not in s:
              raise SystemExit('target intro not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/update-posts-intro.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.html .github/workflows/update-posts-intro.yml
          git commit -m "법률정보 상단 설명문 SEO 문구 보강 [skip ci]"
          git push origin HEAD:main
