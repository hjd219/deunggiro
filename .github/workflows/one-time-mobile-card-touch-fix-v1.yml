name: One-time mobile card touch fix v1
on:
  push:
    paths:
      - '.github/workflows/one-time-mobile-card-touch-fix-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile touch states
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* MOBILE_SERVICE_CARD_TOUCH_FIX_V1 */'
          if marker not in s:
            css='''\n<style>\n/* MOBILE_SERVICE_CARD_TOUCH_FIX_V1 */\n@media(max-width:800px){\n .quick-item.quick-rich:hover,.quick-item.quick-rich:active,.quick-item.quick-rich:focus,.quick-item.quick-rich:focus-visible{\n   background:linear-gradient(110deg,var(--qbg),#fff 76%)!important;\n   color:#20242b!important;\n   transform:none!important;\n }\n .quick-item.quick-rich:hover h3,.quick-item.quick-rich:active h3,.quick-item.quick-rich:focus h3,.quick-item.quick-rich:focus-visible h3{color:#20242b!important;opacity:1!important}\n .quick-item.quick-rich:hover p,.quick-item.quick-rich:active p,.quick-item.quick-rich:focus p{color:#737c85!important;opacity:1!important}\n .quick-item.quick-rich:hover strong,.quick-item.quick-rich:active strong,.quick-item.quick-rich:focus strong,\n .quick-item.quick-rich:hover .go,.quick-item.quick-rich:active .go,.quick-item.quick-rich:focus .go{color:var(--qc)!important;opacity:1!important}\n .quick-item.quick-rich{-webkit-tap-highlight-color:rgba(54,169,225,.10)}\n}\n</style>\n'''
            s=s.replace('</head>',css+'\n</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep mobile service card titles visible on touch'
          git push origin main