name: Fix all current site errors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-all-errors.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, subprocess, sys

          cssp=Path('assets/article-v2.css')
          css=cssp.read_text(encoding='utf-8')
          css=css.replace('body.article-v2 .article-body img,body.article-v2 .article-body video{display:block;max-width:100%!important;height:auto!important;border-radius:10px;margin-left:auto;margin-right:auto}',
                          'body.article-v2 .article-body img,body.article-v2 .article-body video{display:block;max-width:100%!important;height:auto!important;border-radius:10px;margin-left:0!important;margin-right:auto!important}')
          cssp.write_text(css,encoding='utf-8')

          jsp=Path('assets/article-v2.js')
          js=jsp.read_text(encoding='utf-8')
          js=js.replace('margin:18px auto!important','margin:18px 0!important')
          old="const category=categoryOf(current.category),same=posts.filter(p=>categoryOf(p.category)===category);"
          new="const category=categoryOf(current.category),same=posts.filter(p=>categoryOf(p.category)===category).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));"
          if old in js: js=js.replace(old,new)
          jsp.write_text(js,encoding='utf-8')

          ap=Path('admin.html')
          admin=ap.read_text(encoding='utf-8')
          old="""const clean=list.filter(x=>String(x.slug||'').replace(/\\.html$/i,'')!==p.slug);\n      clean.unshift({...p});\n      return clean;"""
          new="""const originalIndex=list.findIndex(x=>String(x.slug||'').replace(/\\.html$/i,'')===p.slug);\n      const clean=list.filter(x=>String(x.slug||'').replace(/\\.html$/i,'')!==p.slug);\n      if(isEdit&&originalIndex>=0) clean.splice(Math.min(originalIndex,clean.length),0,{...p});\n      else clean.unshift({...p});\n      clean.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));\n      return clean;"""
          if old in admin:
              admin=admin.replace(old,new,1)
          elif 'const originalIndex=list.findIndex' not in admin:
              raise SystemExit('admin publishing block not found')
          ap.write_text(admin,encoding='utf-8')

          sp=Path('scripts/sync-seo.py')
          sync=sp.read_text(encoding='utf-8')
          if 'posts = sorted(load_posts()' not in sync:
              sync=sync.replace('    posts = load_posts()\n    sync_posts_html(posts)',
                                '    posts = sorted(load_posts(), key=lambda p: str(p.get("date", "")), reverse=True)\n    sync_posts_html(posts)')
          sp.write_text(sync,encoding='utf-8')

          subprocess.run([sys.executable,'scripts/sync-seo.py'],check=True)
          subprocess.run([sys.executable,'scripts/apply-site-shell.py'],check=True)
          subprocess.run([sys.executable,'scripts/apply-article-v2.py'],check=True)

          posts=json.loads(Path('data/posts.json').read_text(encoding='utf-8-sig'))
          slugs=[str(x.get('slug','')).removesuffix('.html') for x in posts if x.get('slug')]
          post_files={p.stem for p in Path('posts').glob('*.html')}
          missing=[s for s in slugs if s not in post_files]
          if missing: raise SystemExit('Missing post HTML: '+', '.join(missing))
          ph=Path('posts.html').read_text(encoding='utf-8')
          static=set(re.findall(r'href="/posts/([^"/?#]+)\.html"',ph))
          miss_static=[s for s in slugs if s not in static]
          if miss_static: raise SystemExit('posts.html static links missing: '+', '.join(miss_static))
          sm=Path('sitemap.xml').read_text(encoding='utf-8')
          miss_sm=[s for s in slugs if f'/posts/{s}.html' not in sm]
          if miss_sm: raise SystemExit('sitemap missing: '+', '.join(miss_sm))
          if 'margin-left:auto;margin-right:auto' in Path('assets/article-v2.css').read_text(encoding='utf-8'):
              raise SystemExit('center image rule still present in article-v2.css')
          if 'margin:18px auto!important' in Path('assets/article-v2.js').read_text(encoding='utf-8'):
              raise SystemExit('legacy centered image override still present')
          if 'new URLSearchParams(location.search)' not in ph:
              raise SystemExit('category query filter missing from posts.html')
          if 'const originalIndex=list.findIndex' not in ap.read_text(encoding='utf-8'):
              raise SystemExit('admin edit-order repair missing')
          for f in ['assets/article-v2.js','assets/site-shell.js']:
              subprocess.run(['node','--check',f],check=True)
          print('ALL FIXES AND CHECKS PASSED')
          PY
      - name: Commit repaired site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html assets/article-v2.css assets/article-v2.js scripts/sync-seo.py posts.html sitemap.xml scripts/apply-site-shell.py scripts/apply-article-v2.py 'posts/*.html'
          git diff --cached --quiet || git commit -m "Fix publishing order, article images and SEO sync"
          git push
