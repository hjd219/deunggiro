name: SEO Summary Upgrade Once
on:
  push:
    paths:
      - '.github/workflows/seo-summary-upgrade-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install
        run: pip install beautifulsoup4
      - name: Upgrade SEO summaries
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from bs4 import BeautifulSoup
          root=Path('.')
          cp=root/'scripts/import_naver_blog_clean.py'; ip=root/'scripts/import_naver_blog.py'
          clean=cp.read_text(encoding='utf-8')
          old="SUMMARY_TEXT='진행 전 꼭 확인해야 할 핵심 내용과 주의사항'"
          helper="def seo_summary(title):\n t=clean_text(title); t=re.sub(r'^\\s*\\[[^\\]]+\\]\\s*','',t).strip('“”\\\" '); t=re.sub(r'\\s*총정리\\s*',' ',t).strip()\n parts=[x.strip() for x in re.split(r'\\s*[|｜]\\s*',t,1) if x.strip()]; head=parts[0] if parts else t; detail=parts[1] if len(parts)>1 else ''\n head=re.sub(r'\\s*(?:어떻게 해야 (?:되나요|하나요)|어떻게 되나요|가능할까|얼마나 나올까|해야 할까)\\??\\s*$','',head).strip()\n base=head + (('｜'+detail) if detail else '')\n cat=category(title); defaults={'상속등기':['상속등기','절차','필요서류','주의사항'],'상속포기·한정승인':['상속포기·한정승인','절차','대응방법','주의사항'],'법인등기':['법인등기','절차','필요서류','비용'],'부동산등기':['부동산등기','취득세','필요서류','주의사항'],'가사':['가사절차','필요서류','주의사항']}.get(cat,['절차','필요서류','주의사항'])\n extras=[x for x in defaults if x not in base]; out=base + (('｜'+'·'.join(extras)) if extras else '')\n return out[:120].rstrip('·|｜ ')\n"
          if old not in clean: raise SystemExit('summary constant missing')
          clean=clean.replace(old,helper,1)
          a=clean.index('def sync_summaries(posts):'); b=clean.index('def build(p,body):',a)
          sync="def sync_summaries(posts):\n changed=0\n for p in posts:\n  if p.get('source')!='naver-blog': continue\n  target=seo_summary(p.get('title') or '')\n  if p.get('summary')!=target: p['summary']=target; changed+=1\n  slug=(p.get('slug') or '').replace('.html',''); path=POSTS_DIR/f'{slug}.html'\n  if not path.exists(): continue\n  soup=BeautifulSoup(path.read_text(encoding='utf-8',errors='replace'),'html.parser'); touched=False\n  for selector in ('meta[name=\\\"description\\\"]','meta[name=\\\"dg-summary\\\"]'):\n   node=soup.select_one(selector)\n   if node and node.get('content')!=target: node['content']=target; touched=True\n  desc=soup.select_one('p.desc')\n  if desc and desc.get_text(strip=True)!=target: desc.string=target; touched=True\n  if touched: path.write_text(str(soup),encoding='utf-8')\n print('SUMMARY_SYNC',changed)\n"
          clean=clean[:a]+sync+clean[b:]
          clean=clean.replace("p['summary']=SUMMARY_TEXT","p['summary']=seo_summary(p.get('title') or '')").replace('sm=SUMMARY_TEXT;','sm=seo_summary(title);')
          if 'SUMMARY_TEXT' in clean: raise SystemExit('old summary reference remains')
          cp.write_text(clean,encoding='utf-8')
          imp=ip.read_text(encoding='utf-8')
          if 'summary = core.SUMMARY_TEXT' not in imp: raise SystemExit('import summary reference missing')
          ip.write_text(imp.replace('summary = core.SUMMARY_TEXT','summary = core.seo_summary(title)',1),encoding='utf-8')
          def make_summary(title,cat):
              t=re.sub(r'\s+',' ',title or '').strip(); t=re.sub(r'^\s*\[[^\]]+\]\s*','',t).strip('“”" '); t=re.sub(r'\s*총정리\s*',' ',t).strip()
              parts=[x.strip() for x in re.split(r'\s*[|｜]\s*',t,1) if x.strip()]; head=parts[0] if parts else t; detail=parts[1] if len(parts)>1 else ''
              head=re.sub(r'\s*(?:어떻게 해야 (?:되나요|하나요)|어떻게 되나요|가능할까|얼마나 나올까|해야 할까)\??\s*$','',head).strip(); base=head+(('｜'+detail) if detail else '')
              defaults={'상속등기':['상속등기','절차','필요서류','주의사항'],'상속포기·한정승인':['상속포기·한정승인','절차','대응방법','주의사항'],'법인등기':['법인등기','절차','필요서류','비용'],'부동산등기':['부동산등기','취득세','필요서류','주의사항'],'가사':['가사절차','필요서류','주의사항']}.get(cat,['절차','필요서류','주의사항'])
              extras=[x for x in defaults if x not in base]; return (base+(('｜'+'·'.join(extras)) if extras else ''))[:120].rstrip('·|｜ ')
          pp=root/'data/posts.json'; posts=json.loads(pp.read_text(encoding='utf-8')); dc=hc=0
          for p in posts:
              if p.get('source')!='naver-blog': continue
              target=make_summary(p.get('title',''),p.get('category',''))
              if p.get('summary')!=target: p['summary']=target; dc+=1
              path=root/'posts'/f"{str(p.get('slug','')).replace('.html','')}.html"
              if not path.exists(): continue
              soup=BeautifulSoup(path.read_text(encoding='utf-8',errors='replace'),'html.parser'); touched=False
              for sel in ('meta[name="description"]','meta[name="dg-summary"]'):
                  n=soup.select_one(sel)
                  if n and n.get('content')!=target: n['content']=target; touched=True
              d=soup.select_one('p.desc')
              if d and d.get_text(strip=True)!=target: d.string=target; touched=True
              if touched: path.write_text(str(soup),encoding='utf-8'); hc+=1
          pp.write_text(json.dumps(posts,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print('UPDATED',dc,hc)
          PY
      - name: Validate and commit
        run: |
          python -m py_compile scripts/import_naver_blog.py scripts/import_naver_blog_clean.py
          git diff --check
          rm -f .github/workflows/seo-summary-upgrade-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import_naver_blog.py scripts/import_naver_blog_clean.py data/posts.json posts .github/workflows/seo-summary-upgrade-once.yml
          git commit -m "자동수집 글 SEO 요약문 강화"
          git push origin HEAD:main
