name: Remove inheritance duplicate bottom link hub
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'REMOVE_INHERITANCE_BOTTOM_LINKHUB')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Remove only duplicate bottom inheritance link hub
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('inheritance.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\n?<!-- INHERITANCE_INTERNAL_LINK_HUB_V1 -->\s*<section class="section white dg-inheritance-linkhub".*?</section>\s*<style>\s*\.dg-inheritance-linkhub\{.*?</style>\s*'
          new, n = re.subn(pattern, '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected exactly one bottom link hub, found {n}')
          p.write_text(new, encoding='utf-8')
          PY
          rm -f .github/workflows/remove-inheritance-bottom-linkhub.yml .remove-inheritance-bottom-linkhub-trigger
      - name: Verify scope
        run: |
          if grep -q 'INHERITANCE_INTERNAL_LINK_HUB_V1' inheritance.html; then exit 1; fi
          git diff -- inheritance.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html .github/workflows/remove-inheritance-bottom-linkhub.yml .remove-inheritance-bottom-linkhub-trigger
          git commit -m "상속등기 하단 중복 세부안내만 제거 [skip ci]"
          git push origin HEAD:main