name: Service copy bottom align fix once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/service-copy-bottom-align-fix-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/home.css')
          s=p.read_text(encoding='utf-8')
          old='.quick-copy{position:static;z-index:1;min-width:0;padding-right:7px}'
          new='.quick-copy{position:static;z-index:1;min-width:0;padding-right:7px;align-self:end}'
          if s.count(old)!=1: raise SystemExit(f'copy count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='home.css?v=20260913-service-bottom-align'
          new='home.css?v=20260913-service-bottom-align2'
          if s.count(old)!=1: raise SystemExit(f'link count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = $'assets/home.css\nindex.html'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/service-copy-bottom-align-fix-once.yml
          git add assets/home.css index.html
          git commit -m '업무카드 5개 설명글 하단 기준 보정'
          git pull --rebase origin main
          git push origin HEAD:main
