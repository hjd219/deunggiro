name: Update trust contact copy once
on:
  push:
    paths:
      - '.github/workflows/update-trust-contact-copy-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update shared and static contact copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          title='복잡한 등기절차, 현재두 법무사가 직접 상담!'
          desc='상담부터 등기 완료까지, 직접 확인합니다.'
          pages=['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html','posts.html']
          changed=[]
          for name in pages:
              p=Path(name); s=p.read_text(encoding='utf-8'); old=s
              def repl(m):
                  b=m.group(0)
                  b=re.sub(r'<h2>.*?</h2>',f'<h2>{title}</h2>',b,count=1,flags=re.S)
                  b=re.sub(r'<p>.*?</p>',f'<p>{desc}</p>',b,count=1,flags=re.S)
                  return b
              s=re.sub(r'<section\s+class=["\']contact["\'][^>]*>.*?</section>',repl,s,flags=re.S|re.I)
              if s!=old:
                  p.write_text(s,encoding='utf-8'); changed.append(name)
          p=Path('assets/site-footer.js'); s=p.read_text(encoding='utf-8'); old=s
          s=re.sub(r"const genericContact=\{.*?\};\n  const contactByPath=\{.*?\n  \};\n  const contactInfo=contactByPath\[current\]\|\|genericContact;",
                   "const genericContact={title:'복잡한 등기절차, 현재두 법무사가 직접 상담!',desc:'상담부터 등기 완료까지, 직접 확인합니다.'};\n  const contactInfo=genericContact;",s,flags=re.S)
          if s==old: raise SystemExit('site-footer.js expected contact copy block not found')
          p.write_text(s,encoding='utf-8'); changed.append(str(p))
          print('CHANGED',len(changed),*changed,sep='\n')
          PY
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          title='복잡한 등기절차, 현재두 법무사가 직접 상담!'; desc='상담부터 등기 완료까지, 직접 확인합니다.'
          for name in ['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html','posts.html']:
              s=Path(name).read_text(encoding='utf-8')
              blocks=re.findall(r'<section\s+class=["\']contact["\'][^>]*>.*?</section>',s,re.S|re.I)
              if not blocks or title not in blocks[0] or desc not in blocks[0]: raise SystemExit('verify failed '+name)
          sf=Path('assets/site-footer.js').read_text(encoding='utf-8')
          if title not in sf or desc not in sf or 'contactByPath' in sf: raise SystemExit('shared footer verify failed')
          print('VERIFY_OK')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html inheritance.html renunciation.html corporate.html realestate.html family.html posts.html assets/site-footer.js
          git commit -m '상담영역 직접상담 신뢰문구 통일'
          git push origin main
      - name: Remove one-time workflow
        run: |
          git pull --rebase origin main
          git rm .github/workflows/update-trust-contact-copy-once.yml
          git commit -m '일회성 상담문구 작업 정리'
          git push origin main
