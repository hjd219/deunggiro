name: CSS maintenance once

on:
  push:
    paths:
      - 'maintenance/run-css-migration.flag'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run exact CSS migration
        run: node scripts/migrate-home-css-once.mjs
      - name: Verify scope
        run: |
          git diff --exit-code --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'assets/home.css\nassets/site-shell.css'
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/home.css assets/site-shell.css
          git commit -m "홈 전용 CSS를 home.css로 이전"
          git pull --rebase origin main
          git push origin HEAD:main
