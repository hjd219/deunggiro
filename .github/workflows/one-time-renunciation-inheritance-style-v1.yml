name: One-time renunciation inheritance style v1
on:
  push:
    paths:
      - '.github/workflows/one-time-renunciation-inheritance-style-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/one_time_renunciation_inheritance_style_v1.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renunciation.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Redesign renunciation page in inheritance style"
          git pull --rebase origin main
          git push origin main
