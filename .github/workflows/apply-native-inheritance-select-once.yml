name: Apply native inheritance select once
on:
  push:
    branches: [main]
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY_NATIVE_INHERITANCE_SELECT')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Link native detail select script to inheritance detail pages
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
            'inheritance-missing-heir.html',
            'inheritance-overseas-heir.html',
            'inheritance-minor-heir.html',
            'inheritance-substitute-succession.html',
            'inheritance-division.html',
          ]
          tag='<script src="/assets/inheritance-detail-native-select.js?v=1" defer></script>'
          for name in paths:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'inheritance-detail-native-select.js' not in s:
                  s=s.replace('</body>',tag+'</body>')
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/apply-native-inheritance-select-once.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "상속등기 세부페이지 네이티브 선택메뉴 연결"
          git pull --rebase origin main
          git push origin main
