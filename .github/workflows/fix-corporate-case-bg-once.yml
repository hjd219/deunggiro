name: Fix Corporate Case Background Once
on:
  push:
    paths:
      - '.github/workflows/fix-corporate-case-bg-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact background fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('corporate.html')
          s=p.read_text(encoding='utf-8')
          old='.dg-corporate-casehub{padding-top:48px!important;padding-bottom:48px!important;background:#eef6fb!important}'
          new='.section.white.dg-corporate-casehub{padding-top:48px!important;padding-bottom:48px!important;background:var(--detail-sky,#eef6fb)!important}'
          if s.count(old)!=1:
              raise SystemExit(f'expected 1 target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify and push
        run: |
          set -e
          git diff --check
          git diff -- corporate.html
          test "$(git diff --name-only | tr -d '\r')" = "corporate.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corporate.html
          git commit -m "법인 처리사례 배경색 통일"
          git push origin HEAD:main
