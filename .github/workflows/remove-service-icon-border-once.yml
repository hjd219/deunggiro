name: Remove service icon border once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-service-icon-border-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch exact quick-icon rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/home.css')
          s = p.read_text(encoding='utf-8')
          old = '.quick-icon{width:50px;height:50px;border-radius:14px;background:#fff;border:1px solid #dfe7ee;box-shadow:0 5px 14px rgba(31,41,55,.055);padding:8px;display:grid;place-items:center}'
          new = '.quick-icon{width:50px;height:50px;border-radius:14px;background:#fff;box-shadow:0 5px 14px rgba(31,41,55,.055);padding:8px;display:grid;place-items:center}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- assets/home.css
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-service-icon-border-once.yml
          git add assets/home.css
          git commit -m 'Remove service icon box border'
          git push origin HEAD:main
