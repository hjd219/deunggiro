name: Apply title rolling
on:
  push:
    paths:
      - '.github/workflows/apply-title-rolling.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add title rolling
        env:
          ROLLING_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          pages=['inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          marker='/* AUTO_TITLE_ROLLING_V1 */'
          script=base64.b64decode(os.environ['ROLLING_B64']).decode('utf-8')
          for f in pages:
              p=Path(f); t=p.read_text(encoding='utf-8')
              if marker not in t:
                  t=t.replace('</body>',script+'\n</body>',1)
                  p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff --cached --quiet || git commit -m "Roll related legal information titles automatically"
          git push
