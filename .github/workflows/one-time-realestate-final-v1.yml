name: One-time real estate final v1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-realestate-final-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch realestate page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('realestate.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section class="section white"><div class="container"><div class="label">MAIN SERVICES</div>')
          end=s.index('<section class="contact" id="contact">', start)
          css='''<style id="REALESTATE_FINAL_V1">
          .re-main{padding:42px 0 56px;background:#eef6fb}.re-box{background:#fff;border:1px solid #dfe7ee;border-radius:26px;padding:29px;box-shadow:0 7px 22px rgba(31,41,55,.04)}
          .re-intro{text-align:center}.re-intro h2{font-size:27px;margin:5px 0;letter-spacing:-1.2px;white-space:nowrap}.re-intro p{font-size:13px;color:#78858f;margin:0 0 21px}.re-home{width:66px;height:66px;border:1px solid #dfe7ee;border-radius:19px;background:#fff;box-shadow:0 5px 14px rgba(31,41,55,.055);margin:0 auto 11px;display:flex;align-items:center;justify-content:center}.re-home svg{width:41px}
          .re-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.re-tabs input{display:none}.re-tabs label{text-align:center;padding:17px 10px;border:1px solid #dfe7ee;background:#fff;border-radius:15px;font-size:15px;font-weight:900;cursor:pointer}.re-tabs label small{display:block;font-size:10px;color:#91a0aa;margin-bottom:5px}.re-answer{display:none;grid-column:1/-1;margin-top:20px;border:1px solid #cfe3ed;background:#f7fbfd;border-radius:24px;padding:27px;width:100%;box-shadow:0 8px 22px rgba(31,41,55,.035)}
          #re1:checked~label[for=re1],#re2:checked~label[for=re2],#re3:checked~label[for=re3],#re4:checked~label[for=re4]{background:#eaf7fd;border-color:#8fd0ec;color:#258fca}#re1:checked~#ra1,#re2:checked~#ra2,#re3:checked~#ra3,#re4:checked~#ra4{display:block}
          .re-answer-head{display:flex;justify-content:space-between;gap:15px;align-items:end;border-bottom:1px solid #dce9ef;padding-bottom:17px;margin-bottom:18px}.re-answer-head h3{font-size:25px;margin:2px 0;letter-spacing:-.7px}.re-answer-head p{font-size:12px;color:#72808a;margin:0}.re-badge{font-size:10px;font-weight:900;color:#258fca;background:#e8f7fd;padding:8px 10px;border-radius:999px;white-space:nowrap}
          .re-three{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(250px,.75fr);gap:18px}.re-info{background:#fff;border:1px solid #d5e4eb;border-radius:18px;padding:25px}.re-itop{display:flex;gap:10px;align-items:center;margin-bottom:11px}.re-ico{width:47px;height:47px;flex:0 0 47px;border:1px solid #dfe7ee;border-radius:14px;background:#fff;box-shadow:0 4px 12px rgba(31,41,55,.05);display:flex;align-items:center;justify-content:center}.re-ico svg{width:29px}.re-itop small{display:block;color:#36a9e1;font-size:9px;font-weight:900}.re-itop b{font-size:19px}.re-docs{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.re-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid #eef2f4;font-size:13px;line-height:1.55}.re-row b{min-width:78px;color:#263d4b}.re-row span{color:#596a75;word-break:keep-all}.re-note{margin-top:12px;padding:12px 14px;background:#f7fafc;border-radius:10px;font-size:12px;color:#687681}.re-big{font-size:18px;font-weight:900;color:#258fca;margin:8px 0}.re-info p{font-size:13px;color:#687681}.re-calc{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:15px 16px;border-radius:13px;background:#36a9e1;color:#fff!important;font-size:13px;font-weight:900}
          .re-bottom{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;margin-top:24px}.re-pre,.re-faq{background:#fff;border:1px solid #dfe7ee;border-radius:22px;padding:25px;box-shadow:0 6px 18px rgba(31,41,55,.035)}.re-pre h2,.re-faq h2{font-size:23px;margin:5px 0 18px}.re-check{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:14px 0;border-top:1px solid #edf2f5}.re-check:first-of-type{border-top:0}.re-num{width:42px;height:42px;border:1px solid #dfe7ee;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#36a9e1;font-size:11px;font-weight:900}.re-check b{font-size:14px}.re-check p{margin:4px 0 0;color:#687681;font-size:12px;line-height:1.55}.re-check strong,.re-faq details p strong{color:#258fca}.re-faq details{border-top:1px solid #e6edf1}.re-faq details:first-of-type{border-top:0}.re-faq summary{list-style:none;display:grid;grid-template-columns:34px 1fr 20px;gap:8px;align-items:center;padding:15px 0;cursor:pointer;font-size:13px;font-weight:900}.re-faq summary::-webkit-details-marker{display:none}.re-q{width:29px;height:29px;border-radius:50%;background:#e8f7fd;color:#258fca;display:flex;align-items:center;justify-content:center;font-size:11px}.re-plus{font-size:19px;color:#84939d}.re-faq details p{margin:-3px 0 15px 42px;color:#687681;font-size:12px;line-height:1.65}
          @media(max-width:700px){.re-main{padding:28px 0 44px}.re-box{padding:20px 14px}.re-intro h2{font-size:clamp(18px,5.2vw,23px);letter-spacing:-1.4px}.re-tabs{grid-template-columns:1fr 1fr}.re-answer{padding:19px 14px}.re-answer-head{align-items:flex-start;flex-direction:column}.re-three,.re-bottom,.re-docs{grid-template-columns:1fr}.re-pre,.re-faq{padding:20px 17px}.re-row b{min-width:72px}}
          </style>'''
          html='''<section class="re-main"><div class="container"><div class="re-box"><div class="re-intro"><div class="re-home"><svg viewBox="0 0 48 48" fill="none"><path d="M6 23 24 8l18 15v18H6V23Z" stroke="#36a9e1" stroke-width="2.7"/><path d="M17 41V28h14v13" stroke="#7b61d1" stroke-width="2.7"/><path d="m31 17 4 4 7-8" stroke="#28a98b" stroke-width="2.7"/></svg></div><div class="label">SELECT YOUR CASE</div><h2>어떤 이유로 부동산을 취득하셨나요?</h2><p>하나를 선택하면 준비해야 할 서류를 먼저 보여드립니다.</p></div><div class="re-tabs">
          <input id="re1" name="retype" type="radio" checked><input id="re2" name="retype" type="radio"><input id="re3" name="retype" type="radio"><input id="re4" name="retype" type="radio"><label for="re1"><small>01</small>매매</label><label for="re2"><small>02</small>증여</label><label for="re3"><small>03</small>상속</label><label for="re4"><small>04</small>이혼 재산분할</label>
          <div class="re-answer" id="ra1"><div class="re-answer-head"><div><div class="label">매매</div><h3>매매로 취득하는 경우</h3><p>매매등기에 필요한 서류를 먼저 확인하세요.</p></div><span class="re-badge">먼저 · 필요서류</span></div><div class="re-three"><div class="re-info"><div class="re-itop"><div class="re-ico">📄</div><div><small>01 DOCUMENTS</small><b>매매 필요서류</b></div></div><div class="re-docs"><div class="re-row"><b>매도인</b><span>등기필정보(권리증) · 인감증명서 · 인감도장 · 주민등록초본(주소변동 포함)</span></div><div class="re-row"><b>매수인</b><span>주민등록등본 또는 초본</span></div><div class="re-row"><b>공통</b><span>매매계약서</span></div><div class="re-row"><b>기타</b><span>거래신고필증 · 위임 관련 서류</span></div></div><div class="re-note">등기필정보를 분실한 경우 별도 확인절차가 필요할 수 있습니다.</div></div><div class="re-info"><div class="re-itop"><div class="re-ico">🏠</div><div><small>02 TAX</small><b>취득세 계산</b></div></div><div class="re-big">주택수·지역 확인</div><p>주택수, 지역, 취득가액 등에 따라 취득세가 달라질 수 있습니다.</p><a class="re-calc" href="/acquisition-calculator.html"><span>취득세 계산기 바로가기</span><span>→</span></a></div></div></div>
          <div class="re-answer" id="ra2"><div class="re-answer-head"><div><div class="label">증여</div><h3>증여로 취득하는 경우</h3><p>증여등기에 필요한 서류를 먼저 확인하세요.</p></div><span class="re-badge">먼저 · 필요서류</span></div><div class="re-three"><div class="re-info"><div class="re-itop"><div class="re-ico">📄</div><div><small>01 DOCUMENTS</small><b>증여 필요서류</b></div></div><div class="re-docs"><div class="re-row"><b>증여자</b><span>등기필정보(권리증) · 인감증명서 · 인감도장 · 주민등록초본(주소변동 포함)</span></div><div class="re-row"><b>수증자</b><span>주민등록등본 또는 초본</span></div><div class="re-row"><b>공통</b><span>증여계약서</span></div><div class="re-row"><b>기타</b><span>가족관계 확인서류 등</span></div></div><div class="re-note">부담부증여 등 채무를 함께 이전하는 경우 추가 확인자료가 필요할 수 있습니다.</div></div><div class="re-info"><div class="re-itop"><div class="re-ico">🏠</div><div><small>02 TAX</small><b>취득세 계산</b></div></div><div class="re-big">증여 취득세 확인</div><p>부동산 종류, 지역, 시가표준액 등에 따라 적용세율을 확인합니다.</p><a class="re-calc" href="/acquisition-calculator.html"><span>취득세 계산기 바로가기</span><span>→</span></a></div></div></div>
          <div class="re-answer" id="ra3"><div class="re-answer-head"><div><div class="label">상속</div><h3>상속으로 취득하는 경우</h3><p>상속관계에 맞는 필요서류를 먼저 확인하세요.</p></div><span class="re-badge">먼저 · 필요서류</span></div><div class="re-three"><div class="re-info"><div class="re-itop"><div class="re-ico">📄</div><div><small>01 DOCUMENTS</small><b>상속 필요서류</b></div></div><div class="re-docs"><div class="re-row"><b>피상속인</b><span>기본증명서(상세) · 가족관계증명서(상세) · 혼인관계증명서(상세) · 입양관계증명서(상세) · 친양자입양관계증명서(상세) · 말소자 주민등록초본</span></div><div class="re-row"><b>상속인</b><span>기본증명서(상세) · 가족관계증명서(상세) · 주민등록등본 또는 초본</span></div><div class="re-row"><b>협의분할</b><span>상속재산분할협의서 · 상속인 전원의 인감증명서 · 인감도장</span></div></div><div class="re-note">상속관계에 따라 제적등본 · 전제적등본 등 추가 가족관계서류가 필요할 수 있습니다.</div></div><div class="re-info"><div class="re-itop"><div class="re-ico">🏠</div><div><small>02 TAX</small><b>취득세 계산</b></div></div><div class="re-big">상속 취득세 확인</div><p>상속주택의 보유상황과 특례 적용 여부를 함께 확인합니다.</p><a class="re-calc" href="/acquisition-calculator.html"><span>취득세 계산기 바로가기</span><span>→</span></a></div></div></div>
          <div class="re-answer" id="ra4"><div class="re-answer-head"><div><div class="label">이혼 재산분할</div><h3>재산분할로 취득하는 경우</h3><p>재산분할 원인에 맞는 필요서류를 먼저 확인하세요.</p></div><span class="re-badge">먼저 · 필요서류</span></div><div class="re-three"><div class="re-info"><div class="re-itop"><div class="re-ico">📄</div><div><small>01 DOCUMENTS</small><b>재산분할 필요서류</b></div></div><div class="re-docs"><div class="re-row"><b>이전자</b><span>등기필정보(권리증) · 인감증명서 · 인감도장 · 주민등록초본(주소변동 포함)</span></div><div class="re-row"><b>취득자</b><span>주민등록등본 또는 초본</span></div><div class="re-row"><b>협의이혼</b><span>재산분할협의서 등 원인서류</span></div><div class="re-row"><b>재판이혼</b><span>판결문 · 조정조서 · 확정증명 등</span></div></div><div class="re-note">협의인지 재판인지에 따라 원인서류와 등기절차가 달라집니다.</div></div><div class="re-info"><div class="re-itop"><div class="re-ico">🏠</div><div><small>02 TAX</small><b>취득세 계산</b></div></div><div class="re-big">재산분할 취득세 확인</div><p>재산분할에 해당하는지와 취득세 적용기준을 확인합니다.</p><a class="re-calc" href="/acquisition-calculator.html"><span>취득세 계산기 바로가기</span><span>→</span></a></div></div></div>
          </div></div>
          <div class="re-bottom"><div class="re-pre"><div class="label">BEFORE REGISTRATION</div><h2>등기 전 꼭 확인하세요</h2><div class="re-check"><span class="re-num">01</span><div><b>등기권리증</b><p>등기필정보(권리증) 보유 여부를 확인하세요.</p></div></div><div class="re-check"><span class="re-num">02</span><div><b>인감증명서</b><p><strong>인터넷 발급본은 부동산등기에 사용할 수 없습니다.</strong></p></div></div><div class="re-check"><span class="re-num">03</span><div><b>인감도장</b><p>인감증명서의 인감과 실제 인감도장이 일치하는지 확인하세요.</p></div></div><div class="re-check"><span class="re-num">04</span><div><b>서류 유효기간</b><p>등기에 사용하는 일부 증명서류는 <strong>발행일로부터 3개월 이내</strong>인지 확인하세요.</p></div></div></div><div class="re-faq"><div class="label">FAQ</div><h2>자주 묻는 질문</h2><details><summary><span class="re-q">Q</span><span>등기권리증을 분실했는데 이전등기가 가능한가요?</span><span class="re-plus">+</span></summary><p><strong>가능합니다.</strong> 등기필정보가 없는 경우 <strong>별도의 본인확인 절차</strong>를 거쳐 진행할 수 있습니다.</p></details><details><summary><span class="re-q">Q</span><span>취득세는 신고하고 3개월 내 납부하면 되나요?</span><span class="re-plus">+</span></summary><p><strong>아닙니다.</strong> 소유권이전등기를 접수하려면 <strong>등기접수 전에 취득세를 신고·납부</strong>해야 하며, 납부 확인 후 등기신청을 진행합니다.</p></details><details><summary><span class="re-q">Q</span><span>가족 간 부동산 매매도 가능한가요?</span><span class="re-plus">+</span></summary><p><strong>가능합니다.</strong> 다만 <strong>실제 매매대금 지급 여부와 자금 흐름</strong> 등 거래의 실질을 확인하는 것이 중요합니다.</p></details><details><summary><span class="re-q">Q</span><span>증여와 매매 중 어떤 방식이 유리한가요?</span><span class="re-plus">+</span></summary><p><strong>취득세·증여세·양도소득세</strong>와 <strong>실제 대금 지급 여부</strong> 등에 따라 달라질 수 있어 개별 검토가 필요합니다.</p></details></div></div></div></section>'''
          s=s[:start]+css+html+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add realestate.html
          git commit -m 'Apply final real estate detail redesign' || exit 0
          git push
