name: Service icon white area once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/service-icon-whitearea-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply requested service card changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pairs={
            '<p>기한 · 절차 · 필요서류</p>':'<p>기한 · 절차 · 필요서류 · 청산</p>',
            '<p>매매 · 증여 · 이혼재산분할 · 담보</p>':'<p>매매 · 증여 · 재산분할 · 담보</p>',
            '/assets/home.css?v=20260913-service-card-copy-color':'/assets/home.css?v=20260913-service-icon-whitearea'
          }
          for old,new in pairs.items():
              if s.count(old)!=1:
                  raise SystemExit(f'index match failed: {old} count={s.count(old)}')
              s=s.replace(old,new,1)
          if '<p>이혼 · 개명 · 성본변경 · 후견</p>' not in s:
              raise SystemExit('family copy missing')
          p.write_text(s,encoding='utf-8')

          p=Path('assets/home.css')
          s=p.read_text(encoding='utf-8')
          old='.quick-icon{width:40px;height:40px;padding:0;display:grid;place-items:center;grid-column:1;grid-row:1;align-self:center}'
          new='.quick-icon{width:40px;height:40px;padding:4px;display:grid;place-items:center;grid-column:1;grid-row:1;align-self:center;background:#fff;border:1px solid rgba(32,36,43,.07);border-radius:10px;box-shadow:0 2px 8px rgba(31,41,55,.08)}'
          if s.count(old)!=1:
              raise SystemExit(f'home icon rule mismatch count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check -- index.html assets/home.css
          test "$(git diff --name-only | sort)" = $'assets/home.css\nindex.html'
      - name: Commit and clean workflow
        run: |
          rm .github/workflows/service-icon-whitearea-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/home.css .github/workflows/service-icon-whitearea-once.yml
          git commit -m '업무카드 아이콘 흰색 영역 적용'
          git pull --rebase origin main
          git push origin HEAD:main