name: Cleanup legacy mobile sticky CSS once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-mobile-sticky-legacy-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify legacy selectors are unused and remove CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path('inheritance.html'),
              Path('renunciation.html'),
              Path('corporate.html'),
              Path('realestate.html'),
              Path('family.html'),
          ]

          pattern = re.compile(r'<style>\s*/\* MOBILE_STICKY_MENU_V1 \*/.*?</style>\s*', re.S)
          legacy_tokens = [
              'class="header"',
              'class="header-inner"',
              'class="mobile-menu-btn"',
              'class="mobile-menu-panel"',
              'class="mobile-menu-grid"',
              'class="mobile-menu-close"',
              'mobile-menu-open',
          ]

          for path in pages:
              text = path.read_text(encoding='utf-8')
              matches = pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly 1 MOBILE_STICKY_MENU_V1 block, found {len(matches)}')

              # Check actual page markup/behavior outside CSS. Do not infer from selectors inside styles.
              nonstyle = re.sub(r'<style\b[^>]*>.*?</style>', '', text, flags=re.S|re.I)
              if 'class="dg-shell-header"' not in nonstyle or 'id="dg-shell-mobile-panel"' not in nonstyle:
                  raise SystemExit(f'{path}: current dg-shell header/mobile panel not found')
              if '/assets/site-shell.css' not in text:
                  raise SystemExit(f'{path}: site-shell.css not found')

              used = [token for token in legacy_tokens if token in nonstyle]
              if used:
                  raise SystemExit(f'{path}: legacy mobile menu markup still used: {used}')

              cleaned = pattern.sub('', text, count=1)
              if '/* MOBILE_STICKY_MENU_V1 */' in cleaned:
                  raise SystemExit(f'{path}: legacy marker still present after cleanup')
              if 'class="dg-shell-header"' not in cleaned or 'id="dg-shell-mobile-panel"' not in cleaned:
                  raise SystemExit(f'{path}: dg-shell markup changed unexpectedly')
              path.write_text(cleaned, encoding='utf-8')
          PY

          git diff --check -- inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff -- inheritance.html renunciation.html corporate.html realestate.html family.html

      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/cleanup-mobile-sticky-legacy-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html renunciation.html corporate.html realestate.html family.html .github/workflows/cleanup-mobile-sticky-legacy-once.yml
          git commit -m '구조정리: 상세페이지 레거시 모바일메뉴 CSS 제거'
          git push origin main
