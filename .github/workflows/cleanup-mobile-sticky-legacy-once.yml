name: Cleanup legacy mobile sticky code once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-mobile-sticky-legacy-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove obsolete legacy mobile menu CSS and JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path('inheritance.html'),
              Path('renunciation.html'),
              Path('corporate.html'),
              Path('realestate.html'),
              Path('family.html'),
          ]

          css_pattern = re.compile(r'<style>\s*/\* MOBILE_STICKY_MENU_V1 \*/.*?</style>\s*', re.S)
          js_pattern = re.compile(r'<script>\s*/\* MOBILE_STICKY_MENU_V1 \*/.*?</script>\s*', re.S)

          for path in pages:
              text = path.read_text(encoding='utf-8')

              if len(css_pattern.findall(text)) != 1:
                  raise SystemExit(f'{path}: expected exactly 1 legacy CSS block')
              if len(js_pattern.findall(text)) != 1:
                  raise SystemExit(f'{path}: expected exactly 1 legacy JS block')

              if 'class="dg-shell-header"' not in text or 'id="dg-shell-mobile-panel"' not in text:
                  raise SystemExit(f'{path}: current dg-shell header/mobile panel not found')
              if '/assets/site-shell.css' not in text or '/assets/site-shell.js' not in text:
                  raise SystemExit(f'{path}: current site-shell assets not found')

              cleaned = css_pattern.sub('', text, count=1)
              cleaned = js_pattern.sub('', cleaned, count=1)

              for token in [
                  'id="mobile-menu-btn"',
                  'id="mobile-menu-panel"',
                  'id="mobile-menu-close"',
                  'class="mobile-menu-btn"',
                  'class="mobile-menu-panel"',
                  'class="mobile-menu-grid"',
                  'class="mobile-menu-close"',
                  'mobile-menu-open',
                  '/* MOBILE_STICKY_MENU_V1 */',
              ]:
                  if token in cleaned:
                      raise SystemExit(f'{path}: legacy token remains after cleanup: {token}')

              if 'class="dg-shell-header"' not in cleaned or 'id="dg-shell-mobile-panel"' not in cleaned:
                  raise SystemExit(f'{path}: dg-shell markup changed unexpectedly')
              if '/assets/site-shell.css' not in cleaned or '/assets/site-shell.js' not in cleaned:
                  raise SystemExit(f'{path}: site-shell assets changed unexpectedly')

              path.write_text(cleaned, encoding='utf-8')
          PY

          git diff --check -- inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff -- inheritance.html renunciation.html corporate.html realestate.html family.html

      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/cleanup-mobile-sticky-legacy-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html renunciation.html corporate.html realestate.html family.html .github/workflows/cleanup-mobile-sticky-legacy-once.yml
          git commit -m '구조정리: 상세페이지 레거시 모바일메뉴 CSS JS 제거'
          git push origin main
