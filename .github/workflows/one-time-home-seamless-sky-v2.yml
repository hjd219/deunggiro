name: One-time home seamless sky v2
on:
  push:
    paths:
      - '.github/workflows/one-time-home-seamless-sky-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove section seams
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* HOME_SEAMLESS_SKY_V2 */'
          if marker not in s:
            css='''\n<style>\n/* HOME_SEAMLESS_SKY_V2 */\n:root{--home-seamless:#eef6fb}\n/* 히어로 하단부터 계산기까지 같은 배경색으로 이어 경계선을 없앰 */\n.hero{background:var(--home-seamless)!important}\n.hero::before,.hero::after{display:none!important}\n.hero-grid,.photo,.quick,.section.soft{background:var(--home-seamless)!important}\n.photo::after{background:linear-gradient(180deg,rgba(238,246,251,0),var(--home-seamless))!important}\n.quick{margin-top:0!important;padding-top:24px!important;padding-bottom:28px!important;border:0!important;box-shadow:none!important}\n.quick-grid{border:0!important;background:transparent!important;box-shadow:none!important}\n.section.soft{margin-top:0!important;padding-top:38px!important;border-top:0!important;box-shadow:none!important}\n/* 섹션 사이에 남는 흰 띠/선 제거 */\n.quick+.section,.quick+.section.soft{border-top:0!important;margin-top:0!important}\n@media(min-width:1001px){.quick{padding-top:18px!important}.section.soft{padding-top:34px!important}}\n</style>\n'''
            s=s.replace('</head>',css+'\n</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove visible seams between hero cards and calculator'
          git push origin main