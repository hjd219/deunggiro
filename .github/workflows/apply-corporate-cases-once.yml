name: Apply Corporate Cases Once

on:
  push:
    paths:
      - '.github/workflows/apply-corporate-cases-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main

      - name: Apply corporate case hub
        run: python scripts/apply_corporate_cases_once.py

      - name: Verify and commit
        run: |
          set -e
          git diff --check
          rm -f scripts/apply_corporate_cases_once.py
          rm -f .github/workflows/apply-corporate-cases-once.yml
          git add corporate.html scripts/apply_corporate_cases_once.py .github/workflows/apply-corporate-cases-once.yml
          git commit -m "법인등기 처리사례 5개 연결"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
