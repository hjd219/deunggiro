name: Move corporate FAQ CSS once
on:
  push:
    branches: [main]
    paths: ['maintenance/run-corporate-faq-css-move.flag']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/corporate-faq-css-move-once.mjs
      - name: Verify
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'assets/site-shell-core.css corporate.html '
          git diff --check
          ! grep -q 'corp-faq-layout' assets/site-shell-core.css
          grep -q '/assets/corporate-page.css?v=20260913' corporate.html
          grep -q 'corp-faq-layout' assets/corporate-page.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-shell-core.css corporate.html
          git commit -m 'CSS 역할 정리: 법인 FAQ 규칙 전용 파일로 이전'
          git pull --rebase origin main
          git push origin HEAD:main
