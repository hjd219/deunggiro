name: Apply Contextual Article Links (One Time)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_article_context_links.py'
      - '.github/workflows/apply-context-links.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  update-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview safe one-link-per-article edits
        run: python scripts/add_article_context_links.py --dry-run
      - name: Apply links to currently published articles
        run: python scripts/add_article_context_links.py
      - name: Verify no sitemap or metadata files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-only | grep -v -E '^posts/[^/]+\.html$'; then
            echo "Non-article modification detected" >&2
            exit 1
          fi
          if git diff --quiet; then
            echo "No new contextual links needed"
          fi
      - name: Commit article-only changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posts/
          git commit -m "SEO: add one relevant contextual link per article without metadata changes"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
