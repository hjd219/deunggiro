name: Cleanup home button CSS once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'RUN_HOME_BUTTON_CLEANUP_ONCE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge home button styles and remove duplicate override
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the later duplicate override block entirely.
          s2, n = re.subn(
              r'\n?<style id="dg-home-buttons-static-final">.*?</style>\n?',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'duplicate static-final block count={n}')
          s = s2

          old = '''/* DG_HOME_INTRO_V2 */
body.home .hero .buttons .dg-intro-open,
body.home .hero .buttons a[href="#calculator"]{
  background:#fff!important;
  color:#20242b!important;
  border:1px solid #36a9e1!important;
  box-shadow:none!important;
}
body.home .hero .buttons .dg-intro-open{cursor:pointer;font-family:inherit;font-size:inherit!important;line-height:inherit!important}'''

          new = '''/* DG_HOME_INTRO_V2 - 메인 상단 버튼 최종 단일 규칙 */
body.home .hero .buttons .dg-intro-open,
body.home .hero .buttons a[href="#calculator"]{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  min-height:48px!important;
  padding:0 21px!important;
  border-radius:7px!important;
  background:#fff!important;
  color:#20242b!important;
  border:1px solid #36a9e1!important;
  box-shadow:none!important;
  font-size:16px!important;
  font-weight:900!important;
  line-height:1!important;
}
body.home .hero .buttons a.dg-phone-cta{
  display:inline-flex!important;
  align-items:center!important;
  justify-content:center!important;
  min-height:48px!important;
  padding:0 22px!important;
  border-radius:8px!important;
  background:#36a9e1!important;
  color:#fff!important;
  border:1px solid #36a9e1!important;
  box-shadow:none!important;
  font-size:16px!important;
  font-weight:900!important;
  line-height:1!important;
}
body.home .hero .buttons .dg-intro-open{cursor:pointer;font-family:inherit}
@media(max-width:800px){
  body.home .hero .buttons .dg-intro-open,
  body.home .hero .buttons a[href="#calculator"],
  body.home .hero .buttons a.dg-phone-cta{
    min-height:44px!important;
    padding:0 16px!important;
    border-radius:8px!important;
    font-size:16px!important;
  }
}'''

          if old not in s:
              raise SystemExit('DG_HOME_INTRO_V2 target block not found')
          s = s.replace(old, new, 1)

          # Guard against the old hide/reveal mechanism being left anywhere in index.html.
          for legacy in ('dg-home-ready', 'dg-home-buttons-ready', 'dg-home-flash-guard', 'dg-home-ready-script'):
              if legacy in s:
                  raise SystemExit(f'legacy marker still present: {legacy}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cleanup and remove this one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-home-button-css-once.yml
          git add index.html
          git commit -m "Clean home button CSS at source"
          git pull --rebase origin main
          git push origin main
