name: One-time remove renunciation main services
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-remove-renunciation-main-services.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove main services section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('renunciation.html')
          s=p.read_text(encoding='utf-8')
          old=s
          pattern=r'<section class="section white"><div class="container"><div class="label">MAIN SERVICES</div><h2 class="title">주요 업무</h2>.*?</section>\s*(?=<section class="section soft ren-process-section">)'
          s,n=re.subn(pattern,'',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected 1 MAIN SERVICES section, removed {n}')
          if '주요 업무' in s or '>MAIN SERVICES<' in s:
              raise SystemExit('MAIN SERVICES marker still present')
          p.write_text(s,encoding='utf-8')
          print('Removed MAIN SERVICES section successfully')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renunciation.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove main services from renunciation page"
          git push
