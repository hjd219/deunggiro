name: Move realestate CSS once
on:
  push:
    branches: [main]
    paths: ['maintenance/run-realestate-css-move.flag']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/realestate-css-move-once.mjs
      - name: Verify
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'assets/site-shell-core.css realestate.html '
          git diff --check
          ! grep -q 'REALESTATE_SECTION_HEADING_V1' assets/site-shell-core.css
          grep -q '/assets/realestate-page.css?v=20260913' realestate.html
          grep -q 'REALESTATE_SECTION_HEADING_V1' assets/realestate-page.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/site-shell-core.css realestate.html
          git commit -m 'CSS 역할 정리: 부동산 전용 규칙 분리'
          git pull --rebase origin main
          git push origin HEAD:main
