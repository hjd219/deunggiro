name: Auto Post Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'posts/**'
      - 'index.html'
      - 'inheritance.html'
      - 'renunciation.html'
      - 'corporate.html'
      - 'realestate.html'
      - 'family.html'
      - 'assets/latest-posts.css'
      - 'assets/latest-posts.js'
      - 'scripts/generate_thumbnails.py'
      - 'scripts/apply_latest_cards.py'
      - '.github/workflows/auto-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-thumbnails-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Korean fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate all thumbnails
        run: python scripts/generate_thumbnails.py

      - name: Apply latest post cards
        run: python scripts/apply_latest_cards.py

      - name: Validate generated files
        run: |
          python -m py_compile scripts/generate_thumbnails.py scripts/apply_latest_cards.py
          python - <<'PY'
          import json
          from pathlib import Path
          posts=json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
          missing=[]
          for p in posts:
              f=Path(p['thumbnail'].lstrip('/'))
              if not f.exists(): missing.append(str(f))
          if missing:
              raise SystemExit('Missing thumbnails: '+', '.join(missing[:10]))
          for f in ['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']:
              text=Path(f).read_text(encoding='utf-8')
              if '/assets/latest-posts.js' not in text or '/assets/latest-posts.css' not in text:
                  raise SystemExit('Latest cards not injected: '+f)
          print('validated', len(posts), 'thumbnails and latest-card pages')
          PY
          git diff --check

      - name: Commit generated updates
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal assets/posts)" ]; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json posts assets/posts index.html inheritance.html renunciation.html corporate.html realestate.html family.html
          git commit -m "최신글 4개 한줄 및 새 자동 썸네일 전체 적용"
          git pull --rebase origin main
          git push origin HEAD:main
