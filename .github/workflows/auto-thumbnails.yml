name: Auto Post Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'posts/**'
      - 'posts.html'
      - 'index.html'
      - 'inheritance.html'
      - 'renunciation.html'
      - 'corporate.html'
      - 'realestate.html'
      - 'family.html'
      - 'assets/latest-posts.css'
      - 'assets/latest-posts.js'
      - 'assets/article-cta.js'
      - 'scripts/generate_thumbnails.py'
      - 'scripts/fix_thumbnail_logo.py'
      - 'scripts/apply_latest_cards.py'
      - 'scripts/patch_admin_seo.py'
      - 'scripts/patch_admin_category.py'
      - 'scripts/fix_divorce_categories.py'
      - 'scripts/site_maintenance.py'
      - 'scripts/sync_category_meta.py'
      - 'scripts/cleanup_duplicate_posts.py'
      - 'scripts/audit_duplicate_posts.py'
      - 'scripts/seo-auto.mjs'
      - 'favicon.png'
      - '.github/workflows/auto-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-thumbnails-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Korean fonts and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow beautifulsoup4

      - name: Generate and publish automated site updates from latest main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Automated site publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python scripts/cleanup_duplicate_posts.py
            python scripts/patch_admin_seo.py
            python scripts/patch_admin_category.py
            python scripts/fix_divorce_categories.py
            python scripts/site_maintenance.py
            python scripts/generate_thumbnails.py
            python scripts/fix_thumbnail_logo.py
            python scripts/site_maintenance.py
            python scripts/apply_latest_cards.py
            node scripts/seo-auto.mjs
            python scripts/sync_category_meta.py
            python scripts/audit_duplicate_posts.py

            python -m py_compile scripts/cleanup_duplicate_posts.py scripts/patch_admin_seo.py scripts/patch_admin_category.py scripts/fix_divorce_categories.py scripts/site_maintenance.py scripts/generate_thumbnails.py scripts/fix_thumbnail_logo.py scripts/apply_latest_cards.py scripts/sync_category_meta.py scripts/audit_duplicate_posts.py
            node --check scripts/seo-auto.mjs
            node --check assets/latest-posts.js
            node --check assets/article-cta.js

            python - <<'PY'
          import json,re
          from pathlib import Path
          from bs4 import BeautifulSoup

          posts=json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
          missing=[]
          duplicate_ids=[]
          category_mismatches=[]
          seen_titles={}
          duplicate_titles=[]

          for p in posts:
              slug=(p.get('slug') or '').replace('.html','')
              expected=(p.get('category') or '').strip()
              title_key=re.sub(r'[^0-9A-Za-z가-힣]+','',(p.get('title') or '').strip()).lower()
              if title_key:
                  if title_key in seen_titles:
                      duplicate_titles.append(f"{seen_titles[title_key]} <-> {slug}: {p.get('title')}")
                  else:
                      seen_titles[title_key]=slug
              thumb=(p.get('thumbnail') or '').strip()
              if not thumb:
                  missing.append(slug+': empty thumbnail')
              elif not Path(thumb.lstrip('/')).exists():
                  missing.append(thumb)
              hp=Path('posts')/f'{slug}.html'
              if not hp.exists():
                  missing.append(str(hp));continue
              text=hp.read_text(encoding='utf-8')
              ids=re.findall(r'\bid=["\'](SE-[^"\']+)["\']',text,re.I)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: duplicate_ids.append(slug+': '+','.join(dup[:3]))
              if '/assets/article-cta.js' not in text:
                  missing.append(slug+': article CTA script missing')

              soup=BeautifulSoup(text,'html.parser')
              meta=soup.find('meta',attrs={'name':'dg-category'})
              meta_cat=(meta.get('content') or '').strip() if meta else ''
              badge=soup.select_one('.post-meta .badge')
              badge_cat=badge.get_text(' ',strip=True) if badge else ''
              crumb=soup.find('nav',attrs={'aria-label':'breadcrumb'})
              crumb_span=crumb.find('span') if crumb else None
              crumb_cat=crumb_span.get_text(' ',strip=True) if crumb_span else ''
              json_cat=''
              for script in soup.find_all('script',attrs={'type':'application/ld+json'}):
                  try:
                      obj=json.loads(script.string or script.get_text() or '')
                  except Exception:
                      continue
                  if isinstance(obj,dict) and obj.get('@type')=='BreadcrumbList':
                      for item in obj.get('itemListElement',[]):
                          if isinstance(item,dict) and item.get('position')==3:
                              json_cat=str(item.get('name') or '').strip()
                              break
                  if json_cat:
                      break
              values={'meta':meta_cat,'badge':badge_cat,'breadcrumb':crumb_cat,'jsonld':json_cat}
              bad={k:v for k,v in values.items() if v!=expected}
              if bad:
                  category_mismatches.append(f"{slug}: expected={expected}, got={bad}")

          if duplicate_titles:
              raise SystemExit('Duplicate titles remain: '+' | '.join(duplicate_titles[:12]))
          if missing:
              raise SystemExit('Missing generated resources: '+', '.join(missing[:12]))
          if duplicate_ids:
              raise SystemExit('Duplicate SE ids remain: '+', '.join(duplicate_ids[:10]))
          if category_mismatches:
              raise SystemExit('Category sync mismatch: '+' | '.join(category_mismatches[:12]))

          for f in ['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']:
              text=Path(f).read_text(encoding='utf-8')
              if '/assets/latest-posts.js' not in text or '/assets/latest-posts.css' not in text:
                  raise SystemExit('Latest cards not injected: '+f)
          admin=Path('admin.html').read_text(encoding='utf-8')
          if 'SEO 자동생성: 검색 키워드 + 검색결과 설명/목록 요약' not in admin:
              raise SystemExit('Admin SEO autofill not injected')
          if '카테고리 자동분류: 제목 기준' not in admin:
              raise SystemExit('Admin category automation not injected')
          listing=Path('posts.html').read_text(encoding='utf-8')
          if 'SEO_STATIC_POSTS_START' not in listing or 'post-thumb' not in listing:
              raise SystemExit('posts.html static thumbnail cards missing')
          print('validated',len(posts),'posts: duplicate titles absent; category source/meta/badge/breadcrumb/jsonld synchronized')
          PY

            git diff --check

            if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal assets/posts data/duplicate-report.json)" ]; then
              echo "No generated changes"
              exit 0
            fi

            git add admin.html data/posts.json data/seo-report.json data/duplicate-report.json posts posts.html assets/posts index.html inheritance.html renunciation.html corporate.html realestate.html family.html sitemap.xml
            git commit -m "게시글 중복삭제·카테고리·SEO·썸네일 일괄 반영"

            if git push origin HEAD:main; then
              echo "Automated site updates published"
              exit 0
            fi

            echo "Main changed during generation; retrying from latest main"
            sleep 2
          done

          echo "Failed to publish automated site updates after 3 attempts"
          exit 1