name: Auto Post Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'posts/**'
      - 'index.html'
      - 'inheritance.html'
      - 'renunciation.html'
      - 'corporate.html'
      - 'realestate.html'
      - 'family.html'
      - 'assets/latest-posts.css'
      - 'assets/latest-posts.js'
      - 'scripts/generate_thumbnails.py'
      - 'scripts/fix_thumbnail_logo.py'
      - 'scripts/apply_latest_cards.py'
      - 'scripts/patch_admin_seo.py'
      - 'favicon.png'
      - '.github/workflows/auto-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-thumbnails-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Korean and color emoji fonts plus Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate and publish thumbnails from latest main
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other SEO workflows may update the same post immediately after publishing.
          # Always regenerate from the newest main instead of rebasing generated HTML later.
          for attempt in 1 2 3; do
            echo "Thumbnail publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python scripts/patch_admin_seo.py
            python scripts/generate_thumbnails.py
            python scripts/fix_thumbnail_logo.py
            python scripts/apply_latest_cards.py

            python -m py_compile scripts/patch_admin_seo.py scripts/generate_thumbnails.py scripts/fix_thumbnail_logo.py scripts/apply_latest_cards.py
            python - <<'PY'
          import json
          from pathlib import Path
          posts=json.loads(Path('data/posts.json').read_text(encoding='utf-8'))
          missing=[]
          for p in posts:
              thumb=(p.get('thumbnail') or '').strip()
              if not thumb:
                  missing.append(p.get('slug','(no slug)')+': empty thumbnail')
                  continue
              f=Path(thumb.lstrip('/'))
              if not f.exists():
                  missing.append(str(f))
          if missing:
              raise SystemExit('Missing thumbnails: '+', '.join(missing[:10]))
          for f in ['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']:
              text=Path(f).read_text(encoding='utf-8')
              if '/assets/latest-posts.js' not in text or '/assets/latest-posts.css' not in text:
                  raise SystemExit('Latest cards not injected: '+f)
          admin=Path('admin.html').read_text(encoding='utf-8')
          if 'SEO 자동생성: 검색 키워드 + 검색결과 설명/목록 요약' not in admin:
              raise SystemExit('Admin SEO autofill not injected')
          print('validated', len(posts), 'thumbnails, latest-card pages, and admin SEO autofill')
          PY
            git diff --check

            if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal assets/posts)" ]; then
              echo "No generated changes"
              exit 0
            fi

            git add admin.html data/posts.json posts assets/posts index.html inheritance.html renunciation.html corporate.html realestate.html family.html
            git commit -m "게시글 썸네일·SEO 자동 생성 및 최신글 반영"

            if git push origin HEAD:main; then
              echo "Thumbnail and SEO updates published"
              exit 0
            fi

            echo "Main changed during generation; retrying from latest main"
            sleep 2
          done

          echo "Failed to publish thumbnail/SEO updates after 3 attempts"
          exit 1
