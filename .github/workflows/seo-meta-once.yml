name: SEO meta descriptions once

on:
  push:
    paths:
      - '.github/workflows/seo-meta-once.yml'

permissions:
  contents: write

jobs:
  update-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only meta descriptions
        shell: python
        run: |
          from pathlib import Path
          import re

          changes = {
            'index.html': '인천 상속등기·상속포기·한정승인, 법인등기 절차·비용·필요서류부터 확인하세요. 실제 처리사례와 등기비용 계산기를 제공합니다.',
            'inheritance.html': '인천 상속등기·상속재산분할의 절차·비용·필요서류를 확인하세요. 협의분할, 상속취득세와 실제 처리사례도 안내합니다.',
            'renunciation.html': '인천 상속포기·한정승인·특별한정승인의 절차·비용·필요서류를 확인하세요. 신청기한과 실제 처리사례도 안내합니다.',
            'corporate.html': '인천 법인등기의 절차·비용·필요서류를 확인하세요. 법인설립, 대표이사·임원변경, 본점이전, 상호·목적변경, 증자까지 안내합니다.',
            'realestate.html': '인천 부동산등기의 절차·비용·필요서류를 확인하세요. 매매·증여·재산분할·근저당 설정 및 말소 등 주요 등기업무를 안내합니다.',
          }

          for filename, description in changes.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              new, n = re.subn(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{description}">', text, count=1)
              if n != 1:
                  raise SystemExit(f'{filename}: meta description replacement count={n}')
              p.write_text(new, encoding='utf-8')

      - name: Verify
        run: |
          git diff --check
          git diff -- index.html inheritance.html renunciation.html corporate.html realestate.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inheritance.html renunciation.html corporate.html realestate.html
          git commit -m "Align SEO meta descriptions" || exit 0
          git push
