name: Cache bust site shell once
on:
  push:
    branches: [main]
jobs:
  bust:
    if: contains(github.event.head_commit.message, 'CACHE_BUST_SITE_SHELL')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update site-shell cache version on all HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          version='20260910-2055'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              ns=re.sub(r'/assets/site-shell\.css(?:\?v=[^\"\'\s>]+)?', f'/assets/site-shell.css?v={version}', s)
              if ns!=s:
                  p.write_text(ns,encoding='utf-8')
                  changed.append(str(p))
          print('UPDATED', len(changed))
          for x in changed:
              print(x)
          wf=Path('.github/workflows/cache-bust-site-shell-once.yml')
          if wf.exists():
              wf.unlink()
          PY
      - name: Commit cache-busted references
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "전체 HTML site-shell.css 캐시 버전 20260910-2055 적용"
          git pull --rebase origin main
          git push origin main
