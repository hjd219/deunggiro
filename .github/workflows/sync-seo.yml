name: Sync SEO files

on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild posts HTML and sitemap
        run: python scripts/sync-seo.py

      - name: Commit generated SEO files
        run: |
          if git diff --quiet -- posts.html sitemap.xml; then
            echo "No SEO changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.html sitemap.xml
          git commit -m "자동 SEO 동기화: 게시글 목록 및 사이트맵"
          git push
