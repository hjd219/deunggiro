name: One-time inheritance icon text side layout
on:
  push:
    paths:
      - '.github/workflows/one-time-inheritance-horizontal-icon-text.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply side layout
        run: python scripts/one_time_inheritance_horizontal_icon_text.py
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html
          git diff --cached --quiet || git commit -m "Place inheritance process text beside icons"
          git pull --rebase origin main
          git push
