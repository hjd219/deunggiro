name: Remove Duplicate Article Hub Cards

on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-hub-duplicates.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Remove only legacy cards duplicated by new core links
        run: python -u scripts/cleanup_duplicate_hub_links.py
      - name: Confirm idempotency and unchanged canonical metadata
        run: |
          python -u scripts/cleanup_duplicate_hub_links.py
          git diff --check
      - name: Commit and safely publish affected posts only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posts
          if git diff --cached --quiet; then
            echo "NO_DUPLICATE_LEGACY_HUBS"
            exit 0
          fi
          git commit -m "Remove old duplicate hub cards while keeping core link and related posts"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "LEGACY_HUB_DEDUP_PUBLISHED"
              exit 0
            fi
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 5))
          done
          exit 1
