name: Extract posts CSS once
on:
  push:
    branches: [main]
    paths: ['maintenance/run-posts-css-extract.flag']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/posts-css-extract-once.mjs
      - name: Verify
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'assets/posts-page.css assets/site-shell-core.css posts.html '
          git diff --check
          ! grep -q '<style>' posts.html
          grep -q '/assets/posts-page.css?v=20260913' posts.html
          grep -q 'LEGAL_INFO_ENGLISH_OFF_V1' assets/posts-page.css
          ! grep -q 'LEGAL_INFO_ENGLISH_OFF_V1' assets/site-shell-core.css
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posts-page.css assets/site-shell-core.css posts.html
          git commit -m 'CSS 구조 정리: 법률정보 인라인 스타일 외부화'
          git pull --rebase origin main
          git push origin HEAD:main
