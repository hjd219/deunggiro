name: Bust home latest posts cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'BUST_HOME_LATEST_POSTS_CACHE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump latest-posts cache and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'/assets/latest-posts\.js\?v=[^"\']+', '/assets/latest-posts.js?v=20260911-0011', s, count=1)
          if n!=1:
              raise SystemExit(f'latest-posts cache ref replacement count={n}')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/bust-home-latest-posts-cache.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bust-home-latest-posts-cache.yml
          git commit -m "메인 최신글 처리사례 배지 캐시 갱신 [skip ci]"
          git push
