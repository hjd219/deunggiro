name: Unify case badge in thumbnail
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'UNIFY_CASE_BADGE_IN_THUMBNAIL')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install thumbnail dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow
      - name: Remove overlay badges and regenerate thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Latest cards: remove HTML/CSS overlay badge. The PNG itself owns the badge.
          js=Path('assets/latest-posts.js')
          s=js.read_text(encoding='utf-8')
          s,n=re.subn(r"\$\{isCase\?'<span class=\\\"dg-case-overlay-badge\\\">처리사례</span>':''\}", '', s, count=1)
          if n!=1:
              raise SystemExit(f'latest-post overlay replacement count={n}')
          s,n2=re.subn(r"function ensureCaseBadgeStyle\(\)\{.*?\}function init\(\)\{ensureCaseBadgeStyle\(\);", "function init(){", s, count=1, flags=re.S)
          if n2!=1:
              raise SystemExit(f'latest-post style removal count={n2}')
          js.write_text(s,encoding='utf-8')

          # 2) Posts listing: remove pseudo-element overlay badge CSS completely.
          css=Path('assets/site-shell.css')
          c=css.read_text(encoding='utf-8')
          c,n3=re.subn(r"\n/\* POSTS_CASE_BADGE_V1.*\Z", "\n", c, count=1, flags=re.S)
          if n3!=1:
              raise SystemExit(f'posts overlay CSS removal count={n3}')
          css.write_text(c,encoding='utf-8')

          # 3) Force fresh frontend assets where those overlays were previously cached.
          for name in ['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']:
              p=Path(name)
              if not p.exists():
                  continue
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'/assets/latest-posts\.js\?v=[^"\']+', '/assets/latest-posts.js?v=20260911-0025', t, count=1)
              p.write_text(t,encoding='utf-8')

          p=Path('posts.html')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'/assets/site-shell\.css\?v=[^"\']+', '/assets/site-shell.css?v=20260911-0025', t, count=1)
          p.write_text(t,encoding='utf-8')
          PY

          python -u scripts/generate_thumbnails.py

          rm -rf scripts/__pycache__ || true
          find . -type f -name '*.pyc' -delete
          rm .github/workflows/unify-case-badge-in-thumbnail.yml
      - name: Commit unified badge system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-posts.js assets/site-shell.css assets/posts data/posts.json posts index.html inheritance.html renunciation.html corporate.html realestate.html family.html posts.html .github/workflows/unify-case-badge-in-thumbnail.yml
          git commit -m "처리사례 배지를 자동생성 썸네일 내부로 통일 [skip ci]"
          git push
