name: Localize family hero image once
on:
  push:
    paths:
      - .github/workflows/localize-family-hero-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localize-family-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch original IFEZ bridge photograph and optimize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl --retry 3 --retry-delay 2 --location --fail --show-error --silent --connect-timeout 15 --max-time 120 --user-agent "Mozilla/5.0" --referer "https://www.ifez.go.kr/" 'https://www.ifez.go.kr/other/attach/process.file.do?TP=img&key=667A3005CB17CB9&sn=79270' --output /tmp/family-original.jpeg
          echo '1e837f97b0cd809f2167ca44809f02dacbb66d00a17010c57ff1fb3eff12c517  /tmp/family-original.jpeg' | sha256sum -c -
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          import pathlib
          im = Image.open('/tmp/family-original.jpeg')
          im.load()
          if im.size != (1536,1009): raise RuntimeError('Unexpected original photo dimensions')
          im.save('images/family-bridge-hero.webp', 'WEBP', quality=72, method=6)
          path = pathlib.Path('family.html')
          html = path.read_text(encoding='utf-8')
          old = 'https://www.ifez.go.kr/other/attach/process.file.do?TP=img&amp;key=667A3005CB17CB9&amp;sn=79270'
          if html.count(old) != 2: raise RuntimeError('Unexpected photo URL count; do not change page')
          html = html.replace(old, '/images/family-bridge-hero.webp')
          html = html.replace('<link rel="preconnect" href="https://www.ifez.go.kr"><link rel="dns-prefetch" href="//www.ifez.go.kr">', '')
          path.write_text(html, encoding='utf-8')
          print('Saved', pathlib.Path('images/family-bridge-hero.webp').stat().st_size, 'bytes')
          PY
      - name: Commit only family hero image and references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/family-bridge-hero.webp family.html
          if ! git diff --cached --quiet; then
            git commit -m "Serve optimized IFEZ family hero photo locally"
            git push
          fi
