name: 기존글 번호 이모지 1회 적용

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-existing-number-emojis
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependency
        run: pip install beautifulsoup4

      - name: Apply number emojis to existing Naver posts
        run: python -u scripts/restore_naver_number_emojis.py

      - name: Commit changes once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- posts; then
            echo "No number emoji changes needed"
            exit 0
          fi
          git add posts
          git commit -m "기존글 번호 이모지 일괄 적용"
          git pull --rebase origin main
          git push origin HEAD:main
