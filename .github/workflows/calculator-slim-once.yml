name: Calculator slim once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/calculator-slim-once.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 scripts/calculator_slim_once.py
      - run: |
          git diff --check -- assets/home.css assets/icons/calculator.svg index.html
          rm scripts/calculator_slim_once.py .github/workflows/calculator-slim-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home.css assets/icons/calculator.svg index.html scripts/calculator_slim_once.py .github/workflows/calculator-slim-once.yml
          git commit -m '계산기 아이콘 슬림화 및 숫자 전환 효과 적용'
          git pull --rebase origin main
          git push origin HEAD:main
