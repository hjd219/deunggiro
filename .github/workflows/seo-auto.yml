name: SEO Auto Enhance

on:
  push:
    branches: [main]
    paths:
      - 'data/posts.json'
      - 'posts/**'
      - 'sitemap.xml'
      - 'scripts/seo-auto.mjs'
      - 'scripts/seo-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-auto-main
  cancel-in-progress: true

jobs:
  enhance-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SEO script
        run: node --check scripts/seo-auto.mjs

      - name: Run SEO automation
        run: node scripts/seo-auto.mjs

      - name: Check generated changes
        run: git diff --check

      - name: Commit SEO updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No SEO changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inheritance.html renunciation.html corporate.html realestate.html family.html posts sitemap.xml data/seo-report.json || true
          git commit -m "자동 SEO 강화: 관련글·수정일·이미지·오류검사"
          git pull --rebase origin main
          git push origin HEAD:main
