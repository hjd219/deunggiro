name: SEO Auto Enhance

# Disabled automatic SEO rewrites; run manually only when explicitly needed.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  enhance-seo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate automation scripts
        run: |
          node --check scripts/seo-auto.mjs
          node --check scripts/seo-hub-links.mjs
          node --check scripts/category-fix.mjs
          node --check scripts/seo-canonical-fix.mjs
          node --check scripts/rss-auto.mjs

      - name: Run SEO automation
        run: |
          node scripts/category-fix.mjs
          node scripts/seo-auto.mjs
          node scripts/seo-hub-links.mjs
          node scripts/seo-canonical-fix.mjs

      - name: Generate RSS
        run: node scripts/rss-auto.mjs

      - name: Validate generated SEO
        run: |
          python -m pip install --quiet beautifulsoup4
          python -u scripts/seo_quality_gate.py
          git diff --check

      - name: Commit SEO updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No SEO changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inheritance.html renunciation.html corporate.html realestate.html family.html posts sitemap.xml rss.xml data/posts.json data/seo-report.json || true
          git commit -m "자동 SEO 강화 및 RSS 갱신"
          git pull --rebase origin main
          git push origin HEAD:main
