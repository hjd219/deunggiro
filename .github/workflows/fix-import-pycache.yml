name: Fix import pycache cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'FIX_IMPORT_PYCACHE')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch import workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/import-naver-blog.yml')
          s=p.read_text(encoding='utf-8')
          old='''      - name: Commit and push safely\n        shell: bash\n        run: |\n          set -euo pipefail\n          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then\n'''
          new='''      - name: Commit and push safely\n        shell: bash\n        run: |\n          set -euo pipefail\n\n          # py_compile/postprocess may create Python cache files; never treat them as site changes.\n          find . -type d -name __pycache__ -prune -exec rm -rf {} +\n          find . -type f -name '*.pyc' -delete\n\n          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then\n'''
          if old not in s:
              raise SystemExit('commit step target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('.github/workflows/fix-import-pycache.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/import-naver-blog.yml .github/workflows/fix-import-pycache.yml
          git commit -m "자동수집 Python 캐시로 인한 push 실패 수정 [skip ci]"
          git push
