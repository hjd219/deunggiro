name: Calculator visual 3fix once
on:
  push:
    branches: [main]
    paths:
      - 'maintenance/run-calculator-visual-3fix.flag'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/calculator-visual-3fix-once.mjs
      - name: Verify scope
        run: |
          test "$(git diff --name-only | sort)" = $'assets/home.css\nindex.html'
          git diff --check
          grep -q 'width:60px;height:92px' assets/home.css
          grep -q 'transform:translateY(-2px)' assets/home.css
          grep -q 'CALCULATOR_DISPLAY_ROLL_V1' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home.css index.html
          git commit -m '계산기 제목·아이콘·숫자 애니메이션 조정'
          git pull --rebase origin main
          git push origin HEAD:main