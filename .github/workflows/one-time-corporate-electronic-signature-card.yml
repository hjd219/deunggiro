name: One-time corporate electronic signature card
on:
  push:
    paths:
      - '.github/workflows/one-time-corporate-electronic-signature-card.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/add-corporate-electronic-signature-card.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add corporate.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add electronic signature guide beside corporate FAQ'
          git push
