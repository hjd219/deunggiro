name: One-time inheritance refresh
on:
  push:
    paths:
      - '.github/workflows/one-time-inheritance-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh inheritance page
        run: python scripts/one_time_inheritance_refresh.py
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html
          git diff --cached --quiet || git commit -m "Refresh inheritance process and FAQ"
          git push
