name: One-time AI dead code cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-ai-deadcode-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove contradictory detail AI loaders and guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for fn in ['assets/detail-shell.js','assets/renunciation-detail-shell.js']:
              p=Path(fn); s=p.read_text(); old=s
              s=re.sub(r"\nif\(!document\.getElementById\('dg-ai-panel'\).*?\n\}\n(?=\n\}\)\(\);)", '\n', s, count=1, flags=re.S)
              s=re.sub(r"\nif\(!document\.getElementById\('dg-ai-panel'\).*?(?=\n\}\)\(\);)", '\n', s, count=1, flags=re.S)
              if s==old: raise SystemExit(f'{fn}: AI loader not found')
              p.write_text(s)

          p=Path('assets/site-shell.js'); s=p.read_text(); old=s
          s=s.replace("    document.querySelectorAll('.dg-ai-float,.dg-ai-panel,#dg-ai-open,#dg-ai-panel,[class*=\"ai-deunggiro\"],script[data-dg-ai-widget],script[src*=\"ai-deunggiro-widget\"]').forEach(el=>el.remove());\n",'')
          if s==old: raise SystemExit('site-shell.js: AI removal line not found')
          p.write_text(s)

          p=Path('assets/site-shell.css'); s=p.read_text(); old=s
          s=s.replace('section.contact,section.cta,section.dg-shell-contact,.dg-shell-contact,.dg-ai-float,.dg-ai-panel,#dg-ai-open,#dg-ai-panel,[class*="ai-deunggiro"],script[data-dg-ai-widget],script[src*="ai-deunggiro-widget"]{display:none!important}', 'section.contact,section.cta,section.dg-shell-contact,.dg-shell-contact{display:none!important}')
          if s==old: raise SystemExit('site-shell.css: AI guard selectors not found')
          p.write_text(s)
          PY
      - name: Verify and commit
        run: |
          if grep -n 'ai-deunggiro-widget\|dg-ai-panel\|dg-ai-float\|dg-ai-open' assets/detail-shell.js assets/renunciation-detail-shell.js assets/site-shell.js assets/site-shell.css; then
            echo 'Residual AI cleanup code found' >&2; exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/detail-shell.js assets/renunciation-detail-shell.js assets/site-shell.js assets/site-shell.css
          git commit -m 'Remove contradictory detail AI runtime dead code'
          git push