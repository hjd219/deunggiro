name: Finalize optimized family photo
on:
  push:
    paths:
      - .github/workflows/localize-family-photo.yml
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Resize local family hero and fix responsive preload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pc=Path('images/family-bridge-hero.webp')
          mobile=Path('images/family-bridge-hero-mobile.webp')
          if not pc.exists() or not mobile.exists(): raise RuntimeError('Missing verified local source photos')
          im=Image.open(pc).convert('RGB')
          if im.width<1536 or im.height<900: raise RuntimeError('Source image is unexpected resolution')
          im.thumbnail((1536,1536),Image.Resampling.LANCZOS)
          if im.width!=1536: raise RuntimeError('Wrong thumbnail width')
          im.save(pc,format='WEBP',quality=72,method=6)
          html_path=Path('family.html')
          html=html_path.read_text('utf-8')
          old='<link rel="preload" as="image" href="/images/family-bridge-hero.webp" fetchpriority="high">'
          new='<link rel="preload" as="image" imagesrcset="/images/family-bridge-hero-mobile.webp 800w, /images/family-bridge-hero.webp 1536w" imagesizes="100vw" fetchpriority="high">'
          if html.count(old)!=1: raise RuntimeError('Unexpected page preload markup')
          html=html.replace(old,new,1)
          html_path.write_text(html,'utf-8')
          print('Optimized desktop',im.size,pc.stat().st_size,'mobile',mobile.stat().st_size)
          PY
      - name: Publish updated local photo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/family-bridge-hero.webp family.html
          git commit -m 'Resize family bridge hero and preload responsive image'
          git pull --rebase origin main
          git push origin HEAD:main
