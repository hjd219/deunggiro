name: One-time home sky background v1
on:
  push:
    paths:
      - '.github/workflows/one-time-home-sky-background-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify home background
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* HOME_SKY_CONTINUOUS_BG_V1 */'
          if marker not in s:
            css='''\n<style>\n/* HOME_SKY_CONTINUOUS_BG_V1 */\n:root{--home-sky:#eef6fb}\n/* hero 아래 업무카드와 비용계산기까지 하나의 옅은 하늘색 면으로 연결 */\n.hero{background:linear-gradient(90deg,#f8fcff 0%,#f2f9fd 48%,var(--home-sky) 100%)!important}\n.quick{margin-top:0!important;padding:34px 0 30px!important;background:var(--home-sky)!important}\n.quick-grid{background:transparent!important;border:0!important;box-shadow:none!important}\n.quick-item.quick-rich{border:1px solid #d7e4ec!important}\n/* 기존 회색 계산기 섹션 제거하고 같은 하늘색으로 연결 */\n.section.soft{background:var(--home-sky)!important;padding-top:42px!important}\n@media(max-width:800px){\n .quick{padding:22px 0 24px!important}\n .section.soft{padding-top:44px!important}\n}\n</style>\n'''
            s=s.replace('</head>',css+'\n</head>',1)
            p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Connect hero service cards and calculator with sky background'
          git push origin main