name: Apply case overlay badge
on:
  push:
    branches: [main]
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY_CASE_OVERLAY_BADGE')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Move case badge to thumbnail top right
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/latest-posts.js')
          s=p.read_text(encoding='utf-8')
          old="const title=clean(p.title);const isCase=/(처리사례|사례)/.test(String(p.title||''));const badge=isCase?'처리사례':(p.category||'법률정보');const thumb=p.thumbnail||`/assets/posts/${p.slug}-thumbnail.png`;return `<a class=\"dg-latest-card\" href=\"/posts/${encodeURIComponent(p.slug)}.html\"><div class=\"dg-latest-thumb\"><img loading=\"lazy\" decoding=\"async\" src=\"${esc(thumb)}\" alt=\"${esc(title)}\" onerror=\"this.onerror=null;this.src='/favicon.png'\"></div><div class=\"dg-latest-body\"><div class=\"dg-latest-cat\">${esc(badge)}</div>"
          new="const title=clean(p.title);const isCase=/(처리사례|사례)/.test(String(p.title||''));const thumb=p.thumbnail||`/assets/posts/${p.slug}-thumbnail.png`;return `<a class=\"dg-latest-card\" href=\"/posts/${encodeURIComponent(p.slug)}.html\"><div class=\"dg-latest-thumb\">${isCase?'<span class=\"dg-case-overlay-badge\">처리사례</span>':''}<img loading=\"lazy\" decoding=\"async\" src=\"${esc(thumb)}\" alt=\"${esc(title)}\" onerror=\"this.onerror=null;this.src='/favicon.png'\"></div><div class=\"dg-latest-body\"><div class=\"dg-latest-cat\">${esc(p.category||'법률정보')}</div>"
          if old not in s:
              raise SystemExit('target card block not found')
          s=s.replace(old,new,1)
          marker="function init(){addSectionDescriptions();addCalculatorLink();run()}"
          style="function ensureCaseBadgeStyle(){if(document.getElementById('dg-case-overlay-style'))return;const st=document.createElement('style');st.id='dg-case-overlay-style';st.textContent='.dg-latest-thumb{position:relative}.dg-case-overlay-badge{position:absolute;top:10px;right:10px;z-index:3;display:inline-flex;align-items:center;justify-content:center;min-height:28px;padding:4px 10px;border-radius:999px;background:#35a9e1;color:#fff;font-size:12px;font-weight:900;line-height:1;box-shadow:0 4px 12px rgba(18,132,186,.22)}@media(max-width:700px){.dg-case-overlay-badge{top:9px;right:9px;min-height:26px;padding:4px 9px;font-size:11.5px}}';document.head.appendChild(st)}"
          if marker not in s:
              raise SystemExit('init marker not found')
          s=s.replace(marker,style+"function init(){ensureCaseBadgeStyle();addSectionDescriptions();addCalculatorLink();run()}",1)
          p.write_text(s,encoding='utf-8')

          for f in ['index.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']:
              q=Path(f)
              if not q.exists(): continue
              t=q.read_text(encoding='utf-8')
              t=re.sub(r'/assets/latest-posts\.js\?v=[^"\']+', '/assets/latest-posts.js?v=14', t)
              q.write_text(t,encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/apply-case-overlay-badge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-posts.js index.html inheritance.html renunciation.html corporate.html realestate.html family.html .github/workflows/apply-case-overlay-badge.yml
          git commit -m "처리사례 배지 썸네일 우측 상단 표시 [skip ci]"
          git pull --rebase origin main
          git push origin main
