name: Cleanup inheritance duplicate CSS once
on:
  push:
    paths:
      - '.github/workflows/cleanup-inheritance-css-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove fully superseded inheritance CSS blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('inheritance.html')
          s=p.read_text(encoding='utf-8')
          old=s
          markers=[
            'INHERITANCE_MOBILE_ALIGNMENT_V7',
            'INHERITANCE_MOBILE_SINGLELINE_V8',
            'INHERITANCE_MOBILE_TIGHT_GAP_V9',
            'INHERITANCE_PC_PROCESS_GAP_V1',
          ]
          for marker in markers:
            pattern=r'\s*<style>\s*/\*\s*'+re.escape(marker)+r'\s*\*/[\s\S]*?</style>'
            s,n=re.subn(pattern,'',s,count=1)
            if n!=1:
              raise SystemExit(f'expected one block for {marker}, found {n}')
          # Safety: keep final visual rules and all page structure/content intact.
          for required in ['INHERITANCE_MOBILE_REFERENCE_V11','INHERITANCE_PC_LAYOUT_V10','INHERITANCE_PROCESS_TOP_GAP_V2','INHERITANCE_ICON_BOX_V6','INHERITANCE_INFOGRAPHIC_V1']:
            if required not in s:
              raise SystemExit(f'missing required final rule: {required}')
          if s==old:
            raise SystemExit('no change')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check -- inheritance.html
          git diff -- inheritance.html
      - name: Commit and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-inheritance-css-once.yml
          git add inheritance.html
          git diff --cached --check
          git commit -m '구조정리: 상속등기 중복 CSS 제거'
          git push