name: Apply preview PDF save
on:
  push:
    branches: [main]
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY_PREVIEW_PDF_SAVE')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch estimate preview PDF save
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('estimate-preview.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</head>','<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>\n</head>',1)
          s=s.replace('<button class="print" type="button" onclick="window.print()">PDF 저장 / 인쇄</button>','<button class="print" type="button" id="pdfSaveBtn" onclick="savePdfFile()">PDF 저장</button>',1)
          marker='<script>\n(function(){\n const raw=sessionStorage.getItem(\'deunggiroEstimatePreview\');'
          if marker not in s:
              raise SystemExit('script marker not found')
          fn='''<script>\nasync function savePdfFile(){\n const btn=document.getElementById('pdfSaveBtn');\n const paper=document.getElementById('paper');\n if(!paper){alert('견적서를 찾을 수 없습니다.');return;}\n if(!window.html2canvas||!window.jspdf){window.print();return;}\n const old=btn?btn.textContent:'';\n try{\n  if(btn){btn.disabled=true;btn.textContent='PDF 만드는 중...';}\n  const canvas=await html2canvas(paper,{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:-window.scrollY});\n  const {jsPDF}=window.jspdf;\n  const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});\n  const pageW=210,pageH=297;\n  const imgW=pageW;\n  const imgH=canvas.height*imgW/canvas.width;\n  const img=canvas.toDataURL('image/jpeg',0.96);\n  let y=0,remain=imgH;\n  pdf.addImage(img,'JPEG',0,y,imgW,imgH,'FAST');\n  remain-=pageH;\n  while(remain>0){y=remain-imgH;pdf.addPage();pdf.addImage(img,'JPEG',0,y,imgW,imgH,'FAST');remain-=pageH;}\n  const blob=pdf.output('blob');\n  const file=new File([blob],'등기로-예상견적서.pdf',{type:'application/pdf'});\n  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){\n    await navigator.share({files:[file],title:'등기로 예상 견적서'});\n  }else{\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement('a');a.href=url;a.download='등기로-예상견적서.pdf';document.body.appendChild(a);a.click();a.remove();\n    setTimeout(()=>URL.revokeObjectURL(url),60000);\n  }\n }catch(e){\n  try{window.print();}catch(_){}\n }finally{if(btn){btn.disabled=false;btn.textContent=old||'PDF 저장';}}\n}\n</script>\n'''
          s=s.replace(marker,fn+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/apply-preview-pdf-save.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimate-preview.html .github/workflows/apply-preview-pdf-save.yml
          git commit -m "견적서 미리보기에서 PDF 파일 저장 지원 [skip ci]"
          git pull --rebase origin main
          git push origin main
