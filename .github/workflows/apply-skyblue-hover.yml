name: Apply unified skyblue hover
on:
  push:
    paths:
      - '.github/workflows/apply-skyblue-hover.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unify colors and preserve badge contrast
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','posts.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          marker='UNIFIED_SKYBLUE_HOVER_V1'; sky='#36a9e1'
          css=f'''\n<style>\n/* {marker} */\n:root{{--primary:{sky}!important;--primary-dark:#168dca!important;}}\n@media (min-width:801px){{.header{{border-bottom:4px solid #82cef1!important}}.header .nav{{gap:8px!important}}.header .nav a{{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:40px!important;padding:8px 16px!important;border:1px solid #c5d0dc!important;border-radius:999px!important;background:#fff!important;color:#263442!important;transition:.16s!important}}.header .nav a:hover,.header .nav a:focus-visible,.header .nav a.active,.header .nav a.current,.header .nav a[aria-current="page"]{{background:{sky}!important;border-color:{sky}!important;color:#fff!important}}}}\n@media (max-width:800px){{body.home .mobile-header button,body.home .mobile-header .active,body.home .mobile-menu .active,body.home .mobile-nav .active,body.home .btn-primary,body.home .primary-btn,body.home .cta-btn{{background:{sky}!important;background-image:none!important;border-color:{sky}!important;color:#fff!important}}}}\n@media (hover:hover) and (pointer:fine){{.quick-item:hover,.calc-card:hover,.calc-launch:hover,.card[href]:hover,.info-box[href]:hover,.post-card:hover,.seo-link-grid a:hover,.related-posts-list a:hover,#auto-related-posts a:hover,.related-posts-actions a:hover,.feature-item[href]:hover,.feature-panel[href]:hover,.legal-item:hover,.law-item:hover,.document-item[href]:hover,.doc-item[href]:hover,.service-card:hover,.service-item:hover,.topic-card:hover,.guide-card:hover{{background:{sky}!important;background-image:none!important;border-color:{sky}!important;color:#fff!important}}.quick-item:hover *,.calc-card:hover *,.calc-launch:hover *,.card[href]:hover *,.info-box[href]:hover *,.post-card:hover *,.seo-link-grid a:hover *,.related-posts-list a:hover *,#auto-related-posts a:hover *,.related-posts-actions a:hover *{{color:#fff!important}}.btn:hover,.btn-primary:hover,.btn-dark:hover,.btn-border:hover,.btn-soft:hover,.page-btn:hover,.chip:hover{{background:{sky}!important;border-color:{sky}!important;color:#fff!important}}}}\n.nav .active,.nav .current,.nav [aria-current="page"],.category-tabs .active,.chip.active,.page-btn.active,.tab.active,.tabs .active{{background:{sky}!important;background-image:none!important;border-color:{sky}!important;color:#fff!important}}\n.related-posts-list .related-badge,#auto-related-posts .related-badge,.related-badge,.post-card .badge{{background:#fff!important;border:1px solid rgba(255,255,255,.9)!important;color:{sky}!important;font-weight:800!important}}\n.related-posts-list a:hover .related-badge,#auto-related-posts a:hover .related-badge,.post-card:hover .badge{{background:#fff!important;border-color:#fff!important;color:{sky}!important}}\n</style>\n'''
          for f in pages:
              p=Path(f)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8')
              for old in ['#2457a6','#2457A6','#173d78','#173D78']:
                  t=t.replace(old,sky if old.lower()=='#2457a6' else '#168dca')
              pat=re.compile(r'\s*<style>\s*/\* '+re.escape(marker)+r' \*/.*?</style>\s*',re.S)
              t=pat.sub('\n',t)
              if f=='index.html':
                  t=re.sub(r'<body(?![^>]*class=)', '<body class="home"', t, count=1)
                  t=re.sub(r'<body class="([^"]*)"', lambda m:'<body class="'+(m.group(1) if 'home' in m.group(1).split() else m.group(1)+' home')+'"', t, count=1)
              if '</head>' not in t: raise RuntimeError(f+': </head> missing')
              t=t.replace('</head>',css+'</head>',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.html inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff --cached --quiet || git commit -m "Keep post category badges visible"
          git push
