name: Apply unified skyblue hover
on:
  push:
    paths:
      - '.github/workflows/apply-skyblue-hover.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply skyblue hover styles safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages=['index.html','posts.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          marker='UNIFIED_SKYBLUE_HOVER_V1'
          sky='#36a9e1'
          css=f'''\n<style>\n/* {marker} */\n@media (min-width:801px){{\n  .header{{border-bottom:4px solid #82cef1!important;}}\n  .header .nav{{gap:8px!important;}}\n  .header .nav a{{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:40px!important;padding:8px 16px!important;border:1px solid #c5d0dc!important;border-radius:999px!important;background:#fff!important;color:#263442!important;transition:background .16s ease,border-color .16s ease,color .16s ease!important;}}\n  .header .nav a:hover,.header .nav a:focus-visible{{background:{sky}!important;border-color:{sky}!important;color:#fff!important;}}\n}}\n@media (hover:hover) and (pointer:fine){{\n  a.quick-item:hover,.quick-item[href]:hover,\n  a.calc-card:hover,.calc-card[href]:hover,\n  a.calc-launch:hover,.calc-launch[href]:hover,\n  a.card:hover,.card[href]:hover,\n  a.info-box:hover,.info-box[href]:hover,\n  .post-card:hover,\n  .seo-link-grid a:hover,\n  .related-posts-list a:hover,\n  #auto-related-posts a:hover,\n  .related-posts-actions a:hover{{background:{sky}!important;border-color:{sky}!important;color:#fff!important;}}\n  a.quick-item:hover *, .quick-item[href]:hover *,\n  a.calc-card:hover *, .calc-card[href]:hover *,\n  a.calc-launch:hover *, .calc-launch[href]:hover *,\n  a.card:hover *, .card[href]:hover *,\n  a.info-box:hover *, .info-box[href]:hover *,\n  .post-card:hover *, .seo-link-grid a:hover *,\n  .related-posts-list a:hover *, #auto-related-posts a:hover *,\n  .related-posts-actions a:hover *{{color:#fff!important;}}\n  .post-card:hover .badge,.related-posts-list a:hover .related-badge,#auto-related-posts a:hover .related-badge{{background:rgba(255,255,255,.18)!important;border-color:rgba(255,255,255,.65)!important;color:#fff!important;}}\n  .btn-border:hover,.btn-soft:hover,.page-btn:hover,.chip:hover{{background:{sky}!important;border-color:{sky}!important;color:#fff!important;}}\n}}\n</style>\n'''

          for f in pages:
              p=Path(f)
              if not p.exists():
                  continue
              t=p.read_text(encoding='utf-8')
              # Idempotent: replace only our own block on reruns.
              pat=re.compile(r'\s*<style>\s*/\* '+re.escape(marker)+r' \*/.*?</style>\s*',re.S)
              t=pat.sub('\n',t)
              if '</head>' not in t:
                  raise RuntimeError(f+': </head> not found')
              t=t.replace('</head>',css+'</head>',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.html inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff --cached --quiet || git commit -m "Unify skyblue hover across site"
          git push
