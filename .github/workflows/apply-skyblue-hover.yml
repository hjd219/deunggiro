name: Apply unified skyblue hover
on:
  push:
    paths:
      - '.github/workflows/apply-skyblue-hover.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unify primary blue and interactive states to skyblue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=['index.html','posts.html','inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          marker='UNIFIED_SKYBLUE_HOVER_V1'
          sky='#36a9e1'
          css=f'''\n<style>\n/* {marker} */\n:root{{--primary:{sky}!important;--primary-dark:#168dca!important;}}\n@media (min-width:801px){{\n.header{{border-bottom:4px solid #82cef1!important}}\n.header .nav{{gap:8px!important}}\n.header .nav a{{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-height:40px!important;padding:8px 16px!important;border:1px solid #c5d0dc!important;border-radius:999px!important;background:#fff!important;color:#263442!important;transition:.16s!important}}\n.header .nav a:hover,.header .nav a:focus-visible,.header .nav a.active,.header .nav a.current,.header .nav a[aria-current="page"],.nav a.active,.nav a.current,.nav a[aria-current="page"]{{background:{sky}!important;background-image:none!important;border-color:{sky}!important;color:#fff!important}}\n}}\n@media (hover:hover) and (pointer:fine){{\n.quick-item:hover,.calc-card:hover,.calc-launch:hover,.card[href]:hover,.info-box[href]:hover,.post-card:hover,.seo-link-grid a:hover,.related-posts-list a:hover,#auto-related-posts a:hover,.related-posts-actions a:hover,.feature-item[href]:hover,.feature-panel[href]:hover,.legal-item:hover,.law-item:hover,.document-item[href]:hover,.doc-item[href]:hover,.service-card:hover,.service-item:hover,.topic-card:hover,.guide-card:hover{{background:{sky}!important;background-image:none!important;border-color:{sky}!important;color:#fff!important}}\n.quick-item:hover *,.calc-card:hover *,.calc-launch:hover *,.card[href]:hover *,.info-box[href]:hover *,.post-card:hover *,.seo-link-grid a:hover *,.related-posts-list a:hover *,#auto-related-posts a:hover *,.related-posts-actions a:hover *,.feature-item[href]:hover *,.feature-panel[href]:hover *,.legal-item:hover *,.law-item:hover *,.document-item[href]:hover *,.doc-item[href]:hover *,.service-card:hover *,.service-item:hover *,.topic-card:hover *,.guide-card:hover *{{color:#fff!important}}\n.btn:hover,.btn-primary:hover,.btn-dark:hover,.btn-border:hover,.btn-soft:hover,.page-btn:hover,.chip:hover,.category-tabs .chip:hover,.editor-toolbar button:hover{{background:{sky}!important;background-image:none!important;border-color:{sky}!important;color:#fff!important}}\n}}\n.nav .active,.nav .current,.nav [aria-current="page"],.category-tabs .active,.category-tabs .current,.chip.active,.page-btn.active,.tab.active,.tabs .active{{background:{sky}!important;background-image:none!important;border-color:{sky}!important;color:#fff!important}}\n</style>\n'''
          for f in pages:
              p=Path(f)
              if not p.exists(): continue
              t=p.read_text(encoding='utf-8')
              # Replace known old brand blues throughout each page, including gradients and inline styles.
              for old in ['#2457a6','#2457A6','#173d78','#173D78']:
                  t=t.replace(old, sky if old.lower()=='#2457a6' else '#168dca')
              pat=re.compile(r'\s*<style>\s*/\* '+re.escape(marker)+r' \*/.*?</style>\s*',re.S)
              t=pat.sub('\n',t)
              if '</head>' not in t: raise RuntimeError(f+': </head> missing')
              t=t.replace('</head>',css+'</head>',1)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.html inheritance.html renunciation.html corporate.html realestate.html family.html
          git diff --cached --quiet || git commit -m "Unify site primary blue to skyblue"
          git push
