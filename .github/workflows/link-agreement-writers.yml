name: Add Agreement Writer Internal Links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_agreement_writer_links.py'
      - '.github/workflows/link-agreement-writers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  link-agreement-writers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview relevant internal links
        run: python scripts/add_agreement_writer_links.py --dry-run
      - name: Apply links without regenerating HTML
        run: python scripts/add_agreement_writer_links.py
      - name: Verify only existing article HTML changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --name-only | grep -v -E '^posts/[^/]+\.html$'; then
            echo "Unexpected non-article file change" >&2
            exit 1
          fi
      - name: Commit only modified articles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posts/
          git commit -m "SEO: link relevant articles to both agreement PDF writers"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
