name: Pages extended-timeout deploy

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pages-extended-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    steps:
      - name: Let any auto-triggered Pages deployment finish
        run: sleep 650
      - name: Deploy to GitHub Pages (30 minute sync timeout)
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
