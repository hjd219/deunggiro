name: Apply article v2 design

on:
  push:
    branches: [main]
    paths:
      - 'assets/article-v2.css'
      - 'assets/article-v2.js'
      - 'scripts/apply-article-v2.py'
      - '.github/workflows/apply-article-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply latest article design
        run: python scripts/apply-article-v2.py
      - name: Commit updated articles and admin template
        run: |
          if git diff --quiet -- posts admin.html; then
            echo "No article design changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts admin.html
          git commit -m "개별 법률정보 최신 디자인 일괄 적용"
          git push
