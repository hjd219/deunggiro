name: Remove inheritance related info button
on:
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove exact button only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('inheritance.html')
          s=p.read_text(encoding='utf-8')
          t='<a class="btn btn-border" href="/posts.html">관련 법률정보</a>'
          if s.count(t)!=1: raise SystemExit(f'unexpected count={s.count(t)}')
          p.write_text(s.replace(t,''),encoding='utf-8')
          PY
      - name: Verify scope and commit
        run: |
          ! grep -q '<a class="btn btn-border" href="/posts.html">관련 법률정보</a>' inheritance.html
          test "$(git diff --name-only | tr -d '\r')" = "inheritance.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html
          git commit -m "상속등기 관련 법률정보 버튼만 제거 [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push success"
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Push failed after 3 attempts"
          exit 1
