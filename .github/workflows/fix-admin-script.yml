name: Fix admin embedded script

on:
  push:
    paths:
      - '.github/workflows/fix-admin-script.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair embedded closing script tags
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/assets/article-v2.js?v=4" defer></script><script src="/assets/site-shell.js" defer></script>'
          new='<script src="/assets/article-v2.js?v=4" defer><\\/script><script src="/assets/site-shell.js" defer><\\/script>'
          if old not in s:
              raise SystemExit('target embedded scripts not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('admin.html repaired')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Fix admin embedded script closing tags"
          git push
