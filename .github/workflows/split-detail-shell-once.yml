name: Split Detail Shell Once

on:
  push:
    paths:
      - '.github/workflows/split-detail-shell-once.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split injected CSS from detail shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/detail-shell.js')
          text=p.read_text(encoding='utf-8')
          start=text.index("const style=document.createElement('style');")
          css_start=text.index('style.textContent=`', start)+len('style.textContent=`')
          css_end=text.index('`;document.head.appendChild(style);', css_start)
          css=text[css_start:css_end].strip()+"\n"
          Path('assets/detail-shell.css').write_text(css,encoding='utf-8')
          replacement="const detailStyle=document.createElement('link');\ndetailStyle.rel='stylesheet';detailStyle.href='/assets/detail-shell.css?v=20260917-1';document.head.appendChild(detailStyle);"
          new=text[:start]+replacement+text[css_end+len('`;document.head.appendChild(style);'):]
          p.write_text(new,encoding='utf-8')
          print('detail-shell.js',len(text),'->',len(new),'bytes')
          print('detail-shell.css',len(css),'bytes')
          PY
          node --check assets/detail-shell.js
          test -s assets/detail-shell.css
          git diff --check
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/detail-shell.js assets/detail-shell.css
          git commit -m "Split detail shell styles from runtime"
          git pull --rebase origin main
          git push origin HEAD:main
