name: One-time detail brand word

on:
  push:
    paths:
      - '.github/workflows/one-time-detail-brand-word.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand-word:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Color only Deunggiro word in detail hero titles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('inheritance.html'),
              Path('renunciation.html'),
              Path('corporate.html'),
              Path('realestate.html'),
              Path('family.html'),
          ]

          for path in targets:
              text = path.read_text(encoding='utf-8')
              old = text
              pattern = re.compile(r'(<section class="subhero".*?<h1>)(.*?)(등기로)(</h1>)', re.S)
              def repl(m):
                  before = m.group(2)
                  if 'brand-word' in before:
                      return m.group(0)
                  return m.group(1) + before + '<span class="brand-word">등기로</span>' + m.group(4)
              text, n = pattern.subn(repl, text, count=1)
              if n and '.brand-word{color:#36a9e1}' not in text:
                  text = text.replace('</style>', '.brand-word{color:#36a9e1}\n</style>', 1)
              if text != old:
                  path.write_text(text, encoding='utf-8')
                  print(f'updated {path}')
              else:
                  print(f'no changes {path}')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html renunciation.html corporate.html realestate.html family.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Color Deunggiro word in detail page titles'
            git push origin main
          fi
