name: Optimize All Legal Article Search Titles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_post_titles.py'
      - '.github/workflows/optimize-post-titles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-all-post-search-titles
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check title semantics, uniqueness and scope first
        run: python scripts/optimize_post_titles.py --dry-run
      - name: Update article HTML titles only
        run: python scripts/optimize_post_titles.py
      - name: Verify no further changes and no other files touched
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python scripts/optimize_post_titles.py --dry-run > /tmp/dg-post-title-dry.json
          cat /tmp/dg-post-title-dry.json
          grep -q '"changed_files": 0' /tmp/dg-post-title-dry.json
          if git diff --name-only | grep -Ev '^posts/[^/]+\.html$'; then
            echo "Refusing unexpected file changes" >&2
            exit 1
          fi
      - name: Publish title-only edits
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All article search titles already updated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- posts/
          git commit -m "SEO: optimize all article search titles without changing original headings"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
