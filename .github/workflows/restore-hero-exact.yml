name: Restore exact handwritten hero
on:
  push:
    paths:
      - '.github/workflows/restore-hero-exact.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only handwritten hero structure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          ink = '<span class="hero-written-layer hero-written-ink" aria-hidden="true"><span class="hero-written-brand">등기로</span><span class="hero-written-message">에서 쉽게!</span></span>'
          ghost = '<span class="hero-written-layer hero-written-ghost" aria-hidden="true"><span class="hero-written-brand">등기로</span><span class="hero-written-message">에서 쉽게!</span></span>'
          if ghost not in s:
              if ink not in s:
                  raise SystemExit('hero ink markup not found; no changes made')
              s = s.replace(ink, ghost + ink, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('assets/home-clean.css')
          s = p.read_text(encoding='utf-8')
          wrong = 'body.home .hero-written-ink{position:relative!important;top:0;left:0;'
          right = 'body.home .hero-written-ink{position:absolute;top:0;left:0;'
          if wrong in s:
              s = s.replace(wrong, right, 1)
              p.write_text(s, encoding='utf-8')
          elif right not in s:
              raise SystemExit('hero ink CSS not found; no changes made')
          PY
      - name: Commit restoration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/home-clean.css
          git commit -m "Restore exact pre-cleanup handwritten hero"
          git push
