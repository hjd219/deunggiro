name: Sync detail pages with main shell
on:
  push:
    branches: [main]
jobs:
  sync:
    if: contains(github.event.head_commit.message, 'SYNC_DETAIL_MAIN_SHELL')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply static common header to five service pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
            'inheritance.html':'/inheritance.html',
            'renunciation.html':'/renunciation.html',
            'corporate.html':'/corporate.html',
            'realestate.html':'/realestate.html',
            'family.html':'/family.html',
          }
          nav_items = [
            ('/','홈'),
            ('/inheritance.html','상속등기'),
            ('/renunciation.html','상속포기·한정승인'),
            ('/corporate.html','법인등기'),
            ('/realestate.html','부동산등기'),
            ('/family.html','가사'),
            ('/posts.html','법률정보'),
          ]

          def header_markup(active):
              nav = ''.join(
                  f'<a href="{href}"' + (' aria-current="page"' if href == active else '') + f'>{label}</a>'
                  for href, label in nav_items
              )
              return (
                  '<header class="dg-shell-header"><div class="dg-shell-inner">'
                  '<a class="dg-shell-logo" href="/"><span>등기로</span><small>현재두 법무사 사무소 · 인천</small></a>'
                  f'<nav class="dg-shell-nav">{nav}</nav>'
                  '<button class="dg-shell-mobile-menu-btn" id="dg-shell-menu-btn" type="button" aria-expanded="false">☰ 메뉴</button>'
                  '</div></header>'
                  '<div class="dg-shell-mobile-panel" id="dg-shell-mobile-panel" aria-hidden="true">'
                  f'<div class="dg-shell-mobile-grid">{nav}</div>'
                  '<button class="dg-shell-mobile-close" id="dg-shell-menu-close" type="button">메뉴 닫기 ↑</button>'
                  '</div>'
              )

          pattern = re.compile(r'<header class="header">.*?<section class="subhero">', re.S)
          for name, active in pages.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              replacement = header_markup(active) + '\n<section class="subhero">'
              s2, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'{name}: legacy header replacement count={count}')
              p.write_text(s2, encoding='utf-8')

          site_header = r'''/* SITE_HEADER_V4 - 정적 공통 헤더 동작 전용 */
          (function(){
            const current=location.pathname;
            const activePath=current.startsWith('/posts/')?'/posts.html':current;
            const header=document.querySelector('header.dg-shell-header');
            if(!header) return;

            header.querySelectorAll('nav a').forEach(a=>{
              let path;
              try{ path=new URL(a.href,location.origin).pathname; }catch(_){ return; }
              if(path===activePath || (activePath==='/' && (path==='/'||path==='/index.html'))){
                a.setAttribute('aria-current','page');
              }else{
                a.removeAttribute('aria-current');
              }
            });

            const btn=document.getElementById('dg-shell-menu-btn');
            const panel=document.getElementById('dg-shell-mobile-panel');
            const close=document.getElementById('dg-shell-menu-close');
            if(!btn||!panel) return;

            const setOpen=open=>{
              panel.classList.toggle('open',open);
              panel.setAttribute('aria-hidden',open?'false':'true');
              btn.setAttribute('aria-expanded',open?'true':'false');
              document.body.classList.toggle('mobile-menu-open',open);
            };
            btn.addEventListener('click',()=>setOpen(!panel.classList.contains('open')));
            close?.addEventListener('click',()=>setOpen(false));
            panel.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>setOpen(false)));
            document.addEventListener('keydown',e=>{if(e.key==='Escape') setOpen(false)});
          })();
          '''
          Path('assets/site-header.js').write_text(site_header, encoding='utf-8')
          PY
      - name: Verify static headers
        run: |
          python - <<'PY'
          from pathlib import Path
          pages=['inheritance.html','renunciation.html','corporate.html','realestate.html','family.html']
          for name in pages:
              s=Path(name).read_text(encoding='utf-8')
              assert '<header class="dg-shell-header">' in s, name
              assert '<header class="header">' not in s, name
              assert 'id="dg-shell-mobile-panel"' in s, name
          s=Path('assets/site-header.js').read_text(encoding='utf-8')
          assert 'legacyHeader' not in s
          assert 'outerHTML' not in s
          print('static header verification passed')
          PY
      - name: Commit static header conversion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inheritance.html renunciation.html corporate.html realestate.html family.html assets/site-header.js
          git diff --cached --quiet && exit 0
          git commit -m "5개 업무페이지 정적 공통 헤더 적용"
          git pull --rebase origin main
          git push origin main
