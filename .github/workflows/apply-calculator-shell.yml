name: Apply calculator common shell
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-calculator-shell.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['corporate-calculator.html','acquisition-calculator.html']
          css='<link rel="stylesheet" href="/assets/site-shell.css?v=6">'
          js='<script src="/assets/site-shell.js?v=6"></script>'
          for fn in pages:
              p=Path(fn)
              t=p.read_text(encoding='utf-8')
              if '/assets/site-shell.css' not in t:
                  t=t.replace('</head>',css+'\n</head>',1)
              else:
                  import re
                  t=re.sub(r'<link[^>]+href=["\']/?assets/site-shell\.css[^"\']*["\'][^>]*>',css,t, count=1, flags=re.I)
              if '/assets/site-shell.js' not in t:
                  t=t.replace('</body>',js+'\n</body>',1)
              else:
                  import re
                  t=re.sub(r'<script[^>]+src=["\']/?assets/site-shell\.js[^"\']*["\'][^>]*></script>',js,t, count=1, flags=re.I)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corporate-calculator.html acquisition-calculator.html
          git diff --cached --quiet || git commit -m "Use common header and footer on calculators"
          git push
