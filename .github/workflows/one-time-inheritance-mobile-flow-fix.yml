name: One-time inheritance mobile flow fix
on:
  push:
    paths:
      - '.github/workflows/one-time-inheritance-mobile-flow-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix mobile inheritance flow v3
        run: python scripts/one_time_inheritance_mobile_flow_fix.py
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html
          git diff --cached --quiet || git commit -m "Fix inheritance mobile flow v3"
          git pull --rebase origin main
          git push
