name: Split calculator SVG once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/split-calculator-svg-once.yml']
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract identical calculator SVG and replace both inline copies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pat=r'<svg class="calculator-icon" viewBox="0 0 150 168" role="img" aria-label="계산기">.*?</svg>'
          m=re.findall(pat,s,flags=re.S)
          assert len(m)==2, f'expected 2 calculator SVGs, got {len(m)}'
          assert m[0]==m[1], 'calculator SVGs differ; aborting'
          svg=m[0].replace('<svg class="calculator-icon" viewBox="0 0 150 168" role="img" aria-label="계산기">','<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 168">',1)
          out=Path('assets/icons/calculator.svg')
          out.parent.mkdir(parents=True,exist_ok=True)
          assert not out.exists(), 'calculator.svg already exists; aborting'
          out.write_text(svg+'\n',encoding='utf-8')
          replacement='<img class="calculator-icon" src="/assets/icons/calculator.svg" alt="계산기">'
          ns,n=re.subn(pat,replacement,s,flags=re.S)
          assert n==2
          assert '<svg class="calculator-icon"' not in ns
          p.write_text(ns,encoding='utf-8')
          PY
          git diff --check
          git diff -- index.html assets/icons/calculator.svg
      - name: Commit exact structural split and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/split-calculator-svg-once.yml
          git add index.html assets/icons/calculator.svg
          git commit -m "구조정리: 계산기 인라인 SVG 외부화"
          git push origin main
