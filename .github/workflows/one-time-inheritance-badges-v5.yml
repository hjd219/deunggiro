name: One-time inheritance badges v5
on:
  push:
    paths:
      - 'scripts/one_time_inheritance_badges_v5.py'
      - '.github/workflows/one-time-inheritance-badges-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply inheritance badges
        run: python scripts/one_time_inheritance_badges_v5.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inheritance.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update inheritance overview badges"
          git push
