name: Patch corporate officer shareholder documents

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shareholder documents to officer changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('corporate-calculator.html')
          s=p.read_text(encoding='utf-8')
          marker="<b>임원변경 · 주주</b>"
          if marker in s:
              print('already patched')
          else:
              old="if(selected.has('off')){\n  const t=$('offType').value;"
              new="if(selected.has('off')){\n  lines.push('<b>임원변경 · 주주</b> 주주 전원의 인감도장 · 인감증명서 1통 · 주주가 법인인 경우 법인등기부');\n  const t=$('offType').value;"
              if old not in s:
                  raise SystemExit('target block not found')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Normalize calculator account UI
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='CALCULATOR_PAGE_ACCOUNT_SINGLE_V1'
          patch=r'''
<script>
/* CALCULATOR_PAGE_ACCOUNT_SINGLE_V1 */
(function(){
  if(!['/acquisition-calculator.html','/corporate-calculator.html'].includes(location.pathname))return;
  const style=document.createElement('style');
  style.textContent=`@media screen{.result .documents{display:none!important}.result .dg-calc-account-single{display:block!important;margin-top:14px!important;padding:15px 16px!important;border:1px solid #91adbf!important;border-radius:12px!important;background:#f2faff!important}.result .dg-calc-account-head{display:flex!important;align-items:center!important;gap:8px!important;margin-bottom:10px!important}.result .dg-calc-account-head strong{padding:4px 9px!important;border:1px solid #b9e0f2!important;border-radius:8px!important;background:#eaf7fd!important;color:#168dca!important;font-size:12px!important;font-weight:900!important}.result .dg-calc-account-head span{color:#607286!important;font-size:11px!important;font-weight:750!important}.result .dg-calc-account-list{display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important}.result .dg-calc-account-row{padding:10px 12px!important;border:1px solid #cfe4ef!important;border-radius:9px!important;background:#fff!important}.result .dg-calc-account-bank{display:block!important;margin-bottom:3px!important;color:#168dca!important;font-size:11px!important;font-weight:900!important}.result .dg-calc-account-number{display:block!important;color:#0b2137!important;font-size:14px!important;font-weight:900!important;white-space:nowrap!important}.result .dg-calc-account-holder{display:block!important;margin-top:2px!important;color:#607286!important;font-size:10.5px!important;font-weight:750!important}@media(max-width:520px){.result .dg-calc-account-list{grid-template-columns:1fr!important}}}@media print{.result .dg-calc-account-single{display:none!important}}`;
  document.head.appendChild(style);
  const nums=['110-482-692656','3333-07-6560416'];
  const html=`<div class="dg-calc-account-single"><div class="dg-calc-account-head"><strong>입금계좌</strong><span>현재두 법무사 사무소</span></div><div class="dg-calc-account-list"><div class="dg-calc-account-row"><span class="dg-calc-account-bank">신한은행</span><span class="dg-calc-account-number">110-482-692656</span><span class="dg-calc-account-holder">현재두법무사사무소</span></div><div class="dg-calc-account-row"><span class="dg-calc-account-bank">카카오뱅크</span><span class="dg-calc-account-number">3333-07-6560416</span><span class="dg-calc-account-holder">현재두법무사사무소</span></div></div></div>`;
  function clean(){
    const result=document.querySelector('.result'),pdf=result&&result.querySelector('.pdf-download');
    if(!result||!pdf)return;
    result.querySelectorAll('.account-box,.bank-account,.account-info,.deposit-account,.dg-estimate-account').forEach(el=>el.remove());
    [...result.children].forEach(el=>{
      if(el.classList.contains('dg-calc-account-single')||el===pdf||el.querySelector('.pdf-download'))return;
      const t=(el.textContent||'').replace(/\s/g,'');
      if(nums.every(n=>t.includes(n)))el.remove();
    });
    let box=result.querySelector('.dg-calc-account-single');
    if(!box){pdf.insertAdjacentHTML('beforebegin',html);box=result.querySelector('.dg-calc-account-single')}
    else if(box.nextElementSibling!==pdf)pdf.insertAdjacentElement('beforebegin',box);
  }
  let queued=false;
  const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;clean()})};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',schedule,{once:true});else schedule();
  new MutationObserver(schedule).observe(document.documentElement,{subtree:true,childList:true});
})();
</script>
'''
          for fn in ['acquisition-calculator.html','corporate-calculator.html']:
              p=Path(fn)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if marker in s:
                  continue
              if '</body>' not in s:
                  raise SystemExit(f'{fn}: body close not found')
              p.write_text(s.replace('</body>',patch+'\n</body>',1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          if git diff --quiet -- acquisition-calculator.html corporate-calculator.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add acquisition-calculator.html corporate-calculator.html
          git commit -m "계산기 계좌 중복 제거 및 준비서류 화면 숨김"
          git push
