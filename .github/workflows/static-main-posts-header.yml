name: Static common header for main and posts
on:
  push:
    branches: [main]
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'STATIC_MAIN_POSTS_HEADER') || contains(github.event.head_commit.message, 'CLEAN_MAIN_HEADER')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy headers and guard homepage flash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          nav = [
            ('/','홈'),
            ('/inheritance.html','상속등기'),
            ('/renunciation.html','상속포기·한정승인'),
            ('/corporate.html','법인등기'),
            ('/realestate.html','부동산등기'),
            ('/family.html','가사'),
            ('/posts.html','법률정보'),
          ]

          def markup(active):
              links=''.join(f'<a href="{href}"' + (' aria-current="page"' if href==active else '') + f'>{label}</a>' for href,label in nav)
              return (
                '<header class="dg-shell-header"><div class="dg-shell-inner">'
                '<a class="dg-shell-logo" href="/"><span>등기로</span><small>현재두 법무사 사무소 · 인천</small></a>'
                f'<nav class="dg-shell-nav">{links}</nav>'
                '<button class="dg-shell-mobile-menu-btn" id="dg-shell-menu-btn" type="button" aria-expanded="false">☰ 메뉴</button>'
                '</div></header>'
                '<div class="dg-shell-mobile-panel" id="dg-shell-mobile-panel" aria-hidden="true">'
                f'<div class="dg-shell-mobile-grid">{links}</div>'
                '<button class="dg-shell-mobile-close" id="dg-shell-menu-close" type="button">메뉴 닫기 ↑</button>'
                '</div>'
              )

          for name,active in [('index.html','/'),('posts.html','/posts.html')]:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if '<header class="dg-shell-header">' not in s:
                  pattern=r'<header class="header">.*?</header>(?:\s*<div class="mobile-menu-panel".*?</div>)?'
                  s,n=re.subn(pattern,markup(active),s,count=1,flags=re.S)
                  if n!=1:
                      raise SystemExit(f'{name}: legacy header replacement count={n}')
              if name=='index.html':
                  s=s.replace('<button type="button" class="mobile-menu-close" id="mobile-menu-close">메뉴 닫기 ↑</button></div>','')
                  guard='''<style id="dg-home-flash-guard">\nbody.home .hero .buttons{visibility:hidden!important}\nbody.home.dg-home-ready .hero .buttons{visibility:visible!important}\n</style>'''
                  ready='''<script id="dg-home-ready-script">\nrequestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('dg-home-ready')));\n</script>'''
                  if 'id="dg-home-flash-guard"' not in s:
                      s=s.replace('</head>',guard+'\n</head>',1)
                  if 'id="dg-home-ready-script"' not in s:
                      s=s.replace('<body class="home">','<body class="home">\n'+ready,1)
              p.write_text(s,encoding='utf-8')

          for name in ['index.html','posts.html']:
              s=Path(name).read_text(encoding='utf-8')
              assert '<header class="dg-shell-header">' in s
              assert '<header class="header">' not in s
              assert 'id="dg-shell-mobile-panel"' in s
          home=Path('index.html').read_text(encoding='utf-8')
          assert 'id="mobile-menu-close"' not in home
          assert 'id="dg-home-flash-guard"' in home
          assert 'id="dg-home-ready-script"' in home
          PY
      - name: Commit static header conversion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html posts.html
          git diff --cached --quiet && exit 0
          git commit -m "메인 새로고침 버튼 플래시 방지"
          git pull --rebase origin main
          git push origin main
