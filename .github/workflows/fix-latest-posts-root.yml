name: Remove regenerated latest-post blocks
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-latest-posts-root.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove latest-post generator output and obsolete sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed=[]
          for p in Path('.').rglob('*.html'):
              s=p.read_text(encoding='utf-8')
              old=s
              # Remove the exact static block generated by apply_latest_cards.py.
              s=re.sub(r'\s*<!-- SEO_CATEGORY_LINKS_START -->\s*<section id="dg-latest-posts"[\s\S]*?</section>\s*<!-- SEO_CATEGORY_LINKS_END -->\s*', '\n', s)
              # Safety for older generated copies without marker comments.
              s=re.sub(r'\s*<section id="dg-latest-posts" class="dg-latest-wrap">[\s\S]*?</section>\s*', '\n', s)
              # Remove obsolete runtime/style references if any survived.
              s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*latest-posts\.js[^"\']*["\'][^>]*></script>\s*', '\n', s, flags=re.I)
              s=re.sub(r'\s*<link[^>]+href=["\'][^"\']*latest-posts\.css[^"\']*["\'][^>]*>\s*', '\n', s, flags=re.I)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          for dead in [Path('assets/latest-posts.js'), Path('assets/latest-posts.css'), Path('scripts/apply_latest_cards.py')]:
              if dead.exists():
                  dead.unlink()
                  changed.append(str(dead))

          wf=Path('.github/workflows/fix-latest-posts-root.yml')
          if wf.exists():
              wf.unlink()
              changed.append(str(wf))

          print('changed:', *changed, sep='\n')
          PY
          if grep -R -n --include='*.html' -E 'id="dg-latest-posts"|SEO_CATEGORY_LINKS_START|latest-posts\.js|latest-posts\.css' .; then
            echo 'ERROR: latest-post remnants remain'
            exit 1
          fi
          test ! -e scripts/apply_latest_cards.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Permanently remove latest-post output and generator remnants'
          git push origin HEAD:main
