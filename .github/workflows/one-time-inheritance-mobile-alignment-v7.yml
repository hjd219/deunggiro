name: One-time inheritance mobile alignment v7
on:
  push:
    paths:
      - 'scripts/one_time_inheritance_mobile_alignment_v7.py'
      - '.github/workflows/one-time-inheritance-mobile-alignment-v7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply mobile alignment fix
        run: python scripts/one_time_inheritance_mobile_alignment_v7.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add inheritance.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix inheritance mobile text alignment"
          git push
