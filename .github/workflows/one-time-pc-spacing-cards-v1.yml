name: One-time PC spacing and cards v1
on:
  push:
    paths:
      - '.github/workflows/one-time-pc-spacing-cards-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PC only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          # Home PC service cards only
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          marker='/* HOME_SERVICE_CARDS_PC_FIX_V3 */'
          if marker not in s:
            css='''\n<style>\n/* HOME_SERVICE_CARDS_PC_FIX_V3 */\n@media(min-width:1001px){\n .quick{margin-top:-18px!important}\n .quick-grid{grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:14px!important}\n .quick-item.quick-rich{grid-template-columns:52px minmax(0,1fr) 28px!important;gap:10px!important;min-height:150px!important;padding:17px 11px 17px 15px!important;border-radius:16px!important}\n .quick-icon{width:50px!important;height:50px!important;border-radius:14px!important;padding:8px!important}\n .quick-item.quick-rich h3{font-size:16px!important;line-height:1.28!important;letter-spacing:-.7px!important;margin:2px 0 4px!important;word-break:keep-all!important}\n .quick-item.quick-rich.c4 h3{font-size:15px!important}\n .quick-item.quick-rich p{font-size:11px!important;line-height:1.4!important;word-break:keep-all!important}\n .quick-arrow{width:27px!important;height:27px!important;font-size:20px!important}\n}\n</style>\n'''
            s=s.replace('</head>',css+'\n</head>',1); p.write_text(s,encoding='utf-8')
          # Inheritance: reduce only desktop gap above process section
          p=Path('inheritance.html'); s=p.read_text(encoding='utf-8')
          marker='/* INHERITANCE_PC_PROCESS_GAP_V1 */'
          if marker not in s:
            css='''\n<style>\n/* INHERITANCE_PC_PROCESS_GAP_V1 */\n@media(min-width:801px){\n .inheritance-process-section,.inheritance-process-wrap,.inheritance-process{margin-top:0!important}\n .inheritance-process-section,.inheritance-process-wrap{padding-top:34px!important}\n section:has(.inheritance-flow){padding-top:34px!important;margin-top:0!important}\n}\n</style>\n'''
            s=s.replace('</head>',css+'\n</head>',1); p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html inheritance.html
          git commit -m 'Tighten PC service cards and inheritance process spacing'
          git push origin main