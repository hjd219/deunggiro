name: Selected Search Titles and Author Identity
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_search_titles_author.py'
      - '.github/workflows/apply-search-titles-author.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-selected-title-author
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect proposed changes
        run: python scripts/apply_search_titles_author.py --dry-run
      - name: Apply metadata-only edits
        run: python scripts/apply_search_titles_author.py
      - name: Check idempotence, formatting and file scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python scripts/apply_search_titles_author.py --dry-run | tee /tmp/check.json
          grep -q '"changed_files": 0' /tmp/check.json
          if git diff --name-only | grep -Ev '^(index\.html|posts/[^/]+\.html)$'; then
            echo "Unexpected modified path" >&2
            exit 1
          fi
      - name: Commit head-only edits
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All records already aligned"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts/*.html
          git commit -m "SEO: optimize 20 proven landing titles and link article authors to profile"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
