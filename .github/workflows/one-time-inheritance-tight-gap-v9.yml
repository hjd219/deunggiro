name: One-time inheritance mobile tight gap v9
on:
  push:
    paths:
      - '.github/workflows/one-time-inheritance-tight-gap-v9.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/one_time_inheritance_tight_gap_v9.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tighten inheritance mobile icon text spacing"
          git push
