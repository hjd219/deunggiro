name: Service icon container fix once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/service-icon-container-fix-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Modify existing source rules only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('assets/home.css')
          s=css.read_text(encoding='utf-8')
          old='.quick-icon{width:50px;height:50px;border-radius:14px;background:#fff;box-shadow:0 5px 14px rgba(31,41,55,.055);padding:8px;display:grid;place-items:center}'
          new='.quick-icon{width:50px;height:50px;padding:0;display:grid;place-items:center}'
          if s.count(old)!=1:
              raise SystemExit(f'desktop quick-icon source count={s.count(old)}')
          s=s.replace(old,new,1)
          oldm='.quick-icon{width:64px;height:64px;border-radius:17px;padding:10px}.quick-item.quick-rich h3{font-size:21px;line-height:1.3}'
          newm='.quick-icon{width:64px;height:64px;padding:0}.quick-item.quick-rich h3{font-size:21px;line-height:1.3}'
          if s.count(oldm)!=1:
              raise SystemExit(f'mobile quick-icon source count={s.count(oldm)}')
          s=s.replace(oldm,newm,1)
          css.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          oldlink='<link rel="stylesheet" href="/assets/home.css?v=20260912-calculator-preview-final">'
          newlink='<link rel="stylesheet" href="/assets/home.css?v=20260913-approved-icons">'
          if h.count(oldlink)!=1:
              raise SystemExit(f'home css link count={h.count(oldlink)}')
          p.write_text(h.replace(oldlink,newlink,1),encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          expected=$'assets/home.css\nindex.html'
          test "$changed" = "$expected" || { echo "$changed"; exit 1; }
      - name: Commit exact source edit and remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/service-icon-container-fix-once.yml
          git add assets/home.css index.html
          git commit -m '업무카드 아이콘 흰색 컨테이너 원본 제거'
          git pull --rebase origin main
          git push origin HEAD:main
