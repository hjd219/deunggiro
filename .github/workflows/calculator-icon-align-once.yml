name: Calculator icon align once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/calculator-icon-align-once.mjs
      - name: Verify
        run: |
          test "$(git diff --name-only)" = "assets/home.css"
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/home.css
          git commit -m '모바일 계산기 아이콘 슬림화 및 제목 정렬'
          git push
