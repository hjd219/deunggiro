name: Runtime structure cleanup once
on:
  push:
    paths:
      - '.github/workflows/runtime-structure-cleanup-once.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete AI runtime injection and guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('assets/detail-shell.js')
          s=p.read_text()
          old="""if(!document.getElementById('dg-ai-panel')&&!document.querySelector('script[data-dg-ai-widget]')){\n  const ai=document.createElement('script');\n  ai.src='/assets/ai-deunggiro-widget.js?v=20260915-4';\n  ai.defer=true;\n  ai.dataset.dgAiWidget='1';\n  document.head.appendChild(ai);\n}\n\n"""
          if old not in s:
              raise SystemExit('detail-shell AI block not found; abort')
          p.write_text(s.replace(old,'',1))

          p=Path('assets/site-shell.css')
          s=p.read_text()
          old='section.contact,section.cta,section.dg-shell-contact,.dg-shell-contact,.dg-ai-float,.dg-ai-panel,#dg-ai-open,#dg-ai-panel,[class*="ai-deunggiro"],script[data-dg-ai-widget],script[src*="ai-deunggiro-widget"]{display:none!important}'
          new='section.contact,section.cta,section.dg-shell-contact,.dg-shell-contact{display:none!important}'
          if old not in s:
              raise SystemExit('site-shell guard not found; abort')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify cleanup scope
        run: |
          ! grep -q "ai-deunggiro-widget" assets/detail-shell.js
          ! grep -q "dg-ai-panel\|ai-deunggiro" assets/site-shell.css
          git diff --check
          git diff -- assets/detail-shell.js assets/site-shell.css
      - name: Commit cleanup and remove this workflow
        run: |
          rm .github/workflows/runtime-structure-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/detail-shell.js assets/site-shell.css .github/workflows/runtime-structure-cleanup-once.yml
          git commit -m 'Clean obsolete AI runtime structure'
          git push
