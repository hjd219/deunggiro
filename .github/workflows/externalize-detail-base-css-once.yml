name: Externalize detail base CSS once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/externalize-detail-base-css-once.yml'

permissions:
  contents: write

jobs:
  externalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move identical first style block to shared asset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          pages = [
              Path('inheritance.html'),
              Path('renunciation.html'),
              Path('corporate.html'),
              Path('realestate.html'),
              Path('family.html'),
          ]

          extracted = {}
          for path in pages:
              text = path.read_text(encoding='utf-8')
              m = re.search(r'(<meta name="description"[^>]*>)(<style>)(.*?)(</style>)', text, re.S)
              if not m:
                  raise SystemExit(f'{path}: initial style block after description not found')
              css = m.group(3).strip() + '\n'
              extracted[path] = (text, m, css)

          hashes = {p: hashlib.sha256(v[2].encode()).hexdigest() for p,v in extracted.items()}
          if len(set(hashes.values())) != 1:
              raise SystemExit('Initial style blocks are not identical across 5 pages: ' + str(hashes))

          css = next(iter(extracted.values()))[2]
          asset = Path('assets/detail-base.css')
          if asset.exists():
              raise SystemExit('assets/detail-base.css already exists')
          asset.write_text('/* DETAIL_BASE_SHARED_V1 */\n' + css, encoding='utf-8')

          link = '<link rel="stylesheet" href="/assets/detail-base.css?v=20260913">'
          for path, (text, m, css) in extracted.items():
              replacement = m.group(1) + link
              new = text[:m.start()] + replacement + text[m.end():]
              if '<style>' + css.strip() + '</style>' in new:
                  raise SystemExit(f'{path}: initial inline block still present')
              if link not in new:
                  raise SystemExit(f'{path}: shared CSS link missing')
              path.write_text(new, encoding='utf-8')
          PY

          git diff --check -- inheritance.html renunciation.html corporate.html realestate.html family.html assets/detail-base.css
          git diff --stat -- inheritance.html renunciation.html corporate.html realestate.html family.html assets/detail-base.css

      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/externalize-detail-base-css-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html renunciation.html corporate.html realestate.html family.html assets/detail-base.css .github/workflows/externalize-detail-base-css-once.yml
          git commit -m '구조정리: 상세페이지 초기 공통 CSS 외부화'
          git push origin main
