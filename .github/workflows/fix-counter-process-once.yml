name: Fix counter cache and inheritance process text once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-counter-process-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact targeted changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              raw = p.read_text(encoding='utf-8')
              count = raw.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(raw.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'index.html',
              '<script src="/assets/firestore-counter-public.js?v=2" defer></script>',
              '<script src="/assets/firestore-counter-public.js?v=8" defer></script>'
          )

          empty = '<div class="process-box"><div class="process-row"><div class="proc"></div><div class="arrow">→</div><div class="proc"></div><div class="arrow">→</div><div class="proc"></div><div class="arrow">→</div><div class="proc"></div><div class="arrow">→</div><div class="proc"></div></div></div>'

          replacements = {
              'inheritance-missing-heir.html': '<div class="process-box"><div class="process-row"><div class="proc"><div class="proc-icon">📄</div><b>상속관계 확인</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">🔎</div><b>연락·주소 확인</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">👥</div><b>협의 가능성 검토</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">⚖</div><b>대체절차 검토</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">🏠</div><b>상속등기</b></div></div></div>',
              'inheritance-overseas-heir.html': '<div class="process-box"><div class="process-row"><div class="proc"><div class="proc-icon">🌏</div><b>신분·거주국 확인</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">📄</div><b>필요서류 확인</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">✍</div><b>공증·인증 준비</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">📝</div><b>번역·국내제출</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">🏠</div><b>상속등기</b></div></div></div>',
              'inheritance-substitute-succession.html': '<div class="process-box"><div class="process-row"><div class="proc"><div class="proc-icon">📅</div><b>사망순서 확인</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">📄</div><b>피대습자 확인</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">👪</div><b>대습상속인 확정</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">🧮</div><b>상속지분 계산</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">🏠</div><b>상속등기</b></div></div></div>',
              'inheritance-division.html': '<div class="process-box"><div class="process-row"><div class="proc"><div class="proc-icon">📄</div><b>상속인·재산 확인</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">👥</div><b>협의 가능성 검토</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">⚖</div><b>분할심판 청구</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">📝</div><b>분할방법 결정</b></div><div class="arrow">→</div><div class="proc"><div class="proc-icon">🏠</div><b>결과에 따른 등기</b></div></div></div>',
          }

          for path, new in replacements.items():
              replace_once(path, empty, new)

          # Verify only the intended source problems are gone.
          if 'firestore-counter-public.js?v=2' in Path('index.html').read_text(encoding='utf-8'):
              raise SystemExit('index.html counter cache version was not updated')
          for path in replacements:
              if empty in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'{path}: empty process row remains')

      - name: Verify diff scope
        run: |
          git diff --check
          git diff -- index.html inheritance-missing-heir.html inheritance-overseas-heir.html inheritance-substitute-succession.html inheritance-division.html

      - name: Commit targeted changes and remove one-time workflow
        run: |
          rm .github/workflows/fix-counter-process-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html inheritance-missing-heir.html inheritance-overseas-heir.html inheritance-substitute-succession.html inheritance-division.html .github/workflows/fix-counter-process-once.yml
          git diff --cached --check
          git commit -m "카운터 캐시 및 상속 상세 진행절차 수정"
          git push origin HEAD:main
