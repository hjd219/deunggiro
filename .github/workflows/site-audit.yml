name: SEO daily audit
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sitemap, RSS, metadata and internal links
        run: python scripts/site_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-audit-report.json
          if-no-files-found: warn
