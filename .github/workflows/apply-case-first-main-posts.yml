name: Apply case-first main posts
on:
  push:
    branches: [main]
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY_CASE_FIRST_MAIN_POSTS')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prioritize case posts on service main pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/latest-posts.js')
          s=p.read_text(encoding='utf-8')
          old="else{if(cats.length)arr=arr.filter(p=>cats.includes(p.category));arr=arr.slice(0,4)}"
          new="else{if(cats.length)arr=arr.filter(p=>cats.includes(p.category));const serviceMain=new Set(['/inheritance.html','/renunciation.html','/corporate.html','/realestate.html','/family.html']);if(serviceMain.has(PATH)){const isCase=p=>/(처리사례|사례)/.test(String(p.title||''));arr=[...arr.filter(isCase),...arr.filter(p=>!isCase(p))]}arr=arr.slice(0,4)}"
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove this workflow
        run: rm -f .github/workflows/apply-case-first-main-posts.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/latest-posts.js .github/workflows/apply-case-first-main-posts.yml
          git commit -m "업무별 메인 최신글 처리사례 우선 노출 [skip ci]"
          git pull --rebase origin main
          git push origin main