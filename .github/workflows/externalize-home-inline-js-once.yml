name: Externalize home inline JS once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/externalize-home-inline-js-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/externalize_home_inline_js_once.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/externalize-home-inline-js-once.yml scripts/externalize_home_inline_js_once.py
          git add index.html
          git commit -m '구조정리: 홈 인라인 JS 외부화 및 미사용 롤링 제거'
          git push origin main
