name: Externalize detail common CSS once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/externalize-detail-common-css-once.yml'

permissions:
  contents: write

jobs:
  externalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move shared detail CSS to assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path('inheritance.html'),
              Path('renunciation.html'),
              Path('corporate.html'),
              Path('realestate.html'),
              Path('family.html'),
          ]

          specs = [
              ('UNIFIED_SKYBLUE_HOVER_V1', Path('assets/detail-common-hover.css'), '/assets/detail-common-hover.css?v=20260913'),
              ('DETAIL_BG_RHYTHM_V2', Path('assets/detail-pages.css'), '/assets/detail-pages.css?v=20260913'),
          ]

          for marker, asset_path, href in specs:
              pattern = re.compile(r'<style>\s*(/\* '+re.escape(marker)+r' \*/.*?</style>)\s*', re.S)
              extracted = []
              texts = {}
              for page in pages:
                  text = page.read_text(encoding='utf-8')
                  texts[page] = text
                  matches = pattern.findall(text)
                  if len(matches) != 1:
                      raise SystemExit(f'{page}: expected exactly one {marker} block, found {len(matches)}')
                  inner = matches[0][:-8].rstrip() + '\n'
                  extracted.append(inner)

              first = extracted[0].replace('\r\n','\n')
              for page, css in zip(pages[1:], extracted[1:]):
                  if css.replace('\r\n','\n') != first:
                      raise SystemExit(f'{marker}: CSS differs in {page}')

              if asset_path.exists():
                  raise SystemExit(f'{asset_path} already exists')
              asset_path.write_text(first, encoding='utf-8')

              link = f'<link rel="stylesheet" href="{href}">\n'
              for page in pages:
                  text = texts[page]
                  text, count = pattern.subn(link, text, count=1)
                  if count != 1:
                      raise SystemExit(f'{page}: failed replacing {marker}')
                  if marker in text:
                      raise SystemExit(f'{page}: marker {marker} still remains')
                  if text.count(href) != 1:
                      raise SystemExit(f'{page}: expected one link for {href}')
                  page.write_text(text, encoding='utf-8')

          required_markers = {
              'inheritance.html': ['INHERITANCE_INFOGRAPHIC_V1'],
              'renunciation.html': ['RENUNCIATION_INHERITANCE_STYLE_V1'],
              'corporate.html': ['CORPORATE'],
              'realestate.html': ['REALESTATE_FINAL_V1'],
              'family.html': ['FAMILY_INHERITANCE_LAYOUT_V1'],
          }
          for filename, markers in required_markers.items():
              text = Path(filename).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'{filename}: required page-specific marker missing: {marker}')

          PY
          git diff --check -- inheritance.html renunciation.html corporate.html realestate.html family.html assets/detail-common-hover.css assets/detail-pages.css
          git diff --stat
          git diff -- inheritance.html renunciation.html corporate.html realestate.html family.html assets/detail-common-hover.css assets/detail-pages.css
      - name: Commit and remove one-time workflow
        run: |
          rm .github/workflows/externalize-detail-common-css-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html renunciation.html corporate.html realestate.html family.html assets/detail-common-hover.css assets/detail-pages.css .github/workflows/externalize-detail-common-css-once.yml
          git commit -m '구조정리: 상세페이지 공통 CSS 외부화'
          git push origin main
