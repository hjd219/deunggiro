name: Cleanup inheritance inline CSS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  clean:
    if: contains(github.event.head_commit.message, 'RUN_INHERITANCE_INLINE_CLEANUP')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate inheritance inline CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          hp=Path('inheritance.html'); cp=Path('assets/inheritance-core.css')
          s=hp.read_text(encoding='utf-8'); css=cp.read_text(encoding='utf-8')
          patterns=[r'<style>\s*/\* INHERITANCE_PROCESS_TOP_GAP_V2 \*/.*?</style>',r'<style>\.inheritance-search-status\{.*?</style>',r'<style id="dg-home-button-style">.*?</style>',r'<style>/\* INHERITANCE_FINDER_INLINE_STATIC_V1 \*/.*?</style>',r'<style>\.inheritance-finder\{.*?</style>',r'<style>\s*\.dg-inheritance-linkhub\{.*?</style>']
          counts=[]
          for pat in patterns:
            s,n=re.subn(pat,'',s,count=1,flags=re.S); counts.append(n)
          if counts != [1,1,1,1,1,1]: raise SystemExit(f'inline style match failure: {counts}')
          old='/assets/inheritance-core.css?v=20260913'; new='/assets/inheritance-core.css?v=20260918-2'
          if s.count(old)!=1: raise SystemExit(f'core css link count={s.count(old)}')
          s=s.replace(old,new,1)
          canonical='''

/* 상속페이지 인라인 스타일 통합 — 2026-09-18 */
@media(min-width:801px){body section:has(.inheritance-flow){padding-top:22px!important;margin-top:0!important}.inheritance-flow{margin-top:18px!important}}
.inheritance-search-status{min-height:22px;margin:6px 0 0 2px;color:#587080;font-size:12px;font-weight:700}.inheritance-search-status.is-active{color:#168dca}
.inheritance-finder-inline{margin-top:30px;padding-top:24px;border-top:1px solid rgba(54,169,225,.25);max-width:640px}.inheritance-finder-inline>h2{margin:0 0 13px;font-size:21px;letter-spacing:-.8px}
.inheritance-finder-layout{display:flex;flex-direction:column;gap:9px;width:100%;align-items:start}.inheritance-finder-right{width:100%;min-width:0}
.inheritance-search-row{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:7px}.inheritance-combo{position:relative}.inheritance-combo:before{content:"⌕";position:absolute;left:17px;top:6px;color:#7193a6;font-size:25px;z-index:2}
.inheritance-query{width:100%;height:48px;padding:0 56px 0 48px;border:1px solid #c7d5df;border-radius:9px;background:#fff;color:#26313a;font-size:16px;outline:none}.inheritance-query:focus{border-color:#36a9e1;box-shadow:0 0 0 3px rgba(54,169,225,.13)}
.inheritance-toggle{position:absolute;right:0;top:0;width:54px;height:48px;border:0;background:transparent;color:#26313a;font-size:14px;cursor:pointer}.inheritance-results{display:none;position:absolute;left:0;right:0;top:53px;z-index:40;max-height:310px;overflow:auto;margin:0;padding:7px;list-style:none;border:1px solid #d0dbe3;border-radius:9px;background:#fff;box-shadow:0 12px 28px rgba(26,52,70,.17)}.inheritance-results.is-open{display:block}.inheritance-results a{display:block;padding:11px 12px;border-radius:6px;color:#26313a;font-size:14px;line-height:1.45;text-decoration:none}.inheritance-results a:hover{background:#eaf7fd;color:#168dca}.result-type{display:inline-block;margin-right:7px;color:#168dca;font-size:11px;font-weight:900}.inheritance-empty{padding:14px 12px;color:#707b85;font-size:14px}
.inheritance-search-button{height:48px;border:0;border-radius:9px;background:#36a9e1;color:#fff;font-size:15px;font-weight:900;cursor:pointer}
.dg-home-button{width:48px!important;min-width:48px!important;height:48px!important;min-height:48px!important;padding:0!important;border:1px solid #84c9ed!important;border-radius:8px!important;background:#fff!important;color:#168dca!important;display:inline-flex!important;align-items:center!important;justify-content:center!important}.dg-home-button svg{width:21px!important;height:21px!important}.dg-home-button:hover,.dg-home-button:focus-visible{background:#36a9e1!important;color:#fff!important}
.dg-inheritance-linkhub{padding-top:48px!important;padding-bottom:48px!important}.dg-inheritance-linkhub .desc{margin-bottom:18px!important}.dg-inheritance-linkhub-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.dg-inheritance-linkhub-grid a{display:flex;min-height:92px;flex-direction:column;justify-content:center;padding:15px 14px;border:1px solid #dbe5ef;border-radius:10px;background:#fff;transition:.18s}.dg-inheritance-linkhub-grid a:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 8px 22px rgba(25,41,68,.06)}.dg-inheritance-linkhub-grid strong{display:block;color:#24384f;font-size:14px;line-height:1.4;letter-spacing:-.3px}.dg-inheritance-linkhub-grid span{display:block;margin-top:5px;color:#7a8491;font-size:11px;line-height:1.45}
@media(max-width:1000px){.dg-inheritance-linkhub-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.inheritance-finder-inline{margin-top:24px;padding-top:20px;max-width:none}.inheritance-search-row{grid-template-columns:minmax(0,1fr) 76px}.inheritance-query{font-size:14px;padding-left:43px}.inheritance-combo:before{left:14px}.inheritance-search-button{font-size:13px}}
@media(max-width:700px){.dg-inheritance-linkhub{padding-top:36px!important;padding-bottom:36px!important}.dg-inheritance-linkhub-grid{grid-template-columns:1fr 1fr;gap:8px}.dg-inheritance-linkhub-grid a{min-height:82px;padding:12px}.dg-inheritance-linkhub-grid strong{font-size:13px}.dg-inheritance-linkhub-grid span{font-size:10.5px}}
'''
          if '/* 상속페이지 인라인 스타일 통합 — 2026-09-18 */' in css: raise SystemExit('canonical block already exists')
          cp.write_text(css.rstrip()+canonical+'\n',encoding='utf-8'); hp.write_text(s,encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          test "$(grep -c '<style' inheritance.html || true)" = "0"
          grep -q 'inheritance-core.css?v=20260918-2' inheritance.html
          grep -q '상속페이지 인라인 스타일 통합' assets/inheritance-core.css
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "assets/inheritance-core.css inheritance.html "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inheritance.html assets/inheritance-core.css
          git commit -m "상속페이지 인라인 CSS 통합 정리 [skip ci]"
          git push origin HEAD:main
