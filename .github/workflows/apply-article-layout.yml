name: Apply article layout

on:
  push:
    branches: [main]
    paths:
      - 'assets/article-v2.js'
      - 'assets/article-v2.css'
      - 'scripts/apply-article-v2.py'
      - '.github/workflows/apply-article-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply shared article layout to all posts and admin template
        run: python scripts/apply-article-v2.py

      - name: Commit refreshed article pages
        run: |
          if git diff --quiet -- posts admin.html; then
            echo "No article page changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts admin.html
          git commit -m "자동 반영: 개별 법률정보 최신 양식"
          git push
