name: Extract inheritance PC layout once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-inheritance-pc-layout-once.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract PC layout JS without behavior changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('inheritance.html')
          s = html.read_text(encoding='utf-8')
          required_title = '<title>상속등기는 등기로 | 인천 단독상속·공동상속·유증</title>'
          if required_title not in s:
              raise SystemExit('SEO title guard failed')

          pat = re.compile(r'<script>\s*/\* INHERITANCE_PC_LAYOUT_V10 \*/\s*(\(function\(\)\{.*?\}\)\(\);)\s*</script>', re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit('INHERITANCE_PC_LAYOUT_V10 script not found')

          js = '/* INHERITANCE_PC_LAYOUT_V10 */\n' + m.group(1).strip() + '\n'
          asset = Path('assets/inheritance-pc-layout.js')
          if asset.exists():
              raise SystemExit('asset already exists')
          asset.write_text(js, encoding='utf-8')

          replacement = '<script src="/assets/inheritance-pc-layout.js?v=20260913" defer></script>'
          s2 = s[:m.start()] + replacement + s[m.end():]

          guards = [
              required_title,
              'INHERITANCE_MOBILE_REFERENCE_V11',
              'INHERITANCE_PC_LAYOUT_V10',
              'id="inheritance-overview"',
              'id="documents"',
              'INHERITANCE_FINDER_INLINE_STATIC_V1',
              '<script src="/assets/inheritance-pc-layout.js?v=20260913" defer></script>'
          ]
          for g in guards:
              if g not in s2 and g != 'INHERITANCE_PC_LAYOUT_V10':
                  raise SystemExit('guard missing: ' + g)
          if '<script>\n/* INHERITANCE_PC_LAYOUT_V10 */' in s2:
              raise SystemExit('old inline script residue')
          if 'const overview=document.querySelector' not in js or "window.matchMedia('(min-width:801px)')" not in js:
              raise SystemExit('extracted JS integrity failed')

          html.write_text(s2, encoding='utf-8')
          PY
          git diff --check
          git diff -- inheritance.html assets/inheritance-pc-layout.js
          rm .github/workflows/extract-inheritance-pc-layout-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html assets/inheritance-pc-layout.js .github/workflows/extract-inheritance-pc-layout-once.yml
          git commit -m '구조정리: 상속등기 PC 레이아웃 JS 외부화'
          git push origin main