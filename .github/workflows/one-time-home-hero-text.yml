name: One-time Home Hero Text

on:
  push:
    paths:
      - '.github/workflows/one-time-home-hero-text.yml'

permissions:
  contents: write

jobs:
  patch-home-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change only homepage hero text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_label = '<div class="hero-label">DEUNGGIRO · 등기로</div>'
          new_label = '<div class="hero-label">등기로 · 현재두 법무사 사무소</div>'
          old_h1 = '<h1>상속등기는 <span>등기로</span><br>법인등기도 <span>등기로</span></h1>'
          new_h1 = '<h1>복잡한 등기와 상속,<br><span>등기로</span>에서 더 쉽게</h1>'
          if old_label not in s:
              raise SystemExit('기존 hero-label 문구를 찾지 못했습니다.')
          if old_h1 not in s:
              raise SystemExit('기존 h1 문구를 찾지 못했습니다.')
          s = s.replace(old_label, new_label, 1).replace(old_h1, new_h1, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- index.html
      - name: Commit homepage text only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "홈페이지 메인 브랜드 문구 수정"
          git push
