name: Staticize inheritance search once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/staticize-inheritance-search-once.yml'

permissions:
  contents: write

jobs:
  staticize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply static inheritance search
        run: python3 scripts/staticize_inheritance_search_once.py
      - name: Verify and commit
        run: |
          git diff --check
          git diff -- inheritance.html
          rm .github/workflows/staticize-inheritance-search-once.yml
          rm scripts/staticize_inheritance_search_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html .github/workflows/staticize-inheritance-search-once.yml scripts/staticize_inheritance_search_once.py
          git commit -m '구조정리: 상속등기 검색영역 정적 HTML 반영'
          git push origin main
