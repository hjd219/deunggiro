name: One-time Article JSON-LD duplicate cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-article-schema-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deunggiro-content-main
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove only duplicated thumbnail Article JSON-LD
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/generate_thumbnails.py
          python - <<'PY'
          import json, re
          from pathlib import Path
          ld=re.compile(r'(<script\b[^>]*\btype=["\x27]application/ld\+json["\x27][^>]*>)([\s\S]*?)(</script>)',re.I)
          def scan(s):
              rows=[]
              for m in ld.finditer(s):
                  try:
                      data=json.loads(m.group(2))
                  except (ValueError,TypeError):
                      continue
                  nodes=data.get('@graph',[]) if isinstance(data,dict) and isinstance(data.get('@graph'),list) else [data]
                  for item in nodes:
                      if isinstance(item,dict):
                          types=item.get('@type') if isinstance(item.get('@type'),list) else [item.get('@type')]
                          if 'Article' in types:
                              rows.append((m,data,item))
                  # A script can have multiple nodes; all are accounted for.
              return rows
          changed=[]
          skipped=[]
          total=0
          for path in sorted(Path('posts').glob('*.html')):
              total+=1
              before=path.read_text(encoding='utf-8')
              articles=scan(before)
              if len(articles)<=1:
                  continue
              legacy=[r for r in articles if re.search(r'\bid=["\x27]dg-article-schema["\x27]',r[0].group(1),re.I)]
              primary=[r for r in articles if r not in legacy]
              if len(legacy)!=1 or len(primary)!=1:
                  skipped.append((str(path),len(articles),len(legacy),len(primary)))
                  continue
              old_m,old_obj,old_node=legacy[0]
              keep_m,keep_obj,keep_node=primary[0]
              # Preserve thumbnail ImageObject, but keep the canonical Person author,
              # publisher, published/modified dates, title and canonical link.
              if old_node.get('image') and not keep_node.get('image'):
                  keep_node['image']=old_node['image']
              new_primary=keep_m.group(1)+json.dumps(keep_obj,ensure_ascii=False,separators=(',',':'))+keep_m.group(3)
              operations=[
                  (old_m.start(),old_m.end(),''),
                  (keep_m.start(),keep_m.end(),new_primary),
              ]
              after=before
              for start,end,replacement in sorted(operations,reverse=True):
                  after=after[:start]+replacement+after[end:]
              if ld.sub('',before)!=ld.sub('',after):
                  raise AssertionError(f'non-JSONLD changed in {path}')
              result=scan(after)
              if len(result)!=1 or result[0][2].get('author')!=keep_node.get('author'):
                  raise AssertionError(f'Article count/author incorrect in {path}')
              if result[0][2].get('datePublished')!=primary[0][2].get('datePublished'):
                  raise AssertionError(f'published date changed in {path}')
              if after==before:
                  raise AssertionError(f'expected modified HTML in {path}')
              path.write_text(after,encoding='utf-8')
              changed.append(str(path))
          print('AUDITED_POST_FILES',total)
          print('FIXED_DUPLICATE_ARTICLE',len(changed))
          for p in changed:print('FIXED',p)
          print('OTHER_UNHANDLED_DUPLICATES',len(skipped))
          for row in skipped:print('REQUIRES_REVIEW',row)
          if skipped:raise SystemExit('Other Article duplicates require manual review')
          # Full archive final check
          bad=[]
          for path in Path('posts').glob('*.html'):
              if len(scan(path.read_text(encoding='utf-8')))>1:bad.append(str(path))
          if bad:raise SystemExit('Post-cleanup Article duplicates: '+str(bad))
          PY
          git diff --check
          test -z "$(git diff --name-only -- ':!posts/**')" || {
            echo "Unexpected non-post changes"; git diff --name-only; exit 1;
          }
      - name: Commit corrected articles only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then
            echo "No duplicate Article schemas found"
            exit 0
          fi
          git commit -m "Deduplicate Article JSON-LD while keeping original metadata"
          git pull --rebase origin main
          git push origin HEAD:main
