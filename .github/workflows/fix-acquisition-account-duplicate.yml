name: Fix acquisition calculator duplicate account
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-acquisition-account-duplicate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch acquisition calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('acquisition-calculator.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'<script id="calc-account-ui-script-v1">.*?</script>',s,re.S)
          if not old:
              raise SystemExit('account script not found')
          new='''<script id="calc-account-ui-script-v2">
document.addEventListener('DOMContentLoaded',function(){
  var result=document.querySelector('.result');
  if(!result) return;
  var nums=['110-482-692656','3333-07-6560416'];
  result.querySelectorAll('.account-box,.bank-account,.account-info,.deposit-account,.dg-estimate-account').forEach(function(el){el.remove();});
  Array.from(result.children).forEach(function(el){
    if(el.classList.contains('documents')||el.classList.contains('office-footer')||el.classList.contains('print-footer')) return;
    var t=(el.textContent||'').replace(/\\s/g,'');
    if(nums.some(function(n){return t.includes(n)})) el.remove();
  });
  var box=document.createElement('section');
  box.className='account-box';
  box.setAttribute('aria-label','입금계좌');
  box.innerHTML='<div class="account-title"><span>현재두 법무사 사무소</span></div><div class="account-list"><div class="account-row"><div class="account-bank">신한은행</div><div class="account-main"><strong class="account-number">110-482-692656</strong><span class="account-holder">현재두법무사사무소</span></div></div><div class="account-row"><div class="account-bank">카카오뱅크</div><div class="account-main"><strong class="account-number">3333-07-6560416</strong><span class="account-holder">현재두법무사사무소</span></div></div></div>';
  var pdf=result.querySelector('.pdf-download');
  if(pdf) pdf.insertAdjacentElement('beforebegin',box);
  else {var docs=result.querySelector('.documents'); if(docs) docs.insertAdjacentElement('afterend',box); else result.appendChild(box);}
});
</script>'''
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add acquisition-calculator.html
          git diff --cached --quiet && exit 0
          git commit -m "부동산 계산기 입금계좌 중복 제거"
          git push
