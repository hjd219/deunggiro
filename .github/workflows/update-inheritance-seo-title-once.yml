name: Update inheritance SEO title once
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-inheritance-seo-title-once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update title only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inheritance.html')
          s=p.read_text(encoding='utf-8')
          old='<title>상속등기는 등기로 | 인천 상속등기·상속재산분할</title>'
          new='<title>상속등기는 등기로 | 인천 단독상속·공동상속·유증</title>'
          if s.count(old)!=1:
              raise SystemExit(f'expected old title exactly once, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check -- inheritance.html
          git diff -- inheritance.html
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/update-inheritance-seo-title-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inheritance.html .github/workflows/update-inheritance-seo-title-once.yml
          git commit -m 'SEO: 상속등기 제목 키워드 변경'
          git push origin main
