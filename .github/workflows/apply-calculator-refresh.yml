name: Apply calculator refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-calculator-refresh.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch calculator pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages={
            'corporate-calculator.html':'corporate-calculator-page',
            'acquisition-calculator.html':'acquisition-calculator-page',
          }
          link='<link rel="stylesheet" href="/assets/calculator-refresh.css?v=1">'
          for fn, cls in pages.items():
            p=Path(fn); t=p.read_text(encoding='utf-8')
            if '/assets/calculator-refresh.css' not in t:
              t=t.replace('</head>',link+'\n</head>',1)
            m=re.search(r'<body([^>]*)>',t,re.I)
            if m:
              attrs=m.group(1)
              if 'class=' in attrs:
                attrs=re.sub(r'class=(['\"'])(.*?)\1',lambda x:'class='+x.group(1)+('calculator-page '+cls+' '+x.group(2)).strip()+x.group(1),attrs,1)
              else:
                attrs+=' class="calculator-page '+cls+'"'
              t=t[:m.start()]+'<body'+attrs+'>'+t[m.end():]
            p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corporate-calculator.html acquisition-calculator.html
          git diff --cached --quiet || git commit -m "Refresh corporate and acquisition calculator design"
          git push
