name: icon borderless
on: workflow_dispatch
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sed -i 's/border:1px solid rgba(32,36,43,.07);border-radius:10px;box-shadow:0 2px 8px rgba(31,41,55,.08)/border:0;border-radius:10px;box-shadow:none/' assets/home.css
