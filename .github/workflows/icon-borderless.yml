name: icon borderless
on:
  push:
    branches: [main]
    paths: ['.github/workflows/icon-borderless.yml']
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/border:1px solid rgba(32,36,43,.07);border-radius:10px;box-shadow:0 2px 8px rgba(31,41,55,.08)/border:0;border-radius:10px;box-shadow:none/' assets/home.css
          rm .github/workflows/icon-borderless.yml
          git config user.name github-actions
          git config user.email actions@github.com
          git add assets/home.css .github/workflows/icon-borderless.yml
          git commit -m '업무카드 아이콘 영역 테두리 제거'
          git push
