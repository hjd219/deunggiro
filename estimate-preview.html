<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>견적서 미리보기 | 등기로</title>
<link rel="canonical" href="https://www.deunggiro.kr/acquisition-calculator.html">
<meta http-equiv="refresh" content="1;url=https://www.deunggiro.kr/acquisition-calculator.html">
<script>
(function () {
  var target = '/acquisition-calculator.html';
  try {
    if (sessionStorage.getItem('deunggiroEstimatePreview')) {
      target = '/estimate-preview-v2.html' + location.search + location.hash;
    } else {
      var source = sessionStorage.getItem('deunggiroEstimateSource') || '';
      if (/^\/(?:acquisition|corporate|renunciation)-calculator\.html(?:[?#]|$)/.test(source)) target = source;
    }
  } catch (e) {}
  location.replace(target);
}());
</script>
</head>
<body><p>견적서 주소가 변경되었습니다. <a href="https://www.deunggiro.kr/acquisition-calculator.html">현재 비용 계산기로 이동</a>하세요.</p></body>
</html>
