<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>등기로 예상 견적서</title>
<style>
:root{--s:#35a9e1;--n:#172840;--m:#718096}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef4f8;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:#172840}
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;padding:10px;background:rgba(255,255,255,.96);border-bottom:1px solid #d6e2ea}
.toolbar button{border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer}
.back{background:#eaf1f5;color:#263e53}.print{background:#35a9e1;color:#fff}
.guide{text-align:center;padding:8px 14px 0;color:#5d7080;font-size:12px}
.paper{width:min(210mm,calc(100% - 20px));min-height:297mm;margin:12px auto 28px;background:#fff;padding:12mm;box-shadow:0 8px 28px rgba(24,55,77,.12)}
.paper .pdf-download,.paper .consult,.paper .step,.paper .floating-actions,.paper .mobile-nav{display:none!important}
.paper .result{display:block!important;position:static!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;transform:none!important;zoom:1!important;background:#fff!important}
.paper .print-title{display:flex!important;align-items:end!important;justify-content:space-between!important;padding-bottom:12px!important;margin-bottom:14px!important;border-bottom:3px solid #35a9e1!important}
.paper .print-title b{font-size:25px!important;color:#35a9e1!important}
.paper .print-title span{font-size:18px!important;font-weight:900!important;color:#172840!important}
.paper .print-title small{font-size:9px!important;color:#718096!important}
.paper .selected{font-size:10px!important;margin-bottom:10px!important;color:#263e53!important;font-weight:700!important}
.paper .print-columns{display:grid!important;grid-template-columns:1fr 1fr!important;gap:18px!important;align-items:start!important}
.paper .print-col{min-width:0!important;width:100%!important}
.paper .print-col h3,.paper .result h3{font-size:14px!important;margin:6px 0 9px!important;color:#10263d!important;font-weight:800!important}
.paper .print-col .row{display:flex!important;justify-content:space-between!important;gap:10px!important;font-size:10.5px!important;padding:7px 0!important;border-bottom:1px solid #7899af!important}
.paper .print-col .row span{color:#10263d!important;font-size:11px!important;font-weight:700!important;max-width:68%!important}
.paper .print-col .row b{color:#091f33!important;font-size:11px!important;font-weight:800!important;text-align:right!important}
.paper .total{break-inside:avoid!important;margin-top:8px!important;padding:11px 13px!important;background:#eef9fe!important;border-radius:8px!important}
.paper .total span{color:#263e53!important;font-weight:800!important}
.paper .total strong{font-size:18px!important;font-weight:800!important;color:#168dca!important}
.paper .documents{display:block!important;margin-top:12px!important;padding:13px 15px!important;border:1px solid #91adbf!important;background:#e8f6fc!important;border-radius:8px!important}
.paper .documents h3{font-size:11px!important;margin:0 0 5px!important}
.paper .doc-line{font-size:9px!important;line-height:1.4!important;margin:3px 0!important;color:#263e53!important;font-weight:700!important}
.paper .print-footer{display:block!important;margin-top:8px!important;padding-top:8px!important;font-size:8px!important;color:#263e53!important;font-weight:700!important}
.paper .office-footer{display:block!important;margin-top:12px!important;padding:10px 12px!important;border:1px solid #91adbf!important;border-radius:9px!important;background:#f2faff!important;color:#1d354b!important;font-size:9px!important;line-height:1.55!important}
.paper .office-footer b{display:block!important;margin:0 0 3px!important;color:#168dca!important;font-size:11px!important;font-weight:900!important}
@media(max-width:700px){
 .toolbar{padding:8px}.toolbar button{flex:1;max-width:180px}
 .paper{width:calc(100% - 12px);min-height:0;margin:8px auto 20px;padding:14px}
 .paper .print-title b{font-size:22px!important}.paper .print-title span{font-size:16px!important}
 .paper .print-columns{grid-template-columns:1.2fr .8fr!important;gap:12px!important}
 .paper .print-col .row{display:block!important}
 .paper .print-col .row span,.paper .print-col .row b{display:block!important;max-width:none!important;text-align:left!important}
 .paper .print-col .row b{margin-top:2px!important}
}
@media print{
 @page{size:A4;margin:12mm}
 html,body{background:#fff!important}
 .toolbar,.guide{display:none!important}
 .paper{width:100%!important;min-height:0!important;margin:0!important;padding:0!important;box-shadow:none!important}
 *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
</style>
</head>
<body>
<div class="toolbar">
  <button class="back" type="button" onclick="history.back()">계산기로 돌아가기</button>
  <button class="print" type="button" onclick="window.print()">PDF 저장 / 인쇄</button>
</div>
<div class="guide">견적서 화면입니다. 인쇄창이 열리지 않는 앱에서는 브라우저 메뉴의 공유·인쇄 기능을 이용할 수 있습니다.</div>
<main class="paper" id="paper"></main>
<script>
(function(){
  const raw=sessionStorage.getItem('deunggiroEstimatePreview');
  if(!raw){
    document.getElementById('paper').innerHTML='<p style="text-align:center;padding:60px 0">견적 정보가 없습니다.<br><button onclick="history.back()" style="margin-top:14px;padding:10px 16px">돌아가기</button></p>';
    return;
  }
  try{
    const data=JSON.parse(raw);
    document.title=(data.title||'등기로 예상 견적서');
    document.getElementById('paper').innerHTML=data.html||'';
  }catch(e){
    document.getElementById('paper').textContent='견적서를 표시하지 못했습니다.';
  }
})();
</script>
</body>
</html>
