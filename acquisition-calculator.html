<!doctype html><html lang="ko"><head><link rel="icon" type="image/png" href="/favicon.png?v=4"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부동산 취득세 계산기 | 등기로</title><meta name="description" content="매매·증여·상속 부동산의 취득세, 지방교육세, 농어촌특별세를 계산하는 등기로 부동산 취득세 계산기입니다."><meta property="og:title" content="부동산 취득세 계산기 | 등기로"><meta property="og:description" content="매매·증여·상속 부동산의 취득세, 지방교육세, 농어촌특별세를 계산하는 등기로 부동산 취득세 계산기입니다."><style>*{box-sizing:border-box}:root{--s:#35a9e1;--sd:#168dca;--n:#172840;--l:#e4ebf1;--bg:#f5f8fb;--m:#718096}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;color:#202936}.header{height:76px;background:#fff;border-bottom:3px solid var(--s);display:flex;align-items:center}.head{width:min(1180px,calc(100% - 32px));margin:auto}.logo{font-size:28px;font-weight:900}.logo small{display:block;font-size:11px;color:#777;font-weight:500}.hero{text-align:center;padding:42px 15px 26px}.hero b,.step{font-size:12px;color:var(--sd);letter-spacing:1px}.hero h1{font-size:36px;color:var(--n);margin:7px 0;letter-spacing:-2px}.hero p{font-size:14px;color:var(--m)}.wrap{width:min(1120px,calc(100% - 28px));margin:auto;display:grid;grid-template-columns:1.28fr .72fr;gap:20px;align-items:start}.card{background:#fff;border:1px solid var(--l);border-radius:20px;box-shadow:0 16px 45px rgba(23,40,64,.07)}.form{padding:28px}.form h2{font-size:21px;margin:7px 0 17px;color:var(--n)}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}.opt{height:50px;border:1px solid #dce5ed;border-radius:12px;background:#fff;font-weight:850;color:#455468;cursor:pointer}.opt.on{border:2px solid var(--s);background:#effaff;color:#137fb4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#4b5969}.field input,.field select{width:100%;height:49px;border:1px solid #d9e3eb;border-radius:11px;padding:0 12px;background:#fbfdff;font:inherit}.full{grid-column:1/-1}.calc{width:100%;height:52px;margin-top:22px;border:0;border-radius:12px;background:var(--s);color:white;font-weight:900;font-size:15px;cursor:pointer}.result{padding:25px;position:sticky;top:20px}.result h3{margin:5px 0 20px;color:var(--n)}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1f5;font-size:13px;color:#657386}.row b{color:#26384b}.total{margin-top:20px;padding:18px;border-radius:14px;background:#f0f9fd}.total span{font-size:12px;color:#5d7180;font-weight:800}.total strong{display:block;color:#1284ba;font-size:29px;margin-top:3px}.note{font-size:11px;color:#8996a3;line-height:1.6;margin-top:14px}.hidden{display:none}@media(max-width:800px){.header{height:64px;border-bottom-width:2px}.hero h1{font-size:29px}.wrap{grid-template-columns:1fr;width:calc(100% - 20px)}.form,.result{padding:18px 15px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.result{position:static}.card{border-radius:15px}}</style><link rel="stylesheet" href="/assets/site-shell.css?v=6">
</head><body><header class="header"><div class="head"><div class="logo">등기로<small>현재두 법무사 사무소</small></div></div></header><section class="hero"><b>REAL ESTATE TAX</b><h1>부동산 취득세 계산기</h1><p>매매·증여·상속에 따른 예상 취득세를 계산합니다.</p></section><main class="wrap"><section class="card form"><div class="step">STEP 01</div><h2>취득 원인</h2><div class="opts"><button class="opt on" data-v="sale">매매</button><button class="opt" data-v="gift">증여</button><button class="opt" data-v="inherit">상속</button></div><div class="step">STEP 02</div><h2>계산 조건</h2><div class="grid"><div class="field"><label>부동산 종류</label><select id="kind"><option value="house">주택</option><option value="nonhouse">주택외 건물·토지(농지외)</option><option value="farm">농지</option><option value="mixed">주택+비주택 복합취득</option></select></div><div class="field"><label id="priceLabel">취득가액</label><input id="price" value="500,000,000"></div><div id="areaF" class="field"><label>지역</label><select id="area"><option value="non">조정대상지역 이외</option><option value="adj">조정대상지역</option></select></div><div id="homesF" class="field"><label>취득 후 주택 수</label><select id="homes"><option value="1">1주택</option><option value="2">2주택</option><option value="3">3주택</option><option value="4">4주택 이상</option></select></div><div id="sizeF" class="field"><label>전용면적</label><select id="size"><option value="small">85㎡ 이하</option><option value="large">85㎡ 초과</option></select></div><div id="excludeF" class="field"><label>중과세 제외주택</label><select id="exclude"><option value="no">아니오</option><option value="yes">예</option></select></div><div id="luxF" class="field"><label>고급주택·별장</label><select id="lux"><option value="no">아니오</option><option value="yes">예</option></select></div><div id="stdF" class="field hidden"><label>주택 시가표준액(공시가격)</label><input id="std" value="300,000,000"></div><div id="selfFarmF" class="field hidden"><label>자경농민</label><select id="selfFarm"><option value="no">아니오</option><option value="yes">예</option></select></div><div id="oneHouseF" class="field hidden"><label>상속 1가구 1주택</label><select id="oneHouse"><option value="no">아니오</option><option value="yes">예</option></select></div><div id="mixedF" class="field full hidden"><div class="grid"><div class="field"><label>주택 시가표준액</label><input id="houseStd" value="300,000,000"></div><div class="field"><label>비주택 시가표준액</label><input id="nonStd" value="200,000,000"></div></div></div></div><button class="calc" id="calc">취득세 계산하기</button></section><aside class="card result"><div class="step">TAX RESULT</div><h3>예상 취득세</h3><div class="row"><span>취득세</span><b id="acq">0원</b></div><div class="row"><span>지방교육세</span><b id="edu">0원</b></div><div class="row"><span>농어촌특별세</span><b id="rural">0원</b></div><div class="total"><span>예상 납부세액</span><strong id="total">0원</strong></div><p class="note">계산 결과는 참고용이며 실제 신고 시 과세표준·주택 수·지역·감면요건 등에 따라 달라질 수 있습니다.</p></aside></main><script>let mode='sale';const $=x=>document.getElementById(x),money=n=>Math.round(n).toLocaleString()+'원',num=x=>+(String(x.value).replace(/[^\d]/g,''))||0;document.querySelectorAll('input').forEach(x=>x.oninput=()=>{let n=x.value.replace(/[^\d]/g,'');x.value=n?(+n).toLocaleString():''});document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.v;sync();});function show(id,v){$(id).classList.toggle('hidden',!v)}function sync(){let k=$('kind').value,h=k==='house'||k==='mixed';show('areaF',h&&mode!=='inherit');show('homesF',h&&mode==='sale');show('sizeF',h);show('excludeF',h&&mode!=='inherit');show('luxF',h&&mode!=='inherit');show('stdF',h&&mode==='gift');show('selfFarmF',k==='farm');show('oneHouseF',k==='house'&&mode==='inherit');show('mixedF',k==='mixed'&&mode==='sale');$('priceLabel').textContent=mode==='inherit'?'시가표준액(공시가격)':mode==='gift'?'시가인정액':'취득가액';calculate()}function normalRate(p){if(p<=600000000)return .01;if(p>900000000)return .03;let r=(p*2/300000000-3)*.01;return Math.round(r*10000)/10000}function normalEdu(p){return normalRate(p)*.1}function houseSale(p){let homes=+$('homes').value,adj=$('area').value==='adj',ex=$('exclude').value==='yes',lux=$('lux').value==='yes',small=$('size').value==='small',r,e,n;if(ex||(adj&&homes<=1)||(!adj&&homes<=2)){r=normalRate(p);e=normalEdu(p);n=small?0:.002}else if((adj&&homes===2)||(!adj&&homes===3)){r=.08;e=.004;n=small?0:.006}else{r=.12;e=.004;n=small?0:.01}if(lux)r+=.08;return[p*r,p*e,p*n]}function calculate(){let p=num($('price')),k=$('kind').value,a=0,e=0,n=0;if(mode==='sale'){if(k==='house'){[a,e,n]=houseSale(p)}else if(k==='nonhouse'){a=p*.04;e=p*.004;n=p*.002}else if(k==='farm'){let sf=$('selfFarm').value==='yes';a=p*.03*(sf?.5:1);e=p*.002*(sf?.5:1);n=sf?0:p*.002}else{let hs=num($('houseStd')),ns=num($('nonStd')),sum=hs+ns,hp=sum?p*hs/sum:0,np=p-hp;[a,e,n]=houseSale(hp);a+=np*.04;e+=np*.004;n+=np*.002}}else if(mode==='gift'){if(k==='house'){let adj=$('area').value==='adj',std=num($('std')),ex=$('exclude').value==='yes',lux=$('lux').value==='yes',small=$('size').value==='small',high=adj&&std>=300000000&&!ex;let ar=high?.12:.035;if(lux)ar+=.08;a=p*ar;e=p*(high?.004:(lux?.004:.003));n=small&&!lux?0:p*(high?.01:.002)}else if(k==='nonhouse'||k==='farm'){a=p*.035;e=p*.003;n=p*.002}}else{if(k==='farm'){let sf=$('selfFarm').value==='yes';a=sf?p*.015:p*.023;e=p*.0006*(sf?.5:1);n=sf?0:p*.002}else{a=p*.028;e=p*.0016;n=(k==='house'&&$('oneHouse').value==='yes')?0:p*.002}}$('acq').textContent=money(a);$('edu').textContent=money(e);$('rural').textContent=money(n);$('total').textContent=money(a+e+n)}$('calc').onclick=calculate;$('kind').onchange=sync;document.querySelectorAll('select,input').forEach(x=>x.addEventListener('change',calculate));sync();</script><script src="/assets/site-shell.js?v=6"></script>
</body></html>
