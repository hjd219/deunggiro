<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>등기로 임원관리 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:#173b4a;background:#fff}.wrap{max-width:1100px;margin:0 auto;padding:55px 24px}.head{margin-bottom:28px}.head h1{margin:0 0 10px;font-size:28px}.head p{margin:0;color:#71838b;font-size:13px}.box{border:1px solid #d9e5ea;border-radius:10px;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.box.drag{border-color:#168dca;background:#f7fbfd}.top h3{margin:0 0 7px;font-size:16px}.top p{margin:0;color:#71838b;font-size:13px}.actions{display:flex;gap:8px}.file{display:none}.pick,.run{padding:11px 16px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer}.pick{border:1px solid #c8e8f7;color:#168dca;background:#f7fbfd}.run{border:0;background:#168dca;color:#fff}.run:disabled{opacity:.45}.status{margin-top:14px;color:#71838b;font-size:12px}.result{display:none;margin-top:25px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.summary span{padding:7px 10px;background:#f1f8fc;border-radius:999px;font-size:12px}.table{overflow:auto;border:1px solid #d9e5ea;border-radius:10px}.table table{width:100%;min-width:780px;border-collapse:collapse;font-size:13px}.table th,.table td{padding:12px;border-bottom:1px solid #e1e9ed;text-align:left}.table th{background:#f7fbfd}.event{color:#168dca;font-weight:800}.expiry{font-weight:800}.raw{margin-top:25px}.raw pre{white-space:pre-wrap;word-break:break-all;background:#f7f9fa;padding:15px;border-radius:8px;font-size:11px;max-height:300px;overflow:auto}
@media(max-width:700px){#manager,#phone,#email{grid-column:1/-1}.wrap{padding:30px 15px}.top{display:block}.actions{margin-top:18px}.pick,.run{flex:1;text-align:center}}
</style></head><body><main class="wrap"><div class="head"><h1>임원 임기관리 테스트</h1><p>실제 www.deunggiro.kr 도메인에서 Gemini Worker 호출을 확인하는 테스트 페이지입니다.</p></div>
<div class="box"><div style="margin-bottom:22px"><h3 style="margin:0 0 14px;font-size:16px">임기관리 신청정보</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px"><input id="manager" placeholder="담당자 이름" style="padding:12px;border:1px solid #d9e5ea;border-radius:8px"><input id="phone" type="tel" placeholder="휴대전화번호" style="padding:12px;border:1px solid #d9e5ea;border-radius:8px"><input id="email" type="email" placeholder="이메일" style="padding:12px;border:1px solid #d9e5ea;border-radius:8px"></div><div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:13px;font-size:13px"><label><input type="checkbox" id="notifyKakao" checked> 카카오 알림톡</label><label><input type="checkbox" id="notifyEmail" checked> 이메일</label><label><input type="checkbox" id="consent"> 임기관리 및 알림 수신에 동의합니다.</label></div><p style="margin:10px 0 0;color:#71838b;font-size:12px">카카오 알림톡은 휴대전화번호로 발송되며, 실제 자동발송은 알림톡 API 연결 후 활성화됩니다.</p></div><div class="top"><div><h3>등기사항증명서 등록</h3><p>PDF · JPG · PNG / 최대 15MB</p></div><div class="actions"><label class="pick" for="f">파일 선택</label><input class="file" id="f" type="file" accept=".pdf,.jpg,.jpeg,.png"><button class="run" id="go">임원 확인</button></div></div><div class="status" id="st">파일을 선택하세요.</div><div class="result" id="result"><div class="summary" id="sum"></div><div class="table"><table><thead><tr><th>직위</th><th>성명</th><th>최근 이력</th><th>임기 기준일</th><th>예상 만료</th><th>관리</th></tr></thead><tbody id="tb"></tbody></table></div><div class="raw"><b>Worker 원본 응답</b><pre id="raw"></pre></div></div></div></main>
<script>
(()=>{const W="https://deunggiro-ocr.hapuha21.workers.dev/",f=document.getElementById("f"),b=document.getElementById("go"),s=document.getElementById("st"),r=document.getElementById("result"),su=document.getElementById("sum"),tb=document.getElementById("tb"),raw=document.getElementById("raw"),z=x=>String(x??"").trim(),D=x=>{let q=z(x),m=q.match(/(\d{4})\D{0,3}(\d{1,2})\D{0,3}(\d{1,2})/);return m?m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0"):q},T=x=>{let q=new Date(D(x)+"T00:00:00");return isNaN(q)?-Infinity:+q},H=x=>z(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function P(x){x=z(x).replace(/\s/g,"");for(const q of["감사위원","대표이사","사외이사","기타비상무이사","사내이사","감사"])if(x.includes(q))return q;return x.includes("이사")?"이사":x}
function E(event,raw=""){const t=z(raw).replace(/\s/g,""),e=z(event).replace(/\s/g,"");for(const q of["해임","퇴임","사임","중임","취임"])if(t.includes(q))return q;if(t.includes("주소기입")||t.includes("주소변경"))return"주소변경";if(e.includes("주소"))return"주소변경";for(const q of["해임","퇴임","사임","중임","취임"])if(e.includes(q))return q;return"기타"}
function C(es,incorporationDate){
  const g=new Map,inc=D(incorporationDate);
  for(const q of es||[]){
    const x={...q,name:z(q.name),position:P(q.position),event:E(q.event,q.raw_text),event_date:D(q.event_date),registration_date:D(q.registration_date)};
    if(!x.name||!x.position)continue;
    const k=x.name+"|"+x.position;
    if(!g.has(k))g.set(k,[]);
    g.get(k).push(x);
  }
  const out=[];
  for(const a of g.values()){
    a.sort((x,y)=>T(x.event_date||x.registration_date)-T(y.event_date||y.registration_date));
    let active=false,lastStart=null,hasStart=false,hasAddress=false,ended=false;
    for(const x of a){
      if(x.event==="주소변경"){hasAddress=true;continue}
      if(x.event==="기타")continue;
      if(["취임","중임"].includes(x.event)){active=true;ended=false;hasStart=true;lastStart=x;continue}
      if(["사임","퇴임","해임"].includes(x.event)){active=false;ended=true;lastStart=null}
    }
    if(active&&lastStart){out.push(lastStart);continue}
    if(!hasStart&&hasAddress&&!ended&&inc){
      const src=a[a.length-1];
      out.push({...src,event:"설립취임",event_date:inc,registration_date:src.registration_date});
    }
  }
  return out;
}
function addYears(dateText,years){const m=D(dateText).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return"확인 필요";const y=Number(m[1])+years,mo=Number(m[2]),d=Number(m[3]);const last=new Date(y,mo,0).getDate();return y+"-"+String(mo).padStart(2,"0")+"-"+String(Math.min(d,last)).padStart(2,"0")}
function expiry(o){const base=o.event_date||o.registration_date;if(o.position.includes("감사")){const m=D(base).match(/^(\d{4})-/);return m?(Number(m[1])+3)+"-03-31":"확인 필요"}const d=addYears(base,3);if(d==="확인 필요")return d;const dt=new Date(d+"T00:00:00");dt.setDate(dt.getDate()-1);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
const box=document.querySelector(".box");function showFile(file){s.textContent=file?file.name:"파일을 선택하세요."}f.onchange=()=>showFile(f.files[0]);["dragenter","dragover"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();box.classList.add("drag")}));["dragleave","drop"].forEach(ev=>box.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();box.classList.remove("drag")}));box.addEventListener("drop",e=>{const file=e.dataTransfer.files&&e.dataTransfer.files[0];if(!file)return;const ok=/\.(pdf|jpe?g|png)$/i.test(file.name);if(!ok){s.textContent="PDF · JPG · PNG 파일만 가능합니다.";return}if(file.size>15*1024*1024){s.textContent="15MB 이하 파일만 가능합니다.";return}const dt=new DataTransfer();dt.items.add(file);f.files=dt.files;showFile(file)});
b.onclick=async()=>{if(!f.files[0]){s.textContent="파일을 먼저 선택하세요.";return}b.disabled=true;s.textContent="Worker → Gemini 분석 중…";r.style.display="none";try{let fd=new FormData;fd.append("file",f.files[0],f.files[0].name);let x=await fetch(W,{method:"POST",body:fd}),j=await x.json();raw.textContent=JSON.stringify(j,null,2);if(!x.ok||j.error)throw Error(j.detail||j.error||"분석 실패");let os=C(j.officer_events,j.company?.incorporation_date);su.innerHTML="<span>상호 · "+H(j.company?.name||"확인 필요")+"</span><span>현재 임원 · "+os.length+"명</span><span>확인 이력 · "+(j.officer_events||[]).length+"건</span>";tb.innerHTML=os.length?os.map(o=>"<tr><td>"+H(o.position)+"</td><td><b>"+H(o.name)+"</b></td><td class='event'>"+H(o.event)+"</td><td>"+H(o.event_date||o.registration_date||"확인 필요")+"</td><td class='expiry'>"+H(expiry(o))+"</td><td>"+(o.position.includes("감사")?"12월 결산 기준":"3년 기준")+"</td></tr>").join(""):"<tr><td colspan='6'>현재 임원으로 확인된 이력이 없습니다.</td></tr>";r.style.display="block";s.textContent="분석 완료"}catch(e){r.style.display="block";s.textContent="분석 실패 · "+e.message}finally{b.disabled=false}}})();
</script></body></html>
