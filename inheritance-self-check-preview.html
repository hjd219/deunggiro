<script>

const Q={

conflict:['친권자와 미성년자 사이에 이해상반이 있나요?','부모와 미성년자가 공동상속인이고 협의분할로 지분이 달라지는 경우 등을 확인합니다.',[['예, 이해상반이 있습니다','yes','특별대리인 선임 검토'],['아니오','no','특별대리인 절차 생략']]],

substitute:['먼저 사망한 자녀·형제자매가 있어 대습상속인이 있나요?','사망순서와 가족관계를 확인해 대습상속 여부를 판단합니다.',[['예','yes','대습상속인 범위 확인'],['아니오','no','대습상속 절차 생략'],['잘 모르겠습니다','unknown','제적등본 등 확인']]],
period:['사망 사실과 내가 상속인이라는 사실을 안 지 3개월이 지났나요?','3개월 이내라면 특별한정승인 질문은 생략합니다.',[['예, 지났습니다','late','기산점·특별한정승인 확인'],['아니오, 3개월 이내입니다','within','일반 포기·한정승인 검토']]],
multi:['현재 같은 순위 공동상속인이 여러 명인가요?','공동상속인 수에 따라 안전한 처리방식이 달라질 수 있습니다.',[['예, 여러 명입니다','yes','1명 한정승인 + 나머지 포기 검토'],['아니오, 사실상 1명입니다','no','단독 절차 검토']]],

debt:['재산보다 채무가 더 많은 것이 명확한가요?','채무초과가 명확한지, 재산과 채무가 불확실한지에 따라 절차를 나눕니다.',[['예, 빚이 확실히 많습니다','more','포기·한정승인 중심'],['재산도 있거나 잘 모르겠습니다','uncertain','한정승인 중심']]],
disposed:['고인 통장에서 돈을 인출하거나 재산을 처분했나요?','재산 처분이 있다면 법정단순승인 여부를 먼저 확인해야 할 수 있습니다.',[['예','yes','법정단순승인 여부 확인'],['아니오','no','다음 질문']]],
special:['3개월이 지난 뒤 소장·지급명령·승계집행문 등으로 채무를 처음 알았나요?','3개월이 지난 경우에만 특별한정승인 가능성을 확인합니다.',[['예','yes','특별한정승인 검토'],['아니오','no','다음 질문']]],
later:['선순위 상속인이 모두 상속포기해 뒤늦게 상속인이 되었나요?','해당하는 경우 선순위 포기 확인과 후순위 상속인의 3개월 기산점을 확인합니다.',[['예','yes','선순위 포기 + 기산점 확인'],['아니오','no','관련 결과 생략']]],
residue:['한정승인을 한다면 장례비 등 상속비용을 빼고 남는 재산이 있나요?','한정승인이 필요한 경우에만 청산 질문을 이어갑니다.',[['남는 재산이 있습니다','yes','청산방법 확인'],['남는 재산이 없습니다','no','별도 배당재산 없음'],['잘 모르겠습니다','unknown','재산·장례비 산정 필요']]],
hardasset:['남는 재산에 환가가 현저히 곤란한 부동산·자동차 등이 있나요?','잔여재산이 있을 때만 확인합니다.',[['예, 있습니다','hard','상속재산파산 등 법정청산'],['아니오','easy','임의청산 검토']]]};
function n(id,v){S.a[id]=v;if(id==='start'){S.p=v;return v==='debt'?'period':'agree'}if(id==='agree')return'minor';if(id==='minor')return v==='yes'?'conflict':'overseas';if(id==='conflict')return'overseas';if(id==='overseas')return'substitute';if(id==='substitute')return S.p==='mixed'?'period':null;if(id==='period')return'multi';if(id==='multi')return v==='yes'?'nextheir':'debt';if(id==='nextheir')return'debt';if(id==='debt')return'disposed';if(id==='disposed')return S.a.period==='late'?'special':'later';if(id==='special')return'later';if(id==='later')return(S.a.debt==='uncertain'||S.a.multi==='yes'||S.a.special==='yes')?'residue':null;if(id==='residue')return v==='yes'?'hardasset':null;return null}
function render(){const q=Q[c],k=S.h.length+1;stepLabel.textContent=k+'단계';bar.style.width=Math.min(100,10+k*9)+'%';answeredCount.textContent=S.h.length+'개';pathTitle.textContent=S.p==='registration'?'상속등기':S.p==='debt'?'상속포기·한정승인':S.p==='mixed'?'통합검토':'절차 선택';prev.disabled=!S.h.length;questionArea.innerHTML='<div class="q-no">질문 '+String(k).padStart(2,'0')+'</div><h3 class="q-title">'+q[0]+'</h3><p class="q-help">'+q[1]+'</p><div class="opts">'+q[2].map(x=>'<button class="opt" data-v="'+x[1]+'"><b>'+x[0]+'</b><small>'+x[2]+'</small></button>').join('')+'</div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const nx=n(c,b.dataset.v);S.h.push(c);if(nx){c=nx;render()}else result()})}
prev.onclick=()=>{if(!S.h.length)return;const p=S.h.pop();delete S.a[c];c=p;render()};
