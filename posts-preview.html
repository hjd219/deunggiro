<script>
let all=[],active='전체',page=1;const pageSize=10;function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function init(){try{const params=new URLSearchParams(location.search);const requested=params.get('category');const r=await fetch('/data/posts.json?'+Date.now());all=await r.json();const cs=['전체',...new Set(all.map(x=>x.category))];if(requested&&cs.includes(requested))active=requested;document.getElementById('cats').innerHTML=cs.map(c=>`<button class="chip ${c===active?'active':''}" onclick="setCat('${esc(c)}',this)">${esc(c)}</button>`).join('');render()}catch(e){console.warn('posts.json load failed; static HTML remains available',e)}}function setCat(c,btn){active=c;page=1;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}function searchPosts(){page=1;render()}function filteredPosts(){const q=document.getElementById('q').value.trim().toLowerCase();return all.filter(p=>(active==='전체'||p.category===active)&&(!q||(p.title+' '+(p.summary||'')+' '+(p.keywords||'')).toLowerCase().includes(q)))}function goPage(n){const total=Math.max(1,Math.ceil(filteredPosts().length/pageSize));page=Math.min(total,Math.max(1,n));render();document.querySelector('.post-toolbar').scrollIntoView({behavior:'smooth',block:'start'})}function pageItems(total,current){const out=[];for(let n=1;n<=total;n++){if(n===1||n===total||Math.abs(n-current)<=2)out.push(n);else if(out[out.length-1]!=='…')out.push('…')}return out}function render(){if(!all.length)return;const list=filteredPosts(),total=Math.ceil(list.length/pageSize);if(total&&page>total)page=total;const shown=list.slice((page-1)*pageSize,page*pageSize);document.getElementById('posts').innerHTML=shown.length?shown.map(p=>`<a class="post-card ${p.thumbnail?'':'no-thumb'}" href="/posts/${p.slug}.html">${p.thumbnail?`<img class="post-thumb" src="${esc(p.thumbnail)}" alt="${esc(p.title)}" loading="lazy">`:''}<div><div class="post-meta"><span class="badge">${esc(p.category)}</span>${esc(p.date)}</div><h3>${esc(p.title)}</h3><p>${esc(p.summary||'')}</p></div></a>`).join(''):'<div>검색 결과가 없습니다.</div>';document.getElementById('pagination').innerHTML=total>1?`<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>이전</button>`+pageItems(total,page).map(n=>n==='…'?'<span>…</span>':`<button class="page-btn ${n===page?'active':''}" onclick="goPage(${n})">${n}</button>`).join('')+`<button class="page-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>다음</button>`:''}document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')searchPosts()});init();
</script>
