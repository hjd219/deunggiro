<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AI 등기로 미리보기</title><link rel="stylesheet" href="/assets/site-shell.css?v=20260910-2135"><link rel="stylesheet" href="/assets/home.css?v=20260913-calculator-size-tune"><style>*{box-sizing:border-box}.ai-page{display:none;position:fixed;inset:0;z-index:99999;background:#f7fbfd;overflow:auto}.ai-page.on{display:block}.ai-top{height:62px;background:#fff;border-bottom:1px solid #d9e8ed;display:flex;align-items:center;padding:0 16px;position:sticky;top:0}.ai-exit{border:0;background:none;font-size:23px;padding:8px 13px 8px 0;color:#31464e}.ai-logo{font-size:18px;font-weight:900;color:#1985ad}.ai-logo b{display:inline-block;margin-right:7px;padding:3px 7px;border-radius:7px;background:#e5f6fb;color:#1686ad;font-size:12px}.ai-body{max-width:520px;margin:0 auto;padding:36px 20px 70px}.ai-kicker{font-size:13px;font-weight:800;color:#2b91b7;margin-bottom:11px}.ai-q{font-size:24px;line-height:1.42;margin:0 0 10px;color:#17272d}.ai-desc{font-size:14px;line-height:1.65;color:#6b7f87;margin:0 0 24px}.ai-options{display:grid;gap:10px}.ai-option{width:100%;min-height:56px;padding:14px 16px;border:1px solid #d2e4ea;border-radius:13px;background:#fff;text-align:left;font-size:15px;font-weight:800;color:#293b42}.ai-option:active{background:#e8f7fb}.ai-bottom{margin-top:16px}.ai-prev{border:0;background:none;color:#70868f;font-size:13px;padding:6px 0}.swap{animation:swap .17s ease}@keyframes swap{from{opacity:.15;transform:translateY(7px)}to{opacity:1;transform:none}}.ai-result{padding:20px;border:1px solid #cee3eb;border-radius:16px;background:#fff}.ai-result h2{margin:0 0 10px;font-size:21px}.ai-result p{font-size:14px;line-height:1.75}.ai-result .links{display:grid;gap:8px;margin-top:16px}.ai-result a,.ai-result button{height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:800;font-size:14px}.ai-result a{background:#299bc7;color:#fff}.ai-result button{border:1px solid #d4e5eb;background:#fff;color:#42565e}@media(min-width:769px){.ai-start,.ai-page{display:none!important}}</style></head><body class="home"><header class="dg-shell-header"><div class="dg-shell-inner"><a class="dg-shell-logo" href="/"><span>등기로</span><small>현재두 법무사 사무소 · 인천</small></a><button class="dg-shell-mobile-menu-btn">☰ 메뉴</button></div></header><section class="hero"><div class="container hero-grid"><div class="copy"><div class="hero-label">등기로 · 현재두 법무사 사무소</div><h1><span class="hero-title-lead">상속부터 법인등기까지<br>복잡한 절차,</span><span class="hero-written-phrase"><span class="hero-written-layer hero-written-ink"><span class="hero-written-brand">등기로</span><span class="hero-written-message">에서 쉽게!</span></span></span></h1><p>필요서류부터 절차·기간·비용까지,<br>궁금한 내용을 쉽고 빠르게 확인하세요.</p><div class="buttons"><button class="btn btn-border">등기로 소개</button><a class="btn btn-border" href="#">비용계산</a><button class="btn btn-dark ai-start" id="aiStart">AI 등기로 →</button></div></div><div class="photo"><img src="/images/og-home.jpg" alt="현재두 법무사"></div></div></section><div class="container quick"><div class="quick-grid"><a class="quick-item quick-rich c1"><span class="quick-copy"><h3>상속등기</h3><p>단독상속 · 공동상속 · 유증</p></span></a><a class="quick-item quick-rich c4"><span class="quick-copy"><h3>상속포기·한정승인</h3><p>기한 · 절차 · 필요서류 · 청산</p></span></a><a class="quick-item quick-rich c2"><span class="quick-copy"><h3>법인등기</h3><p>설립 · 변경 · 증자 · 회사계속</p></span></a></div></div><section class="ai-page" id="aiPage"><header class="ai-top"><button class="ai-exit" id="aiExit">‹</button><div class="ai-logo"><b>AI</b>등기로</div></header><main class="ai-body"><div id="aiContent"></div><div class="ai-bottom"><button class="ai-prev" id="aiPrev">← 이전 질문</button></div></main></section><script>const page=document.getElementById('aiPage'),content=document.getElementById('aiContent'),prev=document.getElementById('aiPrev');let hist=[],ans=[];const n={start:{k:'AI 간편진단',q:'어떤 상황인지 알려주세요.',d:'몇 가지 질문으로 필요한 절차를 찾아드립니다.',o:[['부모님이 돌아가셨어요','i1'],['상속받을 빚이 걱정돼요','w1'],['법인등기가 필요해요','c1']]},i1:{k:'상속 상황 분석',q:'상속인들끼리 협의가 가능한가요?',d:'협의 여부에 따라 진행 방법이 달라질 수 있습니다.',o:[['모두 협의가 가능해요','i2'],['연락이 안 되는 상속인이 있어요','i2'],['협의가 어려워요','i2']]},i2:{k:'상속 상황 분석',q:'상속인 중 특별한 상황이 있나요?',d:'해당되는 상황을 선택해 주세요.',o:[['특별한 상황 없음','i3'],['미성년자가 있어요','i3'],['외국인·해외거주자가 있어요','i3'],['잘 모르겠어요','i3']]},i3:{k:'상속 상황 분석',q:'상속재산에 부동산이 있나요?',d:'부동산이 있다면 상속등기 절차를 함께 확인합니다.',o:[['네, 있어요','result'],['아니요','result'],['잘 모르겠어요','result']]},w1:{k:'상속채무 분석',q:'사망 사실을 안 날부터 3개월이 지났나요?',d:'상속포기·한정승인에서 중요한 기준입니다.',o:[['3개월 이내예요','w2'],['3개월이 지났어요','w2'],['잘 모르겠어요','w2']]},w2:{k:'상속채무 분석',q:'현재 확인된 채무 상황은 어떤가요?',d:'현재 알고 있는 범위에서 선택하면 됩니다.',o:[['채무가 많아요','result'],['채무 여부를 몰라요','result'],['소송·독촉을 받았어요','result']]},c1:{k:'법인등기 분석',q:'어떤 변경이 필요한가요?',d:'해당 업무에 맞는 절차를 찾아드립니다.',o:[['법인설립','result'],['대표·임원변경','result'],['본점이전','result'],['상호·목적변경','result'],['증자','result']]}};function r(k){prev.style.visibility=hist.length?'visible':'hidden';if(k==='result'){content.innerHTML='<div class="ai-result swap"><div class="ai-kicker">AI 등기로 분석 결과</div><h2>이 상황에 맞는 절차를 확인해 보세요.</h2><p>'+ans.map(x=>'· '+x).join('<br>')+'</p><p>선택한 내용을 기준으로 필요한 절차·서류와 관련 처리사례를 연결합니다.</p><div class="links"><a href="#">관련 절차·처리사례 보기</a><a href="#">예상 비용 계산하기</a><button onclick="restart()">다시 진단하기</button></div></div>';return}const x=n[k];content.innerHTML='<div class="swap"><div class="ai-kicker">'+x.k+'</div><h1 class="ai-q">'+x.q+'</h1><p class="ai-desc">'+x.d+'</p><div class="ai-options">'+x.o.map((o,i)=>'<button class="ai-option" data-i="'+i+'">'+o[0]+'　›</button>').join('')+'</div></div>';content.querySelectorAll('.ai-option').forEach(b=>b.onclick=()=>{let o=x.o[+b.dataset.i];hist.push(k);ans.push(o[0]);r(o[1])})}function restart(){hist=[];ans=[];r('start')}document.getElementById('aiStart').onclick=()=>{page.classList.add('on');document.body.style.overflow='hidden';restart()};document.getElementById('aiExit').onclick=()=>{page.classList.remove('on');document.body.style.overflow='';restart()};prev.onclick=()=>{if(!hist.length)return;let k=hist.pop();ans.pop();r(k)};r('start');</script></body></html>
