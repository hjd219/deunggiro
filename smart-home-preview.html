<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>스마트 등기로 동일영역 미리보기</title><link rel="stylesheet" href="/assets/site-shell.css?v=20260910-2135"><link rel="stylesheet" href="/assets/home.css?v=20260913-calculator-size-tune"><style>*{box-sizing:border-box}.smart-inline{display:none;margin-top:15px;max-width:520px;padding:18px;border:1px solid #cfe4ec;border-radius:16px;background:#f7fcfe}.smart-inline.on{display:block}.smart-step{font-size:12px;font-weight:800;color:#2c91b7;margin-bottom:8px}.smart-q{font-size:19px;line-height:1.4;margin:0 0 14px;color:#17252b}.smart-options{display:grid;gap:8px}.smart-option{width:100%;min-height:48px;padding:12px 14px;border:1px solid #d4e5ea;border-radius:11px;background:#fff;text-align:left;font-size:14px;font-weight:800;color:#293a40}.smart-option:active{background:#e9f7fb}.smart-nav{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.smart-prev,.smart-close{border:0;background:none;color:#71858d;font-size:12px;padding:5px}.swap{animation:swap .16s ease}@keyframes swap{from{opacity:.15;transform:translateY(5px)}to{opacity:1;transform:none}}.smart-result{padding:4px}.smart-result h3{margin:0 0 8px}.smart-result p{font-size:13px;line-height:1.6}.smart-result button{width:100%;height:44px;border:0;border-radius:10px;background:#299bc7;color:#fff;font-weight:800}@media(min-width:769px){.smart-start,.smart-inline{display:none!important}}</style></head><body class="home"><header class="dg-shell-header"><div class="dg-shell-inner"><a class="dg-shell-logo" href="/"><span>등기로</span><small>현재두 법무사 사무소 · 인천</small></a><button class="dg-shell-mobile-menu-btn">☰ 메뉴</button></div></header><section class="hero"><div class="container hero-grid"><div class="copy"><div class="hero-label">등기로 · 현재두 법무사 사무소</div><h1><span class="hero-title-lead">상속부터 법인등기까지<br>복잡한 절차,</span><span class="hero-written-phrase"><span class="hero-written-layer hero-written-ink"><span class="hero-written-brand">등기로</span><span class="hero-written-message">에서 쉽게!</span></span></span></h1><p>필요서류부터 절차·기간·비용까지,<br>궁금한 내용을 쉽고 빠르게 확인하세요.</p><div class="buttons" id="heroButtons"><button class="btn btn-border">등기로 소개</button><a class="btn btn-border" href="#">비용계산</a><button class="btn btn-dark smart-start" id="smartStart">스마트 등기로 시작 →</button></div><div class="smart-inline" id="smartInline"><div id="smartContent"></div><div class="smart-nav"><button class="smart-prev" id="smartPrev">← 이전</button><button class="smart-close" id="smartClose">진단 닫기</button></div></div></div><div class="photo"><img src="/images/og-home.jpg" alt="현재두 법무사"></div></div></section><div class="container quick"><div class="quick-grid"><a class="quick-item quick-rich c1"><span class="quick-copy"><h3>상속등기</h3><p>단독상속 · 공동상속 · 유증</p></span></a><a class="quick-item quick-rich c4"><span class="quick-copy"><h3>상속포기·한정승인</h3><p>기한 · 절차 · 필요서류 · 청산</p></span></a><a class="quick-item quick-rich c2"><span class="quick-copy"><h3>법인등기</h3><p>설립 · 변경 · 증자 · 회사계속</p></span></a></div></div><script>const box=document.getElementById('smartInline'),content=document.getElementById('smartContent'),buttons=document.getElementById('heroButtons'),prev=document.getElementById('smartPrev');let hist=[],ans=[];const n={start:{s:'스마트 등기로',q:'어떤 업무를 확인하시겠습니까?',o:[['상속등기','i1'],['상속포기 · 한정승인','w1'],['법인등기','c1']]},i1:{s:'상속등기',q:'상속인들 사이에 상속 방법이 정해졌나요?',o:[['네, 협의가 됐어요','i2'],['아직 협의 전이에요','i2'],['협의가 어려워요','i2']]},i2:{s:'상속등기',q:'상속인 중 특별한 상황이 있나요?',o:[['특별한 상황 없음','i3'],['연락두절 상속인이 있어요','i3'],['미성년자가 있어요','i3'],['외국인·해외거주자가 있어요','i3']]},i3:{s:'상속등기',q:'상속재산에 부동산이 있나요?',o:[['네, 있어요','result'],['아니요','result'],['잘 모르겠어요','result']]},w1:{s:'상속포기 · 한정승인',q:'사망 사실을 안 날부터 3개월이 지났나요?',o:[['3개월 이내예요','w2'],['3개월이 지났어요','w2'],['잘 모르겠어요','w2']]},w2:{s:'상속포기 · 한정승인',q:'현재 확인된 채무가 있나요?',o:[['채무가 많아요','result'],['채무 여부를 몰라요','result'],['채권자 소송·독촉을 받았어요','result']]},c1:{s:'법인등기',q:'어떤 등기가 필요하신가요?',o:[['법인설립','result'],['대표·임원변경','result'],['본점이전','result'],['상호·목적변경','result'],['증자','result']]}};function r(k){prev.style.visibility=hist.length?'visible':'hidden';if(k==='result'){content.innerHTML='<div class="smart-result swap"><div class="smart-step">진단 완료</div><h3>선택한 상황을 확인했습니다.</h3><p>'+ans.map(x=>'· '+x).join('<br>')+'</p><button onclick="restart()">처음부터 다시</button></div>';return}const x=n[k];content.innerHTML='<div class="swap"><div class="smart-step">'+x.s+'</div><h2 class="smart-q">'+x.q+'</h2><div class="smart-options">'+x.o.map((o,i)=>'<button class="smart-option" data-i="'+i+'">'+o[0]+'　›</button>').join('')+'</div></div>';content.querySelectorAll('.smart-option').forEach(b=>b.onclick=()=>{let o=x.o[+b.dataset.i];hist.push(k);ans.push(o[0]);r(o[1])})}function restart(){hist=[];ans=[];r('start')}document.getElementById('smartStart').onclick=()=>{buttons.style.display='none';box.classList.add('on');restart()};prev.onclick=()=>{if(!hist.length)return;let k=hist.pop();ans.pop();r(k)};document.getElementById('smartClose').onclick=()=>{box.classList.remove('on');buttons.style.display='';restart()};r('start');</script></body></html>
