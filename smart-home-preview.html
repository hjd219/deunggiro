<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>스마트 등기로 화면전환 미리보기</title><link rel="stylesheet" href="/assets/site-shell.css?v=20260910-2135"><link rel="stylesheet" href="/assets/home.css?v=20260913-calculator-size-tune"><style>*{box-sizing:border-box}.smart-start{display:inline-flex!important}.smart-screen{display:none;position:fixed;inset:0;z-index:99999;background:#f7fbfd;overflow:auto}.smart-screen.on{display:block}.smart-head{height:64px;background:#fff;border-bottom:1px solid #d9e8ed;display:flex;align-items:center;padding:0 18px;position:sticky;top:0}.smart-back{border:0;background:none;font-size:24px;padding:8px 14px 8px 0}.smart-brand{font-size:18px;font-weight:900;color:#1985ad}.smart-wrap{max-width:560px;margin:0 auto;padding:36px 20px 60px}.smart-step{font-size:13px;font-weight:800;color:#2c91b7;margin-bottom:13px}.smart-q{font-size:25px;line-height:1.38;margin:0 0 26px;color:#17252b}.smart-options{display:grid;gap:11px}.smart-option{width:100%;min-height:58px;padding:15px 17px;border:1px solid #d2e4ea;border-radius:14px;background:#fff;text-align:left;font-size:16px;font-weight:800;color:#26383f;box-shadow:0 2px 7px rgba(35,91,111,.04)}.smart-option:active{background:#e9f7fb;transform:scale(.99)}.smart-result{padding:20px;border:1px solid #cee3eb;border-radius:16px;background:#fff}.smart-result h2{margin:0 0 10px}.smart-result p{line-height:1.65}.smart-result .again{margin-top:15px;width:100%;height:50px;border:0;border-radius:12px;background:#299bc7;color:#fff;font-weight:800}.fade{animation:fade .18s ease}@keyframes fade{from{opacity:.25;transform:translateX(12px)}to{opacity:1;transform:none}}@media(min-width:769px){.smart-start{display:none!important}}</style></head><body class="home"><header class="dg-shell-header"><div class="dg-shell-inner"><a class="dg-shell-logo" href="/"><span>등기로</span><small>현재두 법무사 사무소 · 인천</small></a><button class="dg-shell-mobile-menu-btn">☰ 메뉴</button></div></header><section class="hero"><div class="container hero-grid"><div class="copy"><div class="hero-label">등기로 · 현재두 법무사 사무소</div><h1><span class="hero-title-lead">상속부터 법인등기까지<br>복잡한 절차,</span><span class="hero-written-phrase"><span class="hero-written-layer hero-written-ink"><span class="hero-written-brand">등기로</span><span class="hero-written-message">에서 쉽게!</span></span></span></h1><p>필요서류부터 절차·기간·비용까지,<br>궁금한 내용을 쉽고 빠르게 확인하세요.</p><div class="buttons"><button class="btn btn-border">등기로 소개</button><a class="btn btn-border" href="#">비용계산</a><button class="btn btn-dark smart-start" id="smartStart">스마트 등기로 시작 →</button></div></div><div class="photo"><img src="/images/og-home.jpg" alt="현재두 법무사"></div></div></section><div class="container quick"><div class="quick-grid"><a class="quick-item quick-rich c1"><span class="quick-copy"><h3>상속등기</h3><p>단독상속 · 공동상속 · 유증</p></span></a><a class="quick-item quick-rich c4"><span class="quick-copy"><h3>상속포기·한정승인</h3><p>기한 · 절차 · 필요서류 · 청산</p></span></a><a class="quick-item quick-rich c2"><span class="quick-copy"><h3>법인등기</h3><p>설립 · 변경 · 증자 · 회사계속</p></span></a></div></div><section class="smart-screen" id="smartScreen"><div class="smart-head"><button class="smart-back" id="smartBack" aria-label="돌아가기">‹</button><div class="smart-brand">스마트 등기로</div></div><main class="smart-wrap"><div id="smartContent"></div></main></section><script>const screen=document.getElementById('smartScreen'),content=document.getElementById('smartContent');let history=[],answers=[];const nodes={start:{step:'간편 진단',q:'어떤 업무를 확인하시겠습니까?',opts:[['상속등기','inherit'],['상속포기 · 한정승인','waiver'],['법인등기','corp']]},inherit:{step:'상속등기',q:'상속인들 사이에 상속 방법이 정해졌나요?',opts:[['네, 협의가 됐어요','inherit_special'],['아직 협의 전이에요','inherit_special'],['협의가 어려워요','inherit_special']]},inherit_special:{step:'상속등기',q:'상속인 중 특별한 상황이 있나요?',opts:[['특별한 상황 없음','inherit_property'],['연락두절 상속인이 있어요','inherit_property'],['미성년자가 있어요','inherit_property'],['외국인·해외거주자가 있어요','inherit_property']]},inherit_property:{step:'상속등기',q:'상속재산에 부동산이 있나요?',opts:[['네, 있어요','result'],['아니요','result'],['잘 모르겠어요','result']]},waiver:{step:'상속포기 · 한정승인',q:'사망 사실을 안 날부터 3개월이 지났나요?',opts:[['3개월 이내예요','waiver_debt'],['3개월이 지났어요','waiver_debt'],['잘 모르겠어요','waiver_debt']]},waiver_debt:{step:'상속포기 · 한정승인',q:'현재 확인된 채무가 있나요?',opts:[['채무가 많아요','result'],['채무 여부를 몰라요','result'],['채권자 소송·독촉을 받았어요','result']]},corp:{step:'법인등기',q:'어떤 등기가 필요하신가요?',opts:[['법인설립','result'],['대표·임원변경','result'],['본점이전','result'],['상호·목적변경','result'],['증자','result']]}};function render(key){if(key==='result'){content.innerHTML='<div class="smart-result fade"><div class="smart-step">진단 완료</div><h2>선택한 상황을 확인했습니다.</h2><p>'+answers.map(x=>'· '+x).join('<br>')+'</p><p>실제 적용 시 이 결과에 맞춰 <b>절차 · 필요서류 · 관련 처리사례 · 비용계산</b>을 바로 보여주는 구조로 연결할 수 있습니다.</p><button class="again" onclick="restart()">처음부터 다시 진단</button></div>';return}const n=nodes[key];content.innerHTML='<div class="fade"><div class="smart-step">'+n.step+'</div><h1 class="smart-q">'+n.q+'</h1><div class="smart-options">'+n.opts.map((o,i)=>'<button class="smart-option" data-i="'+i+'">'+o[0]+'　›</button>').join('')+'</div></div>';content.querySelectorAll('.smart-option').forEach(b=>b.onclick=()=>{const o=n.opts[+b.dataset.i];history.push(key);answers.push(o[0]);render(o[1])})}function restart(){history=[];answers=[];render('start')}document.getElementById('smartStart').onclick=()=>{screen.classList.add('on');document.body.style.overflow='hidden';restart()};document.getElementById('smartBack').onclick=()=>{if(history.length){const k=history.pop();answers.pop();render(k)}else{screen.classList.remove('on');document.body.style.overflow=''}};render('start');</script></body></html>
