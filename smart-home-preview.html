<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>스마트 등기로 위치 미리보기</title><link rel="stylesheet" href="/assets/site-shell.css?v=20260910-2135"><link rel="stylesheet" href="/assets/home.css?v=20260913-calculator-size-tune"><style>@media(max-width:768px){.dg-phone-cta{display:none!important}.dg-smart-preview{display:inline-flex!important}}@media(min-width:769px){.dg-smart-preview{display:none!important}}.dg-smart-preview{display:none}.smart-box{margin:18px auto;padding:18px;border:1px solid #cfe4ec;border-radius:16px;background:#f7fcfe}.smart-box button{width:100%;padding:14px;margin:5px 0;border:1px solid #d5e5ea;border-radius:12px;background:#fff;text-align:left;font-weight:800}</style></head><body class="home"><header class="dg-shell-header"><div class="dg-shell-inner"><a class="dg-shell-logo" href="/"><span>등기로</span><small>현재두 법무사 사무소 · 인천</small></a><button class="dg-shell-mobile-menu-btn">☰ 메뉴</button></div></header><section class="hero"><div class="container hero-grid"><div class="copy"><div class="hero-label">등기로 · 현재두 법무사 사무소</div><h1><span class="hero-title-lead">상속부터 법인등기까지<br>복잡한 절차,</span><span class="hero-written-phrase"><span class="hero-written-layer hero-written-ink"><span class="hero-written-brand">등기로</span><span class="hero-written-message">에서 쉽게!</span></span></span></h1><p>필요서류부터 절차·기간·비용까지,<br>궁금한 내용을 쉽고 빠르게 확인하세요.</p><div class="buttons"><button class="btn btn-border">등기로 소개</button><a class="btn btn-border" href="#">비용계산</a><a class="btn btn-dark dg-phone-cta" href="tel:0324251500">032-425-1500 상담</a><a class="btn btn-dark dg-smart-preview" href="#smart">스마트 등기로 →</a></div></div><div class="photo"><img src="/images/og-home.jpg" alt="현재두 법무사"></div></div></section><div class="container quick"><div class="quick-grid"><a class="quick-item quick-rich c1"><span class="quick-copy"><h3>상속등기</h3><p>단독상속 · 공동상속 · 유증</p></span></a><a class="quick-item quick-rich c4"><span class="quick-copy"><h3>상속포기·한정승인</h3><p>기한 · 절차 · 필요서류 · 청산</p></span></a><a class="quick-item quick-rich c2"><span class="quick-copy"><h3>법인등기</h3><p>설립 · 변경 · 증자 · 회사계속</p></span></a></div></div><section id="smart" class="container smart-box"><h2>스마트 등기로</h2><p>몇 가지 질문으로 내 상황을 간편하게 확인해보세요.</p><b id="progress">1 / 3</b><h3 id="question"></h3><div id="options"></div></section><script>let s=0,a=[];const f={"상속등기":["현재 가장 가까운 상황은 무엇입니까?",["일반 상속등기","연락두절 상속인","미성년자 상속인","외국인·해외거주 상속인"]],"상속포기·한정승인":["현재 가장 가까운 상황은 무엇입니까?",["3개월 이내","3개월이 지남","선순위 상속인이 포기함","채권자 소송·독촉"]],"법인등기":["어떤 등기가 필요합니까?",["법인설립","대표·임원변경","본점이전","상호·목적변경","증자"]]};function d(){let q,o;if(!s){q="어떤 업무를 확인하시겠습니까?";o=Object.keys(f)}else if(s==1){q=f[a[0]][0];o=f[a[0]][1]}else{q="추가로 해당되는 사항이 있습니까?";o=["특별한 사항 없음","협의가 어려움","연락두절·해외거주 등 특이사항 있음"]}progress.textContent=(s+1)+" / 3";question.textContent=q;options.innerHTML="";o.forEach(v=>{let b=document.createElement('button');b.textContent=v+'  ›';b.onclick=()=>{a[s]=v;if(s<2){s++;d()}else{progress.textContent='완료';question.textContent='진단 결과';options.innerHTML='<p><b>'+a.join(' → ')+'</b></p><p>선택한 상황에 맞는 절차·필요서류·비용으로 연결됩니다.</p>'}};options.appendChild(b)})}d()</script></body></html>
